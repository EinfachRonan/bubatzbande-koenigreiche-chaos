<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Bubatzbande">
<meta name="application-name" content="Bubatzbande">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubatzbande</title>
<meta name="theme-color" content="#0b0d12">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="theme.css?v=1" rel="stylesheet">
<style>
:root{--bg:#090c13;--card:#121826;--card2:#0d121c;--line:rgba(255,201,77,.22);--line2:#222b3d;--txt:#f3efe4;--mut:#9aa3b6;--gold:#ffc94d;--gold2:#ffe08a;--gold3:#c8902a}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;min-height:100dvh;color:var(--txt);font:600 15px/1.4 "Nunito",system-ui,sans-serif;overflow-x:hidden;background:var(--bg)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
.bgimg{position:fixed;inset:-30px;z-index:-2;background:url(krieg/img/hero-s.jpg) center 30%/cover;filter:blur(22px) brightness(.32) saturate(1.2);transform:scale(1.05)}
.bgfx{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 70% 40% at 50% 0,rgba(255,201,77,.10),transparent 70%),linear-gradient(180deg,rgba(9,12,19,.4),rgba(9,12,19,.85) 60%,var(--bg))}
.app{max-width:1120px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
.H{font-family:"Lilita One","Nunito",sans-serif;font-weight:400;letter-spacing:.01em}
/* Rahmen-Karte im Stil der Vorlage: dunkles Navy, feiner Goldrand, innerer Glanz */
.card{position:relative;background:linear-gradient(180deg,rgba(24,31,47,.92),rgba(13,18,28,.94));border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.card::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,224,138,.7),transparent)}
/* Profil */
.prof{display:flex;align-items:center;gap:12px;padding:12px 14px}
.prof .av{flex:none;width:58px;height:58px;display:flex;align-items:center;justify-content:center}
.prof .av img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.prof .who{flex:1;min-width:0}
.prof .who b{display:block;font:400 21px/1.1 "Lilita One",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .who small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.lv{display:flex;align-items:center;gap:8px;margin-top:6px}
.lv .tag{flex:none;font:800 11px "Nunito";letter-spacing:.04em;padding:2px 8px;border-radius:6px;background:linear-gradient(#ffd666,#e3a326);color:#1a1206}
.lv .bar{flex:1;height:7px;border-radius:9px;background:#0a0e16;border:1px solid #273046;overflow:hidden}
.lv .bar i{display:block;height:100%;background:linear-gradient(90deg,#e3a326,#ffe08a);box-shadow:0 0 8px rgba(255,201,77,.6)}
.gold{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:12px;background:#0a0e16;border:1px solid #2a3348;font:800 15px "Nunito"}
.gold .c{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc94d 55%,#a8750b);box-shadow:0 0 8px rgba(255,201,77,.5)}
.ibtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#0a0e16;color:var(--gold2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn svg{width:20px;height:20px}
.login{flex:none;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--gold);background:linear-gradient(#ffd666,#e3a326);color:#1a1206;font:900 14px "Nunito";cursor:pointer}
/* Held */
.hero{margin-top:12px;overflow:hidden;min-height:250px;display:flex;align-items:flex-end}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;border-radius:16px}
.hero::after{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(0deg,rgba(9,12,19,.95) 0%,rgba(9,12,19,.35) 45%,rgba(9,12,19,0) 70%)}
.hero .in{position:relative;z-index:1;padding:16px;width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hero .kick{font:900 11px "Nunito";letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}
.hero h1{font:400 34px/1 "Lilita One",sans-serif;text-shadow:0 3px 14px rgba(0,0,0,.7);margin-top:4px}
@media (max-width:400px){.hero h1{font-size:29px}.hero .in>div{min-width:0}.hero .play{height:44px;padding:0 14px;font-size:17px}}
.play{flex:none;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:12px;border:1px solid #ffe9a8;background:linear-gradient(#ffdb73,#e3a326);color:#1a1206;font:400 20px "Lilita One",sans-serif;letter-spacing:.04em;box-shadow:0 5px 0 #8a5d10,0 10px 24px rgba(255,201,77,.35);cursor:pointer}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5d10}
/* Abschnitte */
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec h2{font:400 22px "Lilita One",sans-serif}
.sec button,.sec a{background:none;border:0;color:var(--gold2);font:800 13px "Nunito";cursor:pointer}
/* Spielkarten */
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gc{display:flex;flex-direction:column;overflow:hidden;min-height:190px;cursor:pointer;transition:transform .18s,box-shadow .18s}
.gc:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.55),0 0 0 1px rgba(255,201,77,.45)}
.gc .art{position:relative;height:120px;overflow:hidden;border-radius:15px 15px 0 0;background:radial-gradient(circle at 60% 40%,var(--c),var(--c2))}
.gc .art img{position:absolute;right:-4%;top:-8%;width:78%;aspect-ratio:1;object-fit:cover;-webkit-mask:radial-gradient(circle at 50% 45%,#000 50%,transparent 70%);mask:radial-gradient(circle at 50% 45%,#000 50%,transparent 70%);transition:transform .3s}
.gc .art.full img{inset:0;right:auto;top:0;width:100%;height:100%;aspect-ratio:auto;object-position:50% 45%;-webkit-mask:none;mask:none;image-rendering:auto}
.gc:hover .art img{transform:scale(1.06)}
.gc .art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(13,18,28,.95),transparent 55%)}
.gc .tg{position:absolute;z-index:1;left:10px;top:10px;font:900 10px "Nunito";letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12)}
.gc .tg.n{background:linear-gradient(#ffd666,#e3a326);color:#1a1206;border-color:#ffe9a8}
.gc .bd{padding:0 12px 12px;margin-top:-26px;position:relative;z-index:1}
.gc h3{font:400 19px/1.1 "Lilita One",sans-serif;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.gc p{color:var(--mut);font-size:12.5px;margin-top:4px;line-height:1.35}
.chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 9px;border-radius:8px;background:#0a0e16;border:1px solid #273046;font:800 12px "Nunito";color:var(--gold2)}
.chip .c{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc94d 55%,#a8750b)}
.all .gc{min-height:230px}.all .gc .art{height:140px}
/* Rangliste mit Podest */
.rank{padding:14px 14px 6px}
.rank .hd{display:flex;justify-content:space-between;align-items:center}
.rank .hd b{font:400 20px "Lilita One",sans-serif}
.rank .hd small{color:var(--mut);font-size:12px}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:14px 0 6px}
.pd{text-align:center;cursor:pointer;padding:10px 4px 10px;border-radius:14px}
.pd.p1{background:linear-gradient(180deg,rgba(255,201,77,.18),rgba(255,201,77,.02));border:1px solid rgba(255,201,77,.35);padding-top:14px}
.pd .ring{width:58px;height:58px;margin:0 auto;border-radius:50%;padding:3px;background:var(--rc)}
.pd.p1 .ring{width:72px;height:72px;box-shadow:0 0 22px rgba(255,201,77,.55)}
.pd .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid #0d121c}
.pd b{display:block;font:400 15px/1.1 "Lilita One",sans-serif;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd span{font:800 13px "Nunito";color:var(--gold2)}
.pd i{display:block;font-style:normal;font:900 11px "Nunito";color:var(--mut);margin-top:2px}
.rr{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid #1e2636;cursor:pointer}
.rr .n{width:22px;text-align:center;color:var(--mut);font-weight:900}
.rr img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid #3a4560}
.rr b{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr span{font-weight:900;color:var(--gold2)}
.rr em{font-style:normal;font:900 11px "Nunito";padding:2px 7px;border-radius:6px;background:#2a3348;color:#cfd6e6}
.rr.you{background:rgba(255,201,77,.07);border-radius:10px}
.more{display:block;width:100%;margin:6px 0 8px;padding:11px;border-radius:12px;border:1px solid var(--line);background:#0a0e16;color:var(--gold2);font:800 14px "Nunito";cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:16px 4px;font-size:14px}
/* Sammlung */
.col{display:flex;align-items:center;gap:14px;padding:14px;margin-top:20px;cursor:pointer;background:linear-gradient(110deg,rgba(54,38,104,.92),rgba(18,16,40,.94))}
.col .fan{position:relative;flex:none;width:118px;height:86px}
.col .fan img{position:absolute;bottom:0;width:54px;height:74px;object-fit:cover;border-radius:7px;border:2px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.6)}
.col .fan img:nth-child(1){left:0;transform:rotate(-13deg);border-color:#c78bff}.col .fan img:nth-child(2){left:32px;z-index:2;bottom:8px;border-color:#ffb43a}.col .fan img:nth-child(3){left:64px;transform:rotate(13deg);border-color:#6ab0ff}
.col b{font:400 20px "Lilita One",sans-serif}.col p{color:#cfc8e8;font-size:13px;margin-top:2px}
/* Untere Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 10px max(10px,env(safe-area-inset-bottom));pointer-events:none}
.tabs nav{pointer-events:auto;width:100%;max-width:560px;display:flex;justify-content:space-around;padding:8px 6px;border-radius:18px;background:rgba(12,16,26,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 -6px 30px rgba(0,0,0,.5)}
.tabs button,.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:0;background:none;color:#8792a8;font:800 11.5px "Nunito";cursor:pointer;border-radius:12px}
.tabs svg{width:23px;height:23px}
.tabs .on{color:var(--gold2);background:linear-gradient(180deg,rgba(255,201,77,.16),rgba(255,201,77,0))}
.tabs .on svg{filter:drop-shadow(0 0 6px rgba(255,201,77,.7))}
.view{display:none}.view.on{display:block;animation:vin .25s ease}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
.vhead{display:flex;align-items:center;gap:10px;margin:6px 2px 14px}
.vhead h2{font:400 28px "Lilita One",sans-serif}
.vhead span{color:var(--mut);font-weight:800;font-size:13px;margin-left:auto}
footer{text-align:center;color:#5d6578;font-size:12px;font-weight:700;margin:26px 0 0}
/* Desktop: zweispaltig */
@media (min-width:900px){
  .hub{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
  .hub .side{position:sticky;top:16px}
  .hero{min-height:330px}.hero h1{font-size:46px}
  .games{grid-template-columns:repeat(2,minmax(0,1fr))}
  .all .games{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:899px){.hub .side .rank{margin-top:20px}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}

/* Raster: Handy = Profil, Held, Spiele, Rangliste, Sammlung · PC = Held und Rangliste nebeneinander */
#v-hub{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"prof" "hero" "sec" "games" "rank" "col" "foot";column-gap:16px}
#prof{grid-area:prof}#v-hub>.hero{grid-area:hero;margin-top:12px}#spiele{grid-area:sec}#gAll{grid-area:games}#rank{grid-area:rank;margin-top:20px}#v-hub>.col{grid-area:col}#v-hub>footer{grid-area:foot}
@media (min-width:900px){#v-hub{grid-template-columns:1.6fr 1fr;grid-template-areas:"prof prof" "hero rank" "sec sec" "games games" "col col" "foot foot"}#rank{margin-top:12px}#v-hub>.hero{min-height:340px}}
.gc .chip{max-width:calc(100% - 46px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Startseite v3: alles auf einer Seite, Spiele groß und klar anklickbar */
.top2{display:grid;gap:14px;margin-top:12px}
.top2 .hero{margin-top:0;min-height:210px}
.sec .cnt{color:var(--mut);font-weight:800;font-size:13px}
.games{gap:14px}
.gc{min-height:236px}
.gc .art{height:138px}
.gc .bd{padding:0 13px 14px;display:flex;flex-direction:column;flex:1}
.gc h3{font-size:20px}
.gc p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.gc .chip{align-self:flex-start;margin-top:auto;padding-top:5px}
.gc .go{position:absolute;right:12px;bottom:14px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#ffd666,#e3a326);color:#1a1206;font-weight:900;box-shadow:0 4px 12px rgba(255,201,77,.35)}
.rank{margin:0}
@media (min-width:700px){.games{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.top2{grid-template-columns:1.6fr 1fr;align-items:stretch}.top2 .hero{min-height:340px}.games{grid-template-columns:repeat(4,minmax(0,1fr))}.gc{min-height:270px}.gc .art{height:160px}}
</style>
</head>
<body>
<div class="bgimg"></div><div class="bgfx"></div>
<div class="app">
  <section id="v-hub">
    <div class="card prof" id="prof"></div>
    <div class="card hero"><img src="krieg/img/hero.jpg" srcset="krieg/img/hero-s.jpg 1000w, krieg/img/hero.jpg 2000w" sizes="(max-width:900px) 100vw, 700px" alt="Die Bubatzbande">
        <div class="in"><div><div class="kick" id="nG">8 Spiele · 1 Bande</div><h1>Bubatzbande</h1></div><button class="play" data-go="games">SPIELEN ↓</button></div></div>
      <div class="card rank" id="rank"><div class="hd"><b>Rangliste</b><small>Gesamt · alle Spiele</small></div><div class="empty">Lade …</div></div>
    <div class="sec" id="spiele"><h2>Alle Spiele</h2><span class="cnt" id="nG2"></span></div>
    <div class="games" id="gAll"></div>
    <a class="card col" href="bande/"><div class="fan"><img src="bande/img/mr-mollymann.jpg" alt=""><img src="bande/img/der-koenig-von-deutschland.jpg" alt=""><img src="bande/img/der-graue-geist.jpg" alt=""></div>
      <div><b>Kartensammlung</b><p>Bandengold aus allen Spielen, Kräuterbeutel öffnen, 30 Karten sammeln.</p><span class="chip"><span class="c"></span><span id="cBg">0</span> · 🃏 <span id="cCards">0</span>/30</span></div></a>
    <footer>bubatzbande.de · Königreiche &amp; Chaos</footer>
  </section>
</div>
<div class="tabs"><nav>
  <button data-tab="hub" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Start</button>
  <button data-tab="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M7 11v4M5 13h4M16 12h.01M18 14h.01"/></svg>Spiele</button>
  <a href="bande/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="12" height="17" rx="2"/><path d="M8 3.5l11 2.5-3 15"/></svg>Sammlung</a>
  <button data-tab="rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 6h3v2a3 3 0 0 1-3 3M7 6H4v2a3 3 0 0 0 3 3"/></svg>Rangliste</button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</button>
</nav></div>
<span id="bbChip" hidden></span>
<script src="art.js?v=20261111b"></script>
<script src="bb.js?v=20261115g"></script>
<script>
'use strict';
const IMG = k => 'krieg/img/' + k + '.jpg';
const GAMES = [
  { k: 'drill', url: 'drill/', name: 'Galaxie-Bohrer', who: 'marwin', art: 'drill/key.jpg', c: '#14b8c4', c2: '#041a1e', text: 'Idle: Dein Schiff bohrt Pixel-Planeten weg.', tag: 'Neu', neu: 1 },
  { k: 'runner', url: 'runner/', name: 'Kobold-Runner', who: 'kobold', c: '#3f9a2c', c2: '#0b2a0c', text: 'Springen, rutschen, Gold sammeln.', tag: 'Endlos' },
  { k: 'krieg', url: 'krieg/', name: 'Bandenkrieg', who: 'artur', c: '#c0392b', c2: '#2a0a08', text: 'Kampagne mit 8 Schlachten.', tag: 'Strategie' },
  { k: 'match', url: 'match/', name: 'Kräuter-Match', who: 'molly', c: '#3557d6', c2: '#0c1238', text: 'Drei in eine Reihe, Level ohne Ende.', tag: 'Puzzle' },
  { k: 'hof', url: 'hof/', name: 'Bandenhof', who: 'lg3', c: '#7cc22e', c2: '#16300a', text: 'Bau den Hof aus, läuft auch offline.', tag: 'Aufbau' },
  { k: 'duell', url: 'duell/', name: 'Kneipen-Duell', who: 'don', c: '#9b1d3c', c2: '#2a0710', text: 'Zapfen, schieben, Armdrücken.', tag: '1 gegen 1' },
  { k: 'quiz', url: 'quiz/', name: 'Bubatz-Quiz', who: 'nille', c: '#14989a', c2: '#042426', text: 'Party-Quiz mit Freunden am Handy.', tag: 'Party' },
  { k: 'schach', url: 'schach/', name: 'Schlagabtausch', who: 'koenig', c: '#d1901c', c2: '#2e1c04', text: '3D-Schach mit Ego-Duellen.', tag: 'Online' }
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const B = () => window.BB;
const card = g => { const b = B(), best = b && b.best(g.k);
  return `<a class="card gc" href="${g.url}" style="--c:${g.c};--c2:${g.c2}"><div class="art${g.art ? ' full' : ''}"><img src="${g.art || IMG(g.who)}" alt="" loading="lazy"><span class="tg${g.neu ? ' n' : ''}">${esc(g.tag)}</span></div>
    <div class="bd"><h3>${esc(g.name)}</h3><p>${esc(g.text)}</p>${best ? `<span class="chip">🏆 ${b.fmt(g.k, best.s)}</span>` : ''}<span class="go">▶</span></div></a>`; };
function draw() {
  $('gAll').innerHTML = GAMES.map(card).join('');
  $('nG').textContent = GAMES.length + ' Spiele · 1 Bande'; $('nG2').textContent = GAMES.length + ' Spiele';
  const b = B(), P = b ? b.profile : null, pr = $('prof');
  const bg = b && b.meta ? b.meta.bg : 0; $('cBg').textContent = (bg || 0).toLocaleString('de-DE'); $('cCards').textContent = b && b.meta ? Object.keys(b.meta.cards).length : 0;
  if (b && b.loggedIn) {
    const na = Object.keys(P.ach).length, nAll = b.ACH.length, lvl = 1 + Math.floor(na / 3), pr0 = (na % 3) / 3;
    pr.innerHTML = `<div class="av">${b.avH ? b.avH(P) : ''}</div><div class="who"><b>${esc(P.name)}</b><small>🎖️ ${na}/${nAll} Erfolge · 🎮 ${Object.keys(P.best).length}/${GAMES.length} Bestwerte</small>
      <div class="lv"><span class="tag">Rang ${lvl}</span><span class="bar"><i style="width:${Math.max(6, pr0 * 100)}%"></i></span></div></div>
      <a class="gold" href="bande/" aria-label="Bandengold"><span class="c"></span>${(bg || 0).toLocaleString('de-DE')}</a>
      <button class="ibtn" data-o="profil" aria-label="Profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>`;
  } else {
    pr.innerHTML = `<div class="av"><img src="icon-180.png" alt=""></div><div class="who"><b>Willkommen!</b><small>Mit Konto: Bestenliste, Freunde, Erfolge und Sammlung auf allen Geräten.</small></div><button class="login" data-o="login">Anmelden</button>`;
  }
  pr.querySelectorAll('[data-o]').forEach(x => x.onclick = () => b && b.open(x.dataset.o));
}
async function rank() {
  const el = $('rank'), b = B(); if (!b) return;
  try {
    const r = await fetch('api/bb.php?a=overall&u=' + encodeURIComponent((b.profile && b.profile.id) || ''), { cache: 'no-store' }); const j = await r.json(); if (!j.list) throw 0;
    const L = j.list;
    const top = L.slice(0, 3), order = [top[1], top[0], top[2]], rc = ['linear-gradient(135deg,#e8eef7,#8d99ab)', 'linear-gradient(135deg,#fff3b0,#e3a326)', 'linear-gradient(135deg,#ffc89a,#a8622a)'];
    let h = `<div class="hd"><b>Rangliste</b><small>Gesamt · alle Spiele</small></div>`;
    if (!L.length) h += `<div class="empty">Noch keiner drauf. Hol dir in irgendeinem Spiel einen Bestwert!</div>`;
    else {
      h += `<div class="pod">${order.map((x, k) => x ? `<div class="pd ${k === 1 ? 'p1' : ''}" data-u="${x.id}" style="--rc:${rc[k === 1 ? 1 : k === 0 ? 0 : 2]}"><div class="ring"><img src="${avOf(x)}" alt=""></div><b>${esc(x.name)}</b><span>${x.s} P</span><i>${['2.', '1.', '3.'][k]} Platz</i></div>` : '<div></div>').join('')}</div>`;
      h += L.slice(3, 7).map((x, i) => `<div class="rr ${x.you ? 'you' : ''}" data-u="${x.id}"><span class="n">${i + 4}</span><img src="${avOf(x)}" alt=""><b>${esc(x.name)}</b><em>🎖️${x.nach}</em><span>${x.s}</span></div>`).join('');
      if (j.me && j.me.rank > 7) h += `<div class="rr you"><span class="n">${j.me.rank}</span><b>Du</b><span>${j.me.s}</span></div>`;
    }
    h += `<button class="more" id="rMore">Ganze Bestenliste ›</button>`;
    el.innerHTML = h;
    el.querySelectorAll('[data-u]').forEach(x => x.onclick = () => b.showUser(x.dataset.u));
    $('rMore').onclick = () => b.open('board', '_all');
  } catch (e) { el.innerHTML = `<div class="hd"><b>Rangliste</b></div><div class="empty">Gerade nicht erreichbar.</div><button class="more" onclick="BB.open('board')">Bestenliste öffnen ›</button>`; }
}
function avOf(x) { return x.img && x.id ? `api/bb.php?a=img&u=${x.id}&v=${x.img}` : IMG(x.av || 'artur'); }
function go(v) {
  if (v === 'rank') { B() && B().open('board', '_all'); return; }
  if (v === 'me') { B() && B().open(B().loggedIn ? 'profil' : 'login'); return; }
  if (v === 'games') { const el = $('spiele'); scrollTo({ top: el.getBoundingClientRect().top + scrollY - 10, behavior: 'smooth' }); }
  else scrollTo({ top: 0, behavior: 'smooth' });
  document.querySelectorAll('.tabs [data-tab]').forEach(x => x.classList.toggle('on', x.dataset.tab === v));
}
// Tab-Leiste zeigt an, wo man gerade ist
addEventListener('scroll', () => { const y = $('spiele').getBoundingClientRect().top; document.querySelectorAll('.tabs [data-tab]').forEach(x => x.classList.toggle('on', x.dataset.tab === (y < innerHeight * .5 ? 'games' : 'hub'))); }, { passive: true });
document.querySelectorAll('[data-go]').forEach(x => x.onclick = () => go(x.dataset.go));
document.querySelectorAll('.tabs [data-tab]').forEach(x => x.onclick = () => go(x.dataset.tab));
if (location.hash === '#spiele') setTimeout(() => go('games'), 300);
draw(); rank();
if (window.BB) {
  BB.chip($('bbChip'));
  let last = '';
  BB.onChange(P => { const k = JSON.stringify([P.name, P.rh, P.av, P.img, Object.keys(P.ach).length, P.best]); if (k !== last) { last = k; draw(); } });
  if (BB.onMeta) BB.onMeta(draw);
  BB.gate();
}
</script>
