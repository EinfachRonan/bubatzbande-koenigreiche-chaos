<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubatzbande · Spiele</title>
<meta name="theme-color" content="#070a05">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a05;--txt:#f1e6c8;--mut:#a99d7e;--gold:#d4af37;--gold2:#f0d37a;--line:#7a6128;--g1:#3e7530;--g2:#1c3f15}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
html,body{min-height:100%;color:var(--txt);font:15px/1.45 Georgia,serif}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-40px;z-index:-3;background:url(krieg/img/hoehle.jpg) center/cover;filter:blur(14px) brightness(.38) saturate(1.1)}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 50% 25%,rgba(140,220,90,.10),transparent 55%),radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.7) 100%)}
.motes{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.motes i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#cfff8a;box-shadow:0 0 6px 2px rgba(150,240,90,.55);animation:rise linear infinite;opacity:0}
.motes i:nth-child(3n){background:#f0d37a;box-shadow:0 0 6px 2px rgba(240,200,90,.55)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.9}100%{transform:translate(var(--dx),-105vh);opacity:0}}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(rgba(10,14,7,.94),rgba(10,14,7,.82));border-bottom:1px solid rgba(212,175,55,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:9px;margin-right:auto;text-decoration:none}
.logo img{width:34px;height:34px;border-radius:8px;border:1px solid var(--line)}
.logo b{font:900 19px "Cinzel Decorative","Cinzel",serif;background:linear-gradient(#fff3c4,#d4af37 60%,#8a6a1d);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.lb{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:linear-gradient(#1f2c19,#0f170c);color:var(--gold2);font:800 14px "Cinzel",serif;cursor:pointer}

/* Held-Bereich */
.hero{position:relative;max-width:1180px;margin:18px auto 0;padding:0 16px}
.heroimg{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--gold);outline:1px solid #3a3418;outline-offset:5px;box-shadow:0 30px 80px rgba(0,0,0,.75)}
.heroimg img{display:block;width:100%;aspect-ratio:1400/481;object-fit:cover}
.heroimg::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(7,10,5,.92)),radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.45))}
.heroin{position:absolute;left:16px;right:16px;bottom:0;padding:18px 26px;display:flex;align-items:flex-end;gap:16px;z-index:1}
.heroin p{font-size:clamp(14px,1.8vw,18px);color:#efe2bf;max-width:560px;text-shadow:0 2px 6px #000}
.heroin p b{color:var(--gold2);font-family:"Cinzel",serif}
.stats{display:flex;gap:8px;margin-left:auto;cursor:pointer}
.stats div{min-width:84px;text-align:center;padding:8px 12px;border-radius:10px;background:rgba(8,12,6,.78);border:1px solid rgba(212,175,55,.5)}
.stats b{display:block;font:800 22px "Cinzel",serif;color:#fff3c4;line-height:1.1}.stats span{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}

.sec{max-width:1180px;margin:30px auto 12px;padding:0 16px;display:flex;align-items:center;gap:14px}
.sec h2{font:800 clamp(18px,2.4vw,24px) "Cinzel",serif;color:var(--gold2);letter-spacing:.06em;white-space:nowrap}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}

/* Spielkarten */
.grid{max-width:1180px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media (min-width:1000px){.grid{grid-template-columns:repeat(6,1fr)}.card{grid-column:span 2}.card.wide{grid-column:span 3}.card.wide .ba{aspect-ratio:16/8}.card.wide .ba-quiz .ans{top:33%}.card.wide .ba-quiz .ans i{height:7cqw;font-size:3.6cqw}.card.wide .ba-quiz .crowd img{width:7cqw;height:7cqw}.card.wide .ba-quiz .q{top:8%;font-size:3.4cqw;padding:1.6cqw}}
.card{position:relative;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;background:linear-gradient(#141d10,#0a0f07);border:1px solid #8a6d32;outline:1px solid #2e2a14;outline-offset:4px;box-shadow:0 18px 44px rgba(0,0,0,.6);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);border-color:var(--gold2);box-shadow:0 26px 60px rgba(0,0,0,.7),0 0 34px rgba(212,175,55,.22)}
.card:hover .ba-bg{transform:scale(1.06)}
.card .art{position:relative;border-bottom:1px solid rgba(212,175,55,.45)}
.card .art::after{content:"";position:absolute;left:12%;right:12%;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.badge{position:absolute;top:10px;left:10px;z-index:6;font:800 11px "Cinzel",serif;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:5px;background:linear-gradient(#f0d37a,#b8902c);color:#2a1a08;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.body{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid rgba(212,175,55,.35);color:#d9c9a0;background:rgba(0,0,0,.25)}
.card h3{font:800 25px "Cinzel",serif;color:#fff3d4;letter-spacing:.01em;line-height:1.1}
.card p{color:#cdbf9c;font-size:14.5px;flex:1}
.foot{display:flex;align-items:center;gap:10px;margin-top:4px}
.best{font-size:12.5px;color:var(--mut);line-height:1.25}.best b{display:block;font:800 16px "Cinzel",serif;color:#fff3c4}
.play{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:8px;border:1px solid var(--gold);background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4;font:800 15px "Cinzel",serif;letter-spacing:.14em;box-shadow:inset 0 1px 0 rgba(255,240,180,.3),0 0 0 2px #070a05,0 0 0 3px #4a3c18;transition:box-shadow .2s}
.card:hover .play{box-shadow:inset 0 1px 0 rgba(255,240,180,.3),0 0 0 2px #070a05,0 0 0 3px var(--gold),0 0 22px rgba(120,210,80,.45)}

/* Sammlung */
.colb{position:relative;display:flex;align-items:center;gap:22px;max-width:1148px;margin:22px auto 0;padding:16px 22px;border-radius:14px;text-decoration:none;color:inherit;background:radial-gradient(ellipse at 15% 50%,rgba(212,175,55,.18),transparent 55%),linear-gradient(#1a2412,#0a0f07);border:1px solid var(--gold);outline:1px solid #2e2a14;outline-offset:4px;box-shadow:0 18px 44px rgba(0,0,0,.6);transition:transform .25s,box-shadow .25s}
@media (min-width:1181px){.colb{margin-left:auto;margin-right:auto}}
@media (max-width:1180px){.colb{margin-left:16px;margin-right:16px}}
.colb:hover{transform:translateY(-4px);box-shadow:0 26px 60px rgba(0,0,0,.7),0 0 34px rgba(212,175,55,.25)}
.colb .fan{position:relative;flex:none;width:220px;height:130px}
.colb .fan img{position:absolute;bottom:0;width:78px;height:110px;object-fit:cover;object-position:50% 25%;border-radius:8px;border:2px solid var(--gold);box-shadow:0 8px 18px rgba(0,0,0,.7);transition:transform .35s}
.colb .fan img:nth-child(1){left:0;transform:rotate(-18deg) translateY(8px);border-color:#c78bff}
.colb .fan img:nth-child(2){left:36px;transform:rotate(-9deg) translateY(2px);border-color:#ffb43a}
.colb .fan img:nth-child(3){left:72px;z-index:2;bottom:8px;border-color:#c78bff}
.colb .fan img:nth-child(4){left:108px;transform:rotate(9deg) translateY(2px);border-color:#6ab0ff}
.colb .fan img:nth-child(5){left:144px;transform:rotate(18deg) translateY(8px);border-color:#c78bff}
.colb:hover .fan img:nth-child(1){transform:rotate(-24deg) translate(-8px,6px)}.colb:hover .fan img:nth-child(5){transform:rotate(24deg) translate(8px,6px)}
.colb .ct{flex:1;min-width:0}
.colb h2{font:800 24px "Cinzel",serif;color:#fff3d4}
.colb p{color:#cdbf9c;font-size:14.5px;margin-top:4px}
.badge2{display:inline-block;font:800 10.5px "Cinzel",serif;letter-spacing:.1em;padding:3px 8px;border-radius:5px;background:linear-gradient(#f0d37a,#b8902c);color:#2a1a08;margin-bottom:4px}
.cst{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.cst span{padding:4px 11px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid #4a3c18;font-size:13px;color:#d9c9a0}.cst b{font-family:"Cinzel",serif;color:#ffe9a0}
@media (max-width:700px){.colb{flex-direction:column;text-align:center;margin:18px 12px 0;padding:16px}.colb .fan{width:200px;height:120px}.colb .fan img{width:70px;height:100px}.colb .fan img:nth-child(2){left:32px}.colb .fan img:nth-child(3){left:65px}.colb .fan img:nth-child(4){left:98px}.colb .fan img:nth-child(5){left:130px}.cst{justify-content:center}.colb .play{margin:0}}
footer{text-align:center;color:rgba(241,230,200,.45);font:12px "Cinzel",serif;letter-spacing:.2em;margin:34px 0 22px;padding-bottom:env(safe-area-inset-bottom)}
@media (max-width:700px){
  .logo b{font-size:16px}.lb span{display:none}
  .hero{margin-top:12px;padding:0 12px}.heroimg{border-radius:12px;outline-offset:3px}
  .heroimg img{aspect-ratio:16/9;object-position:50% 30%}
  .heroin{position:static;padding:12px 2px 0;flex-direction:column;align-items:stretch;gap:10px}
  .heroimg::after{background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.4))}
  .stats{margin:0}.stats div{flex:1;min-width:0}
  .grid{grid-template-columns:1fr;padding:0 12px;gap:16px}.sec{padding:0 12px;margin-top:22px}
  .card h3{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.motes{display:none}}
</style>
</head>
<body>
<div class="motes" id="motes"></div>
<header class="top">
  <a class="logo" href="./"><img src="icon-180.png" alt=""><b>Bubatzbande</b></a>
  <span id="bbChip"></span>
  <button class="lb" id="bbBoard">🏆 <span>Bestenliste</span></button>
</header>

<section class="hero">
  <div class="heroimg"><img src="krieg/img/hero.jpg" alt="Die Bubatzbande: Königreiche & Chaos"></div>
  <div class="heroin"><p id="hello"></p><div class="stats" id="stats"></div></div>
</section>

<a class="colb" href="bande/" id="colb">
  <div class="fan"><img src="bande/img/der-gruene-kobold.jpg" alt=""><img src="bande/img/der-koenig-von-deutschland.jpg" alt=""><img src="bande/img/mr-mollymann.jpg" alt=""><img src="bande/img/donpatron.jpg" alt=""><img src="bande/img/der-graue-geist.jpg" alt=""></div>
  <div class="ct"><span class="badge2">Neu</span><h2>Die Bande sammeln</h2><p>Verdien in jedem Spiel Bandengold, öffne Kräuterbeutel und sammel 30 Karten. Jede Karte macht dich in einem Spiel stärker.</p>
    <div class="cst"><span>🪙 <b id="cbg">0</b> Bandengold</span><span>🃏 <b id="ccards">0</b>/30 Karten</span></div></div>
  <span class="play">🃏 Zur Sammlung</span>
</a>
<div class="sec"><h2>Wähle dein Spiel</h2></div>
<main class="grid" id="games"></main>
<footer>bubatzbande.de · Königreiche & Chaos</footer>

<script src="art.js?v=20261108c"></script>
<script src="bb.js?v=20261108c"></script>
<script>
'use strict';
const GAMES = [
  { k: 'runner', url: 'runner/', name: 'Kobold-Runner', chips: ['Endlos', 'Solo', 'Highscore'], text: 'Der Kobold rennt durch die Kräuterhöhle, springt über Kessel, rutscht unter Balken durch und sammelt Gold. Wie weit kommst du?', badge: 'Neu', wide: 1 },
  { k: 'hof', url: 'hof/', name: 'Bandenhof', chips: ['Aufbau', 'Idle', 'läuft auch offline'], text: 'Fokuhila schmiedet, LG3 baut Kräuter an, DonPatron verkauft. Bau den Hof aus und hol die ganze Bande dazu.', badge: 'Neu', wide: 1 },
  { k: 'krieg', url: 'krieg/', name: 'Bandenkrieg', chips: ['Strategie', 'Solo', 'gegen die Spießer'], text: 'Schick Artur, den Kobold und den Rest der Bande los, lass Marwin ein Katapult auf den Turm bauen und stürm die Spießerburg.' },
  { k: 'schach', url: 'schach/', name: 'Schlagabtausch', chips: ['3D-Schach', 'Online 1 gegen 1'], text: 'Schach im Wohnzimmer gegen Herrn Holz. Wird eine Figur geschlagen, kämpfen beide im Ego-Duell um ihr Leben.' },
  { k: 'match', url: 'match/', name: 'Kräuter-Match', chips: ['Puzzle', 'Solo', 'Level'], text: 'Drei Kräuter in eine Reihe. Kobold, Fokuhila und Mollymann helfen mit Spezialkräften, erst 12 Level, dann endlos.' },
  { k: 'quiz', url: 'quiz/', name: 'Bubatz-Quiz', chips: ['Party', 'Online mit Code', 'Solo'], text: 'Einer hostet am TV, alle antworten am Handy. Lade deine Freunde direkt ein oder schreib eigene Fragen.', wide: 1 },
  { k: 'duell', url: 'duell/', name: 'Kneipen-Duell', chips: ['1 gegen 1', 'Ein Handy', 'gegen den Wirt'], text: 'Bier zapfen, Krug schieben, Prost-Duell, Armdrücken. Wer zuerst 3 Runden holt, ist Kneipenkönig.', badge: 'Neu', wide: 1 }
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function draw() {
  const B = window.BB, P = B ? B.profile : null;
  document.getElementById('games').innerHTML = GAMES.map(g => {
    const best = B && B.best(g.k), G = B && B.GAMES[g.k];
    return `<a class="card${g.wide ? ' wide' : ''}" href="${g.url}">
      <div class="art">${window.BBArt ? BBArt.html(g.k) : ''}${g.badge ? `<span class="badge">${g.badge}</span>` : ''}</div>
      <div class="body"><div class="chips">${g.chips.map(c => `<span>${esc(c)}</span>`).join('')}</div>
        <h3>${esc(g.name)}</h3><p>${esc(g.text)}</p>
        <div class="foot">${best ? `<div class="best">Dein Bestwert<b>${B.fmt(g.k, best.s)} ${G.unit ? `<small style="font:12px Georgia,serif;color:var(--mut)">${G.unit}</small>` : ''}</b></div>` : `<div class="best">Noch kein Bestwert</div>`}
        <span class="play">▶ PLAY</span></div></div></a>`;
  }).join('');
  if (B && B.meta) { document.getElementById('cbg').textContent = B.meta.bg.toLocaleString('de-DE'); document.getElementById('ccards').textContent = Object.keys(B.meta.cards).length; }
  const hello = document.getElementById('hello'), stats = document.getElementById('stats');
  if (B && B.loggedIn) {
    const nb = Object.keys(P.best).length;
    hello.innerHTML = `<b>Hi ${esc(P.name)}!</b> Schön, dass du wieder da bist. ${nb < GAMES.length ? `Dir fehlen noch ${GAMES.length - nb} Spiele auf der Bestenliste.` : 'Du stehst in allen Spielen auf der Bestenliste.'}`;
    stats.innerHTML = `<div><b>${Object.keys(P.ach).length}</b><span>Erfolge</span></div><div><b>${(P.fr || []).length}</b><span>Freunde</span></div><div><b>${nb}/${GAMES.length}</b><span>Bestwerte</span></div>`;
    stats.onclick = () => B.open('profil');
  } else {
    hello.innerHTML = '<b>Willkommen in der Bande.</b> Sieben Spiele, eine Bestenliste. Sammel Erfolge, add deine Freunde und jag sie auf den Rängen.';
    stats.innerHTML = '';
  }
}
draw();
if (window.BB) {
  BB.chip(document.getElementById('bbChip'));
  document.getElementById('bbBoard').onclick = () => BB.open('board');
  let last = '';
  BB.onChange(P => { const k = JSON.stringify([P.name, Object.keys(P.ach).length, (P.fr || []).length, P.best]); if (k !== last) { last = k; draw(); } });
  if (BB.onMeta) BB.onMeta(draw);
  BB.gate();
}
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.getElementById('motes');
  for (let i = 0; i < 22; i++) {
    const e = document.createElement('i');
    e.style.left = Math.random() * 100 + '%';
    e.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    e.style.animationDuration = 9 + Math.random() * 10 + 's';
    e.style.animationDelay = -Math.random() * 16 + 's';
    box.appendChild(e);
  }
})();
</script>
</body>
</html>
