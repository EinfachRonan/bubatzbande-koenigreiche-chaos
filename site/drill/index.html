<style>

@font-face{font-family:"Pixelify Sans";src:url(../fonts/pixelify-400.woff2) format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"Pixelify Sans";src:url(../fonts/pixelify-700.woff2) format("woff2");font-weight:600 900;font-display:swap}
@font-face{font-family:Silkscreen;src:url(../fonts/silkscreen.woff2) format("woff2");font-display:swap}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font:600 14px var(--mono);overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;border-left:1px solid #111;border-right:1px solid #111}
/* Kopf */
.hud{position:relative;flex:none;display:flex;align-items:flex-start;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 6px}
.back{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--txt);text-decoration:none;font-size:18px}
.mid{flex:1;text-align:center;min-width:0}
.cr{font:400 27px/1.1 Silkscreen,var(--mono);letter-spacing:.01em;white-space:nowrap;text-shadow:0 0 12px rgba(92,232,240,.45),2px 2px 0 #0d3a40}
.mul{color:var(--cy);font-size:15px}
.mul{cursor:pointer;pointer-events:auto;white-space:nowrap;font-size:10.5px!important;letter-spacing:0!important}.mtab{width:100%;border-collapse:collapse;font-size:12px;text-align:right}.mtab td,.mtab th{padding:5px 4px;border-bottom:1px solid #1b262b}.mtab td:first-child,.mtab th:first-child{text-align:left;color:#cfd8da}.mtab th{color:var(--cy);font-weight:600}.mtab .tot td{font:400 14px Silkscreen,var(--mono);color:var(--cy);border:0;padding-top:8px}
.mul.bon{color:var(--pk)!important;text-shadow:0 0 10px rgba(255,79,122,.7)}
.cry{position:absolute;left:12px;top:calc(max(10px,env(safe-area-inset-top)) + 46px);font-size:14px;color:var(--txt)}
.pl{flex:none;width:78px;text-align:center}
.pl .box{width:62px;height:62px;margin:0 auto;border:1px solid #555;display:flex;align-items:center;justify-content:center}
.pl .box canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.pl .box i{width:24px;height:24px;border-radius:50%;box-shadow:inset -5px -4px 0 rgba(0,0,0,.35)}
.pl small{display:block;font-size:11px;color:#cfd8da;margin-top:5px;line-height:1.35}
/* Spielfeld */
#cv{flex:1 1 auto;min-height:220px;width:100%;display:block;touch-action:none;image-rendering:pixelated}
/* Unten */
.panel{flex:none;height:45%;max-height:440px;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--bg)}
.list{flex:1;overflow-y:auto;padding:8px 8px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.wp{position:relative;display:flex;align-items:center;gap:10px;padding:10px 10px 12px;border:1.5px solid var(--cy2);margin-bottom:7px;background:var(--panel)}
.wp .nm{flex:1;min-width:0}
.wp b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp .lv{font-size:13px;color:#cfd8da;margin-top:3px}
.wp .dps{font-size:12px;color:#cfd8da;text-align:right;white-space:nowrap}
.wp .pr{position:absolute;left:10px;right:10px;bottom:4px;height:3px;background:#1b2225}
.wp .pr i{display:block;height:100%;background:var(--cy)}
.br{position:relative;flex:none;min-width:108px;height:46px;padding:0 10px;background:transparent;color:var(--txt);border:1.5px solid #555;font:700 14px var(--mono);cursor:pointer}
.br::before,.br::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--cy)}
.br::before{left:-2px;top:-2px;border-right:0;border-bottom:0}.br::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.br:disabled{color:var(--pk);border-color:#3a2a2e;cursor:default}
.br:disabled::before,.br:disabled::after{border-color:#5a2a35}
.br:not(:disabled):active{transform:translateY(1px);background:#0e1a1c}
.unl{width:100%;height:58px;margin-bottom:7px;font-size:15px;letter-spacing:.06em}
.unl:disabled{color:var(--pk)}
.unl:not(:disabled){color:var(--cy);border-color:var(--cy2)}
.mode{display:flex;gap:6px;margin:0 0 8px}
.mode button{flex:1;height:32px;background:transparent;border:1px solid var(--line);color:var(--mut);font:700 12px var(--mono);cursor:pointer}
.mode button.on{border-color:var(--cy);color:var(--cy)}
.sk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.sk button{position:relative;aspect-ratio:1;background:#0b0f0b;border:1.5px solid #3e7a3a;color:var(--txt);font:700 11px var(--mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px}
.sk button svg{width:34px;height:34px}
.sk button .c{position:absolute;right:5px;top:4px;font-size:11px;color:#cfd8da}

.sk button.su3{border-color:#c9a233}.sk button.su3 .q{background:#ffd23f}.sk button.su3 small i{font-style:normal;color:#ffd23f}
.sk button.max{border-color:var(--cy2)}
.sk button:disabled{opacity:.45;cursor:default}
.sk button small{font-size:10px;color:var(--mut);text-align:center;line-height:1.2}
.skh{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px;font-size:13px;color:#cfd8da}
.skh b{color:var(--txt);font-size:16px}
.skh span,.wp b,.nav button,.hs.bst,.ov h2,.unl,.eqrow span,.mode button,#pln{font-family:Silkscreen,var(--mono);font-weight:400;letter-spacing:.02em}
.wp b{font-size:13px}.nav button{font-size:10px}.ov h2{font-size:18px}
.nav{flex:none;display:flex;gap:6px;padding:6px 8px max(8px,env(safe-area-inset-bottom))}
.nav button{position:relative;flex:1;min-width:0;height:54px;background:transparent;border:1.5px solid #3a4246;color:var(--txt);font:700 12px var(--mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav button svg{width:22px;height:22px}
.nav button.on{border-color:var(--cy);background:#081619}
.nav button.boost{flex:1.3}
.nav button.boost.act{border-color:var(--li);color:var(--li)}
.nav .dot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--pk)}
.sv{font-size:10px;color:var(--mut);white-space:nowrap;margin-top:3px}
.sv.ok{color:var(--li)}
.dm{color:#c9a2ff}.chp{color:#ff9f43}
.boss{color:var(--pk)!important}
.wh{border:1.5px solid #7b5cff;background:#0d0a18;padding:14px;margin-bottom:9px;text-align:center}
.wh b{display:block;font-size:22px;color:#c9a2ff;margin:4px 0}
.wh p{font-size:12px;color:#cfd8da;line-height:1.5}
.wh .br{width:100%;margin-top:10px;height:52px}
.wh .br:not(:disabled){color:#c9a2ff;border-color:#7b5cff}
.wh .br:not(:disabled)::before,.wh .br:not(:disabled)::after{border-color:#c9a2ff}
.sk.wp6 button{border-color:#5a3fb0;background:#0d0a18}
.sk.wp6 button .q{background:#c9a2ff}
.savebar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:12px 2px 10px;font-size:11px;color:var(--mut)}
.savebar button{height:34px;padding:0 12px;background:transparent;border:1px solid var(--line);color:var(--txt);font:700 12px var(--mono);cursor:pointer}
.hot{flex:none;display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--line)}
.hs{position:relative;flex:1;min-width:0;aspect-ratio:1;max-height:58px;background:#0b0e10;border:1.5px solid var(--cy2);color:var(--txt);font:700 18px var(--mono);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.hs svg{width:62%;height:62%}
.hs.empty{border-color:#333b40;color:#56636a;font-size:24px}
.hs .cd{position:absolute;inset:0;pointer-events:none}
.hs .ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;text-shadow:0 0 4px #000;pointer-events:none}
.hs.rdy{box-shadow:inset 0 0 12px rgba(92,232,240,.35)}
.hs.act{border-color:var(--li);box-shadow:0 0 12px rgba(157,255,106,.6)}
.hs.shp{border-color:#ffe94d;color:#ffe94d}.hs.shp svg{width:55%;height:55%}
.shop{display:flex;flex-direction:column;gap:8px}
.sbox{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--rc);background:#0b0e10}
.sbox>div{flex:1;min-width:0}.sbox b{display:block;font:400 13px Silkscreen,var(--mono);color:var(--rc)}.sbox small{display:block;font-size:11px;color:#cfd8da;margin-top:3px}.sbox .odds i{font-style:normal;margin-right:4px}
.sbox .br{min-width:74px;height:44px}
.ultab{display:flex;align-items:center;gap:10px;justify-content:center;border:1px dashed #c9a2ff;padding:8px;margin-bottom:12px;font-size:12px;color:#cfd8da;text-align:left}.ultab b{color:#c9a2ff}
.hs.bst{flex:1.25;aspect-ratio:auto;flex-direction:column;font-size:11px;gap:2px;border-color:#3a4246}
.hs.bst svg{width:20px;height:20px}
.hs.bst.act{border-color:var(--li);color:var(--li)}
.hs.bst:disabled{color:var(--mut)}
.lb2{position:absolute;left:58px;top:max(10px,env(safe-area-inset-top));width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:transparent;color:var(--txt);cursor:pointer}
.lb2 svg{width:20px;height:20px}
.sk.ab button{border-color:var(--cy2);background:#081214}
.sk.ab button.on{border-color:var(--cy);box-shadow:inset 0 0 0 1px var(--cy)}
.sk.ab button.lock{border-color:#2a3034;color:#4c565b;background:#090b0c}
.sk button em,.inv em{position:absolute;right:4px;bottom:3px;font:700 10px var(--mono);color:var(--cy);font-style:normal}
.row2{display:flex;gap:8px}.row2 .br{flex:1;min-width:0;font-size:12px}
.stars{color:#ffe94d}
.br .gn{display:block;font-size:10px;color:var(--li);font-weight:600;margin-top:2px}.br:disabled .gn{color:#6b4450}
.idet{border:1.5px solid var(--rc);background:#080c0e;padding:10px;margin:0 0 10px;box-shadow:0 0 14px color-mix(in srgb,var(--rc) 25%,transparent)}
.ihd{display:flex;gap:10px;align-items:center}.ihd .ib{width:58px;height:58px;border:1.5px solid var(--rc);display:flex;align-items:center;justify-content:center;background:#05080a}
.ihd b{display:block;font:400 13px Silkscreen,var(--mono);color:var(--rc)}.ihd small{font-size:11px;color:#9fb3b8}
.xpb{position:relative;height:16px;background:#0f171a;margin:9px 0 6px;border:1px solid #1e2a2f}.xpb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--rc),#fff6);}.xpb span{position:relative;display:block;text-align:center;font:400 9px/16px Silkscreen,var(--mono)}
.ist{list-style:none;font-size:12px;margin:4px 0 8px;line-height:1.6}.ist em{font-style:normal;color:var(--li)}.ist .hab{color:#ffe94d}
.mlt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.mlt button{position:relative;width:52px;height:56px;background:#05080a;border:1.5px solid var(--rc);color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 9px var(--mono);cursor:pointer}.mlt button em{font-style:normal;color:var(--li);font-size:9px}.mlt button:disabled{opacity:.4}
.inv button.sel{outline:2px solid #fff;outline-offset:1px}.inv .dupb{position:absolute;left:3px;top:2px;font:400 9px Silkscreen,var(--mono);font-style:normal;color:#ffe94d}
.su2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}.su{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:9px;background:linear-gradient(180deg,#151a0b,#0b0e07);box-shadow:inset 0 0 0 1px #3a4a1c,inset 3px 0 0 #9dff6a}.su .wic{display:none}.su b{font:400 11px Silkscreen,var(--mono);color:#cfff9a}.su .lv{font-size:10.5px;color:#9fb08a;margin-top:2px}.su .br{min-width:0;height:36px;font-size:13px}
.offer{display:grid;grid-template-columns:1fr 1fr;gap:8px}.offer .br{min-width:0;height:auto;padding:12px 8px;display:flex;flex-direction:column;gap:5px;text-align:center}.offer .br b{font-size:13px}.offer .br small{font-size:10.5px;color:#cfd8da;line-height:1.35;font-weight:600}.offer .br span{font-size:13px;color:var(--cy)}.offer .br:disabled span{color:var(--pk)}
.rr{width:100%;height:40px;margin:8px 0 2px;font-size:12px}
.hint{font-size:11px;color:var(--mut);text-align:center;padding:8px 4px 10px;line-height:1.45}
.eqrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border:1.5px solid var(--cy2);padding:10px 6px;margin-bottom:8px;text-align:center}
.eqrow span{display:block;color:var(--cy);font-size:12px;margin-bottom:6px}
.eqrow .ib{width:56px;height:56px;margin:0 auto;border:1.5px solid;display:flex;align-items:center;justify-content:center}
.eqrow small{display:block;font-size:10px;color:#cfd8da;margin-top:5px;line-height:1.3}
.hslots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}
.hslots button{display:flex;align-items:center;gap:6px;padding:6px;background:#070b0d;border:1.5px solid #1e2a2f;color:var(--txt);cursor:pointer;text-align:left;min-width:0}
.hslots button.on{border-color:var(--cy);background:#0a1a1d;box-shadow:0 0 10px rgba(92,232,240,.25)}
.hslots .hi{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--rc);background:#05080a}
.hslots .ht{min-width:0}.hslots b{display:block;font:400 10px Silkscreen,var(--mono);color:var(--cy)}.hslots button:not(.on) b{color:#9fb3b8}
.hslots small{display:block;font-size:9.5px;line-height:1.25;color:#cfd8da;margin-top:2px}
.hab2{font-size:11px;color:#ffe94d;margin:-2px 0 8px;padding:5px 8px;border-left:3px solid #ffe94d;background:#14130a}
.inv2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.inv2 button{position:relative;height:86px;background:#0b0e10;border:1.5px solid color-mix(in srgb,var(--rc) 55%,#1e2a2f);color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px 6px;overflow:hidden}
.inv2 .rb{position:absolute;inset:0 0 auto 0;height:3px;background:var(--rc)}
.inv2 b{font:700 10px var(--mono);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--rc)}
.inv2 small{font-size:10px;color:#9fb3b8}.inv2 small em{font-style:normal;color:#ffe94d}
.inv2 button.on{background:#0c1a12;border-color:var(--li)}
.inv2 .eqb{position:absolute;right:4px;top:5px;width:16px;height:16px;background:var(--li);color:#041204;font:700 11px/16px var(--mono);text-align:center}
.inv2 button.no{opacity:.4;border-style:dashed;cursor:default}.inv2 .qq{font:400 22px Silkscreen,var(--mono);color:#5c6b70}
.hsheet{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;justify-content:flex-end}
.hsbg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.hsp{position:relative;max-height:78%;overflow-y:auto;background:#080c0e;border-top:2px solid var(--rc);padding:14px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px color-mix(in srgb,var(--rc) 20%,transparent);animation:hsUp .18s ease-out}
@keyframes hsUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.hsx{position:absolute;right:10px;top:10px;width:30px;height:30px;background:#0f171a;border:1px solid #2a363b;color:var(--txt);font-size:14px;cursor:pointer}
.ist2{display:grid;gap:6px;margin:4px 0 10px}.ist2>div{background:#0d1316;border:1px solid #1e2a2f;padding:7px 9px}
.ist2 small{display:block;font-size:10px;color:#8fa3a8}.ist2 b{display:block;font:400 15px Silkscreen,var(--mono);color:var(--txt)}.ist2 em{font-style:normal;font-size:10.5px;color:var(--li)}
.ist2 .hab b{font:700 12px var(--mono);color:#ffe94d}
.inv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:2px 0 4px}
.inv button{position:relative;aspect-ratio:1;background:#0b0e10;border:1.5px solid var(--rc);color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10px var(--mono)}
.inv button.on{background:#141018;box-shadow:inset 0 0 10px color-mix(in srgb,var(--rc) 40%,transparent)}
.inv button.no{border-style:dashed;opacity:.35;font-size:18px}
.inv small{font-size:10px;color:#cfd8da}
.crates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.crates .br{min-width:0;height:auto;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border-color:var(--rc)}
.crates .br b{font-size:11px}.crates .br small{font-size:12px;color:#c9a2ff}
.crates .br:disabled small{color:var(--pk)}
.crate{display:flex;justify-content:center;margin-bottom:10px}
.cbox{width:110px;height:110px;display:flex;align-items:center;justify-content:center;border:2px solid var(--rc);box-shadow:0 0 30px color-mix(in srgb,var(--rc) 55%,transparent);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:5;padding:10px 14px;border:1.5px solid var(--cy);background:rgba(5,6,7,.94);font-size:13px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;max-width:90%}
.toast.on{opacity:1}
.ov{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:20px}
.ov.hide{display:none}
.ov .bx{width:100%;max-width:360px;border:1.5px solid var(--cy);background:var(--panel);padding:20px;text-align:center}
.ov h2{font:700 20px var(--mono);margin-bottom:8px;color:var(--cy)}
.ov p{color:#cfd8da;font-size:13px;line-height:1.5;margin-bottom:14px}
.ov .br{width:100%;margin-top:6px}
.ov .br.again{background:linear-gradient(180deg,#2a2f0e,#15180a);border-color:#ffe94d;color:#ffe94d;box-shadow:inset 0 0 12px rgba(255,233,77,.18)}.ov .br.again:disabled{opacity:.4}

/* ===== Menü-Design v2: Neon-Terminal mit Pixel-Kanten ===== */
.hud{background:linear-gradient(180deg,#0a0d10,#06080a);border-bottom:1px solid #1b2328;padding-bottom:8px}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--cy) 30%,var(--pk) 70%,transparent);opacity:.55}
.lb2{width:34px!important;height:34px!important}.lb2 svg{width:17px!important;height:17px!important}.lb2{left:54px}.lb3{left:92px}.back{width:36px!important;height:34px!important}
.mid{padding-left:92px}.cr{font-size:23px!important}
.vrow{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:14px;text-align:left}.vrow span{width:92px}.vrow input{flex:1;accent-color:#5ce8f0}.vrow b{width:30px;text-align:right;color:var(--cy)}
.back,.lb2{border-color:#2a3338;background:#0b1013;box-shadow:inset 0 -3px 0 #050708}

/* ===== PC / Desktop: Vollbild – großes Spielfeld links, Menü als Seitenleiste rechts ===== */
@media (min-width:900px) and (min-height:540px){
  #app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) clamp(390px,30vw,500px);grid-template-rows:auto minmax(0,1fr);border:0}
  .hud{grid-column:1;grid-row:1;padding:12px 18px 10px}
  #cv{grid-column:1;grid-row:2;min-height:0!important;height:100%}
  .panel{grid-column:2;grid-row:1/3;height:100%!important;max-height:none;border-left:1px solid #1b2328}
  .panel::after{content:"";position:absolute;left:-1px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--cy) 30%,var(--pk) 70%,transparent);opacity:.45;pointer-events:none}
  .nav{order:-1;border-top:0;border-bottom:1px solid #1b2328;padding:12px 10px 10px}
  .nav button{height:58px}
  .hot{order:0;border-top:0;border-bottom:1px solid #1b2328;padding:10px}
  .list{padding:12px 12px 16px;scrollbar-width:thin}
  .cr{font-size:34px}.mul{font-size:16px}
  .toast{left:calc((100% - clamp(390px,30vw,500px)) / 2);top:120px}
  .hsheet{left:auto;width:clamp(390px,30vw,500px)}
  .ov .bx{max-width:460px}
  .keys{display:block!important}
}
@media (min-width:1400px){ .sk{grid-template-columns:repeat(4,minmax(0,1fr))!important} .inv2{grid-template-columns:repeat(4,minmax(0,1fr))} }
.keys{display:none;position:absolute;left:14px;bottom:12px;z-index:3;font-size:11px;color:#6f8287;pointer-events:none;letter-spacing:.3px}
.keys b{display:inline-block;min-width:18px;padding:1px 5px;margin-right:3px;border:1px solid #2a363b;background:#070b0d;color:#bfe;text-align:center;font-weight:400}
/* Menü zugeklappt: nur Hotbar + Leiste, Rest ist Spielfeld */
#app.fold .list{display:none}
#app.fold .panel{height:auto!important;max-height:none}
/* Kleine Handys (z. B. iPhone SE): Spielfeld etwas kleiner, unten mehr Platz zum Bedienen */
@media (max-height:760px){
  .panel{height:calc(100% - 300px);max-height:none}
  #cv{min-height:170px}
  .hud{padding-bottom:4px}.cr{font-size:23px}.mul{font-size:13px}
  .hot{padding:5px 8px}.hs{max-height:44px}
  .nav{padding-top:5px}.nav button{height:44px;gap:2px}.nav button svg{width:18px;height:18px}
}
@media (max-height:620px){ .panel{height:calc(100% - 260px)} #cv{min-height:140px} }
.inav{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 10px;font-size:10.5px;color:#8fa3a8;letter-spacing:.4px}
.inav button{width:40px;height:34px;background:#0b1114;border:1.5px solid var(--ic);color:var(--ic);cursor:pointer;display:flex;align-items:center;justify-content:center}
.inf.slr{animation:infR .18s ease-out}.inf.sll{animation:infL .18s ease-out}
@keyframes infR{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}@keyframes infL{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}

/* ===== Schiff-Stil: Menü wie die Raumschiffe – Metallplatten mit dunkler Kontur, Lichtkante oben, cyan Leuchtstreifen ===== */
:root{--ink:#050912;--pl1:#222e3b;--pl2:#16202b;--pl3:#0d131a;--plate:linear-gradient(180deg,var(--pl1) 0%,var(--pl2) 52%,var(--pl3) 100%);--bev:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -2px 0 rgba(0,0,0,.5),0 0 0 1.5px var(--ink)}
.panel{background:linear-gradient(180deg,#0b1118,#06090d);border-top:2px solid #2a3a48;box-shadow:inset 0 1px 0 rgba(92,232,240,.25)}
.wp{background:var(--plate);border:1.5px solid #34485a;border-radius:6px;box-shadow:var(--bev);padding-left:14px}
.wp::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--wc,var(--cy));box-shadow:0 0 8px var(--wc,var(--cy))}
.wp .pr{background:#070b10;height:4px;border-radius:2px;box-shadow:inset 0 1px 0 rgba(0,0,0,.6)}
.wp .pr i{border-radius:2px;background:linear-gradient(90deg,#2bb7c2,#8ff6ff);box-shadow:0 0 6px rgba(92,232,240,.6)}
.wp .wic{border-radius:8px;background:radial-gradient(circle at 35% 30%,#1c2a36,#05080c 75%);border-width:2px}
.br{border-radius:6px;background:var(--plate);border:1.5px solid #3f5466;box-shadow:var(--bev)}
.br::before,.br::after{display:none}
.br:not(:disabled){border-color:#4f6b80}
.br:not(:disabled)::after{display:block;left:10px;right:10px;bottom:3px;top:auto;width:auto;height:2px;border:0;border-radius:2px;background:var(--cy);box-shadow:0 0 6px var(--cy);opacity:.85}
.br:disabled{background:linear-gradient(180deg,#1a1d24,#0e1015);border-color:#3a2a33;color:#ff7a96}
.br:not(:disabled):active{transform:translateY(1px);background:linear-gradient(180deg,#16202b,#0d131a)}
.sk button{border-radius:8px;background:var(--plate);box-shadow:var(--bev);border-width:1.5px}
.sk button .q{border-radius:2px;box-shadow:0 0 6px currentColor}
.sk button:not(:disabled):active{transform:translateY(1px)}
.sk.wp6 button{background:linear-gradient(180deg,#2a2140,#181228 55%,#0e0a18)}
.sk.ab button{background:linear-gradient(180deg,#1b2d36,#112028 55%,#0a141a)}
.sk.ab button.lock{background:linear-gradient(180deg,#14181d,#0b0e12)}
.mode{background:#070b10;border-radius:8px;padding:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.7),0 0 0 1.5px #22303c}
.mode button{border:0;border-radius:6px;height:30px}
.mode button.on{background:linear-gradient(180deg,#1d3a44,#112630 55%,#0a1a20);color:#eaffff;box-shadow:var(--bev),inset 0 -2px 0 var(--cy)}
.skh span{text-shadow:0 0 8px rgba(92,232,240,.35)}
.hot{background:linear-gradient(180deg,#0e151d,#080c11);border-top:2px solid #26343f;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.hs{border-radius:9px;background:radial-gradient(circle at 50% 35%,#1a2836,#0a1017 70%);border:2px solid #36506a;box-shadow:inset 0 2px 4px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.08),0 0 0 1.5px var(--ink)}
.hs.empty{background:radial-gradient(circle at 50% 35%,#121a22,#070a0e 70%);border-style:dashed;border-color:#2c3a46}
.hs.rdy{border-color:var(--cy);box-shadow:inset 0 0 14px rgba(92,232,240,.3),0 0 0 1.5px var(--ink),0 0 8px rgba(92,232,240,.25)}
.hs.shp{background:radial-gradient(circle at 50% 35%,#3a3210,#120f04 70%)}
.hs.bst{background:var(--plate);box-shadow:var(--bev)}
.nav{background:linear-gradient(180deg,#0c121a,#05080c);border-top:2px solid #26343f;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.nav button{border-radius:8px;background:var(--plate);border:1.5px solid #2e3e4c;box-shadow:var(--bev);color:#b9c8d0}
.nav button.on{border-color:var(--cy);color:#eaffff;background:linear-gradient(180deg,#1d3a44,#112630 55%,#0a1a20);box-shadow:var(--bev),inset 0 -3px 0 var(--cy),0 0 12px rgba(92,232,240,.3)}
.nav button.on svg{filter:drop-shadow(0 0 4px var(--cy))}
.ov .bx{border-radius:10px;background:linear-gradient(180deg,#1a2430,#0e141b 60%,#090d12);border:1.5px solid #4f6b80;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 2px var(--ink),0 10px 40px rgba(0,0,0,.6)}
.crates .br{background:var(--plate)}
.eqrow{border-radius:8px;background:var(--plate);box-shadow:var(--bev);border-color:#34485a}
.eqrow .ib{border-radius:8px;background:radial-gradient(circle at 40% 30%,#1c2a36,#05080c 75%)}
.hslots button{border-radius:8px;background:var(--plate);box-shadow:var(--bev)}
.hslots .hi{border-radius:7px}
.offer .br{border-color:#4f6b80}

/* ===== Vollbild-Seiten (Shop, Hangar, Fähigkeiten, Statistik) ===== */
#app.full .panel{position:absolute;left:0;right:0;top:var(--hudh,96px);bottom:0;height:auto!important;max-height:none;z-index:6;animation:fullIn .22s ease-out}
#app.full .hot{display:none}
@keyframes fullIn{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.fhd{position:sticky;top:-8px;z-index:4;display:flex;align-items:center;gap:10px;margin:-8px -8px 12px;padding:12px 10px 11px 14px;background:linear-gradient(180deg,#16212c,#0d141b);border-bottom:2px solid #2c3d4b;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 16px rgba(0,0,0,.45)}
.fhd b{flex:1;font:400 17px Silkscreen,var(--mono);color:#eaffff;text-shadow:0 0 10px rgba(92,232,240,.55)}
.fhd .fcur{font:600 13px var(--mono);color:#cfe6ea;white-space:nowrap}
.fhd button{flex:none;height:34px;padding:0 12px;border-radius:7px;background:var(--plate);border:1.5px solid #4f6b80;color:var(--txt);font:600 12px var(--mono);box-shadow:var(--bev);cursor:pointer}
.oddsbar{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-top:6px;box-shadow:0 0 0 1px #050912}
.oddsbar i{display:block;min-width:4px}
#app.full .sbox{padding:14px 12px}
#app.full .sbox>svg{width:64px;height:64px;filter:drop-shadow(0 0 10px var(--rc))}
.hg-hero{position:relative;display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:12px;border-radius:10px;background:radial-gradient(circle at 25% 50%,#17303a,#0a1117 65%);border:1.5px solid #34485a;box-shadow:var(--bev);overflow:hidden}
.hg-hero::before{content:"";position:absolute;left:-30px;top:50%;width:200px;height:200px;margin-top:-100px;background:radial-gradient(circle,var(--rc) 0,transparent 60%);opacity:.18}
.hg-ship{position:relative;flex:none;width:118px;height:118px;display:flex;align-items:center;justify-content:center;animation:hover 3s ease-in-out infinite}
.hg-ship img{filter:drop-shadow(0 0 14px var(--rc)) drop-shadow(0 6px 6px rgba(0,0,0,.6))}
@keyframes hover{50%{transform:translateY(-5px)}}
.hg-sum{position:relative;flex:1;min-width:0}
.hg-sum b{display:block;font:400 14px Silkscreen,var(--mono);color:#eaffff;margin-bottom:6px}
.hg-sum div{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:#cfd8da;padding:3px 0;border-bottom:1px solid #1d2a33}
.hg-sum div span:last-child{color:var(--li);font-weight:700}
.cmp{margin-top:8px;padding:8px 10px;border-radius:7px;background:#070b10;font-size:12px;color:#cfd8da;box-shadow:inset 0 0 0 1px #22303c}
.cmp b.up{color:var(--li)}.cmp b.dn{color:#ff7a96}
.hbe{display:flex;gap:7px;margin:0 0 6px}
.hbe button{position:relative;flex:1;aspect-ratio:1;max-height:64px;border-radius:10px;background:radial-gradient(circle at 50% 35%,#1a2836,#0a1017 70%);border:2px solid #36506a;color:#cfe6ea;font:700 20px var(--mono);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 1.5px var(--ink)}
.hbe button svg{width:58%;height:58%}
.hbe button.emp{border-style:dashed;border-color:#2c3a46;color:#56636a}
.hbe button.sel{border-color:#ffe94d;box-shadow:0 0 0 1.5px var(--ink),0 0 14px rgba(255,233,77,.45);animation:hbsel 1s ease-in-out infinite}
.hbe button small{position:absolute;left:4px;top:2px;font:400 9px Silkscreen,var(--mono);color:#7f9196}
@keyframes hbsel{50%{transform:scale(1.05)}}
.hbe-h{font-size:11px;color:var(--mut);margin:0 2px 10px;text-align:center}
.hbe-h b{color:#ffe94d}
.stw{margin-bottom:12px}
.stw div{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;margin-bottom:7px}
.stw .wic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;border:1.5px solid;background:#05080c}
.stw .wic svg{width:17px;height:17px}
.stw .bar{position:relative;height:22px;border-radius:5px;background:#070b10;box-shadow:inset 0 0 0 1px #1d2a33;overflow:hidden}
.stw .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;opacity:.85}
.stw .bar span{position:relative;display:block;padding:0 8px;line-height:22px;font-size:11.5px;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
.stw em{font-style:normal;font:700 12px var(--mono);color:#eaffff;min-width:42px;text-align:right}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.stg div{padding:10px;border-radius:8px;background:var(--plate);box-shadow:var(--bev);border:1.5px solid #2e3e4c}
.stg small{display:block;font-size:10.5px;color:var(--mut);margin-bottom:3px}
.stg b{font:400 16px Silkscreen,var(--mono);color:#eaffff}
.cele{position:absolute;left:0;right:0;top:18%;z-index:30;display:flex;flex-direction:column;align-items:center;pointer-events:none;animation:celeIn 2.1s ease-out forwards}
.cele .cs{position:relative;width:110px;height:110px;display:flex;align-items:center;justify-content:center}
.cele .cs::before{content:"";position:absolute;inset:-40px;background:repeating-conic-gradient(from 0deg,rgba(255,233,77,.28) 0 6deg,transparent 6deg 18deg);border-radius:50%;animation:spin 3s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.cele img{position:relative;filter:drop-shadow(0 0 16px #ffe94d)}
.cele b{margin-top:8px;font:400 22px Silkscreen,var(--mono);color:#ffe94d;text-shadow:0 0 14px rgba(255,233,77,.7),2px 2px 0 #3a2a00}
.cele span{margin-top:4px;font:600 13px var(--mono);color:#eaffff;text-shadow:0 1px 3px #000;background:rgba(5,9,18,.7);padding:4px 10px;border-radius:6px}
.cele.uni b{color:#c9a2ff;text-shadow:0 0 14px rgba(201,162,255,.8),2px 2px 0 #2a1450}
@keyframes celeIn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.lflash{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(circle,rgba(255,233,77,.55),rgba(255,233,77,0) 70%);animation:lfl .9s ease-out forwards}
@keyframes lfl{from{opacity:1}to{opacity:0}}
.list.swl{animation:swl .2s ease-out}.list.swr{animation:swr .2s ease-out}
@keyframes swl{from{transform:translateX(30px);opacity:.3}to{transform:none;opacity:1}}@keyframes swr{from{transform:translateX(-30px);opacity:.3}to{transform:none;opacity:1}}
.abimg{display:block;image-rendering:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.hs .abimg{width:84%;height:84%}.hbe .abimg{width:86%;height:86%}.sk button .abimg{width:44px;height:44px}.abh .abimg{width:46px;height:46px;flex:none}

.ov .bx{border-image-width:22px 30px;padding:24px 22px}
.wp::before{left:12px;top:12px;bottom:12px}

.br:not(:disabled)::after{display:none}

.nav button.on{border-image-source:url(ui/tab_on.png);background:none;box-shadow:0 0 14px rgba(92,232,240,.35)}
.hs,.hbe button{border-style:solid;border-image:url(ui/slot_g.png) 24 fill / 9px stretch;background:none;border-radius:0}
.hs.empty,.hbe button.emp{opacity:.55}

.hs.shp{border-image-source:url(ui/slot_l.png)}

.hg-grid button[data-r="l"],.hg-load button[data-r="l"]{border-image-source:url(ui/slot_l.png)}
.hg-grid button[data-r="e"],.hg-load button[data-r="e"]{border-image-source:url(ui/slot_g.png);box-shadow:inset 0 0 14px rgba(255,95,224,.35)!important}
.sk button{border-style:solid;border-image:url(ui/slot_g.png) 24 fill / 9px stretch;background:none!important;border-radius:0}
.sk.ab button.on{border-image-source:url(ui/slot_s.png)}
.sk.wp6 button{box-shadow:inset 0 0 18px rgba(201,162,255,.25)!important}

.fg .br{margin-top:8px;width:100%}.fg-on{margin-top:8px;text-align:center;font:400 12px Silkscreen,var(--mono);color:var(--hc)}

// ================== Schleife ==================
let emaT = 0;
