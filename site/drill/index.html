<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Galaxie-Bohrer · Bubatzbande</title>
<meta name="theme-color" content="#050607">
<link rel="icon" href="../icon-180.png">
<link href="../theme.css?v=1" rel="stylesheet">
<style>
:root{--bg:#050607;--panel:#0b0e10;--line:#2b3236;--cy:#5ce8f0;--cy2:#2bb7c2;--pk:#ff4f7a;--li:#9dff6a;--txt:#e9f4f5;--mut:#7f9196;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font:600 14px var(--mono);overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;border-left:1px solid #111;border-right:1px solid #111}
/* Kopf */
.hud{position:relative;flex:none;display:flex;align-items:flex-start;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 6px}
.back{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--txt);text-decoration:none;font-size:18px}
.mid{flex:1;text-align:center;min-width:0}
.cr{font:700 26px/1.1 var(--mono);letter-spacing:.02em;white-space:nowrap}
.mul{color:var(--cy);font-size:15px}
.cry{position:absolute;left:12px;top:calc(max(10px,env(safe-area-inset-top)) + 46px);font-size:14px;color:var(--txt)}
.pl{flex:none;width:78px;text-align:center}
.pl .box{width:62px;height:62px;margin:0 auto;border:1px solid #555;display:flex;align-items:center;justify-content:center}
.pl .box i{width:24px;height:24px;border-radius:50%;box-shadow:inset -5px -4px 0 rgba(0,0,0,.35)}
.pl small{display:block;font-size:11px;color:#cfd8da;margin-top:5px;line-height:1.35}
/* Spielfeld */
#cv{flex:1 1 auto;min-height:220px;width:100%;display:block;touch-action:none}
/* Unten */
.panel{flex:none;height:50%;max-height:470px;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--bg)}
.list{flex:1;overflow-y:auto;padding:8px 8px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.wp{position:relative;display:flex;align-items:center;gap:10px;padding:10px 10px 12px;border:1.5px solid var(--cy2);margin-bottom:7px;background:var(--panel)}
.wp .nm{flex:1;min-width:0}
.wp b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp .lv{font-size:13px;color:#cfd8da;margin-top:3px}
.wp .dps{font-size:12px;color:#cfd8da;text-align:right;white-space:nowrap}
.wp .pr{position:absolute;left:10px;right:10px;bottom:4px;height:3px;background:#1b2225}
.wp .pr i{display:block;height:100%;background:var(--cy)}
.br{position:relative;flex:none;min-width:108px;height:46px;padding:0 10px;background:transparent;color:var(--txt);border:1.5px solid #555;font:700 14px var(--mono);cursor:pointer}
.br::before,.br::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--cy)}
.br::before{left:-2px;top:-2px;border-right:0;border-bottom:0}.br::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.br:disabled{color:var(--pk);border-color:#3a2a2e;cursor:default}
.br:disabled::before,.br:disabled::after{border-color:#5a2a35}
.br:not(:disabled):active{transform:translateY(1px);background:#0e1a1c}
.unl{width:100%;height:58px;margin-bottom:7px;font-size:15px;letter-spacing:.06em}
.unl:disabled{color:var(--pk)}
.unl:not(:disabled){color:var(--cy);border-color:var(--cy2)}
.mode{display:flex;gap:6px;margin:0 0 8px}
.mode button{flex:1;height:32px;background:transparent;border:1px solid var(--line);color:var(--mut);font:700 12px var(--mono);cursor:pointer}
.mode button.on{border-color:var(--cy);color:var(--cy)}
.sk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.sk button{position:relative;aspect-ratio:1;background:#0b0f0b;border:1.5px solid #3e7a3a;color:var(--txt);font:700 11px var(--mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px}
.sk button svg{width:34px;height:34px}
.sk button .c{position:absolute;right:5px;top:4px;font-size:11px;color:#cfd8da}
.sk button .q{position:absolute;left:5px;top:5px;width:9px;height:9px;background:var(--li)}
.sk button.max{border-color:var(--cy2)}
.sk button:disabled{opacity:.45;cursor:default}
.sk button small{font-size:10px;color:var(--mut);text-align:center;line-height:1.2}
.skh{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px;font-size:13px;color:#cfd8da}
.skh b{color:var(--txt);font-size:16px}
.nav{flex:none;display:flex;gap:6px;padding:6px 8px max(8px,env(safe-area-inset-bottom))}
.nav button{position:relative;flex:1;min-width:0;height:54px;background:transparent;border:1.5px solid #3a4246;color:var(--txt);font:700 12px var(--mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav button svg{width:22px;height:22px}
.nav button.on{border-color:var(--cy);background:#081619}
.nav button.boost{flex:1.3}
.nav button.boost.act{border-color:var(--li);color:var(--li)}
.nav .dot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--pk)}
.sv{font-size:10px;color:var(--mut);white-space:nowrap;margin-top:3px}
.sv.ok{color:var(--li)}
.dm{color:#c9a2ff}
.boss{color:var(--pk)!important}
.wh{border:1.5px solid #7b5cff;background:#0d0a18;padding:14px;margin-bottom:9px;text-align:center}
.wh b{display:block;font-size:22px;color:#c9a2ff;margin:4px 0}
.wh p{font-size:12px;color:#cfd8da;line-height:1.5}
.wh .br{width:100%;margin-top:10px;height:52px}
.wh .br:not(:disabled){color:#c9a2ff;border-color:#7b5cff}
.wh .br:not(:disabled)::before,.wh .br:not(:disabled)::after{border-color:#c9a2ff}
.sk.wp6 button{border-color:#5a3fb0;background:#0d0a18}
.sk.wp6 button .q{background:#c9a2ff}
.savebar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:12px 2px 10px;font-size:11px;color:var(--mut)}
.savebar button{height:34px;padding:0 12px;background:transparent;border:1px solid var(--line);color:var(--txt);font:700 12px var(--mono);cursor:pointer}
.hot{flex:none;display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--line)}
.hs{position:relative;flex:1;min-width:0;aspect-ratio:1;max-height:58px;background:#0b0e10;border:1.5px solid var(--cy2);color:var(--txt);font:700 18px var(--mono);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.hs svg{width:62%;height:62%}
.hs.empty{border-color:#333b40;color:#56636a;font-size:24px}
.hs .cd{position:absolute;inset:0;pointer-events:none}
.hs .ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;text-shadow:0 0 4px #000;pointer-events:none}
.hs.rdy{box-shadow:inset 0 0 12px rgba(92,232,240,.35)}
.hs.act{border-color:var(--li);box-shadow:0 0 12px rgba(157,255,106,.6)}
.hs.bst{flex:1.25;aspect-ratio:auto;flex-direction:column;font-size:11px;gap:2px;border-color:#3a4246}
.hs.bst svg{width:20px;height:20px}
.hs.bst.act{border-color:var(--li);color:var(--li)}
.hs.bst:disabled{color:var(--mut)}
.lb2{position:absolute;left:58px;top:max(10px,env(safe-area-inset-top));width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:transparent;color:var(--txt);cursor:pointer}
.lb2 svg{width:20px;height:20px}
.sk.ab button{border-color:var(--cy2);background:#081214}
.sk.ab button.on{border-color:var(--cy);box-shadow:inset 0 0 0 1px var(--cy)}
.sk.ab button.lock{border-color:#2a3034;color:#4c565b;background:#090b0c}
.sk button em,.inv em{position:absolute;right:4px;bottom:3px;font:700 10px var(--mono);color:var(--cy);font-style:normal}
.row2{display:flex;gap:8px}.row2 .br{flex:1;min-width:0;font-size:12px}
.stars{color:#ffe94d}
.offer{display:grid;grid-template-columns:1fr 1fr;gap:8px}.offer .br{min-width:0;height:auto;padding:12px 8px;display:flex;flex-direction:column;gap:5px;text-align:center}.offer .br b{font-size:13px}.offer .br small{font-size:10.5px;color:#cfd8da;line-height:1.35;font-weight:600}.offer .br span{font-size:13px;color:var(--cy)}.offer .br:disabled span{color:var(--pk)}
.rr{width:100%;height:40px;margin:8px 0 2px;font-size:12px}
.hint{font-size:11px;color:var(--mut);text-align:center;padding:8px 4px 10px;line-height:1.45}
.eqrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border:1.5px solid var(--cy2);padding:10px 6px;margin-bottom:8px;text-align:center}
.eqrow span{display:block;color:var(--cy);font-size:12px;margin-bottom:6px}
.eqrow .ib{width:56px;height:56px;margin:0 auto;border:1.5px solid;display:flex;align-items:center;justify-content:center}
.eqrow small{display:block;font-size:10px;color:#cfd8da;margin-top:5px;line-height:1.3}
.inv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:2px 0 4px}
.inv button{position:relative;aspect-ratio:1;background:#0b0e10;border:1.5px solid var(--rc);color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10px var(--mono)}
.inv button.on{background:#141018;box-shadow:inset 0 0 10px color-mix(in srgb,var(--rc) 40%,transparent)}
.inv button.no{border-style:dashed;opacity:.35;font-size:18px}
.inv small{font-size:10px;color:#cfd8da}
.crates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.crates .br{min-width:0;height:auto;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border-color:var(--rc)}
.crates .br b{font-size:11px}.crates .br small{font-size:12px;color:#c9a2ff}
.crates .br:disabled small{color:var(--pk)}
.crate{display:flex;justify-content:center;margin-bottom:10px}
.cbox{width:110px;height:110px;display:flex;align-items:center;justify-content:center;border:2px solid var(--rc);box-shadow:0 0 30px color-mix(in srgb,var(--rc) 55%,transparent);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:5;padding:10px 14px;border:1.5px solid var(--cy);background:rgba(5,6,7,.94);font-size:13px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;max-width:90%}
.toast.on{opacity:1}
.ov{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:20px}
.ov.hide{display:none}
.ov .bx{width:100%;max-width:360px;border:1.5px solid var(--cy);background:var(--panel);padding:20px;text-align:center}
.ov h2{font:700 20px var(--mono);margin-bottom:8px;color:var(--cy)}
.ov p{color:#cfd8da;font-size:13px;line-height:1.5;margin-bottom:14px}
.ov .br{width:100%;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <a class="back" href="../" aria-label="Zur Startseite">←</a>
    <button class="lb2" id="lb" aria-label="Bestenliste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/></svg></button>
    <span class="cry" id="cry">◆0</span>
    <div class="mid"><div class="cr" id="cr">0 CR</div><div class="mul" id="mul">x1.00</div><div class="sv" id="sv"></div></div>

  </div>
  <canvas id="cv"></canvas>
  <div class="toast" id="toast"></div>
  <div class="panel">
    <div class="hot" id="hot"></div>
    <div class="list" id="list"></div>
    <nav class="nav">
      <button data-t="w" class="on" aria-label="Waffen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l7-7M14 4l6 6-8 8-6-6z"/></svg>Waffen</button>
      <button data-t="s" aria-label="Skills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7 7 .5-5.5 4.5 2 7L12 17l-6.5 4 2-7L2 9.5 9 9z"/></svg>Skills<span class="dot" id="skdot" hidden></span></button>
      <button data-t="a" aria-label="Fähigkeiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l7-3-4 7M5 12l9-4-3 8M8 6l13-3-5 13z"/></svg>Fähigk.<span class="dot" id="abdot" hidden></span></button>
      <button data-t="h" aria-label="Hangar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l5 14-5-3-5 3z"/><path d="M8 19l4 3 4-3"/></svg>Hangar<span class="dot" id="hgdot" hidden></span></button>
      <button data-t="p" aria-label="Warp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 12m-2 0a2 2 0 1 0 4 0a4 4 0 1 0-8 0a6 6 0 1 0 12 0a8 8 0 1 0-16 0"/></svg>Warp<span class="dot" id="wpdot" hidden></span></button>
    </nav>
  </div>
  <div class="ov hide" id="ov"><div class="bx" id="ovb"></div></div>
</div>

<script>
'use strict';
// ================== Daten ==================
const WEAP = [
  { id: 'line', n: 'Kobold-Strahl', d: 'Dauerlaser auf den nächsten Block' },
  { id: 'star', n: 'Mollys Kristallstern', d: '4 rotierende Laser' },
  { id: 'drill', n: 'Fokuhilas Bohrlanze', d: 'Durchschlagender Stoß bis zum Kern' },
  { id: 'nova', n: 'Geister-Nova', d: 'Druckwelle rund ums Schiff' },
  { id: 'scatter', n: 'Nilles Streufeuer', d: '7 Schüsse im Fächer' },
  { id: 'drones', n: 'DonPatrons Drohnen', d: '3 Drohnen ballern mit' },
  { id: 'chain', n: 'Marwins Kettenblitz', d: 'Blitz springt über 6 Blöcke' },
  { id: 'saw', n: 'LG3s Kräutersäge', d: '2 Sägeblätter kreisen ums Schiff' },
  { id: 'mine', n: 'Allans Minenwerfer', d: 'Minen explodieren auf der Oberfläche' },
  { id: 'sniper', n: 'Königsschuss', d: 'Ein Riesenschuss auf das wertvollste Erz' }
];
// Stärke hängt davon ab, als wievielte Waffe sie gekauft wurde, nicht welche es ist
const T_DPS = [2, 9, 34, 120, 450, 1800, 7000, 28000, 110000, 450000];
const T_UP = [10, 350, 5e3, 9e4, 1.8e6, 3.5e7, 7e8, 1.4e10, 2.8e11, 5.6e12];
const T_UNL = [0, 500, 8e3, 1.5e5, 3e6, 6e7, 1.2e9, 2.5e10, 5e11, 1e13];
const tier = id => Math.max(0, S.wo.indexOf(id));
const owned = () => S.wo.filter(id => WL(id));
const nextUnl = () => T_UNL[owned().length];
const RR_MAX = 3;
function rrState() { const now = Date.now(); if (!S.rr || now - S.rr.t >= 3600e3) S.rr = { n: RR_MAX, t: now }; return S.rr; }
function offers() {
  const left = WEAP.filter(w => !WL(w.id)).map(w => w.id);
  if (!left.length) return [];
  if (!S.offer || S.offer.length !== Math.min(2, left.length) || S.offer.some(id => !left.includes(id))) { const p = left.slice().sort(() => Math.random() - .5); S.offer = p.slice(0, 2); }
  return S.offer;
}
const SKILLS = [
  { id: 'dmg', n: 'Laserfokus', d: '+15 % Schaden', max: 10, ico: '<circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>' },
  { id: 'cr', n: 'Goldgier', d: '+15 % CR', max: 10, ico: '<circle cx="12" cy="12" r="8"/><path d="M12 7v10M9 10h6"/>' },
  { id: 'crit', n: 'Krit-Kern', d: '+4 % Krit (x3)', max: 10, ico: '<path d="M12 2v6M12 16v6M4 12h4M16 12h4M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/>' },
  { id: 'spd', n: 'Turbo', d: '+10 % Feuerrate', max: 10, ico: '<path d="M4 20l16-16M9 4h11v11"/>' },
  { id: 'ore', n: 'Erzader', d: '+1,5 % Erze', max: 8, ico: '<path d="M12 2l8 5v10l-8 5-8-5V7z"/><path d="M12 7l4 2.5v5L12 17l-4-2.5v-5z"/>' },
  { id: 'off', n: 'Überstunden', d: '+10 % offline', max: 5, ico: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' }
];
const PAL = [
  ['#0e4c52', '#0a3439', '#38d6d8'], ['#e07b32', '#7a3613', '#ffb46a'], ['#8c4be0', '#3d1d6d', '#d9a8ff'],
  ['#3f9a3a', '#1c4a1a', '#b5ff8a'], ['#c8344f', '#5e1222', '#ff9ab0'], ['#7aa8d8', '#28466a', '#e2f2ff'], ['#d9b22a', '#6e550c', '#fff0a0']
];
const WARP = [
  { id: 'start', n: 'Startkapital', d: l => 'Start mit ' + fmt(startCr(l + 1)) + ' CR', max: 10, cost: l => l + 1, ico: '<circle cx="12" cy="12" r="8"/><path d="M12 7v10M9 10h6"/>' },
  { id: 'kris', n: 'Kristallregen', d: () => '+1 ◆ pro Planet', max: 5, cost: l => 2 * (l + 1), ico: '<path d="M12 2l8 5v10l-8 5-8-5V7z"/>' },
  { id: 'boost', n: 'Nachbrenner', d: () => 'Boost +2 min', max: 5, cost: l => 2 * (l + 1), ico: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>' },
  { id: 'skip', n: 'Hyperraum', d: () => 'Start +3 Planeten', max: 5, cost: l => 3 * (l + 1), ico: '<path d="M4 12h12M12 6l6 6-6 6M4 6v12"/>' },
  { id: 'comet', n: 'Kometenjäger', d: () => 'Kometen öfter, +50 %', max: 3, cost: l => 3 * (l + 1), ico: '<circle cx="16" cy="8" r="3"/><path d="M13 11L4 20M11 7L5 13M17 13l-6 6"/>' },
  { id: 'auto', n: 'Autopilot', d: () => 'Zündet Fähigkeiten selbst', max: 1, cost: () => 30, ico: '<rect x="5" y="7" width="14" height="11" rx="2"/><path d="M12 3v4M9 12h.01M15 12h.01M9 15h6"/>' },
];
const startCr = l => l ? 500 * Math.pow(12, l - 1) : 0;
const NAMES = ['Kräuterhöhle', 'Rostrot', 'Violettia', 'Moosmond', 'Spießerstern', 'Frostkugel', 'Goldader'];
const fmt = n => { if (!isFinite(n)) return '∞'; if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n).toString();
  const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc']; let i = -1; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; } return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + u[i]; };
const $ = id => document.getElementById(id);

// ================== Speicherstand ==================
let S = null;
const fresh = () => ({ cr: 0, cry: 0, p: 1, best: 1, w: { line: 1 }, sk: {}, boostEnd: 0, boostCd: 0, ema: 0, t: Date.now(), last: Date.now(), done: 0, dm: 0, dmAll: 0, pc: 0, wp: {}, own: '', ab: {}, hot: [], abT: {}, buf: {}, inv: { h_pfeil: 1, r_basis: 1, t_basis: 1 }, eq: { h: 'h_pfeil', r: 'r_basis', t: 't_basis' }, wo: ['line'], offer: null, rr: null });
const norm = o => Object.assign(fresh(), o || {}, { w: Object.assign({ line: 1 }, (o && o.w) || {}), sk: (o && o.sk) || {}, wp: (o && o.wp) || {}, ab: (o && o.ab) || {}, hot: (o && o.hot) || [], abT: (o && o.abT) || {}, buf: (o && o.buf) || {}, inv: Object.assign({ h_pfeil: 1, r_basis: 1, t_basis: 1 }, (o && o.inv) || {}), eq: Object.assign({ h: 'h_pfeil', r: 'r_basis', t: 't_basis' }, (o && o.eq) || {}), wo: (o && o.wo) || ['line', 'star', 'drill', 'nova', 'scatter', 'drones'].filter(id => o && o.w && o.w[id]) });
try { S = JSON.parse(localStorage.getItem('gb_save')); } catch (e) {}
S = S && typeof S.cr === 'number' ? norm(S) : fresh();
const logged = () => !!(window.BB && BB.loggedIn);

    ${abSel && AL(abSel) ? (() => { const a = ABIL.find(x => x.id === abSel), l = AL(abSel), c = abUpCost(abSel); return `<div class="wh" style="margin-top:10px"><p><b style="display:inline;font-size:14px;color:var(--txt)">${a.n}</b> · Lvl. ${l}<br>Stärke x${abPow(abSel).toFixed(2)} · Abklingzeit ${Math.round(abCd(a))} s</p>
      <div class="row2"><button class="br" id="abeq">${S.hot.includes(abSel) ? 'Ablegen' : 'Ausrüsten'}</button><button class="br" id="abup" ${l >= 10 || S.dm < c ? 'disabled' : ''}>${l >= 10 ? 'Max' : 'Verbessern ✦' + c}</button></div></div>`; })() : ''}
    <div class="row2" style="margin-top:10px"><button class="br" id="aball" ${own.some(a => AL(a.id) < 10 && S.dm >= abUpCost(a.id)) ? '' : 'disabled'}>Alle verbessern</button><button class="br" id="abbest" ${own.length ? '' : 'disabled'}>Beste ausrüsten</button></div>
    <button class="br unl" id="abdraw" style="margin-top:9px" ${allOwned || S.dm < dc ? 'disabled' : ''}>${allOwned ? 'ALLE FÄHIGKEITEN GEZOGEN' : 'FÄHIGKEIT ZIEHEN<br>✦' + dc}</button>
    <div class="hint">✦ Dunkle Materie bekommst du bei jedem Warp-Sprung (ab Planet 3).</div>`;
  L.querySelectorAll('[data-ab]').forEach(b => b.onclick = () => { abSel = abSel === b.dataset.ab ? null : b.dataset.ab; render(); });
  if ($('abeq')) $('abeq').onclick = () => { const i = S.hot.indexOf(abSel); if (i >= 0) S.hot[i] = null; else { const f = S.hot.findIndex(x => !x); if (f >= 0 && f < 5) S.hot[f] = abSel; else if (S.hot.length < 5) S.hot.push(abSel); else S.hot[4] = abSel; } S.hot = S.hot.slice(0, 5); save('now'); hotbar(true); render(); };
  if ($('abup')) $('abup').onclick = () => { const c = abUpCost(abSel); if (AL(abSel) >= 10 || S.dm < c) return; S.dm -= c; S.ab[abSel]++; save('now'); render(); };
  $('aball').onclick = () => { let go = true; while (go) { go = false; const c = own.filter(a => AL(a.id) < 10).sort((a, b) => abUpCost(a.id) - abUpCost(b.id))[0]; if (c && S.dm >= abUpCost(c.id)) { S.dm -= abUpCost(c.id); S.ab[c.id]++; go = true; } } save('now'); render(); };
  $('abbest').onclick = () => { S.hot = own.slice().sort((a, b) => AL(b.id) - AL(a.id)).slice(0, 5).map(a => a.id); save('now'); hotbar(true); render(); };
  $('abdraw').onclick = () => { const left = ABIL.filter(a => !AL(a.id)); if (!left.length || S.dm < dc) return; S.dm -= dc; const a = left[(Math.random() * left.length) | 0]; S.ab[a.id] = 1;
    const f = [0, 1, 2, 3, 4].find(k => !S.hot[k]); if (f != null) S.hot[f] = a.id; save('now'); hotbar(true);
    overlay(`<div class="crate" style="--rc:#c9a2ff"><div class="cbox"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#c9a2ff" stroke-width="1.6">${a.ico}</svg></div></div><h2 style="color:#c9a2ff">${a.n}</h2><p>${a.d}<br>Abklingzeit ${a.cd} s${f != null ? '<br>Liegt jetzt auf deiner Hotbar.' : ''}</p>`, [['Nice', () => render()]]); };
}
function renderHangar(L) {
  L.innerHTML = `<div class="eqrow">${['h', 'r', 't'].map(s => { const it = eqItem(s); return `<div><span>${SLOT[s].n}</span><div class="ib" style="border-color:${RAR[it.r].c}">${itemSvg(it, 40)}</div><small>Lvl. ${S.inv[it.id] || 1} · +${Math.round(itemVal(it, S.inv[it.id]) * 100)} % ${SLOT[s].st}</small></div>`; }).join('')}</div>
    <div class="mode">${['h', 'r', 't'].map(s => `<button data-hs="${s}" class="${hTab === s ? 'on' : ''}">${SLOT[s].n}</button>`).join('')}</div>
    <div class="inv">${ITEMS.filter(x => x.s === hTab).map(it => { const l = S.inv[it.id], on = S.eq[it.s] === it.id;
      return `<button data-it="${it.id}" ${l ? '' : 'disabled'} style="--rc:${RAR[it.r].c}" class="${on ? 'on' : ''} ${l ? '' : 'no'}">${l ? itemSvg(it, 34) : '?'}<small>${l ? 'Lvl. ' + l : RAR[it.r].n}</small>${on ? '<em>AUSG</em>' : ''}</button>`; }).join('')}</div>
    <div class="hint" id="itinfo">Tipp auf ein Teil zum Ausrüsten. Doppelte Teile steigen eine Stufe auf (max. 10).</div>
    <button class="br" id="best" style="width:100%;margin:2px 0 12px">Beste ausrüsten</button>
    <div class="skh"><span>Kisten</span><b class="dm">✦ ${S.dm || 0}</b></div>
    <div class="crates">${CRATES.map(k => `<button class="br" data-cr="${k.id}" ${S.dm < k.cost ? 'disabled' : ''} style="--rc:${k.c}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${k.c}" stroke-width="1.6"><rect x="3" y="8" width="18" height="12" rx="1"/><path d="M3 12h18M10 8V5h4v3M12 12v3"/></svg><b>${k.n}</b><small>✦${k.cost}</small></button>`).join('')}</div>
    <div class="hint">Schrottkiste: meist gewöhnlich · Bandenkiste: oft selten · Nullraum-Kiste: 20 % Legendär</div>`;
  L.querySelectorAll('[data-hs]').forEach(b => b.onclick = () => { hTab = b.dataset.hs; render(); });
  L.querySelectorAll('[data-it]').forEach(b => b.onclick = () => { const it = IT(b.dataset.it); S.eq[it.s] = it.id; save('now'); render(); toast(`${it.n} ausgerüstet · +${Math.round(itemVal(it, S.inv[it.id]) * 100)} % ${SLOT[it.s].st}`); });
  $('best').onclick = bestEquip;
  L.querySelectorAll('[data-cr]').forEach(b => b.onclick = () => openCrate(CRATES.find(k => k.id === b.dataset.cr)));
}

// ================== Schleife ==================
let emaT = 0;
function loop(now) {
  const dt = Math.min(.05, (now - (tLast || now)) / 1000); tLast = now;
  if (G) { step(dt); draw(now); }
  if ((emaT += dt) >= 1) { S.ema = S.ema * .9 + (earnedSec / emaT) * .1; earnedSec = 0; emaT = 0; }
  if ((uiT += dt) > .2) { uiT = 0; ui(); }
  requestAnimationFrame(loop);
}
window.addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 200); });
setInterval(() => save(), 5000);
setInterval(() => save(true), 20000);
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(true); window.BB && BB.cloud && BB.cloud.flush(); } });
window.addEventListener('pagehide', () => save(true));

resize(); ship.x = W / 2; ship.y = 30; hotbar(true); render(); requestAnimationFrame(loop); svState();

if (logged()) pull().then(offline); else offline();
let lastId = myId();
if (window.BB && BB.onChange) BB.onChange(() => { const id = myId(); if (id !== lastId) { lastId = id; if (id) { pulled = false; pull(); } else { pulled = true; svState(); } } });
window.GB = { cast, openCrate: i => openCrate(CRATES[i]), goTab, get S() { return S; }, get G() { return G; }, planetDone, render, warp, get comet() { return comet; }, set cometT(v) { cometT = v; } };
</script>
