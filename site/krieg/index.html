<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bandenkrieg</title>
<meta name="theme-color" content="#0e0a07">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0a07;--panel:#1c140d;--line:#4a3820;--txt:#f4e4c1;--mut:#a8977a;--gold:#d4af37;--acc:#5ee08a;--xp:#9fd3ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font:14px/1.3 "Cinzel",Georgia,serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:linear-gradient(#2a1d12,#1a120b);border-bottom:2px solid var(--line);box-shadow:0 1px 0 rgba(212,175,55,.25)}
.top a,.top button{color:var(--txt);text-decoration:none;background:#2e2114;border:1px solid #6b5228;border-radius:8px;padding:6px 10px;font:inherit;font-weight:800;cursor:pointer}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{color:var(--mut);font-weight:600}
.gold{color:#f2cd5c}.xp{color:var(--xp)}
.age{margin-left:auto;color:var(--gold);font-weight:800;white-space:nowrap;letter-spacing:.04em}
#wrap{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#141a33 50%,#1d2416 50%)}
canvas{display:block}
.queue{display:flex;align-items:center;gap:6px;padding:5px 10px;min-height:28px;background:var(--panel);border-top:2px solid var(--line);font-size:12px;color:var(--mut)}
.chip{padding:2px 8px;border-radius:6px;background:#2e2114;border:1px solid #6b5228;color:var(--txt);font-weight:800;position:relative;overflow:hidden}
.chip i{position:absolute;left:0;bottom:0;height:2px;background:var(--gold)}
.bar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:linear-gradient(#1c140d,#120c07)}
.btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:52px;padding:4px;border-radius:8px;border:1px solid #6b5228;background:linear-gradient(#3a2a19,#241910);box-shadow:inset 0 1px 0 rgba(255,220,150,.15),0 2px 0 #0a0604;color:var(--txt);font:inherit;cursor:pointer;overflow:hidden}
.btn b{font-size:13px;line-height:1.1;text-align:center;font-weight:800}
.btn span{font-size:11px;color:var(--mut)}
.btn .c{color:#f2cd5c;font-weight:800}
.btn.unit{border-color:#7a6230}
.btn.sp{border-color:#a8862f;background:linear-gradient(#4a321a,#2a1b0e)}
.btn.up{border-color:#3f6b8a;background:linear-gradient(#22303d,#151d25)}
.btn:disabled{opacity:.42;cursor:default}
.btn:not(:disabled):active{transform:translateY(1px);box-shadow:none}
.btn .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(30,18,10,.6),rgba(5,3,2,.9));backdrop-filter:blur(2px);z-index:5;padding:16px}
.ov.hide{display:none}
.box{position:relative;background:linear-gradient(#2a1d12,#18100a);border:2px solid #a8862f;outline:1px solid #4a3820;outline-offset:4px;border-radius:12px;padding:22px 20px;max-width:460px;width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.4)}
.box h1{font-family:"Cinzel Decorative","Cinzel",serif;font-size:30px;font-weight:900;letter-spacing:.02em;background:linear-gradient(#fff3c4,#d4af37 55%,#8a6a1d);-webkit-background-clip:text;background-clip:text;color:transparent}
.box .orn{color:var(--gold);letter-spacing:.4em;font-size:12px;margin:4px 0}
.box p{color:#e2d2ad;margin:8px 0;font-family:Georgia,serif}
.box ul{text-align:left;color:#e2d2ad;font-size:13px;margin:10px 0 14px 18px;font-family:Georgia,serif}
.box li{margin:4px 0}.box li b{font-family:"Cinzel",serif;color:var(--gold)}
.diff{display:flex;gap:6px;justify-content:center;margin:10px 0}
.diff button{flex:1;padding:9px;border-radius:8px;border:1px solid #6b5228;background:#2e2114;color:var(--txt);font:inherit;font-weight:800;cursor:pointer}
.diff button.on{background:linear-gradient(#f0d37a,#b8902c);color:#2a1a08;border-color:#f0d37a}
.go{display:block;width:100%;margin-top:8px;padding:13px;border:1px solid #f0d37a;border-radius:8px;background:linear-gradient(#f0d37a,#b8902c);color:#2a1a08;font:inherit;font-weight:800;font-size:17px;letter-spacing:.08em;cursor:pointer;box-shadow:0 3px 0 #6b5228}
.go.alt{background:#2e2114;color:var(--txt);border-color:#6b5228}
.ghost{display:block;margin-top:12px;color:var(--mut);text-decoration:none;font-size:13px}
.turn{display:none}
@media (orientation:portrait) and (max-width:600px){
  .turn{display:block;position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:var(--mut);font-size:12px;padding:4px 10px;border-radius:99px;z-index:2;white-space:nowrap}
  .bar{grid-template-columns:repeat(3,1fr)}
  .stat small{display:none}
}
@media (max-height:420px){.btn{min-height:42px}.btn span{display:none}.top{padding-top:4px;padding-bottom:4px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a href="../" title="Zurück zur Spielauswahl">←</a>
    <div class="stat gold">💰 <span id="gold">0</span></div>
    <div class="stat xp">⭐ <span id="xp">0</span><small id="xpn"></small></div>
    <div class="age" id="age">Holzfeste</div>
    <button id="spd" title="Tempo">1×</button>
    <button id="pause" title="Pause">❚❚</button>
  </div>
  <div id="wrap">
    <div class="turn">Tipp: Handy quer halten</div>
    <canvas id="cv"></canvas>
    <div class="ov" id="ov">
      <div class="box" id="box"></div>
    </div>
  </div>
  <div class="queue" id="queue">Ausbildung: –</div>
  <div class="bar" id="bar"></div>
</div>
<script>
'use strict';
// ---------- Daten ----------
const W = 1200, H = 420, GROUND = 340, BASE_FRONT = 130;
const AGES = [
  { name: 'Holzfeste', eName: 'Spießer-Lager', addHp: 0, special: 70, xpNext: 1800, income: 4,
    units: [
      { n: 'Kobold', e: 'Hausmeister', k: 'Nah', cost: 15, hp: 55, dmg: 9, rng: 18, rate: .9, spd: 46, tr: 1.0, sz: 1 },
      { n: 'Nille', e: 'Nachbarin', k: 'Fern', cost: 25, hp: 40, dmg: 7, rng: 150, rate: 1.2, spd: 40, tr: 1.3, sz: .95 },
      { n: 'Mollymann', e: 'Rasenmäher-Rudi', k: 'Tank', cost: 100, hp: 280, dmg: 20, rng: 20, rate: 1.4, spd: 30, tr: 2.6, sz: 1.35 },
    ],
    tur: { n: 'Allan', w: 'Steinschleuder', e: 'Gartenzwerg-Kanone', cost: 200, dmg: 12, rate: 1.1, rng: 340 } },
  { name: 'Steinburg', eName: 'Spießer-Burg', addHp: 400, special: 180, xpNext: 9000, income: 9,
    units: [
      { n: 'Artur', e: 'Kontrolleur', k: 'Nah', cost: 45, hp: 160, dmg: 25, rng: 18, rate: .9, spd: 48, tr: 1.1, sz: 1.05 },
      { n: 'LG3', e: 'Blitzer-Bert', k: 'Fern', cost: 70, hp: 110, dmg: 19, rng: 170, rate: 1.1, spd: 42, tr: 1.4, sz: 1 },
      { n: 'Fokuhilamann', e: 'Bauzaun-Bodo', k: 'Tank', cost: 280, hp: 780, dmg: 54, rng: 20, rate: 1.4, spd: 32, tr: 2.8, sz: 1.45 },
    ],
    tur: { n: 'Allan', w: 'Armbrust', e: 'Sprinkler-Turm', cost: 550, dmg: 32, rate: 1.0, rng: 360 } },
  { name: 'Königsburg', eName: 'Spießer-Zitadelle', addHp: 700, special: 480, xpNext: null, income: 20,
    units: [
      { n: 'KräuterKönig', e: 'Ordnungsamt', k: 'Nah', cost: 130, hp: 440, dmg: 66, rng: 18, rate: .85, spd: 50, tr: 1.2, sz: 1.1 },
      { n: 'Grauer Geist', e: 'Drohnen-Dieter', k: 'Fern', cost: 200, hp: 300, dmg: 52, rng: 190, rate: 1.0, spd: 46, tr: 1.5, sz: 1 },
      { n: 'DonPatron', e: 'Bürokratie-Boss', k: 'Tank', cost: 750, hp: 2100, dmg: 145, rng: 22, rate: 1.4, spd: 34, tr: 3.0, sz: 1.6 },
    ],
    tur: { n: 'Allan', w: 'Ballista', e: 'Aktenstapel-Katapult', cost: 1500, dmg: 85, rate: .9, rng: 380 } },
];
const DIFF = { leicht: { mult: .7, label: 'Leicht' }, normal: { mult: 1, label: 'Normal' }, schwer: { mult: 1.35, label: 'Schwer' } };
const SP_CD = 45, START_GOLD = 175, BASE_HP = 500, MAX_Q = 5;
const COL = [
  { main: '#3fae5f', dark: '#1f5e33', light: '#9fe3b2' },
  { main: '#c8432f', dark: '#7a2218', light: '#f2a593' },
];

// ---------- Zustand ----------
let S = null, diff = 'normal', uid = 0;
try { diff = localStorage.getItem('bk_diff') || 'normal'; } catch (e) {}
if (!DIFF[diff]) diff = 'normal';

function mkSide(i) {
  return { i, gold: START_GOLD, xp: 0, age: 0, hp: BASE_HP, maxhp: BASE_HP, queue: [], tq: 0, tur: -1, turCd: 0, spCd: 20, aiT: 1, aiNext: null, kills: 0 };
}
function newGame() {
  S = { t: 0, speed: 1, paused: false, over: false, started: true, sides: [mkSide(0), mkSide(1)], units: [], shots: [], fx: [], flash: [] };
}
const mult = s => s.i === 1 ? DIFF[diff].mult : 1;
const baseX = side => side === 0 ? BASE_FRONT : W - BASE_FRONT;

// ---------- Aktionen ----------
function enqueue(s, idx) {
  const u = AGES[s.age].units[idx];
  if (s.gold < u.cost || s.queue.length >= MAX_Q) return false;
  s.gold -= u.cost;
  s.queue.push({ ...u, age: s.age });
  return true;
}
function spawn(s, u) {
  const sx = s.i === 0 ? BASE_FRONT - 20 : W - BASE_FRONT + 20;
  S.units.push({ id: uid++, side: s.i, x: sx, ...u, maxhp: u.hp, r: 9 * u.sz, cd: .3, anim: 0, walk: Math.random() * 6 });
}
function spawnFree(s) {
  const sx = s.i === 0 ? BASE_FRONT - 20 : W - BASE_FRONT + 20;
  return !S.units.some(u => u.side === s.i && Math.abs(u.x - sx) < 22);
}
function buyTurret(s) {
  const t = AGES[s.age].tur;
  if (s.tur >= s.age || s.gold < t.cost) return false;
  s.gold -= t.cost; s.tur = s.age; s.turCd = .5;
  if (s.i === 0) floatText(70, GROUND - 170, 'Allan ist oben!', COL[0].light);
  return true;
}
function ageUp(s) {
  const A = AGES[s.age];
  if (!A.xpNext || s.xp < A.xpNext) return false;
  s.age++;
  const add = AGES[s.age].addHp;
  s.maxhp += add; s.hp += add;
  S.flash.push({ t: .8, col: COL[s.i].main, a: .25 });
  floatText(s.i === 0 ? 80 : W - 80, GROUND - 190, (s.i === 0 ? 'Bande' : 'Spießer') + ': ' + AGES[s.age].name + '!', COL[s.i].light, 2.2);
  return true;
}
function special(s) {
  if (s.spCd > 0) return false;
  s.spCd = SP_CD;
  const dmg = AGES[s.age].special;
  S.flash.push({ t: .6, col: s.i === 0 ? '#9dffb9' : '#ffb39f', a: .35 });
  for (const u of S.units) if (u.side !== s.i && u.hp > 0) {
    hurt(u, dmg, s.i);
    S.fx.push({ x: u.x, y: GROUND - 20 * u.sz, t: .7, kind: 'rain', dir: s.i === 0 ? 1 : -1, col: COL[s.i].light });
  }
  floatText(W / 2, 70, s.i === 0 ? '👑 Der König ruft: Pfeilhagel!' : '📜 Erlass der Spießer: Pfeilhagel!', COL[s.i].light, 1.8);
  return true;
}
function hurt(v, dmg, bySide) {
  if (v.hp <= 0) return;
  v.hp -= dmg;
  if (v.hp <= 0) {
    const s = S.sides[bySide];
    const g = Math.round(v.cost * 1.25), x = Math.round(v.cost * 4);
    s.gold += g; s.xp += x; s.kills++;
    if (bySide === 0) floatText(v.x, GROUND - 60 * v.sz, '+' + g, '#f5c542');
    S.fx.push({ x: v.x, y: GROUND - 20, t: .5, kind: 'poof', col: COL[v.side].main });
  }
}
function hurtBase(side, dmg) {
  const s = S.sides[side];
  s.hp = Math.max(0, s.hp - dmg); s.shake = .25;
  if (s.hp <= 0 && !S.over) endGame(side === 1);
}
function floatText(x, y, txt, col, life = 1.1) { S.fx.push({ x, y, t: life, max: life, kind: 'txt', txt, col }); }

// ---------- KI ----------
function ai(s, dt) {
  s.aiT -= dt; if (s.aiT > 0) return; s.aiT = .5;
  const A = AGES[s.age];
  if (A.xpNext && s.xp >= A.xpNext) ageUp(s);
  if (s.tur < s.age && S.t > 35 && s.gold >= AGES[s.age].tur.cost + 40) buyTurret(s);
  const threat = S.units.filter(u => u.side === 0 && u.x > W * .5).length;
  if (s.spCd <= 0 && (threat >= 5 || (s.hp < s.maxhp * .45 && threat >= 2))) special(s);
  if (s.queue.length < 3) {
    if (s.aiNext == null) { const r = Math.random(); s.aiNext = r < .5 ? 0 : r < .82 ? 1 : 2; }
    if (enqueue(s, s.aiNext)) s.aiNext = null;
    else if (s.aiNext === 2 && Math.random() < .15) s.aiNext = null; // nicht ewig auf den Tank sparen
  }
}

// ---------- Update ----------
function update(dt) {
  S.t += dt;
  for (const s of S.sides) {
    s.gold += AGES[s.age].income * mult(s) * dt * .5;
    s.xp += 2 * mult(s) * dt;
    s.spCd = Math.max(0, s.spCd - dt); s.shake = Math.max(0, (s.shake || 0) - dt);
    if (s.queue.length) {
      s.tq += dt;
      if (s.tq >= s.queue[0].tr) {
        if (spawnFree(s)) { spawn(s, s.queue.shift()); s.tq = 0; } else s.tq = s.queue[0].tr;
      }
    }
    if (s.i === 1) ai(s, dt);
    // Turm
    if (s.tur >= 0) {
      const t = AGES[s.tur].tur;
      s.turCd -= dt;
      if (s.turCd <= 0) {
        const tp = turretPos(s.i), tx = tp.x;
        let best = null, bd = 1e9;
        for (const u of S.units) if (u.side !== s.i && u.hp > 0) { const d = Math.abs(u.x - tx); if (d < bd) { bd = d; best = u; } }
        if (best && bd <= t.rng) {
          s.turCd = t.rate;
          S.shots.push({ x1: tx, y1: tp.y - 18, x2: best.x, y2: GROUND - 22 * best.sz, t: 0, dur: .3, col: COL[s.i].main, kind: ['stone', 'bolt', 'bolt'][s.tur] });
          hurt(best, t.dmg, s.i);
        }
      }
    }
  }
  // Einheiten
  for (const u of S.units) {
    if (u.hp <= 0) continue;
    u.cd -= dt; u.anim = Math.max(0, u.anim - dt);
    const dir = u.side === 0 ? 1 : -1;
    let tgt = null, tgap = 1e9;
    for (const v of S.units) {
      if (v.side === u.side || v.hp <= 0) continue;
      const g = (v.x - u.x) * dir - u.r - v.r;
      if (g > -30 && g < tgap) { tgap = g; tgt = v; }
    }
    const bgap = (baseX(1 - u.side) - u.x) * dir - u.r;
    let attack = null;
    if (tgt && tgap <= u.rng && tgap <= bgap) attack = tgt;
    else if (bgap <= u.rng) attack = 'base';
    if (attack) {
      if (u.cd <= 0) {
        u.cd = u.rate; u.anim = .18;
        if (attack === 'base') {
          hurtBase(1 - u.side, u.dmg);
          if (u.k === 'Fern') S.shots.push({ x1: u.x, y1: GROUND - 26 * u.sz, x2: baseX(1 - u.side) + dir * 20, y2: GROUND - 50, t: 0, dur: .3, col: COL[u.side].main, kind: 'arrow' });
        } else {
          if (u.k === 'Fern') S.shots.push({ x1: u.x, y1: GROUND - 26 * u.sz, x2: attack.x, y2: GROUND - 22 * attack.sz, t: 0, dur: .3, col: COL[u.side].main, kind: 'arrow' });
          hurt(attack, u.dmg, u.side);
        }
      }
      continue;
    }
    // Blockiert durch eigene Leute vorne?
    let blocked = false;
    for (const f of S.units) {
      if (f === u || f.side !== u.side || f.hp <= 0) continue;
      const d = (f.x - u.x) * dir;
      if (d > 0 && d < u.r + f.r + 4) { blocked = true; break; }
    }
    if (tgt && tgap < 2) blocked = true;
    if (!blocked) { u.x += dir * u.spd * dt; u.walk += dt * 9; }
  }
  S.units = S.units.filter(u => u.hp > 0);
  for (const sh of S.shots) sh.t += dt;
  S.shots = S.shots.filter(sh => sh.t < sh.dur);
  for (const f of S.fx) f.t -= dt;
  S.fx = S.fx.filter(f => f.t > 0);
  for (const f of S.flash) f.t -= dt;
  S.flash = S.flash.filter(f => f.t > 0);
}

// ---------- Zeichnen ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), wrap = document.getElementById('wrap');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = wrap.getBoundingClientRect();
  scale = Math.min(r.width / W, r.height / H);
  cv.style.width = Math.floor(W * scale) + 'px';
  cv.style.height = Math.floor(H * scale) + 'px';
  cv.width = Math.floor(W * scale * dpr);
  cv.height = Math.floor(H * scale * dpr);
}
new ResizeObserver(resize).observe(wrap);

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
const FONT = '"Cinzel", Georgia, serif';

// Seeded Zufall, damit Steine und Bäume immer gleich aussehen
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------- Hintergrund (einmal vorgerendert) ----------
const BG_RES = 2;
function makeBg() {
  const c = document.createElement('canvas'); c.width = W * BG_RES; c.height = H * BG_RES;
  const g = c.getContext('2d'); g.scale(BG_RES, BG_RES);
  const R = rng(7);
  // Himmel: Sonnenuntergang
  const sky = g.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#141a33'); sky.addColorStop(.38, '#3b2c4f'); sky.addColorStop(.72, '#a5506a'); sky.addColorStop(1, '#f19a5a');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // Sterne
  for (let i = 0; i < 70; i++) { g.globalAlpha = .2 + R() * .6; g.fillStyle = '#fff'; g.fillRect(R() * W, R() * 110, 1.3, 1.3); }
  g.globalAlpha = 1;
  // Sonne
  const sun = g.createRadialGradient(600, 255, 5, 600, 255, 170);
  sun.addColorStop(0, 'rgba(255,226,160,.95)'); sun.addColorStop(.18, 'rgba(255,190,110,.6)'); sun.addColorStop(1, 'rgba(255,150,90,0)');
  g.fillStyle = sun; g.fillRect(0, 0, W, H);
  g.fillStyle = '#ffe2a8'; g.beginPath(); g.arc(600, 255, 26, 0, 7); g.fill();
  // Berge in drei Lagen
  const ridge = (base, amp, col, seed, step) => {
    const r = rng(seed); g.fillStyle = col; g.beginPath(); g.moveTo(0, GROUND);
    let y = base; for (let x = 0; x <= W + step; x += step) { y = base - r() * amp; g.lineTo(x, y); }
    g.lineTo(W, GROUND); g.closePath(); g.fill();
  };
  ridge(205, 70, '#5b3b5c', 3, 55);
  ridge(240, 55, '#40294a', 11, 42);
  // Ferne Burg auf dem Hügel in der Mitte
  g.fillStyle = '#2c1d36';
  g.beginPath(); g.moveTo(430, GROUND); g.quadraticCurveTo(600, 215, 770, GROUND); g.fill();
  const fx = 560, fy = 238;
  g.fillRect(fx, fy - 22, 80, 24); g.fillRect(fx + 8, fy - 52, 16, 32); g.fillRect(fx + 56, fy - 46, 16, 26); g.fillRect(fx + 30, fy - 70, 20, 50);
  for (const [tx, ty, tw] of [[fx + 8, fy - 52, 16], [fx + 56, fy - 46, 16], [fx + 30, fy - 70, 20]]) { g.beginPath(); g.moveTo(tx - 2, ty); g.lineTo(tx + tw / 2, ty - 16); g.lineTo(tx + tw + 2, ty); g.fill(); }
  g.fillStyle = 'rgba(255,200,120,.7)'; g.fillRect(fx + 37, fy - 55, 3, 5); g.fillRect(fx + 14, fy - 40, 3, 4);
  ridge(282, 30, '#2a1f30', 23, 30);
  // Nebel

  g.fillStyle = fog; g.fillRect(0, 250, W, GROUND - 250);

  for (let x = 0; x < W; x += 9) pine(x + R() * 6, GROUND - 14 + R() * 6, 24 + R() * 26, '#1a1820');

  g.fillStyle = gr; g.fillRect(0, GROUND, W, H - GROUND);
  g.fillStyle = '#566b37'; g.fillRect(0, GROUND - 2, W, 5);
  for (let x = 0; x < W; x += 3) { g.fillStyle = R() < .5 ? '#6a8240' : '#4a5c2e'; g.fillRect(x, GROUND - 2 - R() * 5, 1.5, 6); }
  // Weg
  g.fillStyle = '#5a4630'; g.fillRect(0, GROUND + 8, W, 22);
  g.fillStyle = '#6e573b'; g.fillRect(0, GROUND + 8, W, 3);
  for (let i = 0; i < 140; i++) { g.fillStyle = R() < .5 ? '#7a6447' : '#463622'; g.beginPath(); g.ellipse(R() * W, GROUND + 12 + R() * 16, 2 + R() * 3, 1 + R() * 1.5, 0, 0, 7); g.fill(); }
  for (let i = 0; i < 60; i++) { g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(R() * W, GROUND + 36 + R() * 40, 8 + R() * 18, 2); }

}

// ---------- Burgen (pro Seite und Zeitalter vorgerendert) ----------
const CASTLE = [
  { name: 'Holzfeste', tower: 160 },
  { name: 'Steinburg', tower: 195 },
  { name: 'Königsburg', tower: 238 },

const turretPos = side => { const a = S.sides[side].age; return { x: side === 0 ? 58 : W - 58, y: GROUND - CASTLE[a].tower - 4 }; };

function stones(g, x, y, w, h, base, seed, bw = 16, bh = 9) {
  const r = rng(seed);
  g.fillStyle = base; g.fillRect(x, y, w, h);
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  for (let row = 0, yy = y; yy < y + h; row++, yy += bh) {
    for (let xx = x - (row % 2 ? bw / 2 : 0); xx < x + w; xx += bw) {
      const l = (r() - .5) * 22;
      g.fillStyle = `rgba(${l > 0 ? '255,255,255' : '0,0,0'},${Math.abs(l) / 100})`; g.fillRect(xx + 1, yy + 1, bw - 2, bh - 2);
      g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1; g.strokeRect(xx + .5, yy + .5, bw - 1, bh - 1);
    }
  }
  // Seitenschatten
  const sh = g.createLinearGradient(x, 0, x + w, 0); sh.addColorStop(0, 'rgba(0,0,0,.25)'); sh.addColorStop(.3, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(255,200,140,.12)');
  g.fillStyle = sh; g.fillRect(x, y, w, h);
  g.restore();
}
function merlons(g, x, y, w, col, mw = 9) {
  g.fillStyle = col;
  for (let xx = x; xx < x + w - 2; xx += mw * 2) g.fillRect(xx, y - 8, mw, 9);
  g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(x, y, w, 3);
}
function logs(g, x, y, w, h, seed) {
  const r = rng(seed);
  for (let xx = x; xx < x + w; xx += 9) {
    const top = y - r() * 6;
    g.fillStyle = r() < .5 ? '#6b4a2c' : '#5c3f25'; g.fillRect(xx, top, 8, y + h - top);
    g.beginPath(); g.moveTo(xx, top); g.lineTo(xx + 4, top - 8); g.lineTo(xx + 8, top); g.fill();
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(xx + 6, top, 2, y + h - top);
  }
  g.fillStyle = '#3d2a18'; g.fillRect(x, y + 14, w, 5); g.fillRect(x, y + h - 26, w, 5);
}
function gate(g, x, w, h, wood) {
  g.fillStyle = '#120c08'; g.beginPath(); g.moveTo(x, GROUND); g.lineTo(x, GROUND - h + w / 2); g.arc(x + w / 2, GROUND - h + w / 2, w / 2, Math.PI, 0); g.lineTo(x + w, GROUND); g.fill();
  if (wood) { g.fillStyle = '#4e331c'; g.fillRect(x + 3, GROUND - h + w / 2, w - 6, h - w / 2); g.fillStyle = 'rgba(0,0,0,.35)'; for (let i = 1; i < 4; i++) g.fillRect(x + 3 + i * (w - 6) / 4, GROUND - h + w / 2, 1.5, h - w / 2); }
  else { g.strokeStyle = '#3a3a3a'; g.lineWidth = 2; for (let i = 1; i < 5; i++) { g.beginPath(); g.moveTo(x + i * w / 5, GROUND - h + 4); g.lineTo(x + i * w / 5, GROUND - 6); g.stroke(); } for (let j = 0; j < 4; j++) { g.beginPath(); g.moveTo(x + 2, GROUND - 10 - j * 12); g.lineTo(x + w - 2, GROUND - 10 - j * 12); g.stroke(); } }
}
function windowSlit(g, x, y) { g.fillStyle = '#120c08'; g.fillRect(x, y, 4, 11); g.fillStyle = 'rgba(255,190,100,.55)'; g.fillRect(x + 1, y + 3, 2, 6); }
function cone(g, x, w, y, h, col) {
  g.fillStyle = col; g.beginPath(); g.moveTo(x - 4, y); g.lineTo(x + w / 2, y - h); g.lineTo(x + w + 4, y); g.fill();
  g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.moveTo(x + w / 2, y - h); g.lineTo(x + w + 4, y); g.lineTo(x + w / 2, y); g.fill();

function makeCastle(side, age) {

    for (let y = GROUND - T + 20; y < GROUND - 20; y += 28) { g.beginPath(); g.moveTo(39, y); g.lineTo(73, y + 24); g.moveTo(73, y); g.lineTo(39, y + 24); g.stroke(); }
    g.fillStyle = '#6b4a2c'; g.fillRect(28, GROUND - T, 56, 8);

    gate(g, 94, 30, 64, false);
    g.fillStyle = tc.dark; g.fillRect(44, GROUND - 100, 22, 34); g.beginPath(); g.moveTo(44, GROUND - 66); g.lineTo(55, GROUND - 58); g.lineTo(66, GROUND - 66); g.fill();
  } else {
    stones(g, 0, GROUND - 128, 140, 128, '#8e8a83', 51 + side);
    merlons(g, 0, GROUND - 128, 140, '#99958d');
    // Seitenturm mit Spitzdach
    stones(g, 100, GROUND - 175, 36, 175 - 128, '#97938b', 61 + side, 12, 8);
    cone(g, 100, 36, GROUND - 175, 46, tc.dark);
    // Hauptturm
    stones(g, 18, GROUND - T, 72, T - 128, '#a19c93', 71 + side);
    merlons(g, 16, GROUND - T, 76, '#aaa59c');
    g.fillStyle = '#d4af37'; g.fillRect(18, GROUND - T + 14, 72, 3);
    windowSlit(g, 52, GROUND - T + 26); windowSlit(g, 36, GROUND - T + 60); windowSlit(g, 68, GROUND - T + 60); windowSlit(g, 115, GROUND - 160);

      g.fillStyle = '#d4af37'; g.fillRect(bx, GROUND - 118, 18, 3); g.font = 'bold 13px Georgia'; g.textAlign = 'center'; g.fillText(side === 0 ? '♛' : '⚖', bx + 9, GROUND - 88);
    }

}

let BG = null; const CASTLES = [[], []];
function buildArt() { BG = makeBg(); for (const s of [0, 1]) for (let a = 0; a < 3; a++) CASTLES[s][a] = makeCastle(s, a); }

function drawFlag(x, y, side, t, big) {
  const c = COL[side], dir = side === 0 ? 1 : -1, L = big ? 30 : 22;
  ctx.strokeStyle = '#2a2018'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 34); ctx.stroke();
  ctx.fillStyle = c.main; ctx.beginPath(); ctx.moveTo(x, y - 34);
  for (let i = 0; i <= 6; i++) { const px = x + dir * L * i / 6; ctx.lineTo(px, y - 34 + Math.sin(t * 5 + i * .9) * 2.5 * i / 6); }

}
function drawTorch(x, y, t) {

  ctx.fillStyle = '#fff1b0'; ctx.beginPath(); ctx.ellipse(x, y - 1, 1.4, 3, 0, 0, 7); ctx.fill();
}

function drawBase(side) {
  const s = S.sides[side], a = s.age, T = CASTLE[a].tower;

  if (side === 1) { ctx.translate(W, 0); ctx.scale(-1, 1); }

function drawUnit(u) {
  const c = COL[u.side], dir = u.side === 0 ? 1 : -1, sz = u.sz;
  const moving = u.anim <= 0;
  const bob = moving ? Math.abs(Math.sin(u.walk)) * 1.6 : 0;
  const atk = u.anim > 0 ? u.anim / .18 : 0;
  const lunge = u.k !== 'Fern' ? 5 * atk : 0;
  const leg = moving ? Math.sin(u.walk) * 5 : 0;
  ctx.save(); ctx.translate(u.x, GROUND); ctx.scale(dir * sz, sz);
  // Schatten
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, 1, 10, 2.5, 0, 0, 7); ctx.fill();
  ctx.translate(lunge, -bob);
  ctx.lineCap = 'round';
  // Beine
  ctx.strokeStyle = u.k === 'Tank' ? '#6d6d6d' : '#3b2b1d'; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(-3, -11); ctx.lineTo(-3 + leg, bob); ctx.moveTo(3, -11); ctx.lineTo(3 - leg, bob); ctx.stroke();
  if (u.k === 'Fern') {
    // Umhang
    ctx.fillStyle = c.dark; ctx.beginPath(); ctx.moveTo(-5, -33); ctx.lineTo(-11, -9); ctx.lineTo(2, -11); ctx.fill();
  }
  // Rüstung / Wappenrock

  rr(-7, -32, 14, 21, 3); ctx.fill();
  ctx.fillStyle = c.main; ctx.fillRect(-4, -31, 8, 19);
  ctx.fillStyle = '#d4af37'; ctx.fillRect(-7, -15, 14, 2);
  // Kopf
  ctx.fillStyle = '#e8c39e'; ctx.beginPath(); ctx.arc(0, -38, 6, 0, 7); ctx.fill();
  if (u.k === 'Nah') {
    ctx.fillStyle = '#a9adb3'; ctx.beginPath(); ctx.arc(0, -39.5, 6.6, Math.PI, 0); ctx.fill();
    ctx.fillRect(2.5, -40, 1.6, 6);
    ctx.fillStyle = c.main; ctx.fillRect(-1, -48, 2, 3);
  } else if (u.k === 'Fern') {
    ctx.fillStyle = c.dark; ctx.beginPath(); ctx.moveTo(-7, -34); ctx.quadraticCurveTo(-6, -47, 2, -47); ctx.quadraticCurveTo(7, -45, 6, -40); ctx.lineTo(2, -41); ctx.quadraticCurveTo(-2, -38, -4, -33); ctx.fill();
  } else {
    ctx.fillStyle = '#9ca0a7'; rr(-7, -46, 14, 13, 3); ctx.fill();
    ctx.fillStyle = '#1b1b1b'; ctx.fillRect(1, -41, 6, 1.6);
    ctx.fillStyle = c.main; ctx.beginPath(); ctx.moveTo(-2, -46); ctx.quadraticCurveTo(-8, -54, -12, -50); ctx.quadraticCurveTo(-6, -50, -2, -44); ctx.fill();
  }
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(3, -38, 1, 0, 7); ctx.fill();
  // Waffen
  if (u.k === 'Nah') {
    // Rundschild hinten
    ctx.fillStyle = c.dark; ctx.beginPath(); ctx.arc(-7, -22, 5.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 1; ctx.stroke();
    // Schwert
    const ang = -1.1 + atk * 1.6;
    ctx.save(); ctx.translate(6, -24); ctx.rotate(ang);
    ctx.fillStyle = '#5a3c22'; ctx.fillRect(-1, -1, 2, 5);
    ctx.fillStyle = '#d4af37'; ctx.fillRect(-3.5, -2, 7, 2);
    ctx.fillStyle = '#e4e7ec'; ctx.beginPath(); ctx.moveTo(-1.2, -2); ctx.lineTo(-1.2, -16); ctx.lineTo(0, -18); ctx.lineTo(1.2, -16); ctx.lineTo(1.2, -2); ctx.fill();
    ctx.restore();
  } else if (u.k === 'Fern') {
    ctx.strokeStyle = '#7a5530'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(5, -24, 11, -1.25, 1.25); ctx.stroke();
    const pull = atk > 0 ? 0 : 4;
    ctx.strokeStyle = 'rgba(240,240,240,.8)'; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.moveTo(5 + 11 * Math.cos(-1.25), -24 + 11 * Math.sin(-1.25)); ctx.lineTo(5 - pull, -24); ctx.lineTo(5 + 11 * Math.cos(1.25), -24 + 11 * Math.sin(1.25)); ctx.stroke();
    if (atk === 0) { ctx.strokeStyle = '#c9a16a'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(1, -24); ctx.lineTo(17, -24); ctx.stroke(); }
  } else {
    // Streithammer hinten
    const ang = -.5 - atk * -1.4;
    ctx.save(); ctx.translate(-2, -26); ctx.rotate(ang - .6);
    ctx.fillStyle = '#5a3c22'; ctx.fillRect(-1.2, -20, 2.4, 22);
    ctx.fillStyle = '#7a7e85'; ctx.fillRect(-5, -24, 10, 6);
    ctx.restore();

    ctx.fillStyle = c.main; ctx.beginPath(); ctx.moveTo(5, -34); ctx.lineTo(15, -34); ctx.lineTo(15, -20); ctx.quadraticCurveTo(15, -10, 10, -6); ctx.quadraticCurveTo(5, -10, 5, -20); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 1.2; ctx.stroke();

  ctx.fillStyle = 'rgba(244,228,193,.9)'; ctx.font = `700 ${Math.round(8 + sz * 1.5)}px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillText(u.side === 0 ? u.n : u.e, u.x, top - 6);

    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(u.x - w / 2, top - 3, w, 3);
    ctx.fillStyle = c.main; ctx.fillRect(u.x - w / 2, top - 3, w * Math.max(0, u.hp / u.maxhp), 3);
  }
}

function drawShot(sh) {
  const p = sh.t / sh.dur, arc = sh.kind === 'stone' ? 30 : 16;
  const pos = q => [sh.x1 + (sh.x2 - sh.x1) * q, sh.y1 + (sh.y2 - sh.y1) * q - Math.sin(q * Math.PI) * arc];
  const [x, y] = pos(p), [x2, y2] = pos(Math.min(1, p + .04));
  if (sh.kind === 'stone') { ctx.fillStyle = '#8d8a85'; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill(); return; }
  const a = Math.atan2(y2 - y, x2 - x), L = sh.kind === 'bolt' ? 18 : 13;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.strokeStyle = '#c9a16a'; ctx.lineWidth = sh.kind === 'bolt' ? 2.6 : 1.5;
  ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(0, 0); ctx.stroke();
  ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.moveTo(0, -2.2); ctx.lineTo(4, 0); ctx.lineTo(0, 2.2); ctx.fill();
  ctx.fillStyle = sh.col; ctx.fillRect(-L, -2, 3, 4);
  ctx.restore();
}

function drawHud() {
  for (const side of [0, 1]) {
    const s = S.sides[side], w = 270, x = side === 0 ? 14 : W - 14 - w, y = 12;
    ctx.fillStyle = 'rgba(15,10,6,.75)'; rr(x - 3, y - 3, w + 6, 22, 6); ctx.fill();
    ctx.strokeStyle = '#a8862f'; ctx.lineWidth = 1.5; ctx.stroke();
    const grd = ctx.createLinearGradient(0, y, 0, y + 16);
    grd.addColorStop(0, COL[side].light); grd.addColorStop(1, COL[side].dark);
    ctx.fillStyle = grd; rr(x, y, Math.max(0, w * s.hp / s.maxhp), 16, 4); ctx.fill();
    ctx.fillStyle = '#fff6e0'; ctx.font = `700 11px ${FONT}`; ctx.textAlign = side === 0 ? 'left' : 'right';
    ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 3;
    ctx.fillText((side === 0 ? 'Bande  ' : '') + Math.ceil(s.hp) + ' / ' + s.maxhp + (side === 1 ? '  Spießer' : ''), side === 0 ? x + 8 : x + w - 8, y + 12);
    ctx.fillStyle = 'rgba(244,228,193,.75)'; ctx.font = `600 11px ${FONT}`;
    ctx.fillText(side === 0 ? AGES[s.age].name : AGES[s.age].eName, side === 0 ? x : x + w, y + 34);

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  if (!BG) buildArt();
  ctx.drawImage(BG, 0, 0, W, H);
  // Wolken
  const t = S ? S.t : performance.now() / 1000;
  ctx.fillStyle = 'rgba(255,190,170,.13)';
  for (let i = 0; i < 6; i++) {
    const x = ((i * 260 + t * (6 + i)) % (W + 300)) - 150, y = 50 + (i * 37) % 110;
    ctx.beginPath(); ctx.ellipse(x, y, 70, 10, 0, 0, 7); ctx.ellipse(x + 30, y - 6, 40, 9, 0, 0, 7); ctx.fill();
  }
  if (!S) return;
  drawBase(0); drawBase(1);
  const list = [...S.units].sort((a, b) => a.sz - b.sz);
  for (const u of list) drawUnit(u);
  for (const sh of S.shots) drawShot(sh);
  for (const f of S.fx) {
    if (f.kind === 'txt') {
      const p = 1 - f.t / f.max;
      ctx.globalAlpha = Math.min(1, f.t * 2); ctx.fillStyle = f.col; ctx.font = `800 16px ${FONT}`; ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 4;
      ctx.fillText(f.txt, f.x, f.y - p * 30); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    } else if (f.kind === 'rain') {
      const p = 1 - f.t / .7;
      for (let i = 0; i < 4; i++) {
        const q = Math.min(1, p * 1.6 - i * .15); if (q <= 0) continue;
        const ax = f.x + (i - 1.5) * 9 - (1 - q) * 60 * f.dir, ay = f.y - (1 - q) * 260;
        ctx.save(); ctx.translate(ax, ay); ctx.rotate(Math.PI / 2 - .25 * f.dir);
        ctx.strokeStyle = f.col; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(0, 0); ctx.stroke();
        ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.moveTo(0, -2.5); ctx.lineTo(5, 0); ctx.lineTo(0, 2.5); ctx.fill();
        ctx.restore();
      }
    } else {
      const p = 1 - f.t / (f.kind === 'boom' ? .6 : .5);
      ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, 6 + p * (f.kind === 'boom' ? 30 : 16), 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
  for (const f of S.flash) { ctx.globalAlpha = f.a * f.t; ctx.fillStyle = f.col; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  // Vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .7);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  drawHud();
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
const bar = $('bar');
const btns = {};
function makeBtn(key, cls, onClick) {
  const b = document.createElement('button');
  b.className = 'btn ' + cls; b.innerHTML = '<b></b><span></span><div class="cd"></div>';
  b.addEventListener('click', () => { if (S && !S.over && !S.paused) { onClick(); refreshUi(true); } });
  bar.appendChild(b); btns[key] = b; return b;
}
[0, 1, 2].forEach(i => makeBtn('u' + i, 'unit', () => enqueue(S.sides[0], i)));
makeBtn('tur', 'tur', () => buyTurret(S.sides[0]));
makeBtn('sp', 'sp', () => special(S.sides[0]));
makeBtn('up', 'up', () => ageUp(S.sides[0]));

function setBtn(b, title, sub, dis, cdFrac) {
  const t = b.children[0], s = b.children[1];
  if (t.innerHTML !== title) t.innerHTML = title;
  if (s.innerHTML !== sub) s.innerHTML = sub;
  b.disabled = dis;
  b.children[2].style.width = cdFrac ? (cdFrac * 100) + '%' : '0';
}
let uiT = 0;
function refreshUi(force) {
  if (!S) return;
  if (!force && (uiT -= 1) > 0) return; uiT = 6;
  const p = S.sides[0], A = AGES[p.age];
  $('gold').textContent = Math.floor(p.gold);
  $('xp').textContent = Math.floor(p.xp);
  $('xpn').textContent = A.xpNext ? ' / ' + A.xpNext : ' max';
  $('age').textContent = A.name;
  A.units.forEach((u, i) => setBtn(btns['u' + i], u.n, `${u.k} · <span class="c">${u.cost}💰</span>`, p.gold < u.cost || p.queue.length >= MAX_Q));
  const T = A.tur;
  if (p.tur >= p.age) setBtn(btns.tur, 'Allan', T.w + ' ✓', true);
  else setBtn(btns.tur, p.tur < 0 ? 'Allan holen' : 'Allan upgraden', `${T.w} · <span class="c">${T.cost}💰</span>`, p.gold < T.cost);
  setBtn(btns.sp, '👑 König ruft', p.spCd > 0 ? Math.ceil(p.spCd) + ' s' : 'Bereit!', p.spCd > 0, p.spCd > 0 ? 1 - p.spCd / SP_CD : 0);
  if (A.xpNext) setBtn(btns.up, '⬆ ' + AGES[p.age + 1].name, `${A.xpNext} ⭐`, p.xp < A.xpNext, Math.min(1, p.xp / A.xpNext));
  else setBtn(btns.up, 'Top-Zeitalter', 'erreicht', true);
  const q = $('queue');
  if (!p.queue.length) q.innerHTML = 'Ausbildung: –';
  else q.innerHTML = 'Ausbildung: ' + p.queue.map((u, i) => `<span class="chip">${u.n}${i === 0 ? `<i style="width:${Math.min(100, p.tq / u.tr * 100)}%"></i>` : ''}</span>`).join('');
}

$('spd').onclick = () => { if (!S) return; S.speed = S.speed === 1 ? 2 : 1; $('spd').textContent = S.speed + '×'; };
$('pause').onclick = () => { if (!S || S.over) return; S.paused = !S.paused; $('pause').textContent = S.paused ? '▶' : '❚❚'; if (S.paused) showMenu('pause'); else hideMenu(); };
document.addEventListener('keydown', e => {
  if (!S || S.over) return;
  const k = e.key.toLowerCase();
  if (k === 'p' || k === 'escape') return $('pause').click();
  if (S.paused) return;
  if (k === '1' || k === '2' || k === '3') enqueue(S.sides[0], +k - 1);
  else if (k === 't') buyTurret(S.sides[0]);
  else if (k === 's') special(S.sides[0]);
  else if (k === 'a') ageUp(S.sides[0]);
  else return;
  refreshUi(true);
});

// ---------- Menüs ----------
const ov = $('ov'), box = $('box');
function diffButtons() {
  return '<div class="diff">' + Object.entries(DIFF).map(([k, d]) => `<button data-d="${k}" class="${k === diff ? 'on' : ''}">${d.label}</button>`).join('') + '</div>';
}
function bindDiff() {
  box.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    diff = b.dataset.d; try { localStorage.setItem('bk_diff', diff); } catch (e) {}
    box.querySelectorAll('[data-d]').forEach(x => x.classList.toggle('on', x === b));
  });
}
function showMenu(kind, win) {
  ov.classList.remove('hide');
  if (kind === 'start') {
    box.innerHTML = `<h1>Bandenkrieg</h1>
      <div class="orn">✦ ⚔ ✦</div><p>Die Bubatzbande gegen die Spießer. Stürm ihre Feste, bevor sie deine Burg schleifen.</p>
      <ul>
        <li><b>Truppen schicken:</b> Schwertkämpfer, Bogenschützen und Schildträger kosten Gold und ziehen von allein los.</li>
        <li><b>Gold & Sterne</b> gibt's für jeden besiegten Gegner.</li>
        <li><b>Aufsteigen:</b> Mit genug Sternen wird aus deiner Holzfeste eine Steinburg und dann die Königsburg, mit stärkeren Leuten.</li>
        <li><b>Allan</b> bezieht den Turm und schießt mit Schleuder, Armbrust oder Ballista.</li>
        <li><b>König ruft:</b> Pfeilhagel auf alle Gegner, dann 45 s Pause.</li>
      </ul>
      ${diffButtons()}
      <button class="go" id="go">▶ PLAY</button>
      <a class="ghost" href="../">← Zur Spielauswahl</a>`;
    bindDiff();
    $('go').onclick = () => { newGame(); hideMenu(); refreshUi(true); };
  } else if (kind === 'pause') {
    box.innerHTML = `<h1>Pause</h1><div class="orn">✦ ⚔ ✦</div>
      <button class="go" id="go">▶ Weiter</button>
      <button class="go alt" id="re">Neu starten</button>
      <a class="ghost" href="../">← Zur Spielauswahl</a>`;
    $('go').onclick = () => $('pause').click();
    $('re').onclick = () => showMenu('start');
  } else if (kind === 'end') {
    const p = S.sides[0], mins = Math.floor(S.t / 60), secs = String(Math.floor(S.t % 60)).padStart(2, '0');
    box.innerHTML = `<h1>${win ? 'Sieg!' : 'Niederlage'}</h1>
      <p>${win ? 'Die Spießerfeste ist gefallen. Die Bande feiert bis zum Morgengrauen. 🌿' : 'Die Spießer haben deine Burg gestürmt. 💀'}</p>
      <p style="color:var(--mut)">Zeit ${mins}:${secs} · ${p.kills} Gegner besiegt · ${AGES[p.age].name} · ${DIFF[diff].label}</p>
      ${diffButtons()}
      <button class="go" id="go">Nochmal</button>
      <a class="ghost" href="../">← Zur Spielauswahl</a>`;
    bindDiff();
    $('go').onclick = () => { newGame(); hideMenu(); refreshUi(true); };
  }
}
function hideMenu() { ov.classList.add('hide'); }
function endGame(win) { S.over = true; const g = S; setTimeout(() => { if (S === g) showMenu('end', win); }, 900); }

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S && !S.paused && !S.over) {
    const steps = S.speed;
    for (let i = 0; i < steps; i++) update(dt);
  } else if (S && S.over) {
    for (const f of S.fx) f.t -= dt;
  }
  draw();
  refreshUi();
  requestAnimationFrame(loop);
}
resize();
showMenu('start');
requestAnimationFrame(loop);
// Zum Testen per Konsole
window.BK = { get S() { return S; }, newGame, update, enqueue, special, ageUp, buyTurret, AGES };
</script>
