<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bandenkrieg</title>
<meta name="theme-color" content="#0b1108">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0a07;--panel:#1c140d;--line:#4a3820;--txt:#f4e4c1;--mut:#a8977a;--gold:#d4af37;--acc:#5ee08a;--xp:#9fd3ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font:14px/1.3 "Cinzel",Georgia,serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:linear-gradient(#2a1d12,#1a120b);border-bottom:2px solid var(--line);box-shadow:0 1px 0 rgba(212,175,55,.25)}
.top a,.top button{color:var(--txt);text-decoration:none;background:#2e2114;border:1px solid #6b5228;border-radius:8px;padding:6px 10px;font:inherit;font-weight:800;cursor:pointer}
.stat{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid #4a3820;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{color:var(--mut);font-weight:600}
.gold{color:#f2cd5c}.xp{color:var(--xp)}
.age{margin-left:auto;color:var(--gold);font-weight:800;white-space:nowrap;letter-spacing:.04em}
#wrap{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#141a33 50%,#1d2416 50%)}
canvas{display:block}
.queue{display:flex;align-items:center;gap:6px;padding:5px 10px;min-height:28px;background:var(--panel);border-top:2px solid var(--line);font-size:12px;color:var(--mut)}
.chip{padding:2px 8px;border-radius:6px;background:#2e2114;border:1px solid #6b5228;color:var(--txt);font-weight:800;position:relative;overflow:hidden}
.chip i{position:absolute;left:0;bottom:0;height:2px;background:var(--gold)}
.bar{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:6px;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:linear-gradient(#1c140d,#120c07)}
.btn{position:relative;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:7px;min-height:56px;padding:5px 7px;text-align:left;border-radius:8px;border:1px solid #6b5228;background:linear-gradient(#3a2a19,#241910);box-shadow:inset 0 1px 0 rgba(255,220,150,.15),0 2px 0 #0a0604;color:var(--txt);font:inherit;cursor:pointer;overflow:hidden}
.btn b{display:block;font-size:13px;line-height:1.1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.btn .pic{flex:none;width:42px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#5a3f6a,#24182c 75%);border:1px solid #8a6d32;box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
.btn .pic canvas{width:42px;height:42px;display:block}
.btn .pic img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.btn.unit .pic{background:radial-gradient(circle at 50% 30%,#f0a868,#8a3f4a 60%,#2a1626)}
.btn.up .pic{background:radial-gradient(circle at 50% 35%,#3f6b8a,#151d25 75%)}
.btn span{font-size:11px;color:var(--mut);white-space:nowrap}
.btn .c{color:#f2cd5c;font-weight:800}
.btn.unit{border-color:#7a6230}
.btn.sp{border-color:#a8862f;background:linear-gradient(#4a321a,#2a1b0e)}
.btn.shop{border-color:#a8862f}
.btn.cat{border-color:#8a6d32}
.tbtns{margin-left:auto;display:flex;gap:6px;min-width:0}
.top .btn.tb{min-height:38px;padding:3px 10px 3px 3px;gap:7px;flex-direction:row;text-align:left;background:linear-gradient(#3a2a19,#241910);border:1px solid #6b5228;border-radius:8px}
.top .btn.tb.up{background:linear-gradient(#22303d,#151d25);border-color:#3f6b8a}
.top .btn.tb.glow{box-shadow:0 0 0 1px #f0d37a,0 0 14px rgba(240,200,90,.45)}
.btn.tb .pic{width:30px;height:30px;border-radius:6px}
.btn.tb b{font-size:12px}.btn.tb span{font-size:10px}
.how{text-align:left;margin-top:12px;color:#e2d2ad}.how summary{cursor:pointer;color:var(--gold);font-family:"Cinzel",serif;font-weight:800;text-align:center;list-style:none}.how summary::-webkit-details-marker{display:none}.how summary::after{content:' ▾'}
.crewstrip{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:12px 0 6px}
.crewstrip img{width:38px;height:38px;border-radius:50%;border:1.5px solid #a8862f;object-fit:cover;object-position:50% 15%;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.btn.shop.glow{box-shadow:0 0 0 1px #f0d37a,0 0 14px rgba(240,200,90,.45)}
.panel{position:absolute;right:8px;top:8px;bottom:8px;width:min(360px,calc(100% - 16px));overflow:auto;z-index:4;background:linear-gradient(#2a1d12f2,#18100af2);border:2px solid #a8862f;border-radius:10px;padding:8px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.panel.hide{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 8px;color:var(--gold);font-size:15px}
.ph.sub{margin-top:8px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.ph .x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer}
.up-row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;background:rgba(0,0,0,.25);margin-bottom:5px}
.up-row img.ico{width:42px;height:42px;flex:none;border-radius:7px;border:1px solid #8a6d32;object-fit:cover}
.up-row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.up-row .txt b{font-size:12px}.up-row .txt span{font-size:11px;color:var(--mut);font-family:Georgia,serif}
.pips{display:flex;gap:3px;margin-top:3px}.pips i{width:12px;height:4px;border-radius:2px;background:#3a2c1a}.pips i.on{background:var(--gold)}
.up-row button{min-width:70px;padding:7px 6px;border-radius:6px;border:1px solid #f0d37a;background:linear-gradient(#f0d37a,#b8902c);color:#2a1a08;font:inherit;font-weight:800;font-size:12px;cursor:pointer}
.up-row button:disabled{opacity:.4;cursor:default}
.crew{display:flex;gap:8px;align-items:center;padding:5px 6px;font-size:12px}.crew img{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid #a8862f;object-fit:cover;object-position:50% 15%}.crew em{color:var(--gold);font-style:normal;font-size:10px;letter-spacing:.05em}.crew span{display:block;color:var(--mut);font-family:Georgia,serif;font-size:11px}
.btn.up{border-color:#3f6b8a;background:linear-gradient(#22303d,#151d25)}
.btn:disabled{opacity:.42;cursor:default}
.btn:not(:disabled):active{transform:translateY(1px);box-shadow:none}
.btn .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(30,18,10,.6),rgba(5,3,2,.9));backdrop-filter:blur(2px);z-index:5;padding:16px}
.ov.hide{display:none}
.box{position:relative;background:linear-gradient(#2a1d12,#18100a);border:2px solid #a8862f;outline:1px solid #4a3820;outline-offset:4px;border-radius:12px;padding:22px 20px;max-width:460px;width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.4)}
.box h1{font-family:"Cinzel Decorative","Cinzel",serif;font-size:30px;font-weight:900;letter-spacing:.02em;background:linear-gradient(#fff3c4,#d4af37 55%,#8a6a1d);-webkit-background-clip:text;background-clip:text;color:transparent}
.box .orn{color:var(--gold);letter-spacing:.4em;font-size:12px;margin:4px 0}
.box p{color:#e2d2ad;margin:8px 0;font-family:Georgia,serif}
.box ul{text-align:left;color:#e2d2ad;font-size:13px;margin:10px 0 14px 18px;font-family:Georgia,serif}
.box li{margin:4px 0}.box li b{font-family:"Cinzel",serif;color:var(--gold)}
.diff{display:flex;gap:6px;justify-content:center;margin:10px 0}
.diff button{flex:1;padding:9px;border-radius:8px;border:1px solid #6b5228;background:#2e2114;color:var(--txt);font:inherit;font-weight:800;cursor:pointer}
.diff button.on{background:linear-gradient(#f0d37a,#b8902c);color:#2a1a08;border-color:#f0d37a}
.go{display:block;width:100%;margin-top:8px;padding:13px;border:1px solid #f0d37a;border-radius:8px;background:linear-gradient(#f0d37a,#b8902c);color:#2a1a08;font:inherit;font-weight:800;font-size:17px;letter-spacing:.08em;cursor:pointer;box-shadow:0 3px 0 #6b5228}
.go.alt{background:#2e2114;color:var(--txt);border-color:#6b5228}
.ghost{display:block;margin-top:12px;color:var(--mut);text-decoration:none;font-size:13px}
.turn{display:none}
@media (orientation:portrait) and (max-width:600px){
  .turn{display:block;position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:var(--mut);font-size:12px;padding:4px 10px;border-radius:99px;z-index:2;white-space:nowrap}
  .bar{grid-template-columns:repeat(4,1fr)}
  .btn{flex-direction:column;gap:2px;padding:4px;text-align:center}.btn .pic{width:34px;height:34px}.btn .pic canvas{width:34px;height:34px}.btn b{font-size:11px}
  .stat small{display:none}
  .btn.tb .tx{display:none}.top .btn.tb{padding:3px}
  .top{gap:5px}.stat{padding:4px 7px}
}
@media (max-height:420px){.btn{min-height:44px;gap:5px;padding:3px 5px}.btn span{font-size:10px}.btn b{font-size:11.5px}.btn .pic{width:32px;height:32px}.btn .pic canvas{width:32px;height:32px}.top{padding-top:4px;padding-bottom:4px}}

/* ===== Königreiche & Chaos ===== */
:root{--bg:#070a06;--panel:#0f160c;--line:#4a3c18;--txt:#f1e6c8;--mut:#a59a7c;--gold:#d4af37;--gold2:#f0d37a;--xp:#a8dcff}
html,body{background:var(--bg)}
.top{background:linear-gradient(#19220f,#0b1108);border-bottom:1px solid #7a6128;box-shadow:0 1px 0 rgba(212,175,55,.25),0 8px 24px rgba(0,0,0,.65);position:relative;z-index:6}
.top a,.top button{background:linear-gradient(#1f2c19,#0f170c);border:1px solid #7a6128;color:var(--gold2);box-shadow:inset 0 1px 0 rgba(240,211,122,.15)}
.stat{background:rgba(0,0,0,.5);border:1px solid #5a4a1c;box-shadow:inset 0 1px 0 rgba(240,211,122,.08)}
.gold{color:#f6d36a}
#wrap{background:#050704;overflow:hidden}
#wrap::before{content:"";position:absolute;inset:-30px;background:url(img/hoehle.jpg) center/cover;filter:blur(16px) brightness(.6) saturate(1.1);z-index:0}
#wrap>canvas{position:relative;z-index:1}
canvas#cv{box-shadow:0 0 0 1px rgba(212,175,55,.25),0 0 50px rgba(0,0,0,.8)}
.queue{background:linear-gradient(#0f160c,#0a0f08);border-top:1px solid #7a6128;color:var(--mut)}
.chip{background:linear-gradient(#22311b,#141e10);border:1px solid #7a6128}
.bar{background:linear-gradient(#0e150b,#070a05);border-top:1px solid rgba(212,175,55,.2)}
.btn{background:linear-gradient(#202e1a,#0f170c);border:1px solid #8a6d32;border-radius:6px;box-shadow:inset 0 1px 0 rgba(240,211,122,.18),0 3px 0 #040603,0 4px 10px rgba(0,0,0,.45)}
.btn::before{content:"";position:absolute;inset:3px;border:1px solid rgba(212,175,55,.16);border-radius:4px;pointer-events:none}
.btn:not(:disabled):hover{border-color:var(--gold2);box-shadow:inset 0 1px 0 rgba(240,211,122,.25),0 0 16px rgba(120,210,90,.22),0 3px 0 #040603}
.btn b{color:#f8eed2;text-shadow:0 1px 0 #000}
.btn .c{color:#f6d36a}
.btn .pic{border:1px solid #c49a3a;border-radius:5px;box-shadow:0 0 0 1px #000,0 2px 6px rgba(0,0,0,.6);background:#0b1009}
.btn.unit .pic,.btn.up .pic{background:#0b1009}
.btn.sp{background:linear-gradient(#2c3a16,#141c0a);border-color:#b8902c}
.btn.cat{background:linear-gradient(#2a2a16,#15140a)}
.btn .cd{background:linear-gradient(90deg,#7ec85a,#f0d37a);height:3px;box-shadow:0 0 6px rgba(160,230,110,.6)}
.btn:disabled{opacity:.5;filter:saturate(.5)}
.top .btn.tb{background:linear-gradient(#202e1a,#0f170c);border-color:#8a6d32}
.top .btn.tb.up{background:linear-gradient(#1a2a2c,#0c1517);border-color:#6a8a8a}
.top .btn.tb.glow,.btn.shop.glow{box-shadow:0 0 0 1px var(--gold2),0 0 18px rgba(240,200,90,.5)}
.panel{background:linear-gradient(rgba(17,26,13,.97),rgba(8,12,6,.97));border:1px solid #c49a3a;outline:1px solid #3a3418;outline-offset:3px;border-radius:8px}
.ph{color:var(--gold2);font-family:"Cinzel",serif}
.up-row{background:rgba(255,255,255,.025);border:1px solid rgba(212,175,55,.14)}
.up-row button{background:linear-gradient(#3b6e2e,#1d4116);color:#f6e7b0;border:1px solid #d4af37;box-shadow:inset 0 1px 0 rgba(255,240,180,.3)}
.pips i.on{background:linear-gradient(#f0d37a,#b8902c);box-shadow:0 0 4px rgba(240,211,122,.6)}
.ov{background:radial-gradient(ellipse at 50% 40%,rgba(8,14,6,.55),rgba(2,3,2,.93))}
.box{background:linear-gradient(#131c0f,#090d07);border:1px solid #d4af37;outline:1px solid #4a3c18;outline-offset:5px;border-radius:10px;box-shadow:0 30px 90px rgba(0,0,0,.85),inset 0 0 70px rgba(0,0,0,.55);max-width:620px}
.box::before,.box::after{content:"✦";position:absolute;top:8px;color:var(--gold);font-size:12px;opacity:.7}
.box::before{left:12px}.box::after{right:12px}
.box.start{padding:0;overflow:hidden auto}
.box.start::before,.box.start::after{display:none}
.heroWrap{position:relative}
@media (max-height:560px){.heroWrap .ba{aspect-ratio:16/6}}
.hero{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.box .inner{padding:0 22px 20px;margin-top:-26px;position:relative}
.box h1{font-size:34px;filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 18px rgba(212,175,55,.3))}
.go{background:linear-gradient(#3e7530,#1c3f15);color:#f8e9b4;border:1px solid #d4af37;border-radius:6px;font-family:"Cinzel",serif;letter-spacing:.16em;text-shadow:0 1px 0 #0a1406;box-shadow:inset 0 1px 0 rgba(255,240,180,.35),0 0 0 3px #070a05,0 0 0 4px #7a6128,0 8px 24px rgba(60,150,50,.3);margin-top:14px}
.go:hover{filter:brightness(1.12)}
.go.alt{background:linear-gradient(#202e1a,#0f170c);color:var(--gold2);box-shadow:0 0 0 3px #070a05,0 0 0 4px #4a3c18}
.diff button{background:linear-gradient(#1a2614,#0e150b);border:1px solid #5a4a1c;color:var(--txt)}
.diff button.on{background:linear-gradient(#3e7530,#1c3f15);color:#f8e9b4;border-color:#d4af37;box-shadow:0 0 12px rgba(100,190,70,.3)}
.crewstrip img{border-color:#d4af37;box-shadow:0 0 0 2px #070a05,0 3px 10px rgba(0,0,0,.6)}
.banner{display:block;width:calc(100% + 30px);max-width:none;margin:-6px -15px 4px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.75))}
.banner.loss{filter:drop-shadow(0 12px 30px rgba(0,0,0,.75)) brightness(.92)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px}
.stats div{background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.2);border-radius:6px;padding:8px 4px}
.stats b{display:block;font-family:"Cinzel",serif;color:var(--gold2);font-size:16px}
.stats span{font-size:11px;color:var(--mut)}
@media (max-height:520px){.hero{max-height:130px;object-fit:cover;object-position:50% 22%}.box .inner{margin-top:-14px}.box h1{font-size:26px}.crewstrip img{width:30px;height:30px}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.box h1{font-size:28px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a href="../" title="Zurück zur Spielauswahl">←</a>
    <div class="stat gold">💰 <span id="gold">0</span></div>
    <div class="stat xp">⭐ <span id="xp">0</span><small id="xpn"></small></div>
    <div class="tbtns" id="tbtns"></div>
    <button id="spd" title="Tempo">1×</button>
    <button id="pause" title="Pause">❚❚</button>

  <div id="wrap">
    <div class="turn">Tipp: Handy quer halten</div>
    <canvas id="cv"></canvas>
    <div class="panel hide" id="panel"></div>
    <div class="ov" id="ov">
      <div class="box" id="box"></div>
    </div>
  </div>
  <div class="queue" id="queue">Ausbildung: –</div>
  <div class="bar" id="bar"></div>
</div>

function update(dt) {

        for (const u of S.units) if (u.side !== s.i && u.hp > 0) { const d = Math.abs(u.x - tx); if (d < bd) { bd = d; best = u; } }

  S.fx = S.fx.filter(f => f.t > 0);

  }
}

function drawShot(sh) {
  if (sh.delay && sh.t < sh.delay) return;
  const p = Math.min(1, (sh.t - (sh.delay || 0)) / sh.dur), arc = sh.arc || (sh.kind === 'stone' ? 30 : 16);
  const pos = q => [sh.x1 + (sh.x2 - sh.x1) * q, sh.y1 + (sh.y2 - sh.y1) * q - Math.sin(q * Math.PI) * arc];
  const [x, y] = pos(p), [x2, y2] = pos(Math.min(1, p + .04));
  if (sh.kind === 'boulder' || sh.kind === 'firestone') {
    const r = 3.5 + sh.big * .5;
    if (sh.kind === 'firestone') {
      for (let i = 1; i <= 4; i++) { const [tx, ty] = pos(Math.max(0, p - i * .03)); ctx.globalAlpha = .35 - i * .07; C(tx, ty, r * (1 - i * .12), '#ff9a3a'); }
      ctx.globalAlpha = 1; glow(x, y, r * 3.5, 'rgba(255,140,40,.7)'); C(x, y, r, '#ff7a1a'); C(x - .8, y - .8, r * .5, '#ffe08a');
    } else { C(x, y, r, '#8d8a85'); C(x - r * .3, y - r * .3, r * .35, '#b5b2ac'); }
    return;
  }
  if (sh.kind === 'stone') { ctx.fillStyle = '#8d8a85'; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill(); return; }
  if (sh.kind === 'fire') { glow(x, y, 10, 'rgba(120,255,110,.7)'); C(x, y, 3.5, '#6cff5a'); C(x, y, 1.6, '#e2ffd0'); return; }
  if (sh.kind === 'crystal') { glow(x, y, 12, 'rgba(190,120,255,.7)'); P([x, y - 5, x + 3, y, x, y + 5, x - 3, y], '#d5a8ff'); return; }
  if (sh.kind === 'leaf') { ctx.save(); ctx.translate(x, y); ctx.rotate(p * 12); E(0, 0, 4, 2, '#5cbf4f'); ctx.restore(); return; }
  if (sh.kind === 'coin') { E(x, y, 3.5 * Math.abs(Math.cos(p * 14)) + .6, 3.5, '#f0c94a'); return; }
  const a = Math.atan2(y2 - y, x2 - x), L = sh.kind === 'bolt' ? 18 : 13;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.strokeStyle = '#c9a16a'; ctx.lineWidth = sh.kind === 'bolt' ? 2.6 : 1.5;
  ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(0, 0); ctx.stroke();
  ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.moveTo(0, -2.2); ctx.lineTo(4, 0); ctx.lineTo(0, 2.2); ctx.fill();
  ctx.fillStyle = sh.col; ctx.fillRect(-L, -2, 3, 4);
  ctx.restore();
}

function drawHud() {
  for (const side of [0, 1]) {
    const s = S.sides[side], w = 270, x = side === 0 ? 14 : W - 14 - w, y = 12;
    ctx.fillStyle = 'rgba(15,10,6,.75)'; rr(x - 3, y - 3, w + 6, 22, 6); ctx.fill();
    ctx.strokeStyle = '#a8862f'; ctx.lineWidth = 1.5; ctx.stroke();
    const grd = ctx.createLinearGradient(0, y, 0, y + 16);
    grd.addColorStop(0, COL[side].light); grd.addColorStop(1, COL[side].dark);
    ctx.fillStyle = grd; rr(x, y, Math.max(0, w * s.hp / s.maxhp), 16, 4); ctx.fill();
    ctx.fillStyle = '#fff6e0'; ctx.font = `700 11px ${FONT}`; ctx.textAlign = side === 0 ? 'left' : 'right';
    outText((side === 0 ? 'Bande  ' : '') + Math.ceil(s.hp) + ' / ' + s.maxhp + (side === 1 ? '  Spießer' : ''), side === 0 ? x + 8 : x + w - 8, y + 12);

// schwebende Sporen und Glühwürmchen
const MOTE = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d');
  const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32); return c; })();
const MOTE_T = { gruen: null, gold: null };
for (const [k, col] of [['gruen', '#9dff7a'], ['gold', '#ffd27a']]) { const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'); g.drawImage(MOTE, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, 32, 32); MOTE_T[k] = c; }
const MOTES = Array.from({ length: 46 }, (_, i) => ({ x: Math.random() * W, y: 60 + Math.random() * (GROUND + 40), vx: (Math.random() - .5) * 6, vy: -4 - Math.random() * 8, r: 3 + Math.random() * 6, ph: Math.random() * 7, gold: i % 4 === 0 }));
let moteT = performance.now();
function drawMotes() {
  const now = performance.now(), dt = Math.min(.05, (now - moteT) / 1000); moteT = now;
  for (const m of MOTES) {
    m.x += (m.vx + Math.sin(now / 1300 + m.ph) * 5) * dt; m.y += m.vy * dt;
    if (m.y < 40) { m.y = GROUND + 50; m.x = Math.random() * W; }
    if (m.x < -10) m.x = W + 10; if (m.x > W + 10) m.x = -10;
    ctx.globalAlpha = .35 + Math.sin(now / 500 + m.ph * 3) * .3;
    ctx.drawImage(m.gold ? MOTE_T.gold : MOTE_T.gruen, m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
  }
  ctx.globalAlpha = 1;
}
function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  if (!BG) buildArt();
  if (S && S.quake > 0) { const q = Math.min(1, S.quake / .3) * 3.5; ctx.fillStyle = '#050704'; ctx.fillRect(0, 0, W, H); ctx.translate((Math.random() - .5) * q, (Math.random() - .5) * q); }
  ctx.drawImage(BG, 0, 0, W, H);
  if (!CAVE()) {
    const t = S ? S.t : performance.now() / 1000;
    ctx.fillStyle = 'rgba(255,190,170,.13)';
    for (let i = 0; i < 6; i++) {
      const x = ((i * 260 + t * (6 + i)) % (W + 300)) - 150, y = 50 + (i * 37) % 110;
      ctx.beginPath(); ctx.ellipse(x, y, 70, 10, 0, 0, 7); ctx.ellipse(x + 30, y - 6, 40, 9, 0, 0, 7); ctx.fill();
    }
  }
  if (!S) { drawMotes(); ctx.drawImage(FG, 0, 0, W, H); return; }
  drawBase(0); drawBase(1); drawCamp();
  drawBurns();
  for (const d of S.dead) drawUnit(d, d);
  const list = [...S.units].sort((a, b) => a.sz - b.sz);
  for (const u of list) drawUnit(u);
  for (const sh of S.shots) drawShot(sh);
  drawMotes();
  for (const f of S.fx) {
    if (f.kind === 'num') {
      const p = 1 - f.t / .7;
      ctx.globalAlpha = Math.min(1, f.t * 3); ctx.fillStyle = f.col; ctx.font = `800 ${f.big ? 15 : 11}px ${FONT}`; ctx.textAlign = 'center';
      outText(f.txt, f.x + f.dx * p * 12, f.y - p * 22 - Math.sin(p * Math.PI) * 6); ctx.globalAlpha = 1;
    } else if (f.kind === 'txt') {
      const p = 1 - f.t / f.max;
      ctx.globalAlpha = Math.min(1, f.t * 2); ctx.fillStyle = f.col; ctx.font = `800 ${f.small ? 11 : 16}px ${FONT}`; ctx.textAlign = 'center';
      outText(f.txt, f.x, f.y - p * 30); ctx.globalAlpha = 1;
    } else if (f.kind === 'spark') {
      const p = 1 - f.t / .28; ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.col; ctx.lineWidth = 1.6;
      for (let i = 0; i < 5; i++) { const a = i * 1.26 + f.x; ctx.beginPath(); ctx.moveTo(f.x + Math.cos(a) * 3 * (1 + p * 2), f.y + Math.sin(a) * 3 * (1 + p * 2)); ctx.lineTo(f.x + Math.cos(a) * 8 * (1 + p), f.y + Math.sin(a) * 8 * (1 + p)); ctx.stroke(); }
      ctx.globalAlpha = 1;
    } else if (f.kind === 'dust') {
      const p = 1 - f.t / .6; ctx.globalAlpha = .35 * (1 - p); E(f.x - f.dir * p * 10, f.y - p * 6, 3 + p * 7, 2 + p * 4, '#b49a76'); ctx.globalAlpha = 1;
    } else if (f.kind === 'heal') {
      const p = 1 - f.t / .7; ctx.globalAlpha = 1 - p; ctx.fillStyle = f.col; ctx.font = `800 14px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText('+', f.x - 6, f.y - p * 22); ctx.fillText('+', f.x + 6, f.y - 6 - p * 18); ctx.globalAlpha = 1;
    } else if (f.kind === 'crystalBoom' || f.kind === 'quake') {
      const p = 1 - f.t / .45; ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(f.x, GROUND, 8 + p * 40, 3 + p * 8, 0, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.kind === 'rain') {
      const p = 1 - f.t / .7;
      for (let i = 0; i < 4; i++) {
        const q = Math.min(1, p * 1.6 - i * .15); if (q <= 0) continue;
        const ax = f.x + (i - 1.5) * 9 - (1 - q) * 60 * f.dir, ay = f.y - (1 - q) * 260;
        ctx.save(); ctx.translate(ax, ay); ctx.rotate(Math.PI / 2 - .25 * f.dir);
        ctx.strokeStyle = f.col; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(0, 0); ctx.stroke();
        ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.moveTo(0, -2.5); ctx.lineTo(5, 0); ctx.lineTo(0, 2.5); ctx.fill();
        ctx.restore();
      }
    } else {
      const p = 1 - f.t / (f.kind === 'boom' ? .6 : .5);
      ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, 6 + p * (f.kind === 'boom' ? 30 : 16), 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
  ctx.drawImage(FG, 0, 0, W, H);
  for (const f of S.flash) { ctx.globalAlpha = f.a * f.t; ctx.fillStyle = f.col; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  // Vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .7);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  drawHud();
}

    box.innerHTML = `<img class="banner ${win ? 'win' : 'loss'}" src="img/${win ? 'win' : 'loss'}.webp" alt="${win ? 'Gewonnen' : 'Verloren'}">
      <p>${win ? 'Die Spießerfeste ist gefallen. Die Bande feiert bis zum Morgengrauen. 🌿' : 'Die Spießer haben deine Burg gestürmt. Beim nächsten Mal holst du sie dir.'}</p>
      <div class="stats"><div><b>${mins}:${secs}</b><span>Zeit</span></div><div><b>${p.kills}</b><span>Gegner besiegt</span></div><div><b>${AGES[p.age].name}</b><span>Zeitalter</span></div><div><b>${p.cat ? romans(p.cat) : '–'}</b><span>Katapult</span></div></div>
      ${diffButtons()}
      <button class="go" id="go">Nochmal</button>
      ${window.BB ? '<button class="go alt" id="bbBoard">🏆 Bestenliste</button>' : ''}
      <a class="ghost" href="../">← Zur Spielauswahl</a>`;
    if ($('bbBoard')) $('bbBoard').onclick = () => BB.open('board', 'krieg');
    bindDiff();
    $('go').onclick = () => { newGame(); hideMenu(); refreshUi(true); };
  }
}
function hideMenu() { ov.classList.add('hide'); }
function endGame(win) {
  S.over = true; const g = S;
  if (win && window.BB) {
    const p = S.sides[0], pts = { leicht: 1000, normal: 2000, schwer: 3500 }[diff] + Math.max(0, 1500 - Math.round(S.t)) + p.kills * 3;
    BB.record('krieg', pts, { d: DIFF[diff].label, t: Math.round(S.t) });
    BB.unlock('krieg_win'); if (diff === 'schwer') BB.unlock('krieg_hart'); if (S.t < 600) BB.unlock('krieg_fast');
  }
  if (window.BB && BB.earn) BB.earn(win ? { leicht: 30, normal: 60, schwer: 100 }[diff] : 10, win ? 'Bandenkrieg gewonnen' : 'Tapfer gekämpft');
  if (window.BB && S.sides[0].kills >= 120) BB.unlock('krieg_kills'); setTimeout(() => { if (S === g) showMenu('end', win); }, 900); }

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S && !S.paused && !S.over) {
    const steps = S.speed;
    for (let i = 0; i < steps; i++) update(dt);
  } else if (S && S.over) {
    for (const f of S.fx) f.t -= dt;
  }
  draw();
  refreshUi();
  requestAnimationFrame(loop);
}
resize();
AGES[0].units.forEach((u, i) => { setPic(btns['u' + i], u.look); setBtn(btns['u' + i], u.n, `${u.k} · <span class="c">${u.cost}💰</span>`, true); });
setBtn(btns.tur, 'Allan', AGES[0].tur.w, true); setBtn(btns.cat, 'Katapult', 'erst Allan holen', true);
setBtn(btns.sp, 'König ruft', 'Bereit!', true); setBtn(btns.up, '⬆ ' + AGES[1].name, AGES[0].xpNext + ' ⭐', true); setBtn(btns.shop, 'Upgrades', 'Schmiede & Co.', true);
showMenu('start');
requestAnimationFrame(loop);
// Zum Testen per Konsole
window.BK = { get S() { return S; }, newGame, update, enqueue, special, ageUp, buyTurret, buyUpgrade, buyCat, AGES, UPG, CAT };
</script>
