<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bandenkrieg</title>
<meta name="theme-color" content="#0f130d">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
:root{--bg:#0f130d;--panel:#171d15;--line:#2a3326;--txt:#eef3ee;--mut:#8d998f;--acc:#5ee08a;--red:#ff7a59;--gold:#f5c542;--xp:#7cc7ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.top a,.top button{color:var(--txt);text-decoration:none;background:#232b20;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;font-weight:700;cursor:pointer}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{color:var(--mut);font-weight:600}
.gold{color:var(--gold)}.xp{color:var(--xp)}
.age{margin-left:auto;color:var(--acc);font-weight:800;white-space:nowrap}
#wrap{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:#0b0e09}
canvas{display:block}
.queue{display:flex;align-items:center;gap:6px;padding:5px 10px;min-height:28px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.chip{padding:2px 7px;border-radius:99px;background:#232b20;color:var(--txt);font-weight:700;position:relative;overflow:hidden}
.chip i{position:absolute;left:0;bottom:0;height:2px;background:var(--acc)}
.bar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:var(--panel)}
.btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:52px;padding:4px;border-radius:12px;border:1px solid var(--line);background:#20281d;color:var(--txt);font:inherit;cursor:pointer;overflow:hidden}
.btn b{font-size:13px;line-height:1.1;text-align:center}
.btn span{font-size:11px;color:var(--mut)}
.btn .c{color:var(--gold);font-weight:700}
.btn.unit{border-color:#2f4a33}
.btn.sp{border-color:#4a3a2a}
.btn.up{border-color:#2a3f52}
.btn:disabled{opacity:.42;cursor:default}
.btn:not(:disabled):active{transform:scale(.96)}
.btn .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,7,.82);backdrop-filter:blur(3px);z-index:5;padding:16px}
.ov.hide{display:none}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:440px;width:100%;max-height:100%;overflow:auto;text-align:center}
.box h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.box h1 span{color:var(--acc)}
.box p{color:#c3ccc5;margin:8px 0}
.box ul{text-align:left;color:#c3ccc5;font-size:13px;margin:10px 0 14px 18px}
.box li{margin:3px 0}
.diff{display:flex;gap:6px;justify-content:center;margin:10px 0}
.diff button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#20281d;color:var(--txt);font:inherit;font-weight:700;cursor:pointer}
.diff button.on{background:var(--acc);color:#0b1a10;border-color:var(--acc)}
.go{display:block;width:100%;margin-top:8px;padding:13px;border:0;border-radius:12px;background:var(--acc);color:#0b1a10;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.ghost{display:block;margin-top:10px;color:var(--mut);text-decoration:none;font-size:13px}
.turn{display:none}
@media (orientation:portrait) and (max-width:600px){
  .turn{display:block;position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:var(--mut);font-size:12px;padding:4px 10px;border-radius:99px;z-index:2;white-space:nowrap}
  .bar{grid-template-columns:repeat(3,1fr)}
  .stat small{display:none}
}
@media (max-height:420px){.btn{min-height:42px}.btn span{display:none}.top{padding-top:4px;padding-bottom:4px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a href="../" title="Zurück zur Spielauswahl">←</a>
    <div class="stat gold">💰 <span id="gold">0</span></div>
    <div class="stat xp">⭐ <span id="xp">0</span><small id="xpn"></small></div>
    <div class="age" id="age">Straße</div>
    <button id="spd" title="Tempo">1×</button>
    <button id="pause" title="Pause">❚❚</button>
  </div>
  <div id="wrap">
    <div class="turn">Tipp: Handy quer halten</div>
    <canvas id="cv"></canvas>
    <div class="ov" id="ov">
      <div class="box" id="box"></div>
    </div>
  </div>
  <div class="queue" id="queue">Ausbildung: –</div>
  <div class="bar" id="bar"></div>
</div>
<script>
'use strict';
// ---------- Daten ----------
const W = 1200, H = 420, GROUND = 340, BASE_FRONT = 130;
const AGES = [
  { name: 'Straße', eName: 'Spießer', addHp: 0, special: 70, xpNext: 1800, income: 4,
    units: [
      { n: 'Kobold', e: 'Hausmeister', k: 'Nah', cost: 15, hp: 55, dmg: 9, rng: 18, rate: .9, spd: 46, tr: 1.0, sz: 1 },
      { n: 'Nille', e: 'Nachbarin', k: 'Fern', cost: 25, hp: 40, dmg: 7, rng: 150, rate: 1.2, spd: 40, tr: 1.3, sz: .95 },
      { n: 'Mollymann', e: 'Rasenmäher-Rudi', k: 'Tank', cost: 100, hp: 280, dmg: 20, rng: 20, rate: 1.4, spd: 30, tr: 2.6, sz: 1.35 },
    ],
    tur: { n: 'Allan', w: 'Schleuder', e: 'Gartenzwerg-Kanone', cost: 200, dmg: 12, rate: 1.1, rng: 340 } },
  { name: 'Hinterhof', eName: 'Kontrolleure', addHp: 400, special: 180, xpNext: 9000, income: 9,
    units: [
      { n: 'Artur', e: 'Kontrolleur', k: 'Nah', cost: 45, hp: 160, dmg: 25, rng: 18, rate: .9, spd: 48, tr: 1.1, sz: 1.05 },
      { n: 'LG3', e: 'Blitzer-Bert', k: 'Fern', cost: 70, hp: 110, dmg: 19, rng: 170, rate: 1.1, spd: 42, tr: 1.4, sz: 1 },
      { n: 'Fokuhilamann', e: 'Bauzaun-Bodo', k: 'Tank', cost: 280, hp: 780, dmg: 54, rng: 20, rate: 1.4, spd: 32, tr: 2.8, sz: 1.45 },
    ],
    tur: { n: 'Allan', w: 'Böller-Werfer', e: 'Sprinkler-Turm', cost: 550, dmg: 32, rate: 1.0, rng: 360 } },
  { name: 'Königreich', eName: 'Ordnungsamt', addHp: 700, special: 480, xpNext: null, income: 20,
    units: [
      { n: 'KräuterKönig', e: 'Ordnungsamt', k: 'Nah', cost: 130, hp: 440, dmg: 66, rng: 18, rate: .85, spd: 50, tr: 1.2, sz: 1.1 },
      { n: 'Grauer Geist', e: 'Drohnen-Dieter', k: 'Fern', cost: 200, hp: 300, dmg: 52, rng: 190, rate: 1.0, spd: 46, tr: 1.5, sz: 1 },
      { n: 'DonPatron', e: 'Bürokratie-Boss', k: 'Tank', cost: 750, hp: 2100, dmg: 145, rng: 22, rate: 1.4, spd: 34, tr: 3.0, sz: 1.6 },
    ],
    tur: { n: 'Allan', w: 'Laser-Pointer', e: 'Aktenstapel-Katapult', cost: 1500, dmg: 85, rate: .9, rng: 380 } },
];
const DIFF = { leicht: { mult: .7, label: 'Leicht' }, normal: { mult: 1, label: 'Normal' }, schwer: { mult: 1.35, label: 'Schwer' } };
const SP_CD = 45, START_GOLD = 175, BASE_HP = 500, MAX_Q = 5;
const COL = [
  { main: '#5ee08a', dark: '#2e8a4f', light: '#a6f2c1', base: '#3a4b34', roof: '#5ee08a' },
  { main: '#ff7a59', dark: '#a8442d', light: '#ffc0ad', base: '#4b3a34', roof: '#ff7a59' },
];

// ---------- Zustand ----------
let S = null, diff = 'normal', uid = 0;
try { diff = localStorage.getItem('bk_diff') || 'normal'; } catch (e) {}
if (!DIFF[diff]) diff = 'normal';

function mkSide(i) {
  return { i, gold: START_GOLD, xp: 0, age: 0, hp: BASE_HP, maxhp: BASE_HP, queue: [], tq: 0, tur: -1, turCd: 0, spCd: 20, aiT: 1, aiNext: null, kills: 0 };
}
function newGame() {
  S = { t: 0, speed: 1, paused: false, over: false, started: true, sides: [mkSide(0), mkSide(1)], units: [], shots: [], fx: [], flash: [] };
}
const mult = s => s.i === 1 ? DIFF[diff].mult : 1;
const baseX = side => side === 0 ? BASE_FRONT : W - BASE_FRONT;

// ---------- Aktionen ----------
function enqueue(s, idx) {
  const u = AGES[s.age].units[idx];
  if (s.gold < u.cost || s.queue.length >= MAX_Q) return false;
  s.gold -= u.cost;
  s.queue.push({ ...u, age: s.age });
  return true;
}
function spawn(s, u) {
  const sx = s.i === 0 ? BASE_FRONT - 20 : W - BASE_FRONT + 20;
  S.units.push({ id: uid++, side: s.i, x: sx, ...u, maxhp: u.hp, r: 9 * u.sz, cd: .3, anim: 0, walk: Math.random() * 6 });
}
function spawnFree(s) {
  const sx = s.i === 0 ? BASE_FRONT - 20 : W - BASE_FRONT + 20;
  return !S.units.some(u => u.side === s.i && Math.abs(u.x - sx) < 22);
}
function buyTurret(s) {
  const t = AGES[s.age].tur;
  if (s.tur >= s.age || s.gold < t.cost) return false;
  s.gold -= t.cost; s.tur = s.age; s.turCd = .5;
  if (s.i === 0) floatText(70, GROUND - 170, 'Allan ist oben!', COL[0].light);
  return true;
}
function ageUp(s) {
  const A = AGES[s.age];
  if (!A.xpNext || s.xp < A.xpNext) return false;
  s.age++;
  const add = AGES[s.age].addHp;
  s.maxhp += add; s.hp += add;
  S.flash.push({ t: .8, col: COL[s.i].main, a: .25 });
  floatText(s.i === 0 ? 80 : W - 80, GROUND - 190, (s.i === 0 ? 'Bande' : 'Spießer') + ': ' + AGES[s.age].name + '!', COL[s.i].light, 2.2);
  return true;
}
function special(s) {
  if (s.spCd > 0) return false;
  s.spCd = SP_CD;
  const dmg = AGES[s.age].special;
  S.flash.push({ t: .6, col: s.i === 0 ? '#9dffb9' : '#ffb39f', a: .35 });
  for (const u of S.units) if (u.side !== s.i && u.hp > 0) {
    hurt(u, dmg, s.i);
    S.fx.push({ x: u.x, y: GROUND - 40 * u.sz, t: .6, kind: 'boom', col: COL[s.i].light });
  }
  floatText(W / 2, 70, s.i === 0 ? '👑 König ruft die Bande!' : '📋 Razzia vom Amt!', COL[s.i].light, 1.8);
  return true;
}
function hurt(v, dmg, bySide) {
  if (v.hp <= 0) return;
  v.hp -= dmg;
  if (v.hp <= 0) {
    const s = S.sides[bySide];
    const g = Math.round(v.cost * 1.25), x = Math.round(v.cost * 4);
    s.gold += g; s.xp += x; s.kills++;
    if (bySide === 0) floatText(v.x, GROUND - 60 * v.sz, '+' + g, '#f5c542');
    S.fx.push({ x: v.x, y: GROUND - 20, t: .5, kind: 'poof', col: COL[v.side].main });
  }
}
function hurtBase(side, dmg) {
  const s = S.sides[side];
  s.hp = Math.max(0, s.hp - dmg);
  if (s.hp <= 0 && !S.over) endGame(side === 1);
}
function floatText(x, y, txt, col, life = 1.1) { S.fx.push({ x, y, t: life, max: life, kind: 'txt', txt, col }); }

// ---------- KI ----------
function ai(s, dt) {
  s.aiT -= dt; if (s.aiT > 0) return; s.aiT = .5;
  const A = AGES[s.age];
  if (A.xpNext && s.xp >= A.xpNext) ageUp(s);
  if (s.tur < s.age && S.t > 35 && s.gold >= AGES[s.age].tur.cost + 40) buyTurret(s);
  const threat = S.units.filter(u => u.side === 0 && u.x > W * .5).length;
  if (s.spCd <= 0 && (threat >= 5 || (s.hp < s.maxhp * .45 && threat >= 2))) special(s);
  if (s.queue.length < 3) {
    if (s.aiNext == null) { const r = Math.random(); s.aiNext = r < .5 ? 0 : r < .82 ? 1 : 2; }
    if (enqueue(s, s.aiNext)) s.aiNext = null;
    else if (s.aiNext === 2 && Math.random() < .15) s.aiNext = null; // nicht ewig auf den Tank sparen
  }
}

// ---------- Update ----------
function update(dt) {
  S.t += dt;
  for (const s of S.sides) {
    s.gold += AGES[s.age].income * mult(s) * dt * .5;
    s.xp += 2 * mult(s) * dt;
    s.spCd = Math.max(0, s.spCd - dt);
    if (s.queue.length) {
      s.tq += dt;
      if (s.tq >= s.queue[0].tr) {
        if (spawnFree(s)) { spawn(s, s.queue.shift()); s.tq = 0; } else s.tq = s.queue[0].tr;
      }
    }
    if (s.i === 1) ai(s, dt);
    // Turm
    if (s.tur >= 0) {
      const t = AGES[s.tur].tur;
      s.turCd -= dt;
      if (s.turCd <= 0) {
        const tx = s.i === 0 ? 70 : W - 70;
        let best = null, bd = 1e9;
        for (const u of S.units) if (u.side !== s.i && u.hp > 0) { const d = Math.abs(u.x - tx); if (d < bd) { bd = d; best = u; } }
        if (best && bd <= t.rng) {
          s.turCd = t.rate;
          S.shots.push({ x1: tx, y1: GROUND - 150, x2: best.x, y2: GROUND - 22 * best.sz, t: 0, dur: .25, col: COL[s.i].light, big: true });
          hurt(best, t.dmg, s.i);
        }
      }
    }
  }
  // Einheiten
  for (const u of S.units) {
    if (u.hp <= 0) continue;
    u.cd -= dt; u.anim = Math.max(0, u.anim - dt);
    const dir = u.side === 0 ? 1 : -1;
    let tgt = null, tgap = 1e9;
    for (const v of S.units) {
      if (v.side === u.side || v.hp <= 0) continue;
      const g = (v.x - u.x) * dir - u.r - v.r;
      if (g > -30 && g < tgap) { tgap = g; tgt = v; }
    }
    const bgap = (baseX(1 - u.side) - u.x) * dir - u.r;
    let attack = null;
    if (tgt && tgap <= u.rng && tgap <= bgap) attack = tgt;
    else if (bgap <= u.rng) attack = 'base';
    if (attack) {
      if (u.cd <= 0) {
        u.cd = u.rate; u.anim = .18;
        if (attack === 'base') {
          hurtBase(1 - u.side, u.dmg);
          if (u.k === 'Fern') S.shots.push({ x1: u.x, y1: GROUND - 26 * u.sz, x2: baseX(1 - u.side) + dir * 20, y2: GROUND - 50, t: 0, dur: .22, col: COL[u.side].light });
        } else {
          if (u.k === 'Fern') S.shots.push({ x1: u.x, y1: GROUND - 26 * u.sz, x2: attack.x, y2: GROUND - 22 * attack.sz, t: 0, dur: .22, col: COL[u.side].light });
          hurt(attack, u.dmg, u.side);
        }
      }
      continue;
    }
    // Blockiert durch eigene Leute vorne?
    let blocked = false;
    for (const f of S.units) {
      if (f === u || f.side !== u.side || f.hp <= 0) continue;
      const d = (f.x - u.x) * dir;
      if (d > 0 && d < u.r + f.r + 4) { blocked = true; break; }
    }
    if (tgt && tgap < 2) blocked = true;
    if (!blocked) { u.x += dir * u.spd * dt; u.walk += dt * 9; }
  }
  S.units = S.units.filter(u => u.hp > 0);
  for (const sh of S.shots) sh.t += dt;
  S.shots = S.shots.filter(sh => sh.t < sh.dur);
  for (const f of S.fx) f.t -= dt;
  S.fx = S.fx.filter(f => f.t > 0);
  for (const f of S.flash) f.t -= dt;
  S.flash = S.flash.filter(f => f.t > 0);
}

// ---------- Zeichnen ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), wrap = document.getElementById('wrap');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = wrap.getBoundingClientRect();
  scale = Math.min(r.width / W, r.height / H);
  cv.style.width = Math.floor(W * scale) + 'px';
  cv.style.height = Math.floor(H * scale) + 'px';
  cv.width = Math.floor(W * scale * dpr);
  cv.height = Math.floor(H * scale * dpr);
}
new ResizeObserver(resize).observe(wrap);

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function drawBase(side) {
  const s = S.sides[side], c = COL[side];
  const x0 = side === 0 ? 10 : W - 120, w = 110;
  const lvl = s.age;
  const h = 120 + lvl * 25;
  ctx.fillStyle = c.base; rr(x0, GROUND - h, w, h, 6); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  for (let r = 0; r < 2 + lvl; r++) for (let k = 0; k < 3; k++) { rr(x0 + 14 + k * 30, GROUND - h + 18 + r * 32, 18, 18, 3); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,230,140,.5)';
  rr(x0 + 14 + (side ? 60 : 0), GROUND - h + 18, 18, 18, 3); ctx.fill();
  // Dach
  ctx.fillStyle = c.dark; ctx.beginPath(); ctx.moveTo(x0 - 8, GROUND - h); ctx.lineTo(x0 + w / 2, GROUND - h - 30); ctx.lineTo(x0 + w + 8, GROUND - h); ctx.closePath(); ctx.fill();
  // Tür
  ctx.fillStyle = '#1a1612'; rr(x0 + (side ? 10 : w - 34), GROUND - 46, 24, 46, 4); ctx.fill();
  // Turm / Allan
  if (s.tur >= 0) {
    const tx = side === 0 ? 70 : W - 70, ty = GROUND - 150;
    ctx.fillStyle = '#2a2a2a'; rr(tx - 16, ty + 6, 32, 10, 3); ctx.fill();
    ctx.fillStyle = c.light; rr(tx - 7, ty - 14, 14, 20, 4); ctx.fill();
    ctx.beginPath(); ctx.arc(tx, ty - 20, 7, 0, 7); ctx.fill();
    ctx.strokeStyle = c.main; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(tx, ty - 8); ctx.lineTo(tx + (side ? -16 : 16), ty - 12 - s.tur * 2); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(side === 0 ? AGES[s.tur].tur.n : AGES[s.tur].tur.e, tx, ty - 32);
  }
  // Name
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(side === 0 ? 'Bandenbude' : 'Spießer-Siedlung', x0 + w / 2, GROUND + 18);
}

function drawUnit(u) {
  const c = COL[u.side], dir = u.side === 0 ? 1 : -1, sz = u.sz;
  const moving = u.anim <= 0;
  const bob = moving ? Math.abs(Math.sin(u.walk)) * 2 : 0;
  const lunge = u.anim > 0 && u.k !== 'Fern' ? dir * 5 * (u.anim / .18) : 0;
  const x = u.x + lunge, by = GROUND - bob;
  const bw = 14 * sz, bh = 20 * sz, hr = 7 * sz;
  // Beine
  ctx.strokeStyle = c.dark; ctx.lineWidth = 3 * sz; ctx.lineCap = 'round';
  const leg = moving ? Math.sin(u.walk) * 5 * sz : 0;
  ctx.beginPath(); ctx.moveTo(x - 3 * sz, by - 10 * sz); ctx.lineTo(x - 3 * sz + leg, GROUND); ctx.moveTo(x + 3 * sz, by - 10 * sz); ctx.lineTo(x + 3 * sz - leg, GROUND); ctx.stroke();
  // Körper
  ctx.fillStyle = u.k === 'Tank' ? c.dark : u.k === 'Fern' ? c.light : c.main;
  rr(x - bw / 2, by - 10 * sz - bh, bw, bh, 4 * sz); ctx.fill();
  // Kopf
  ctx.fillStyle = '#f0d2b4';
  ctx.beginPath(); ctx.arc(x, by - 10 * sz - bh - hr + 1, hr, 0, 7); ctx.fill();
  // Auge
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + dir * 3 * sz, by - 10 * sz - bh - hr, 1.4 * sz, 0, 7); ctx.fill();
  // Waffe
  ctx.strokeStyle = u.k === 'Fern' ? '#c9a16a' : '#d8d8d8'; ctx.lineWidth = 2.5 * sz;
  const ay = by - 10 * sz - bh * .6;
  ctx.beginPath();
  if (u.k === 'Fern') { ctx.moveTo(x + dir * 5 * sz, ay); ctx.lineTo(x + dir * 14 * sz, ay - 6 * sz); }
  else { const sw = u.anim > 0 ? 1 : 0; ctx.moveTo(x + dir * 6 * sz, ay); ctx.lineTo(x + dir * (12 + sw * 6) * sz, ay - (12 - sw * 10) * sz); }
  ctx.stroke();
  // Tank-Schild
  if (u.k === 'Tank') { ctx.fillStyle = 'rgba(255,255,255,.18)'; rr(x + dir * 6 * sz - (dir < 0 ? 6 * sz : 0), ay - 6 * sz, 6 * sz, 16 * sz, 2); ctx.fill(); }
  // Name
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = `600 ${Math.round(9 + sz)}px system-ui`; ctx.textAlign = 'center';
  const top = by - 10 * sz - bh - hr * 2 - 4;
  ctx.fillText(u.side === 0 ? u.n : u.e, x, top - 6);
  // HP
  if (u.hp < u.maxhp) {
    const w = 24 * sz;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x - w / 2, top - 3, w, 3);
    ctx.fillStyle = c.main; ctx.fillRect(x - w / 2, top - 3, w * Math.max(0, u.hp / u.maxhp), 3);
  }
}

function drawHud() {
  for (const side of [0, 1]) {
    const s = S.sides[side], w = 260, x = side === 0 ? 14 : W - 14 - w, y = 12;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(x, y, w, 16, 8); ctx.fill();
    ctx.fillStyle = COL[side].main; rr(x, y, Math.max(0, w * s.hp / s.maxhp), 16, 8); ctx.fill();
    ctx.fillStyle = '#0b0e09'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = side === 0 ? 'left' : 'right';
    ctx.fillStyle = '#fff';
    ctx.fillText((side === 0 ? 'Bande  ' : '') + Math.ceil(s.hp) + ' / ' + s.maxhp + (side === 1 ? '  Spießer' : ''), side === 0 ? x + 8 : x + w - 8, y + 12);
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '11px system-ui';
    ctx.fillText(side === 0 ? AGES[s.age].name : AGES[s.age].eName, side === 0 ? x + 2 : x + w - 2, y + 30);
  }
}

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#1b2433'); g.addColorStop(1, '#3a3f39');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // Hügel
  ctx.fillStyle = '#2b3428';
  ctx.beginPath(); ctx.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, GROUND - 40 - Math.sin(x / 140) * 22 - Math.sin(x / 57) * 8);
  ctx.lineTo(W, GROUND); ctx.fill();
  // Boden
  ctx.fillStyle = '#3d4a33'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#4c5b3f'; ctx.fillRect(0, GROUND, W, 5);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; for (let x = 0; x < W; x += 60) ctx.fillRect(x + 20, GROUND + 30, 26, 3);
  if (!S) return;
  drawBase(0); drawBase(1);
  const list = [...S.units].sort((a, b) => a.sz - b.sz);
  for (const u of list) drawUnit(u);
  for (const sh of S.shots) {
    const p = sh.t / sh.dur, x = sh.x1 + (sh.x2 - sh.x1) * p, y = sh.y1 + (sh.y2 - sh.y1) * p - Math.sin(p * Math.PI) * 18;
    ctx.fillStyle = sh.col; ctx.beginPath(); ctx.arc(x, y, sh.big ? 4.5 : 3, 0, 7); ctx.fill();
  }
  for (const f of S.fx) {
    if (f.kind === 'txt') {
      const p = 1 - f.t / f.max;
      ctx.globalAlpha = Math.min(1, f.t * 2); ctx.fillStyle = f.col; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(f.txt, f.x, f.y - p * 30); ctx.globalAlpha = 1;
    } else {
      const p = 1 - f.t / (f.kind === 'boom' ? .6 : .5);
      ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, 6 + p * (f.kind === 'boom' ? 30 : 16), 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
  for (const f of S.flash) { ctx.globalAlpha = f.a * f.t; ctx.fillStyle = f.col; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawHud();
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
const bar = $('bar');
const btns = {};
function makeBtn(key, cls, onClick) {
  const b = document.createElement('button');
  b.className = 'btn ' + cls; b.innerHTML = '<b></b><span></span><div class="cd"></div>';
  b.addEventListener('click', () => { if (S && !S.over && !S.paused) { onClick(); refreshUi(true); } });
  bar.appendChild(b); btns[key] = b; return b;
}
[0, 1, 2].forEach(i => makeBtn('u' + i, 'unit', () => enqueue(S.sides[0], i)));
makeBtn('tur', 'tur', () => buyTurret(S.sides[0]));
makeBtn('sp', 'sp', () => special(S.sides[0]));
makeBtn('up', 'up', () => ageUp(S.sides[0]));

function setBtn(b, title, sub, dis, cdFrac) {
  const t = b.children[0], s = b.children[1];
  if (t.innerHTML !== title) t.innerHTML = title;
  if (s.innerHTML !== sub) s.innerHTML = sub;
  b.disabled = dis;
  b.children[2].style.width = cdFrac ? (cdFrac * 100) + '%' : '0';
}
let uiT = 0;
function refreshUi(force) {
  if (!S) return;
  if (!force && (uiT -= 1) > 0) return; uiT = 6;
  const p = S.sides[0], A = AGES[p.age];
  $('gold').textContent = Math.floor(p.gold);
  $('xp').textContent = Math.floor(p.xp);
  $('xpn').textContent = A.xpNext ? ' / ' + A.xpNext : ' max';
  $('age').textContent = A.name;
  A.units.forEach((u, i) => setBtn(btns['u' + i], u.n, `${u.k} · <span class="c">${u.cost}💰</span>`, p.gold < u.cost || p.queue.length >= MAX_Q));
  const T = A.tur;
  if (p.tur >= p.age) setBtn(btns.tur, 'Allan', T.w + ' ✓', true);
  else setBtn(btns.tur, p.tur < 0 ? 'Allan holen' : 'Allan upgraden', `${T.w} · <span class="c">${T.cost}💰</span>`, p.gold < T.cost);
  setBtn(btns.sp, '👑 König ruft', p.spCd > 0 ? Math.ceil(p.spCd) + ' s' : 'Bereit!', p.spCd > 0, p.spCd > 0 ? 1 - p.spCd / SP_CD : 0);
  if (A.xpNext) setBtn(btns.up, '⬆ ' + AGES[p.age + 1].name, `${A.xpNext} ⭐`, p.xp < A.xpNext, Math.min(1, p.xp / A.xpNext));
  else setBtn(btns.up, 'Top-Zeitalter', 'erreicht', true);
  const q = $('queue');
  if (!p.queue.length) q.innerHTML = 'Ausbildung: –';
  else q.innerHTML = 'Ausbildung: ' + p.queue.map((u, i) => `<span class="chip">${u.n}${i === 0 ? `<i style="width:${Math.min(100, p.tq / u.tr * 100)}%"></i>` : ''}</span>`).join('');
}

$('spd').onclick = () => { if (!S) return; S.speed = S.speed === 1 ? 2 : 1; $('spd').textContent = S.speed + '×'; };
$('pause').onclick = () => { if (!S || S.over) return; S.paused = !S.paused; $('pause').textContent = S.paused ? '▶' : '❚❚'; if (S.paused) showMenu('pause'); else hideMenu(); };
document.addEventListener('keydown', e => {
  if (!S || S.over) return;
  const k = e.key.toLowerCase();
  if (k === 'p' || k === 'escape') return $('pause').click();
  if (S.paused) return;
  if (k === '1' || k === '2' || k === '3') enqueue(S.sides[0], +k - 1);
  else if (k === 't') buyTurret(S.sides[0]);
  else if (k === 's') special(S.sides[0]);
  else if (k === 'a') ageUp(S.sides[0]);
  else return;
  refreshUi(true);
});

// ---------- Menüs ----------
const ov = $('ov'), box = $('box');
function diffButtons() {
  return '<div class="diff">' + Object.entries(DIFF).map(([k, d]) => `<button data-d="${k}" class="${k === diff ? 'on' : ''}">${d.label}</button>`).join('') + '</div>';
}
function bindDiff() {
  box.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    diff = b.dataset.d; try { localStorage.setItem('bk_diff', diff); } catch (e) {}
    box.querySelectorAll('[data-d]').forEach(x => x.classList.toggle('on', x === b));
  });
}
function showMenu(kind, win) {
  ov.classList.remove('hide');
  if (kind === 'start') {
    box.innerHTML = `<h1>Banden<span>krieg</span></h1>
      <p>Die Bubatzbande gegen die Spießer. Reiß ihre Siedlung ab, bevor sie deine Bude plattmachen.</p>
      <ul>
        <li><b>Leute schicken:</b> Nahkämpfer, Fernkämpfer und Tanks kosten Gold und laufen von allein los.</li>
        <li><b>Gold & Sterne</b> gibt's für jeden besiegten Gegner.</li>
        <li><b>Aufsteigen:</b> Mit genug Sternen kommst du ins nächste Zeitalter, mit stärkeren Leuten.</li>
        <li><b>Allan</b> setzt sich aufs Dach und ballert auf alles, was zu nah kommt.</li>
        <li><b>König ruft:</b> trifft alle Gegner auf einmal, dann 45 s Pause.</li>
      </ul>
      ${diffButtons()}
      <button class="go" id="go">▶ PLAY</button>
      <a class="ghost" href="../">← Zur Spielauswahl</a>`;
    bindDiff();
    $('go').onclick = () => { newGame(); hideMenu(); refreshUi(true); };
  } else if (kind === 'pause') {
    box.innerHTML = `<h1>Pause</h1>
      <button class="go" id="go">▶ Weiter</button>
      <button class="go" id="re" style="background:#2a3326;color:#eef3ee">Neu starten</button>
      <a class="ghost" href="../">← Zur Spielauswahl</a>`;
    $('go').onclick = () => $('pause').click();
    $('re').onclick = () => showMenu('start');
  } else if (kind === 'end') {
    const p = S.sides[0], mins = Math.floor(S.t / 60), secs = String(Math.floor(S.t % 60)).padStart(2, '0');
    box.innerHTML = `<h1>${win ? 'Gewonnen! <span>🌿</span>' : 'Verloren 💀'}</h1>
      <p>${win ? 'Die Spießer-Siedlung liegt in Schutt und Asche.' : 'Die Spießer haben deine Bude plattgemacht.'}</p>
      <p style="color:var(--mut)">Zeit ${mins}:${secs} · ${p.kills} Gegner besiegt · ${AGES[p.age].name} · ${DIFF[diff].label}</p>
      ${diffButtons()}
      <button class="go" id="go">Nochmal</button>
      <a class="ghost" href="../">← Zur Spielauswahl</a>`;
    bindDiff();
    $('go').onclick = () => { newGame(); hideMenu(); refreshUi(true); };
  }
}
function hideMenu() { ov.classList.add('hide'); }
function endGame(win) { S.over = true; const g = S; setTimeout(() => { if (S === g) showMenu('end', win); }, 900); }

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S && !S.paused && !S.over) {
    const steps = S.speed;
    for (let i = 0; i < steps; i++) update(dt);
  } else if (S && S.over) {
    for (const f of S.fx) f.t -= dt;
  }
  draw();
  refreshUi();
  requestAnimationFrame(loop);
}
resize();
showMenu('start');
requestAnimationFrame(loop);
// Zum Testen per Konsole
window.BK = { get S() { return S; }, newGame, update, enqueue, special, ageUp, buyTurret, AGES };
</script>
</body>
