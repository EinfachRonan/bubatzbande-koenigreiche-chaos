<style>
:root{--bg:#0b0c0f;--gold:#e8d870;--gb:#8a7a30;--kr:#7fd8ff;--txt:#e6e8ea;--mut:#8a8f98;--C:#a0a8a0;--U:#5ecb4a;--R:#4da3ff;--E:#b26bff;--L:#ffb020}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"VT323",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:inherit}
#hub{position:fixed;inset:0;display:flex;gap:0}
#left{width:380px;flex:0 0 380px;display:flex;flex-direction:column;padding:12px;gap:10px;border-right:2px solid var(--gb);background:#0e0d08;overflow:auto}
.chap{display:flex;align-items:center;justify-content:space-between;text-align:center;color:var(--mut)}
.chap small{display:block;font-size:17px;letter-spacing:2px}
.chap b{display:block;font-size:29px;color:#cfd4d8;letter-spacing:1px}
.chap button{background:none;border:0;color:var(--gold);font-size:29px;cursor:pointer;padding:6px 10px}
.chap button:disabled{opacity:.2;cursor:default}
.panel{border:2px solid var(--gb);border-radius:6px;padding:10px;background:#000}
.ph{display:flex;justify-content:space-between;align-items:center;font-size:31px;font-weight:700;color:var(--gold);margin-bottom:10px}
#offers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.of{cursor:pointer;text-align:center;user-select:none}
.of .pr{border:2px solid var(--gb);border-radius:6px;background:#2a2410;font-size:23px;font-weight:700;color:var(--gold);padding:2px 0;margin-bottom:4px}
.of .pb{border:2px solid #3a3420;border-radius:6px;background:#050505;height:96px;display:flex;align-items:center;justify-content:center}
.of .pb img{height:74px;image-rendering:pixelated;transition:transform .1s}
.of:hover .pb img{transform:scale(1.08) rotate(-3deg)}
.of.no{opacity:.35;cursor:default}
.of.no:hover .pb img{transform:none}
.of .sn{font-size:16px;color:#c8bc80;margin-top:3px}
.odds{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;font-size:14px;margin-top:2px}
.odds i{font-style:normal}
#bag{margin-top:10px;min-height:44px;border-top:1px solid #2a2410;padding-top:8px;font-size:17px;color:#c8bc80}
#bag img{height:34px;image-rendering:pixelated;margin-right:3px;vertical-align:middle}
.btn{background:#c8b040;color:#1a1300;border:2px solid #f0e080;border-radius:6px;padding:10px 16px;font-weight:700;font-size:21px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.35;cursor:default}
.btn.sec{background:#2a2a20;color:var(--gold);border-color:var(--gb)}
.btn.red{background:#c9483f;color:#fff;border-color:#e87a70}
#reroll{width:100%;margin-top:8px}
.mut{color:var(--mut);font-size:17px}
#right{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:6px;align-items:flex-end;padding:8px 12px 0;border-bottom:2px solid #2a4aa0}
.tabs button{background:#14182a;color:#8a90a8;border:2px solid #2a3a70;border-bottom:0;border-radius:6px 6px 0 0;padding:8px 18px;font-size:25px;font-weight:700;cursor:pointer;letter-spacing:1px}
.tabs button.on{background:#2a4aa0;color:#e8f0ff}
.tabs .krc{margin-left:auto;font-size:31px;font-weight:700;color:var(--kr);padding:0 4px 6px}
#treebox{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background:radial-gradient(circle at 50% 50%,#12141a,#07080a)}
#treebox.drag{cursor:grabbing}
#tree{position:absolute;left:0;top:0;width:4400px;height:2600px}
#tree svg{position:absolute;inset:0;pointer-events:none}
.node{position:absolute;width:48px;height:48px;border:2px solid #3a3a40;border-radius:4px;background:#16161a;display:flex;align-items:center;justify-content:center;font-size:29px;cursor:pointer;user-select:none}
.node img{height:36px;image-rendering:pixelated;pointer-events:none}
.node.own{border-color:#c8c8c8;background:#2a2a30}
.node.buy{border-color:#e8d870;box-shadow:0 0 10px #e8d87055}
.node.lock{opacity:.55}
.node.unk{opacity:.4;font-size:26px;color:#888}
.node.q{border-color:#d86a3a;background:#3a1a10}
.node.q.own{border-color:#5ecb4a;background:#1a2a14}
.node .mk{position:absolute;right:-1px;top:-3px;font-size:16px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;pointer-events:none}
.node .pg{position:absolute;bottom:-1px;left:0;right:0;font-size:13px;text-align:center;background:#000a;color:#fff;pointer-events:none}
.node.sil img{filter:brightness(0) opacity(.75)}
.node.root{width:160px;height:150px;border:0;background:none;cursor:default}
.node.root img{height:140px}
#tip{position:absolute;display:none;width:330px;z-index:5;pointer-events:auto}
.tb{background:#2a2c30;border:2px solid #4a4c52;border-radius:4px;margin-bottom:6px}
.tb h4{margin:0;padding:8px 12px;background:#3a3c42;font-size:23px;letter-spacing:1px}
.tb.ownd h4{background:#3a6a2a}
.tb p{margin:0;padding:10px 12px;font-size:20px;line-height:1.4;color:#d8dadc}
.tb .cost{border-top:1px solid #4a4c52;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-size:23px;font-weight:700;color:var(--kr)}
.tb .hc{display:flex;gap:10px;align-items:center;padding:8px 12px}
.tb .hc img{height:52px;image-rendering:pixelated}
.tb .hs{display:flex;gap:12px;justify-content:center;padding:4px 12px 10px;font-size:18px;color:#c8cacc;flex-wrap:wrap}
.tb .hh{padding:8px 12px 0;font-size:18px;font-weight:700;letter-spacing:.5px}
#coll{flex:1;overflow:auto;padding:14px;display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
#fight{position:absolute;right:18px;bottom:18px;font-size:36px;padding:14px 34px;letter-spacing:2px;z-index:4}
#battle{position:fixed;inset:0;display:none;flex-direction:column;background:#0b110e;z-index:10}
#hud{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#000c;font-size:20px;font-weight:600}
#hud .w{white-space:nowrap}
.hpbar{flex:1;height:16px;background:#3a1717;border-radius:3px;overflow:hidden;position:relative;min-width:70px;border:1px solid #000}
.hpbar div{height:100%;background:#4fae3a;width:100%;transition:width .1s}
.hpbar span{position:absolute;inset:0;font-size:16px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000}
.hb{background:#2a382e;color:#fff;border:0;border-radius:6px;padding:6px 10px;font-weight:700;font-size:18px;cursor:pointer}
#cvwrap{flex:1;position:relative;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:none;image-rendering:pixelated}
#hint{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:#000c;padding:6px 14px;border-radius:6px;font-size:20px;display:none;pointer-events:none;z-index:3;white-space:nowrap}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.mbox{background:#0b0c0f;border-radius:6px;padding:20px;max-width:980px;width:100%;max-height:94vh;overflow:auto;text-align:center}
.mbox h3{margin:0 0 14px;font-size:52px;letter-spacing:3px;border-top:3px solid #a02a2a;border-bottom:3px solid #a02a2a;padding:10px 0}
.mbox h3.win{border-color:#4a9a3a;color:#7fe07a}
.mbox h3.lose{color:#d84a3a}
.dgrid{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;text-align:left}
.dbox{background:#1a1c20;border:2px solid #3a3c42;border-radius:4px;padding:10px 14px;flex:1;min-width:280px}
.dbox table{width:100%;border-collapse:collapse;font-size:22px}
.dbox th{color:#a0a4aa;font-weight:600;text-align:right;padding:6px 8px;font-size:20px}
.dbox th:first-child,.dbox td:first-child{text-align:left}
.dbox td{padding:7px 8px;text-align:right;border-top:1px solid #2a2c30}
.dbox td img{height:28px;image-rendering:pixelated;vertical-align:middle;margin-right:8px}
.drow{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid #2a2c30;font-size:25px}
.mbtns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000e;border:1px solid var(--gb);padding:10px 16px;border-radius:6px;font-size:21px;z-index:60;display:none;max-width:90vw;text-align:center;color:var(--gold)}
@media (max-width:820px){
  html,body{overflow:auto}
  #hub{position:static;flex-direction:column;min-height:100vh}
  #left{width:auto;flex:none;border-right:0;border-bottom:2px solid var(--gb)}
  #right{height:78vh;flex:none}
  #fight{font-size:29px;padding:10px 22px}
  #tip{width:290px}
}
</style>

const FIND_GOAL = {C:10, U:6, R:5, E:3, L:2};
const VET_COST = {C:40, U:80, R:160, E:320, L:640};
(function(){
  // Helden-Äste verteilen sich rechts UND links der Höhle, jeweils nach oben und unten
  const SLOT = [[0,1,'h'],[1,1,0],[0,2,0],[1,2,1],[-1,0,'h'],[1,3,3]];
  const occ = new Set(NODES.map(n => n.x + ',' + n.y));
  const cand = [];
  for(let k = 0; k < 12; k++) for(const side of [1, -1]) for(const s of [-1, 1]) cand.push({x:side * (9 + k*5), s, side});
  HEROES.forEach(h => {
    const T = HERO_TREE[h.id], hid = 'h_' + h.id;
    let spot = null, cells = null;
    for(const c of cand){
      if(c.used) continue;
      const fx = dx => c.x + dx * c.side, y = 4 * c.s;
      const cl = [[c.x, y], [c.x, c.s], [c.x, 2*c.s], [c.x, 3*c.s], [fx(1), y], [fx(-1), y + c.s]];
      T.ups.forEach((u, k) => { const [dx, dy] = SLOT[k]; cl.push([fx(dx), y + dy*c.s]); });
      if(cl.every(([x, yy]) => !occ.has(x + ',' + yy))){ spot = c; cells = cl; break; }
    }
    spot.used = true; cells.forEach(([x, y]) => occ.add(x + ',' + y));
    const s = spot.s, x = spot.x, y = 4 * s, fx = dx => x + dx * spot.side;
    NODES.push({id:hid, x, y, p:'root', t:'hero', hero:h.id, cost:0});
    T.ups.forEach((u, k) => { const [dx, dy, par] = SLOT[k]; const eff = {}; for(const key in u.eff){ if(key.endsWith('G')) eff[key.slice(0,-1)] = u.eff[key]; else { eff.h = h.id; eff[key] = u.eff[key]; } }
      NODES.push(Object.assign({id:h.id + '_u' + k, x:fx(dx), y:y + dy*s, p:par === 'h' ? hid : h.id + '_u' + par, t:'up', hero:h.id}, u, {eff})); });
    NODES.push({id:'q_find_' + h.id, x:fx(1), y, p:hid, t:'quest', hero:h.id, mark:'?', n:'Quest', d:`Spüre ${FIND_GOAL[h.r]}× ${h.n} auf.`, q:{key:'found_' + h.id, goal:FIND_GOAL[h.r]}, rew:'+1 🪙 Einkommen', eff:{income:1}});
    NODES.push({id:h.id + '_vet', x:fx(-1), y:y + s, p:hid, t:'up', hero:h.id, mark:'▲', n:'Veteranen', d:`${h.n}: +15% LP und Schaden (pro Stufe).`, cost:VET_COST[h.r], max:10, cf:1.4, eff:{h:h.id, hp:.15, dmg:.15}});
  });
})();

function makeCave(){
  const W = 46, H = 34, R = rng(42), g = mkGrid(W, H), cx = 23, by = 32;
  const rock = ['#232328','#303037','#3e3e46','#4d4d56','#5e5e68'];
  const noise = {}; const nz = (x,y) => { const k = (x>>1)+','+(y>>1); if(!(k in noise)) noise[k] = R(); return noise[k]; };
  const isRock = (x,y) => { const nx = (x-cx)/21, ny = (y-by)/26; return nx*nx + ny*ny <= 1 && y <= by; };
  const isHole = (x,y) => { const ex = (x-cx)/8.5, ey = (y-by)/13; return ex*ex + ey*ey <= 1; };
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    if(!isRock(x,y)) continue;
    const nx = (x-cx)/21, ny = (y-by)/26;
    const l = -nx*0.35 - ny*0.6 + (nz(x,y)-.5)*0.55;
    g[y][x] = rock[Math.max(0, Math.min(4, Math.floor((l+0.35)/1.3*5)))];
    if(isHole(x,y)){ const ex = (x-cx)/8.5, ey = (y-by)/13, d = ex*ex+ey*ey; g[y][x] = d > .75 ? '#141416' : '#060607'; }
  }
  const moss = ['#2a5420','#3a7028','#4f8f34','#6aae44'];
  const top = [];
  for(let x = 0; x < W; x++){ let t = -1; for(let y = 0; y < H; y++) if(g[y][x]){ t = y; break; } top[x] = t; }
  for(let x = 0; x < W; x++){
    if(top[x] < 0) continue;
    const depth = 2 + Math.floor(R()*4);
    for(let k = 0; k < depth; k++){ const y = top[x] + k; if(g[y] && g[y][x] && !isHole(x,y)) g[y][x] = moss[Math.min(3, Math.floor(R()*2) + (k < 1 ? 2 : 0))]; }
  }
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++) if(g[y][x] && !isHole(x,y) && isRock(x,y) && nz(x+7,y+3) > .78 && R() < .7) g[y][x] = moss[Math.floor(R()*3)];
  // Ranken über dem Eingang
  for(let i = 0; i < 9; i++){
    const x = cx - 10 + Math.floor(R()*21); if(top[x] < 0) continue;
    const len = 5 + Math.floor(R()*12);
    for(let k = 0; k < len; k++){ const y = top[x] + 2 + k; if(y >= by) break; g[y][x] = k % 3 === 2 ? '#5a9a3a' : '#2f6a24'; if(k % 4 === 1 && x+1 < W) g[y][x+1] = '#4f8f34'; }
  }
  // Kräuter oben drauf
  const herb = ['g.g.g','.ggg.','..s..'];
  for(let i = 0; i < 7; i++){
    const x = 6 + Math.floor(R()*34); if(top[x] < 3) continue;
    const pal = {g: R() < .5 ? '#7fd04a' : '#5fb83a', s:'#3a7028'};
    herb.forEach((row, ry) => [...row].forEach((ch, rx) => { if(ch !== '.'){ const yy = top[x] - 3 + ry, xx = x - 2 + rx; if(g[yy] && xx >= 0 && xx < W) g[yy][xx] = pal[ch]; } }));
  }
  for(let i = 0; i < 14; i++){ const x = 2 + Math.floor(R()*42); if(top[x] < 0) continue; const y = top[x] + Math.floor(R()*5); if(g[y] && g[y][x] && !isHole(x,y)) g[y][x] = R() < .5 ? '#e8d34a' : '#b07ae0'; }
  // Kräuterbüschel am Eingang
  for(const x of [cx-11, cx-10, cx+10, cx+11, cx-12, cx+12]) { g[by][x] = '#5fb83a'; g[by-1][x] = '#7fd04a'; }
  return gridCanvas(outline(g));
}

let MD;
function computeMods(){
  const M = {allDmg:0, allHp:0, allRate:0, allCrit:0, allBlock:0, hitsBasis:0, hitsAdv:0, extra:0, basisHp:0, sale:0, freeroll:0, krKill:0, tavFast:0, tavDbl:0, kasBox:0, income:3, slots:3, packs:['basis'], cave:100, regen:0, cdmg:10, crad:34, cradP:0, crate:3, ccrit:0, blds:[], bspeed:0, unl:{}, H:{}, moon:0, rudel:.25};
  for(const n of NODES){
    if(!S.owned[n.id]) continue;
    if(n.t === 'hero') M.unl[n.hero] = 1;
    const e0 = n.eff; if(!e0) continue;
    const L = S.owned[n.id] === true ? 1 : S.owned[n.id], e = {};
    for(const k in e0) e[k] = typeof e0[k] === 'number' ? e0[k] * L : e0[k];
    for(const k of ['allRate','allCrit','allBlock','hitsBasis','hitsAdv','extra','basisHp','sale','freeroll','krKill','tavFast','tavDbl','kasBox']) if(e[k] && !e.h) M[k] += e[k];
    if(e.allDmg) M.allDmg += e.allDmg;
    if(e.allHp) M.allHp += e.allHp;
    if(e.income) M.income += e.income;
    if(e.slots) M.slots += e.slots;
    if(e.pack) M.packs.push(e.pack);
    if(e.cave) M.cave += e.cave;
    if(e.regen) M.regen += e.regen;
    if(e.cdmg) M.cdmg += e.cdmg;
    if(e.crad) M.cradP += e.crad;
    if(e.crate) M.crate += e.crate;
    if(e.ccrit) M.ccrit += e.ccrit;
    if(e.bld) M.blds.push(e.bld);
    if(e.bspeed) M.bspeed += e.bspeed;
    if(e.moon) M.moon += e.moon;
    if(e.rudel) M.rudel += e.rudel;
    if(e.h){ const H = M.H[e.h] = M.H[e.h] || {}; for(const k in e) if(k !== 'h') H[k] = (H[k] || 0) + e[k]; }
  }

}

    hp: c.hp * add('hp'), atk: c.atk * add('dmg'), cd: c.cd / add('rate'),
    range: c.melee ? c.range : c.range * (1 + (h.range || 0)),
    multi: (c.multi || 1) + (h.multi || 0) + (s.multi || 0),
    chain: (c.chain || 0) + (h.chain || 0) + (s.chain || 0),

    lifesteal: (c.lifesteal || 0) * (1 + (s.lifesteal || 0)) + (h.lifesteal || 0),
    aura: (c.aura || 0) + (h.aura || 0), alwaysWolf: !!s.alwaysWolf,

    blockStun: !!h.blockStun, blockBolt: !!h.blockBolt, caveHealKill: h.caveHealKill || 0, killHeal: h.killHeal || 0, rage: !!h.rage,

  };
}

const GRID = 56, OX = 2200, OY = 1300;

const owned = id => !!S.owned[id];
const lvlOf = id => S.owned[id] === true ? 1 : (S.owned[id] || 0);
const maxed = n => n.max ? lvlOf(n.id) >= n.max : owned(n.id);
const nodeCost = n => n.max ? Math.floor(n.cost * Math.pow(n.cf || 1.4, lvlOf(n.id))) : n.cost;

const visible = n => !n.p || owned(n.p);
const unknown = n => !visible(n) && n.p && visible(NODE[n.p]) && NODE[n.p].p !== undefined && owned(NODE[n.p].p);
function qProg(n){ return Math.min(n.q.goal, Math.floor(S.q[n.q.key] || 0)); }
function checkQuests(){
  const done = [];
  let changed = true;
  while(changed){
    changed = false;
    for(const n of NODES) if(n.t === 'quest' && !owned(n.id) && visible(n) && qProg(n) >= n.q.goal){ S.owned[n.id] = 1; done.push(n); changed = true; }
  }
  if(done.length){ computeMods(); save(); }
  return done;
}

function renderTree(){
  const T = $('#tree');
  let svg = `<svg width="4400" height="2600">`;
  let html = '';
  for(const n of NODES){
    const vis = visible(n), unk = !vis && n.p && visible(NODE[n.p]);
    if(!vis && !unk) continue;
    const px = OX + n.x*GRID, py = OY + n.y*GRID;
    if(n.p){
      const p = NODE[n.p], ax = OX + p.x*GRID, ay = OY + p.y*GRID;

      svg += `<polyline points="${ax},${ay} ${px},${ay} ${px},${py}" fill="none" stroke="${col}" stroke-width="3"/>`;
    }
    if(n.t === 'root'){ html += `<div class="node root" style="left:${px-80}px;top:${py-96}px"><img src="${CAVE_URL}"></div>`; continue; }
    if(unk){ html += `<div class="node unk" style="left:${px-24}px;top:${py-24}px" data-id="${n.id}">?</div>`; continue; }
    const own = owned(n.id), cls = ['node'];
    if(n.t === 'quest'){ cls.push('q'); if(own) cls.push('own'); }
    else if(maxed(n)) cls.push('own');
    else if(n.t === 'hero') cls.push('lock');
    else if(S.kr >= nodeCost(n)) cls.push('buy'); else cls.push(own ? 'own' : 'lock');
    let inner;
    if(n.t === 'hero'){ inner = heroImg(n.hero); if(!own) cls.push('sil'); }
    else if(n.hero) inner = heroImg(n.hero) + `<span class="mk">${n.mark || ''}</span>`;

    if(n.max) inner += `<span class="pg">${lvlOf(n.id)}/${n.max}</span>`;
    html += `<div class="${cls.join(' ')}" style="left:${px-24}px;top:${py-24}px" data-id="${n.id}">${inner}</div>`;

function rollHero(w){
  const tot = w.reduce((a,b) => a+b, 0); let x = Math.random()*tot, ri = 0;
  for(let i = 0; i < 5; i++){ if(x < w[i]){ ri = i; break; } x -= w[i]; }
  const pool = r => HEROES.filter(h => h.r === RORD[r]).map(h => h.id);
  for(let i = ri; i >= 0; i--){ const p = pool(i); if(p.length) return p[Math.floor(Math.random()*p.length)]; }
  for(let i = ri + 1; i < 5; i++){ const p = pool(i); if(p.length) return p[Math.floor(Math.random()*p.length)]; }
  return 'nille';
}
function openPack(p){
  const P = PACKS[p.pid];

  if(p.pid !== 'basis' && MD.extra && Math.random() < MD.extra){ throwPack('basis', 0.2, p); addText(p.x, p.y - 50, 'Beipack!', '#e8d870', 13, 1); }

      if(src.st.reap && Math.random() < src.st.reap && B.units.filter(u => !u.dead && u.id === 'skelett').length < 14){

function hurtQuiet(e, amt, src){
  if(e.dead) return;
  e.hp -= amt; if(src && src.id) stat(src.id).dmg += amt;
  if(e.hp <= 0){ e.hp = 0.0001; hurt(e, 0.001, false, src); }
}
function areaHurt(x, y, rad, amt, slow, src){
  for(const e of B.enemies){ if(e.dead) continue; if(Math.hypot(e.x - x, e.y - y) <= rad + e.r){ hurt(e, amt, false, src); if(slow) applySlow(e, slow, 1.5); } }
}
function applySlow(e, f, dur){ e.slowT = Math.max(e.slowT, dur); e.slowF = Math.min(e.slowF, 1 - f); }
function heroHurt(u, amt, src){
  if(u.dead || u.ultra) return;
  if(u.st.dodge && Math.random() < u.st.dodge){ addText(u.x, u.y - 45, 'Ausgewichen', '#cfe8ff', 11, 0.6); return; }
  if(u.st.block && Math.random() < u.st.block){
    addText(u.x, u.y - 45, 'Block!', '#c8d8ff', 12, 0.6);
    if(u.st.blockStun){ for(const e of B.enemies) if(!e.dead && Math.hypot(e.x - u.x, e.y - u.y) < 70) e.stunT = Math.max(e.stunT, 1); addRing(u.x, u.y - 10, 70, '#c8d8ff', 0.4); }
    if(u.st.blockBolt){ const live = B.enemies.filter(e => !e.dead); if(live.length){ const t = live[Math.floor(Math.random()*live.length)]; hurt(t, unitDmg(u) * 3, false, u); addLine([{x:t.x, y:t.y - 200}, {x:t.x + 10, y:t.y - 120}, {x:t.x - 6, y:t.y - 60}, {x:t.x, y:t.y - t.h/2}], '#fff8a0'); } }
    return;
  }
  amt *= (1 - u.st.armor);
  u.hp -= amt; u.hit = 0.1; stat(u.id).taken += amt;
  if(u.hp <= 0){ u.dead = true; B.fx.push({t:'poof', x:u.x, y:u.y - 20, r:12, life:0.4, max:0.4}); addText(u.x, u.y - 40, '✝', '#ff6b6b', 16, 1); recalcAura(); }
}

/* ---- Helden ---- */
const isWolf = u => u.c.ww && (B.moonOn || u.st.alwaysWolf);
function unitDmg(u){
  let m = (1 + B.aura) * (u.promoted === 2 ? 2.25 : u.promoted ? 1.5 : 1) * (u.toadMul || 1);
  if(isWolf(u)) m *= 2.5 * (B.rudel ? 1 + MD.rudel : 1);
  return u.st.atk * m;
}
function nearest(x, y, maxD, pred){
  let best = null, bd = maxD;
  for(const e of B.enemies){ if(e.dead || (pred && !pred(e))) continue; const d = Math.hypot(e.x - x, e.y - y) - e.r; if(d < bd){ bd = d; best = e; } }
  return best;
}
function rangedFire(u){
  const st = u.st, hx = u.x, hy = u.y - 22, col = u.c.pc || '#fff';
  const tg = B.enemies.filter(e => !e.dead && Math.hypot(e.x-u.x, e.y-u.y) <= st.range + e.r).sort((a,b) => (Math.hypot(a.x-u.x,a.y-u.y) - (Math.hypot(a.x, a.y*1.3) < 110 ? 60 : 0)) - (Math.hypot(b.x-u.x,b.y-u.y) - (Math.hypot(b.x, b.y*1.3) < 110 ? 60 : 0)));
  if(!tg.length) return false;
  u.face = tg[0].x > u.x ? 1 : -1;
  const dmg = unitDmg(u);
  if(u.c.vines && SPR[u.id].hitFrame){
    // Dornen-Ranken-Geschoss aus der Stabspitze, Ranken brechen beim Einschlag aus
    const t = tg[0];
    B.proj.push({x:u.x + u.face*20, y:u.y - 30, t, lx:t.x, ly:t.y - t.h/2, thorn:true, src:u, col:'#9aff4a', trail:[]});
    return true;
  }
  if(u.c.vines){ vineBurst(u, tg[0]); u.anim = 0.15; return true; }
  return rangedRest(u, tg, dmg, hx, hy, col);
}
function vineBurst(u, first){
  const st = u.st, dmg = unitDmg(u);
  {
    let cur = first; const hit = new Set(), pts = [];
    for(let k = 0; k < u.c.vines + (st.multi - 1) && cur; k++){
      hit.add(cur); pts.push({x:cur.x, y:cur.y});
      const crit = Math.random() < st.crit; hurt(cur, dmg * (k ? 0.8 : 1) * (crit ? 2 : 1), crit, u);
      if(st.slow) applySlow(cur, st.slow, 2); onHitFx(u, cur);
      cur = nearest(cur.x, cur.y, 80, e => !hit.has(e));
    }
    B.fx.push({t:'vine', sx:pts[0].x, sy:pts[0].y, pts, life:0.7, max:0.7, seed:Math.random()*9});
  }
}
function rangedRest(u, tg, dmg, hx, hy, col){
  const st = u.st;
  if(st.chain){
    for(let c = 0; c < Math.min(st.multi, tg.length); c++){
      let cur = tg[c]; const pts = [{x:hx, y:hy}], hit = new Set();
      for(let k = 0; k <= st.chain && cur; k++){
        pts.push({x:cur.x, y:cur.y - cur.h/2}); hit.add(cur);
        const crit = Math.random() < st.crit;
        hurt(cur, dmg * (k ? 0.75 : 1) * (crit ? 2 : 1), crit, u); onHitFx(u, cur);
        cur = nearest(cur.x, cur.y, 90, e => !hit.has(e));
      }
      addLine(pts, col);
    }
  } else {
    const n = Math.min(st.multi, tg.length);
    for(let k = 0; k < n; k++){ const t = tg[k], crit = Math.random() < st.crit; B.proj.push({x:hx, y:hy, t, lx:t.x, ly:t.y - t.h/2, dmg:dmg * (crit ? 2 : 1), crit, splash:st.splash, slow:st.slow, col, src:u, trail:[]}); }
  }
  u.anim = 0.15;
  return true;
}
function swingDur(u, sp){ return Array.isArray(sp.hitFrame) ? Math.min(u.st.cd * 3.6, 2.4) : Math.min(u.st.cd, 1.3); }
function meleeHit(u){
  const st = u.st, reach = st.range + (isWolf(u) ? 6 : 0);
  const tg = B.enemies.filter(e => !e.dead && Math.hypot(e.x-u.x, e.y-u.y) <= reach + e.r + 4).sort((a,b) => Math.hypot(a.x-u.x,a.y-u.y) - Math.hypot(b.x-u.x,b.y-u.y));
  if(!tg.length) return false;
  let comboMul = 1;
  if(u.id === 'foku'){ u.combo = ((u.combo || 0) + 1) % 3; if(u.combo === 0) comboMul = 1.6; u.punchSide = u.combo === 1 ? -1 : 1; }
  const dmg = unitDmg(u) * comboMul, splash = st.splash + (isWolf(u) && u.c.wolfSplash ? u.c.wolfSplash : 0);
  if(u.id === 'foku'){
    const t0 = tg[0], px = t0.x - Math.sign(t0.x - u.x || 1) * t0.r * 0.5, py = t0.y - t0.h * 0.5;
    sparks(px, py, comboMul > 1 ? 16 : 8, comboMul > 1 ? 1.6 : 1);
    if(comboMul > 1){
      // Finisher: Schallwelle stößt Gegner zurück
      addRing(px, py, 26, '#a8e0ff', 0.3); addRing(px, py, 14, '#ffffff', 0.2);
      for(const e of B.enemies){ if(e.dead || Math.hypot(e.x - t0.x, e.y - t0.y) > 34 + e.r) continue;
        const dx = e.x - u.x, dy = e.y - u.y, d = Math.hypot(dx, dy) || 1, kb = e.boss ? 4 : 22;
        e.x += dx/d*kb; e.y += dy/d*kb; e.stunT = Math.max(e.stunT, e.boss ? 0 : 0.25); }
    }
  }
  if(isWolf(u)){
    // Klauenhieb: trifft bis zu 4 Gegner im Bogen vor dem Wolf
    const f = Math.sign(tg[0].x - u.x) || u.face; u.face = f;
    const cx = u.x + f * 22, cy = u.y;
    const hit = B.enemies.filter(e => !e.dead && Math.hypot(e.x - cx, (e.y - cy) * 1.2) <= 46 + e.r && (e.x - u.x) * f > -12)
      .sort((a,b) => Math.hypot(a.x-u.x,a.y-u.y) - Math.hypot(b.x-u.x,b.y-u.y)).slice(0, 4 + (st.multi > 1 ? st.multi - 1 : 0));
    if(!hit.includes(tg[0])) hit[0] = tg[0];
    for(const t of hit){
      const crit = Math.random() < st.crit, d = dmg * (crit ? 2 : 1);
      if(splash){ areaHurt(t.x, t.y, splash, d * 0.5, st.slow, u); }
      hurt(t, d, crit, u); onHitFx(u, t);
    }
    B.fx.push({t:'claw', x:cx, y:cy - 18, face:f, life:0.22, max:0.22});
    u.anim = 0.18; u.killedNow = false;
    return true;
  }
  const n = Math.min(st.multi, tg.length);
  for(let k = 0; k < n; k++){
    const t = tg[k], crit = Math.random() < st.crit, d = dmg * (crit ? 2 : 1);
    if(splash){ areaHurt(t.x, t.y, splash, d, st.slow, u); addRing(t.x, t.y - 6, splash, '#e8e0c8', 0.25); }
    else { hurt(t, d, crit, u); if(st.slow) applySlow(t, st.slow, 1.5); }
    onHitFx(u, t);
    addSlash(t.x, t.y - t.h/2, u.face);
  }
  u.anim = 0.18;
  // Mönch-Sprints
  let sprints = st.sprint + (u.killedNow && st.sprintKill ? st.sprintKill : 0);
  u.killedNow = false;
  let last = tg[0];
  while(sprints-- > 0){
    const nx = nearest(u.x, u.y, 110, e => e !== last);
    if(!nx) break;
    const ox = u.x, oy = u.y; u.x = nx.x - Math.sign(nx.x - u.x || 1) * (nx.r + 8); u.y = nx.y;
    B.fx.push({t:'dash', x1:ox, y1:oy - 20, x2:u.x, y2:u.y - 20, life:0.2, max:0.2});
    const crit = Math.random() < st.crit; hurt(nx, dmg * (crit ? 2 : 1), crit, u); addSlash(nx.x, nx.y - nx.h/2, u.face);
    if(u.killedNow && st.sprintKill){ sprints += st.sprintKill; u.killedNow = false; }
    last = nx;
  }
  return true;
}
function onHitFx(u, t){
  if(!u || u === 'mouse' || t.dead) return;
  if(u.st.root && Math.random() < u.st.root){ t.stunT = Math.max(t.stunT, 1); }
  if(u.st.poison){ t.poison = {dps:u.st.poison * (1 + MD.allDmg), t:3, src:u}; }
  if(u.st.bleed){ t.bleeds = (t.bleeds || []).filter(b => b.t > 0); if(t.bleeds.length < 5) t.bleeds.push({dps:t.max * u.st.bleed * (t.boss ? 0.25 : 1) / 2.5, t:2.5, src:u}); }
}

/* ---- Update ---- */
function update(dt){
  B.t += dt;
  if(B.flashShiny) B.flashShiny = Math.max(0, B.flashShiny - dt);
  if(B.held){ B.holdT -= dt; if(B.holdT <= 0){ collectAt(mouse.x, mouse.y); doClick(mouse.x, mouse.y); B.holdT = 1 / MD.crate; } }
  if(MD.regen) B.hp = Math.min(B.maxHp, B.hp + MD.regen*dt);

  // Vollmond
  const wolves = B.units.some(u => !u.dead && u.c.ww);
  const dur = MOON_DUR + MD.moon, ph = B.t % MOON_PERIOD, on = wolves && B.t > 5 && ph >= MOON_PERIOD - dur;
  if(on && !B.moonOn) addText(0, -160, '🌕 VOLLMOND! 🌕', '#e8e8ff', 26, 2);
  B.moonOn = on;

  // Gebäude
  for(const b of B.blds){
    const Bd = BUILDINGS[b.id]; b.t += dt * (1 + MD.bspeed);
    const every = Bd.every - (b.id === 'taverne' ? MD.tavFast : 0);
    if(b.t >= every){
      b.t = 0;
      if(b.id === 'hof'){ const u = spawnUnit('nille', Bd.x, Bd.y + 20, Math.random() < SHINY_CHANCE, false); addText(Bd.x, Bd.y - 40, 'Nille!', '#e8d870', 13, 1); u.hx = Bd.x * 0.6; u.hy = Bd.y * 0.6 + 30; }
      if(b.id === 'taverne'){ throwPack('basis', 0, Bd); if(Math.random() < MD.tavDbl) throwPack('basis', 0.3, Bd); }
      if(b.id === 'kaserne') throwPack(Math.random() < MD.kasBox ? 'box' : 'gross', 0, Bd);
    }
  }

  // Pakete fliegen
  for(const p of B.packs){
    if(p.t < p.dur){ p.t += dt; const k = Math.max(0, Math.min(1, p.t / p.dur)); p.x = p.sx + (p.tx - p.sx)*k; p.y = p.sy + (p.ty - p.sy)*k - Math.sin(Math.PI*k)*90; }
    else { p.x = p.tx; p.y = p.ty; }
    if(p.wob) p.wob = Math.max(0, p.wob - dt);
  }

  // Spawnen
  if(!B.bossSpawned && B.t >= DIFF.bossT[B.ch-1]){ B.bossSpawned = true; spawnEnemy(true); }
  B.spawnT -= dt;
  if(B.spawnT <= 0){
    spawnEnemy(false);
    if(B.t > 60 && Math.random() < 0.3) spawnEnemy(false);
    B.spawnT = Math.max(DIFF.spawnMin, DIFF.spawnStart - B.t*DIFF.spawnRamp) / DIFF.chSpawn[B.ch-1];
  }

  // Helden
  for(const u of B.units){
    if(u.dead) continue;
    u.anim = Math.max(0, u.anim - dt); u.hit = Math.max(0, u.hit - dt); u.moving = false;
    const st = u.st, wolf = isWolf(u), sp = st.ms * (wolf ? 2 : 1);
    if(st.heal){ for(const o of B.units) if(!o.dead && o !== u && Math.hypot(o.x-u.x, o.y-u.y) < 120) o.hp = Math.min(o.max, o.hp + st.heal*dt); }
    if(st.healCave) B.hp = Math.min(B.maxHp, B.hp + st.healCave*dt);
    u.cd -= dt * (wolf ? 1.25 : 1) * (st.rage ? 2 - u.hp / u.max : 1);
    if(st.summon){
      u.toads = (u.toads || []).filter(t => !t.dead);
      u.sumT = (u.sumT === undefined ? 1 : u.sumT) - dt;
      if(u.sumT <= 0 && u.toads.length < st.summon.max){
        u.sumT = st.summon.every;
        const a = Math.random()*Math.PI*2, tx = u.x + Math.cos(a)*30, ty = u.y + Math.sin(a)*20;
        const t = spawnUnit('kroete', tx, ty, false, false);
        const own = (u.st.hp / u.c.hp) / (1 + MD.allHp), owd = (u.st.atk / u.c.atk) / (1 + MD.allDmg);
        t.max *= (1 + st.toadHp) * own; t.hp = t.max; t.toadMul = (1 + st.toadDmg) * owd; t.hx = tx; t.hy = ty; t.owner = u;
        u.toads.push(t); B.fx.push({t:'poof', x:tx, y:ty - 8, r:6, life:0.3, max:0.3});
      }
    }
    const moveTo = (tx, ty, s) => { const dx = tx - u.x, dy = ty - u.y, d = Math.hypot(dx, dy); if(d > 2){ const m = Math.min(d, s*dt); u.x += dx/d*m; u.y += dy/d*m; u.moving = true; if(Math.abs(dx) > 1) u.face = dx > 0 ? 1 : -1; } };
    if(u.c.melee || u.berserk){
      u.retT = (u.retT || 0) - dt;
      if(!u.tgt || u.tgt.dead || u.retT <= 0){
        u.retT = 0.35;
        let best = null, bs = 1e9, cur = 1e9;
        for(const e of B.enemies){
          if(e.dead) continue;
          const dh = Math.hypot(e.x - u.x, e.y - u.y), dHome = Math.hypot(e.x - u.hx, e.y - u.hy), dCave = Math.hypot(e.x, e.y * 1.3);
          if(dHome > 210 && dCave > 140) continue;
          const crowd = (e.claims || 0) - (u.tgt === e ? 1 : 0);
          const sc = dh + crowd * 45 - (dCave < 120 ? 70 : 0) + (e.boss ? -30 : 0);
          if(e === u.tgt) cur = sc;
          if(sc < bs){ bs = sc; best = e; }
        }
        if(u.tgt && !u.tgt.dead && cur < 1e9 && bs > cur - 25) best = u.tgt;
        if(u.tgt && u.tgt !== best) u.tgt.claims = Math.max(0, (u.tgt.claims || 0) - 1);
        if(best && best !== u.tgt) best.claims = (best.claims || 0) + 1;
        u.tgt = best;
      }
      if(u.ultra){
        const U = u.ultra; U.t -= dt; u.moving = false;
        if(U.t <= 0){
          if(!U.hit) U.hit = new Set();
          // zufälliges Ziel irgendwo auf dem Feld, bevorzugt noch nicht getroffene
          let pool = B.enemies.filter(e => !e.dead && !U.hit.has(e) && Math.abs(e.x) < SPW/2 + 20 && Math.abs(e.y) < SPH/2 + 20);
          if(!pool.length) pool = B.enemies.filter(e => !e.dead && e !== U.last);
          const nx = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
          if(!nx || U.n <= 0){ u.ultra = null; u.cd = 0.3; if(U.ox !== undefined){ B.fx.push({t:'dash', x1:u.x, y1:u.y - 20, x2:U.ox, y2:U.oy - 20, life:0.25, max:0.25, blue:true}); u.x = U.ox; u.y = U.oy; } continue; }
          if(U.ox === undefined){ U.ox = u.x; U.oy = u.y; }
          const ox = u.x, oy = u.y; u.x = nx.x - Math.sign(nx.x - u.x || 1) * (nx.r + 8); u.y = nx.y; u.face = nx.x > u.x ? 1 : -1;
          B.fx.push({t:'dash', x1:ox, y1:oy - 20, x2:u.x, y2:u.y - 20, life:0.25, max:0.25, blue:true});
          B.fx.push({t:'ghost', id:u.id, x:ox, y:oy, face:u.face, life:0.25, max:0.25});
          const crit = Math.random() < st.crit; hurt(nx, unitDmg(u) * 2.5 * (crit ? 2 : 1), crit, u);
          sparks(nx.x, nx.y - nx.h/2, 14, 1.5); addRing(nx.x, nx.y - nx.h/2, 20, '#a8e0ff', 0.25);
          if(!nx.dead && !nx.boss){ nx.stunT = Math.max(nx.stunT, 0.4); }
          U.last = nx; U.hit.add(nx); U.n--; U.t = 0.08; B.shake = Math.max(B.shake || 0, 0.06);
        }
        continue;
      }
      const swSp = !u.berserk && !isWolf(u) && SPR[u.id] && SPR[u.id].hitFrame ? SPR[u.id] : null;
      if(swSp && u.swing >= 0){
        // Schwung läuft: stehen bleiben, Treffer im Einschlag-Frame
        const dur = swingDur(u, swSp), hfs = Array.isArray(swSp.hitFrame) ? swSp.hitFrame : [swSp.hitFrame], before = u.swing;
        u.swing += dt;
        hfs.forEach((h, k) => { const hitT = dur * h / swSp.nFrames; if(before < hitT && u.swing >= hitT){ if(hfs.length > 1) u.combo = k; meleeHit(u); } });
        if(u.swing >= dur) u.swing = -1;
        continue;
      }
      if(u.tgt){
        const d = Math.hypot(u.tgt.x - u.x, u.tgt.y - u.y), reach = st.range + u.tgt.r;
        if(swSp && d <= reach){ u.face = u.tgt.x > u.x ? 1 : -1; if(u.cd <= 0){ u.swing = 0; u.cd = Array.isArray(swSp.hitFrame) ? swingDur(u, swSp) + st.cd * 0.6 : st.cd; } continue; }
        if(d > reach) moveTo(u.tgt.x - Math.sign(u.tgt.x - u.x)*reach*0.7, u.tgt.y, sp);
        else { u.face = u.tgt.x > u.x ? 1 : -1; if(u.cd <= 0 && meleeHit(u)) u.cd = st.cd * (u.id === 'foku' && u.combo === 0 ? 1.6 : 1); }
      } else moveTo(u.hx, u.hy, sp * 0.7);
    } else {
      const csp = !u.berserk && SPR[u.id] && SPR[u.id].hitFrame ? SPR[u.id] : null;
      if(csp){
        // Zauber mit Animation: Abschuss im Leucht-Frame
        if(u.swing >= 0){
          const dur = Math.min(st.cd, 1.3), hitT = dur * csp.hitFrame / csp.nFrames, before = u.swing;
          u.swing += dt;
          if(before < hitT && u.swing >= hitT) rangedFire(u);
          if(u.swing >= dur) u.swing = -1;
          continue;
        }
        moveTo(u.hx, u.hy, sp);
        if(u.cd <= 0){ const t = B.enemies.find(e => !e.dead && Math.hypot(e.x-u.x, e.y-u.y) <= st.range + e.r); if(t){ u.face = t.x > u.x ? 1 : -1; u.swing = 0; u.cd = st.cd; } else u.cd = 0.05; }
        continue;
      }
      moveTo(u.hx, u.hy, sp);
      if(u.fireT > 0) u.fireT -= dt;
      if(u.cd < 0.6) u.aiming = B.enemies.some(e => !e.dead && Math.hypot(e.x-u.x, e.y-u.y) <= st.range + e.r);
      if(u.cd <= 0) u.cd = rangedFire(u) ? (u.fireT = 0.3, st.cd) : 0.05;
    }
  }

  // Helden halten Abstand
  const hl = B.units.filter(u => !u.dead);
  for(let i = 0; i < hl.length; i++) for(let j = i+1; j < hl.length; j++){
    const a = hl[i], b = hl[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), mn = 22;
    if(d > 0 && d < mn){ const p = (mn - d) / 2, ux = dx/d, uy = dy/d; a.x -= ux*p; a.y -= uy*p; b.x += ux*p; b.y += uy*p; }
  }
  // Geschosse
  for(const p of B.proj){
    if(p.t && !p.t.dead){ p.lx = p.t.x; p.ly = p.t.y - p.t.h/2; }
    const dx = p.lx - p.x, dy = p.ly - p.y, d = Math.hypot(dx, dy), sp = 420*dt;
    p.trail.push({x:p.x, y:p.y}); if(p.trail.length > 4) p.trail.shift();
    if(d <= sp + 4){
      p.done = true;
      if(p.thorn){ const f = p.t && !p.t.dead ? p.t : nearest(p.lx, p.ly + 8, 40); if(f && !p.src.dead) vineBurst(p.src, f); addRing(p.lx, p.ly + 8, 14, '#9aff4a', 0.3); }

    if(e.bleeds && e.bleeds.length){ for(const b of e.bleeds){ if(b.t > 0){ b.t -= dt; hurtQuiet(e, b.dps * dt, b.src); } } if(e.dead) continue; }

    const a = live[i], b = live[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = (a.r + b.r) * 0.9;

  }
  B.enemies = B.enemies.filter(e => !e.dead);
  if(B.units.length > 60) B.units = B.units.filter(u => !u.dead);
  if(B.shake) B.shake = Math.max(0, B.shake - dt);

  if(B.hp <= 0){ B.hp = 0; endFight(false); }
}

  function drawMixed(ctx, t, x, y, stroke){
    const fs = parseFloat((ctx.font.match(/([\d.]+)px/) || [0, 14])[1]), es = Math.round(fs * 1.0);
    const parts = split(t), widths = parts.map(p => typeof p === 'string' ? ctx.measureText(p).width : es + 2), total = widths.reduce((a, b) => a + b, 0);
    let cx = ctx.textAlign === 'center' ? x - total/2 : (ctx.textAlign === 'right' || ctx.textAlign === 'end') ? x - total : x;
    const align = ctx.textAlign; ctx.textAlign = 'left';
    const bl = ctx.textBaseline, iy = bl === 'middle' ? y - es/2 : bl === 'top' ? y : bl === 'bottom' ? y - es : y - es*0.82;
    parts.forEach((p, i) => {
      if(typeof p === 'string') (stroke ? oStroke : oFill).call(ctx, p, cx, y);
      else if(!stroke){ const sm = ctx.imageSmoothingEnabled; ctx.imageSmoothingEnabled = false; ctx.drawImage(icon(p.e).c, Math.round(cx + 1), Math.round(iy), es, es); ctx.imageSmoothingEnabled = sm; }
      cx += widths[i];
    });
    ctx.textAlign = align;
  }
  P.fillText = function(t, x, y, mw){ t = String(t); EMO.lastIndex = 0; if(!EMO.test(t)) return oFill.call(this, t, x, y, mw); drawMixed(this, t, x, y, false); };
  P.strokeText = function(t, x, y, mw){ t = String(t); EMO.lastIndex = 0; if(!EMO.test(t)) return oStroke.call(this, t, x, y, mw); drawMixed(this, t, x, y, true); };
})();

/* ===================== SOUND & MUSIK =====================
   Komplett eigenständig: hängt sich nur von außen an bestehende Funktionen.
   Zum Entfernen einfach diese Datei aus build6.sh nehmen. */
(function(){
  let AC = null, master, sfxG, musG;
  let mode = 0; // 0 = alles an, 1 = nur Effekte, 2 = stumm
  try{ mode = +(localStorage.getItem('kh_sound') || 0); }catch(e){}
  const last = {};

  function init(){
    if(AC) { if(AC.state === 'suspended') AC.resume(); return; }
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    sfxG = AC.createGain(); sfxG.connect(master);
    musG = AC.createGain(); musG.connect(master);
    applyMode();
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    startMusic();
  }
  // V = gemeinsame Lautstärke aller Bubatzbande-Spiele (0..1, 0,5 = Standard)
  let V = {m:.5, s:.5}; try{ if(window.BB && BB.vol) V = BB.vol(); }catch(e){}
  window.addEventListener('bb-vol', e => { if(e.detail){ V = e.detail; applyMode(); } });
  function applyMode(){
    if(!AC) return;
    sfxG.gain.value = mode < 2 ? 4 * V.s * V.s : 0;
    musG.gain.value = mode === 0 ? 0.32 * 4 * V.m * V.m : 0;
  }
  let noiseBuf = null;
  ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, init, {capture:true}));

  // Throttle: gleicher Sound nicht öfter als alle "gap" Sekunden
  function ok(key, gap){ if(!AC || mode === 2 || V.s <= 0) return false; const t = AC.currentTime; if(last[key] && t - last[key] < gap) return false; last[key] = t; return true; }

  function tone(f, dur, type='square', vol=0.15, f2=null, delay=0, out=sfxG){
    if(!AC || mode === 2) return;
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol=0.2, ff=2000, ftype='bandpass', ff2=null, delay=0, out=sfxG, q=1){
    if(!AC || mode === 2) return;
    const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = ftype; f.Q.value = q; f.frequency.setValueAtTime(ff, t); if(ff2) f.frequency.exponentialRampToValueAtTime(ff2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random()*0.5); s.stop(t + dur + 0.02);
  }
  const N = n => 440 * Math.pow(2, (n - 69) / 12); // MIDI -> Hz
  const rnd = (a, b) => a + Math.random()*(b - a);

  const SND = {
    click(){ if(!ok('click', 0.05)) return; noise(0.05, 0.12, 3000, 'highpass'); tone(rnd(260,320), 0.06, 'square', 0.05, 110); },
    packHit(){ if(!ok('ph', 0.04)) return; tone(rnd(480,560), 0.06, 'triangle', 0.12, 300); noise(0.06, 0.12, 1400, 'bandpass'); },
    packOpen(pid){ if(!ok('po', 0.05)) return;
      tone(180, 0.12, 'square', 0.12, 900); noise(0.15, 0.15, 4000, 'highpass');
      const n = pid === 'box' ? 5 : pid === 'gross' ? 4 : 3;
      for(let i = 0; i < n; i++) tone(N(84 + [0,4,7,12,16][i]), 0.12, 'sine', 0.07, null, 0.06 + i*0.05); },
    reveal(r){ if(!ok('rv', 0.08)) return;
      const i = RORD.indexOf(r), base = 67 + i*2, sc = [0,4,7,12,16,19];
      for(let k = 0; k < i + 2; k++) tone(N(base + sc[k]), 0.16, i >= 3 ? 'square' : 'triangle', 0.06 + i*0.015, null, k*0.07);
      if(i >= 4){ [0,4,7].forEach(s => tone(N(72 + s), 0.6, 'square', 0.05, null, 0.42)); tone(N(84), 0.7, 'sawtooth', 0.03, null, 0.42); } },
    shiny(){ if(!ok('sh', 0.3)) return;
      [0,2,4,7,9,12,14,16,19,21,24].forEach((s, k) => tone(N(79 + s), 0.3, 'sine', 0.07, null, k*0.05));
      noise(1.2, 0.05, 8000, 'highpass', null, 0.1); },
    swish(heavy){ if(!ok(heavy ? 'swh' : 'sw', 0.06)) return;
      if(heavy){ noise(0.22, 0.2, 400, 'bandpass', 1600, 0, sfxG, 2); tone(110, 0.15, 'sine', 0.1, 50, 0.08); }
      else noise(0.11, 0.14, 1200, 'bandpass', 3500, 0, sfxG, 2); },
    claw(){ if(!ok('claw', 0.08)) return; for(let k = 0; k < 3; k++) noise(0.08, 0.16, 1800, 'bandpass', 4500, k*0.035, sfxG, 3); tone(90, 0.12, 'sawtooth', 0.05, 60); },
    shoot(id){ if(!ok('sh_' + id, 0.07)) return;
      if(id === 'marwin'){ tone(900, 0.08, 'triangle', 0.1, 260); noise(0.12, 0.07, 2500, 'bandpass', 900); }
      else if(id === 'kobold'){ noise(0.16, 0.13, 700, 'bandpass', 2200, 0, sfxG, 2); }
      else if(id === 'molde'){ tone(1400, 0.18, 'sawtooth', 0.06, 180); tone(1700, 0.12, 'square', 0.04, 300, 0.02); noise(0.2, 0.1, 5000, 'highpass'); }
      else if(id === 'lg3'){ tone(300, 0.2, 'sine', 0.1, 900); noise(0.25, 0.08, 900, 'lowpass', 300); }
      else if(id === 'kraeuter'){ tone(220, 0.14, 'sine', 0.12, 520); }
      else tone(600, 0.08, 'triangle', 0.08, 300); },
    die(boss){
      if(boss){ noise(1.4, 0.35, 900, 'lowpass', 60); tone(130, 1.2, 'sawtooth', 0.15, 35); [0,4,7,12].forEach((s, k) => tone(N(72 + s), 0.3, 'square', 0.06, null, 0.6 + k*0.1)); return; }
      if(!ok('die', 0.05)) return; const f = rnd(650, 900); tone(f, 0.05, 'square', 0.07, f*1.5); tone(f*1.2, 0.08, 'square', 0.05, f*0.6, 0.05); },
    heroHurt(){ if(!ok('hh', 0.09)) return; tone(170, 0.09, 'sine', 0.12, 60); },
    cave(){ if(!ok('cave', 0.18)) return; noise(0.3, 0.3, 260, 'lowpass', 80); tone(75, 0.3, 'sine', 0.2, 38); },
    moon(){ if(!AC || mode === 2) return;
      const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(), v = AC.createOscillator(), vg = AC.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(330, t); o.frequency.linearRampToValueAtTime(620, t + 0.5); o.frequency.linearRampToValueAtTime(560, t + 1.4); o.frequency.linearRampToValueAtTime(380, t + 2);
      v.frequency.value = 6; vg.gain.value = 12; v.connect(vg); vg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.13, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.1);
      o.connect(g); g.connect(sfxG); o.start(t); v.start(t); o.stop(t + 2.2); v.stop(t + 2.2);
      noise(2.2, 0.08, 500, 'bandpass', 1500, 0, sfxG, 0.7); },
    boss(){ if(!AC || mode === 2) return;
      for(let k = 0; k < 3; k++){ tone(60, 0.45, 'sine', 0.35, 30, k*0.55); noise(0.4, 0.25, 200, 'lowpass', 60, k*0.55); }
      tone(70, 1.6, 'sawtooth', 0.14, 45, 1.6); noise(1.6, 0.18, 300, 'bandpass', 900, 1.6, sfxG, 2); },
    win(){ [60,64,67,72,67,72].forEach((n, k) => tone(N(n + 12), k === 5 ? 0.6 : 0.16, 'square', 0.08, null, k*0.13)); },
    lose(){ [69,65,62,57].forEach((n, k) => tone(N(n), k === 3 ? 0.8 : 0.25, 'triangle', 0.12, null, k*0.22)); },
    coin(){ if(!ok('coin', 0.05)) return; tone(1320, 0.07, 'square', 0.06); tone(1760, 0.18, 'square', 0.06, null, 0.06); },
    reroll(){ if(!ok('rr', 0.05)) return; for(let k = 0; k < 4; k++) noise(0.05, 0.1, 2500, 'bandpass', null, k*0.04, sfxG, 3); tone(500, 0.1, 'triangle', 0.06, 900, 0.16); },
    upgrade(){ [0,4,7,12].forEach((s, k) => tone(N(76 + s), 0.18, 'triangle', 0.09, null, k*0.06)); tone(N(88), 0.4, 'sine', 0.06, null, 0.26); }
  };
  window.SND = SND;

  /* ---------- Musik (Schrittsequenzer) ---------- */
  let musT = 0, step = 0, track = 'hub';
  // Hub: ruhige Höhle in a-Moll (Am F C G), Kampf: treibend, Boss: härter
  const PROG = [[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
  function startMusic(){ musT = AC.currentTime + 0.1; setInterval(schedule, 50); }
  function schedule(){
    if(!AC || mode !== 0) { if(AC) musT = AC.currentTime + 0.1; return; }
    const fight = typeof B !== 'undefined' && B && !B.over && document.getElementById('battle') && getComputedStyle(document.getElementById('battle')).display !== 'none';
    track = fight ? (B.boss && !B.boss.dead ? 'boss' : 'fight') : 'hub';
    const bpm = track === 'hub' ? 76 : track === 'fight' ? 128 : 140, st = 60 / bpm / 2;
    while(musT < AC.currentTime + 0.25){ playStep(step, musT, st); musT += st; step++; }
  }
  function at(f, t, dur, type, vol){
    const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musG); o.start(t); o.stop(t + dur + 0.02);
  }
  function kick(t){ const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12); g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15); o.connect(g); g.connect(musG); o.start(t); o.stop(t + 0.16); }
  function hat(t, v, dur=0.04){ const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f); f.connect(g); g.connect(musG); s.start(t, Math.random()*0.5); s.stop(t + dur + 0.01); }
  function snare(t){ hat(t, 0.25, 0.12); const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 190; g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08); o.connect(g); g.connect(musG); o.start(t); o.stop(t + 0.1); }
  function playStep(i, t, st){
    const bar = Math.floor(i / 8) % 4, s = i % 8, ch = PROG[bar];
    if(track === 'hub'){
      if(s === 0){ at(N(ch[0] - 24), t, st*7, 'sine', 0.35); ch.forEach(n => at(N(n), t, st*7.5, 'triangle', 0.05)); }
      const arp = [0,1,2,1,2,1,0,2][s]; if(s % 2 === 0 || Math.random() < 0.3) at(N(ch[arp] + 12), t, st*1.6, 'sine', 0.07);
      if(s === 4 && Math.random() < 0.5) at(N(ch[2] + 24), t, st*3, 'sine', 0.03);
    } else {
      const boss = track === 'boss';
      if(s % 4 === 0 || (boss && s === 6)) kick(t);
      if(s === 4) snare(t);
      hat(t, s % 2 ? 0.05 : 0.09);
      const bass = [0,0,12,0,0,10,0,7][s]; at(N(ch[0] - 24 + bass), t, st*0.9, boss ? 'sawtooth' : 'square', boss ? 0.11 : 0.09);
      if(s % 2 === 0) at(N(ch[[0,1,2,1][s/2]] + 12), t, st*0.8, 'square', 0.035);
      if(boss && s === 0) at(N(ch[0]), t, st*7, 'sawtooth', 0.04);
    }
  }

  /* ---------- Knopf ---------- */
  const btn = document.createElement('button');
  btn.id = 'sndbtn'; btn.title = 'Sound: alles an / nur Effekte / stumm';
  btn.style.cssText = 'position:fixed;left:392px;bottom:10px;z-index:9999;font:22px VT323,monospace;background:#1e2a1e;color:#e8e0c8;border:2px solid #5a6a4a;padding:2px 8px;cursor:pointer;opacity:.85';
  const lbl = () => btn.textContent = ['🔊 🎵', '🔊', '🔇'][mode];
  lbl();
  btn.onclick = e => { e.stopPropagation(); init(); mode = (mode + 1) % 3; try{ localStorage.setItem('kh_sound', mode); }catch(_){} applyMode(); lbl(); };
  document.body.appendChild(btn);

  /* ---------- Einhängen ---------- */
  const wrap = (name, fn) => { const orig = window[name]; if(typeof orig !== 'function') return; window[name] = fn(orig); };
  wrap('doClick', o => function(x, y){ const l = B.lastClick; const r = o.apply(this, arguments); if(B.lastClick !== l) SND.click(); return r; });
  wrap('collectAt', o => function(){ const h = B.packs.reduce((a, p) => a + (p.done ? 0 : p.hits), 0); const r = o.apply(this, arguments); const h2 = B.packs.reduce((a, p) => a + (p.done ? 0 : p.hits), 0); if(h2 < h) SND.packHit(); return r; });
  wrap('openPack', o => function(p){ SND.packOpen(p.pid); return o.apply(this, arguments); });
  wrap('spawnUnit', o => function(id, x, y, shiny, reveal){ const u = o.apply(this, arguments); if(reveal){ if(shiny) SND.shiny(); else SND.reveal(HERO[id].r); } return u; });
  wrap('meleeHit', o => function(u){ const r = o.apply(this, arguments); if(r){ if(isWolf(u)) SND.claw(); else SND.swish(u.berserk || ['dino','geist','don'].includes(u.id)); } return r; });
  wrap('rangedFire', o => function(u){ const r = o.apply(this, arguments); if(r) SND.shoot(u.id); return r; });
  wrap('hurt', o => function(e){ const was = e.dead; const r = o.apply(this, arguments); if(!was && e.dead) SND.die(e.boss); return r; });
  wrap('heroHurt', o => function(){ SND.heroHurt(); return o.apply(this, arguments); });
  wrap('update', o => function(){
    const hp = B.hp, moon = B.moonOn, boss = B.bossSpawned;
    const r = o.apply(this, arguments);
    if(B.hp < hp - 0.5) SND.cave();
    if(B.moonOn && !moon) SND.moon();
    if(B.bossSpawned && !boss) SND.boss();
    return r; });
  wrap('endFight', o => function(win){ const was = B.over; const r = o.apply(this, arguments); if(!was) (win ? SND.win : SND.lose)(); return r; });
  wrap('renderShop', o => function(){ const D = S.day, c = D && D.coins, off = D && D.offers, fr = D && D.free;
    const r = o.apply(this, arguments);
    if(D && wrap.seen){ if(S.day.offers !== off && (S.day.coins < c || S.day.free < fr)) SND.reroll(); else if(S.day.coins < c) SND.coin(); }
    wrap.seen = true; return r; });
  wrap('buyNode', o => function(){ const k = S.kr; const r = o.apply(this, arguments); if(S.kr < k) SND.upgrade(); return r; });
})();
