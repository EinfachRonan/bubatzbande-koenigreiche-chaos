<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bandenhof · Bubatzbande</title>
<meta name="theme-color" content="#070a05">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--txt:#f1e6c8;--mut:#a99d7e;--gold:#d4af37;--gold2:#f0d37a;--line:#7a6128;--g1:#3e7530;--g2:#1c3f15}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#070a05;color:var(--txt);font:15px/1.4 Georgia,serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
.c{font-family:"Cinzel",Georgia,serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.left{display:flex;flex-direction:column;flex:1;min-height:0}
/* Kopf */
.hud{position:relative;z-index:4;background:linear-gradient(rgba(25,34,15,.98),rgba(11,17,8,.97));border-bottom:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.6);padding:max(6px,env(safe-area-inset-top)) 10px 7px}
.row1{display:flex;align-items:center;gap:8px}
.ib{flex:none;color:var(--gold2);text-decoration:none;background:linear-gradient(#1f2c19,#0f170c);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:800 14px "Cinzel",serif}
.gold{flex:1;min-width:0;line-height:1.05}
.gold b{display:block;font:900 23px "Cinzel",serif;color:#ffe9a0;text-shadow:0 0 14px rgba(240,200,90,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gold small{font-size:11.5px;color:#9fe36a;white-space:nowrap}
.lvl{flex:none;display:flex;align-items:center;gap:6px;padding:4px 9px 4px 5px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid #8a6d32;cursor:pointer}
.lvl .ring{position:relative;width:30px;height:30px}
.lvl svg{width:30px;height:30px;transform:rotate(-90deg)}
.lvl .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 13px "Cinzel",serif;color:#fff3c4}
.lvl span{font:800 11.5px "Cinzel",serif;color:var(--gold2);line-height:1.1}
.row2{display:flex;gap:6px;margin-top:6px}
.chipr{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 6px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid #3a3418;font:800 14px "Cinzel",serif;color:#fff3c4;white-space:nowrap}
.chipr i{font-style:normal}
.chipr.full{border-color:#c0562a;background:rgba(120,30,10,.35)}
.chipr.full::after{content:"voll";font:700 10px Georgia,serif;color:#ff9a7a}
/* Szene */
.scene{position:relative;flex:1;min-height:200px;touch-action:none;cursor:grab;overflow:hidden;border-bottom:1px solid var(--gold)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hintp{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);max-width:94%;padding:5px 12px;border-radius:99px;background:rgba(8,12,6,.82);border:1px solid #8a6d32;font-size:12.5px;color:#e2d2ad;pointer-events:none;transition:opacity .8s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.festbar{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);padding:5px 14px;border-radius:99px;background:linear-gradient(#f0d37a,#b8902c);color:#2a1a08;font:800 13px "Cinzel",serif;display:none;box-shadow:0 0 18px rgba(240,211,122,.6);white-space:nowrap}
.goal{position:absolute;left:8px;top:8px;max-width:calc(100% - 80px);display:flex;align-items:center;gap:8px;padding:6px 10px 6px 7px;border-radius:12px;background:rgba(8,12,6,.86);border:1px solid #8a6d32;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.goal .gi{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1c2a12;border:1px solid #8a6d32;font-size:15px}
.goal .gt{min-width:0}.goal b{display:block;font:800 12.5px "Cinzel",serif;color:#fff3d4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal small{display:block;font-size:11px;color:var(--mut);white-space:nowrap}
.goal .gp{height:4px;border-radius:2px;background:#0a0f07;margin-top:3px;overflow:hidden}.goal .gp i{display:block;height:100%;background:linear-gradient(90deg,#4caa3c,#f0d37a)}
.goal.done{border-color:var(--gold2);background:linear-gradient(rgba(62,117,48,.95),rgba(28,63,21,.95));animation:gpulse 1.2s ease-in-out infinite}
.goal.done small{color:#fff3c4}
@keyframes gpulse{50%{box-shadow:0 0 22px rgba(240,211,122,.75)}}
.fest{position:absolute;right:8px;top:8px;display:none;flex-direction:column;align-items:center;padding:6px 9px;border-radius:12px;border:1px solid var(--gold);background:linear-gradient(#f0d37a,#b8902c);color:#2a1a08;font:800 11px "Cinzel",serif;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.fest i{font-style:normal;font-size:20px;line-height:1}
.fest.on{display:flex;animation:gpulse 1.4s ease-in-out infinite}
.fest.cd{display:flex;background:rgba(8,12,6,.86);color:var(--mut);border-color:#4a3c18}
/* Unterer Bereich */
.sheet{flex:0 0 auto;height:41vh;height:41dvh;min-height:250px;display:flex;flex-direction:column;background:linear-gradient(#111a0d,#080c06);min-width:0}
.pane{flex:1;min-height:0;overflow-y:auto;padding:10px 10px 12px;-webkit-overflow-scrolling:touch}
.nav{flex:none;display:flex;border-top:1px solid var(--gold);background:linear-gradient(#18230f,#0b1108);padding-bottom:env(safe-area-inset-bottom)}
.nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px 8px;border:0;background:none;color:#a99d7e;font:800 11.5px "Cinzel",serif}
.nav button i{font-style:normal;font-size:21px;line-height:1.1;filter:grayscale(.6);opacity:.75}
.nav button.on{color:#f8e9b4}.nav button.on i{filter:none;opacity:1}
.nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--gold2)}
.nav .dot{position:absolute;top:3px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#d4473a;color:#fff;font:800 11px/18px Georgia,serif}
/* Gebäudeliste */
.qty{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;color:var(--mut)}
.qty span{margin-right:auto}
.qty button{padding:4px 11px;border-radius:99px;border:1px solid #4a3c18;background:#0e150b;font:800 12px "Cinzel",serif;color:#cdbf9c}
.qty button.on{border-color:var(--gold);background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4}
.brow{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:11px;background:linear-gradient(#18230f,#0c1209);border:1px solid #3a3418;margin-bottom:7px}
.brow.sel{border-color:var(--gold);box-shadow:0 0 0 1px rgba(240,211,122,.25) inset}
.brow .pic{position:relative;flex:none;width:46px;height:46px}
.brow .pic img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:2px solid #8a6d32}
.brow .pic span{position:absolute;right:-5px;bottom:-4px;font-size:18px;filter:drop-shadow(0 1px 2px #000)}
.brow .pic .em{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:#0a0f07;border:2px solid #8a6d32}
.brow .t{flex:1;min-width:0}
.brow b{display:block;font:800 14px "Cinzel",serif;color:#fff3d4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .sub{display:block;font-size:12px;color:#cdbf9c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .sub em{font-style:normal;color:#9fe36a}
.brow .stg{height:4px;border-radius:2px;background:#0a0f07;margin-top:4px;overflow:hidden}.brow .stg i{display:block;height:100%;background:linear-gradient(90deg,#4caa3c,#f0d37a)}
.bup{flex:none;min-width:86px;display:flex;flex-direction:column;align-items:center;padding:6px 8px;border-radius:9px;border:1px solid var(--gold);background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4;font:800 13px "Cinzel",serif;line-height:1.15;box-shadow:inset 0 1px 0 rgba(255,240,180,.3)}
.bup small{font:11.5px Georgia,serif;opacity:.95;white-space:nowrap}
.bup:disabled{filter:grayscale(.8) brightness(.55);cursor:default}
.bup.can{animation:upulse 1.6s ease-in-out infinite}
@keyframes upulse{50%{box-shadow:inset 0 1px 0 rgba(255,240,180,.3),0 0 12px rgba(120,220,80,.55)}}
.brow.lock{opacity:.55}.brow.lock .bup{background:#0e150b;border-color:#4a3c18;color:var(--mut)}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
/* Aufträge & Bande */
.ord{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;background:linear-gradient(#18230f,#0c1209);border:1px solid #3a3418;margin-bottom:7px}
.ord .ic{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;background:#0a0f07;border:2px solid #8a6d32}
.ord .t{flex:1;min-width:0}.ord b{display:block;font:800 13.5px "Cinzel",serif;color:#fff3d4}.ord span{font-size:12px;color:#cdbf9c}
.ord .pg{height:5px;border-radius:3px;background:#0a0f07;margin-top:4px;overflow:hidden}.ord .pg i{display:block;height:100%;background:linear-gradient(90deg,#4caa3c,#f0d37a)}
.ord .tm{font-size:11px;color:var(--mut)}
.ord button{flex:none;min-width:86px;padding:8px 8px;border-radius:9px;border:1px solid var(--gold);background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4;font:800 12.5px "Cinzel",serif}
.ord button:disabled{filter:grayscale(.8) brightness(.55)}
.ord.ready{border-color:var(--gold2);box-shadow:0 0 14px rgba(240,211,122,.25)}
.empty{text-align:center;color:var(--mut);padding:16px}
.lockbox{padding:16px;text-align:center;border-radius:12px;border:1px dashed #8a6d32;color:#cdbf9c}
.lockbox b{display:block;font:800 16px "Cinzel",serif;color:var(--gold2);margin-bottom:4px}
.hire{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:11px;background:linear-gradient(#162011,#0a0f07);border:1px solid #3a3418;margin-bottom:7px}
.hire img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:2px solid #8a6d32;flex:none}
.hire .t{flex:1;min-width:0}.hire b{display:block;font:800 14px "Cinzel",serif;color:#fff3d4}.hire span{font-size:12px;color:#cdbf9c}
.hire button{flex:none;min-width:92px;padding:8px 6px;border-radius:9px;border:1px solid var(--gold);background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4;font:800 12.5px "Cinzel",serif}
.hire button:disabled{filter:grayscale(.8) brightness(.55)}
.hire.on{border-color:#8a6d32;background:linear-gradient(#24300f,#10160a)}.hire.on img{border-color:var(--gold2)}
.hire .ok{flex:none;min-width:92px;text-align:center;font:800 12.5px "Cinzel",serif;color:#9fe36a}
.hire.lock{opacity:.45}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:4px}
.stats div{padding:8px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid #3a3418;text-align:center}.stats b{display:block;font:800 16px "Cinzel",serif;color:#fff3c4}.stats span{font-size:11.5px;color:var(--mut)}
.float{position:fixed;z-index:20;pointer-events:none;font:800 17px "Cinzel",serif;color:#ffe9a0;text-shadow:0 2px 0 #000,0 0 10px rgba(240,200,90,.8);animation:flt 1.1s ease-out forwards;white-space:nowrap}
@keyframes flt{to{transform:translateY(-56px);opacity:0}}
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,4,.8);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.ov.hide{display:none}
.panel{width:100%;max-width:420px;max-height:92vh;overflow:auto;background:linear-gradient(rgba(19,28,15,.97),rgba(9,13,7,.98));border:1px solid var(--gold);outline:1px solid #3a3418;outline-offset:4px;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.85);padding:20px;text-align:center;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.panel .t1{font:900 25px "Cinzel Decorative","Cinzel",serif;background:linear-gradient(#fff6d6,#f0d37a 45%,#b8902c);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel .big{font:900 32px "Cinzel",serif;color:#ffe9a0;margin:10px 0 4px;text-shadow:0 0 22px rgba(240,200,90,.5)}
.panel p{color:#e2d2ad;margin:6px 0}
.panel ul{text-align:left;margin:10px 0 0 18px;color:#e2d2ad;font-size:14px}.panel li{margin:3px 0}
.days{display:flex;gap:5px;justify-content:center;margin:10px 0 2px}
.days div{width:40px;padding:5px 0;border-radius:8px;border:1px solid #4a3c18;background:#0e150b;font:800 11px "Cinzel",serif;color:var(--mut)}
.days div b{display:block;font-size:15px}
.days div.got{border-color:#8a6d32;color:#cdbf9c}.days div.now{border-color:var(--gold2);background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4}
.go{display:block;width:100%;margin-top:14px;padding:13px;border:1px solid var(--gold);border-radius:8px;background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4;font:800 17px "Cinzel",serif;letter-spacing:.1em}
@media (min-width:900px){
  #app{flex-direction:row}
  .sheet{flex:0 0 420px;width:420px;height:auto;border-left:1px solid var(--gold)}
  .nav{order:-1;border-top:0;border-bottom:1px solid var(--gold)}
  .nav button.on::before{top:auto;bottom:0;border-radius:3px 3px 0 0}
  .scene{border-bottom:0}
}
@media (max-height:640px) and (max-width:899px){.sheet{height:46dvh}.goal{transform:scale(.9);transform-origin:0 0}}
</style>
</head>
<body>
<div id="app">
  <div class="left">
    <div class="hud">
      <div class="row1"><a class="ib" href="../" title="Zur Spielauswahl">←</a>
        <div class="gold"><b id="hGold">0</b><small id="hRate">+0/s</small></div>
        <div class="lvl" id="hLvl"><div class="ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#2a2a1a" stroke-width="4"/><circle id="hXp" cx="18" cy="18" r="15" fill="none" stroke="#f0d37a" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2"/></svg><b id="hLv">1</b></div><span>Hof-<br>Stufe</span></div>
        <button class="ib" id="btnBoard" title="Bestenliste">🏆</button></div>
      <div class="row2">
        <div class="chipr" id="cHerb"><i>🌿</i><span id="hHerb">0</span></div>
        <div class="chipr" id="cArm"><i>⚔️</i><span id="hArm">0</span></div>
        <div class="chipr" id="cPot"><i>🧪</i><span id="hPot">0</span></div>
      </div>
    </div>
    <div class="scene" id="scene"><canvas id="cv"></canvas>
      <button class="goal" id="goal"></button>
      <button class="fest" id="fest"><i>🎉</i><span id="festT">Fest</span></button>
      <div class="festbar" id="festbar"></div><div class="hintp" id="hint">Wischen zum Umsehen · Gebäude antippen</div></div>
  </div>
  <div class="sheet">
    <div class="pane" id="pane"></div>
    <nav class="nav"><button data-tab="bld" class="on"><i>🏠</i>Hof</button><button data-tab="ord"><i>📜</i>Aufträge</button><button data-tab="crew"><i>👥</i>Bande</button></nav>
  </div>
</div>
<div class="ov hide" id="ov"><div class="panel" id="box"></div></div>

<script src="../art.js"></script>
<script src="../bb.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IMGP = k => `../krieg/img/${k}.jpg`;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 10) return (Math.floor(n * 10) / 10).toLocaleString('de-DE');
  if (n < 1e6) return Math.floor(n).toLocaleString('de-DE');
  const u = [[1e15, 'Brd'], [1e12, 'Bio'], [1e9, 'Mrd'], [1e6, 'Mio']].find(x => n >= x[0]);
  return (n / u[0]).toLocaleString('de-DE', { maximumFractionDigits: n / u[0] < 100 ? 2 : 1 }) + ' ' + u[1];
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ================= Spieldaten =================
const BLD = {
  garden: { name: 'Kräutergarten', who: 'LG3', img: 'lg3', ico: '🌿', x: 230, w: 300, cost: [15, 1.17], stages: ['Kräuterbeet', 'Kräutergarten', 'Gewächshaus', 'Zaubergarten'] },
  forge: { name: 'Schmiede', who: 'Fokuhilamann', img: 'fokuhila', ico: '⚒️', x: 600, w: 260, cost: [60, 1.19], stages: ['Amboss', 'Schmiede', 'Waffenschmiede', 'Königsschmiede'] },
  brew: { name: 'Brauerei', who: 'Kobold', img: 'kobold', ico: '🧪', x: 950, w: 250, cost: [900, 1.2], need: 3, stages: ['Hexenkessel', 'Hexenküche', 'Trankbrauerei', 'Alchemistenturm'] },
  market: { name: 'Marktstand', who: 'DonPatron', img: 'don', ico: '💰', x: 1300, w: 280, cost: [30, 1.18], stages: ['Bauchladen', 'Marktstand', 'Handelshaus', 'Gildenhalle'] },
  store: { name: 'Vorratskeller', who: 'Platz für alle Waren', img: null, ico: '📦', x: 1570, w: 150, cost: [40, 1.55], stages: ['Kistenstapel', 'Vorratskeller', 'Lagerhaus', 'Schatzkammer'] }
};
const ORDER = ['garden', 'forge', 'brew', 'market', 'store'];
const CREW = [
  { id: 'artur', name: 'Artur', perk: 'Wache am Tor: alle Werkstätten +25 %', cost: 400 },
  { id: 'kraeuter', name: 'KräuterKönig', perk: 'Königsdünger: Kräuter ×2', cost: 6000 },
  { id: 'marwin', name: 'Marwin', perk: 'Baumeister: Ausbauen 15 % billiger', cost: 20000 },
  { id: 'molly', name: 'Mollymann', perk: 'Kristallklingen: Waffen ×2', cost: 60000 },
  { id: 'geist', name: 'Grauer Geist', perk: 'Nachtschicht: offline volle Kraft, bis 24 h', cost: 160000 },
  { id: 'allan', name: 'Allan', perk: 'Wolfskarawane: Markt verkauft doppelt so viel', cost: 420000 },
  { id: 'nille', name: 'Nille', perk: 'Feine Finger: alle Preise +50 %', cost: 1.1e6 },
  { id: 'koenig', name: 'König', perk: 'Königliches Siegel: alles ×2', cost: 5e6 }
];
const CUSTOMERS = [
  ['🛡️', 'Ritter Kunibert'], ['🧙', 'Hexe Walburga'], ['🏹', 'Jägerin Mira'], ['🍺', 'Wirt vom Okay'], ['👑', 'Hofmarschall'],
  ['🐉', 'Drachenjäger Bodo'], ['⚓', 'Kapitän Hein'], ['🎻', 'Barde Lutz'], ['🧔', 'Zwerg Grimbart'], ['🦊', 'Fuchs-Händlerin']
];
const ITEM = { herbs: { ico: '🌿', n: 'Kräuter' }, arms: { ico: '⚔️', n: 'Waffen' }, pots: { ico: '🧪', n: 'Tränke' } };

const fresh = () => ({ gold: 30, herbs: 0, arms: 0, pots: 0, earned: 0, lv: { garden: 1, forge: 0, brew: 0, market: 1, store: 1 }, crew: {}, t: Date.now(), start: Date.now(), taps: 0, xp: 0, hl: 1, orders: [], nextOrder: 20, done: 0, raids: 0, festCd: 0, festT: 0, goal: 0, daily: null, fests: 0, v: 2 });
let S;
try { S = JSON.parse(localStorage.getItem('bh_save') || 'null'); } catch (e) { S = null; }
function migrate(x) {
  if (!x || !x.lv) return fresh();
  const f = fresh();
  for (const k in f) if (x[k] === undefined) x[k] = f[k];
  for (const k in f.lv) if (x.lv[k] === undefined) x.lv[k] = f.lv[k];
  if (x.crew.kobold) { delete x.crew.kobold; x.gold += 2500; } // Kobold arbeitet jetzt in der Brauerei
  x.v = 2;
  return x;
}
S = migrate(S);

const has = id => !!S.crew[id];
const fest = () => S.festT > 0 ? 2 : 1;
const all = () => (has('artur') ? 1.25 : 1) * (has('koenig') ? 2 : 1) * fest() * (1 + CV('der-kraeuterkoenig'));
const CV = id => window.BB && BB.cardVal ? BB.cardVal(id) / 100 : 0;
const herbRate = () => S.lv.garden * .8 * all() * (has('kraeuter') ? 2 : 1) * (1 + CV('lg3'));
const armRate = () => S.lv.forge * .22 * all() * (has('molly') ? 2 : 1) * (1 + CV('fokuhilamann'));
const potRate = () => S.lv.brew * .1 * all();
const sellCap = () => S.lv.market * 1.4 * all() * (has('allan') ? 2 : 1);
const cap = () => Math.floor(100 * Math.pow(1.7, S.lv.store - 1));
const pm = () => (has('nille') ? 1.5 : 1) * (1 + CV('donpatron'));
const PRICE = { herbs: () => 1 * pm(), arms: () => 6 * pm(), pots: () => 28 * pm() };
const cost = (k, lv) => Math.ceil(BLD[k].cost[0] * Math.pow(BLD[k].cost[1], (lv ?? S.lv[k]) - (k === 'forge' || k === 'brew' ? 0 : 1)) * (has('marwin') ? .85 : 1));
const stage = lv => lv >= 50 ? 3 : lv >= 25 ? 2 : lv >= 10 ? 1 : 0;
const xpNeed = l => Math.round(40 * Math.pow(1.55, l - 1));
const unlocked = k => !BLD[k].need || S.hl >= BLD[k].need;

// ================= Simulation =================
let flow = { herbs: 0, arms: 0, pots: 0 };
function sim(dt) {
  const c = cap();
  S.herbs = Math.min(c, S.herbs + herbRate() * dt);
  S.arms = Math.min(c, S.arms + armRate() * dt);
  if (S.lv.brew) { const want = Math.min(potRate() * dt, S.herbs / 2, c - S.pots); if (want > 0) { S.herbs -= want * 2; S.pots += want; } }
  let budget = sellCap() * dt, g = 0;
  const sold = {};
  const res = reserved();
  for (const k of ['pots', 'arms', 'herbs']) { const n = Math.max(0, Math.min(S[k] - res[k], budget)); S[k] -= n; budget -= n; g += n * PRICE[k](); sold[k] = n; }
  S.gold += g; S.earned += g;
  if (dt > 0) for (const k in sold) flow[k] = flow[k] * .9 + (sold[k] / dt) * .1;
  if (S.festT > 0) S.festT = Math.max(0, S.festT - dt);
  if (S.festCd > 0) S.festCd = Math.max(0, S.festCd - dt);
  return g;
}
function reserved() { const r = { herbs: 0, arms: 0, pots: 0 }; for (const o of S.orders || []) r[o.it] += o.qty; const c = cap(); for (const k in r) r[k] = Math.min(r[k], c); return r; }
function goldRate() {
  let b = sellCap(), g = 0;
  const pr = Math.min(potRate(), herbRate() / 2);
  for (const [k, r] of [['pots', S.lv.brew ? pr : 0], ['arms', armRate()], ['herbs', herbRate() - (S.lv.brew ? pr * 2 : 0)]]) { const n = Math.max(0, Math.min(r, b)); b -= n; g += n * PRICE[k](); }
  return g;
}
function addXp(n) {
  S.xp += n;
  while (S.xp >= xpNeed(S.hl)) { S.xp -= xpNeed(S.hl); S.hl++; levelUp(); }
}
function levelUp() {
  const L = S.hl, perks = [];
  if (L === 2) perks.push('Kunden schicken jetzt Aufträge');
  if (L === 3) perks.push('Die Brauerei vom Kobold kann gebaut werden');
  if (L === 4) perks.push('Aufträge für Zaubertränke');
  if (L === 5) perks.push('Festtag: alles 60 s doppelt so schnell');
  perks.push(`Bonus: ${fmt(150 * L * L)} Gold`);
  S.gold += 150 * L * L;
  if (window.BB && BB.earn) setTimeout(() => BB.earn(20 + L * 5, `Hof-Stufe ${L}`), 600);
  buzz([40, 60, 40]);
  showOv(`<div class="t1">Hof-Stufe ${L}!</div><p>Dein Hof wird bekannter in den Königreichen.</p><ul>${perks.map(p => `<li>${esc(p)}</li>`).join('')}</ul><button class="go" id="ok">Weiter</button>`);
  $('#ok').onclick = closeOv;
  renderPane();
}

// ================= Aufträge =================
function newOrder() {
  const opts = ['herbs', 'arms'];
  if (S.lv.forge === 0) opts.pop();
  if (S.hl >= 4 && S.lv.brew > 0) opts.push('pots', 'pots');
  const it = pick(opts);
  const rate = it === 'herbs' ? herbRate() : it === 'arms' ? armRate() : potRate();
  const qty = Math.max(it === 'pots' ? 3 : 10, Math.round(rate * rnd(40, 90) / 5) * 5);
  const qty2 = Math.min(qty, Math.floor(cap() * .9 / 5) * 5 || 5);
  const [ico, who] = pick(CUSTOMERS);
  const reward = Math.ceil(qty2 * PRICE[it]() * rnd(2.6, 3.4));
  S.orders.push({ id: Math.random().toString(36).slice(2, 8), it, qty: qty2, reward, xp: 8 + Math.round(Math.sqrt(qty2) * 2), ico, who, t: rnd(150, 240), max: 0 });
  S.orders[S.orders.length - 1].max = S.orders[S.orders.length - 1].t;
}
function tickOrders(dt) {
  if (S.hl < 2) return;
  for (const o of S.orders) o.t -= dt;
  const before = S.orders.length;
  S.orders = S.orders.filter(o => o.t > 0);
  S.nextOrder -= dt;
  if (S.orders.length < 3 && S.nextOrder <= 0) { newOrder(); S.nextOrder = rnd(35, 70); if (tab === 'ord') renderPane(); }
  if (before !== S.orders.length && tab === 'ord') renderPane();
}
function deliver(id) {
  const o = S.orders.find(x => x.id === id); if (!o || S[o.it] < o.qty) return;
  S[o.it] -= o.qty; S.gold += o.reward; S.earned += o.reward; S.done++;
  S.orders = S.orders.filter(x => x !== o);
  addXp(o.xp);
  const r = $('#pane').getBoundingClientRect();
  float(`+${fmt(o.reward)} 🪙`, r.left + r.width / 2, r.top + 40);
  scene.coins(BLD.market.x, 30);
  buzz(30); renderPane(); save();
  if (window.BB && S.done === 10) BB.toast('10 Aufträge erledigt! Die Kunden lieben deinen Hof.', '📜');
}

        <div class="pg"><i></i></div><span class="tm"></span></div><button data-del="${o.id}"></button></div>`).join('') : `<div class="empty">Gerade keine Aufträge. Gleich klopft wieder jemand an. ⏳</div>`) +
      `<p class="note">Aufträge zahlen etwa das Dreifache. DonPatron hält die Ware dafür zurück.</p>`;
    P.querySelectorAll('[data-del]').forEach(x => x.onclick = () => deliver(x.dataset.del));
  } else {
    let lockNext = false;
    P.innerHTML = CREW.map(c => {
      const on = has(c.id), lock = !on && lockNext; if (!on) lockNext = true;
      return `<div class="hire ${on ? 'on' : ''} ${lock ? 'lock' : ''}"><img src="${IMGP(c.id)}" alt=""><div class="t"><b>${c.name}</b><span>${c.perk}</span></div>
        ${on ? '<span class="ok">✓ dabei</span>' : `<button data-hire="${c.id}" ${lock ? 'disabled' : ''}>${lock ? '🔒' : fmt(c.cost) + ' 🪙'}</button>`}</div>`;
    }).join('') + `<div class="stats"><div><b>${fmt(S.earned)}</b><span>Gold verdient</span></div><div><b>${S.done}</b><span>Aufträge</span></div><div><b>${S.raids}</b><span>Spießer verjagt</span></div><div><b>${Math.max(0, S.goal)}</b><span>Ziele erreicht</span></div></div>
      <p class="note">Offline arbeitet die Bande bis 8 Std. mit halber Kraft weiter, mit dem Grauen Geist 24 Std. mit voller Kraft.</p>`;
    P.querySelectorAll('[data-hire]').forEach(x => x.onclick = () => hire(x.dataset.hire));
  }
  hud();
}
function upgrade(k) {
  if (!unlocked(k)) return;
  const p = plan(k); if (S.gold < p.c) return;
  const before = stage(Math.max(1, S.lv[k])), wasBuilt = S.lv[k] > 0;
  S.gold -= p.c; S.lv[k] += p.n; addXp(p.n * (3 + Math.floor(S.lv[k] / 5)));
  buzz(20); save();
  if (!wasBuilt) { scene.coins(BLD[k].x, 24); hint(`🔨 ${BLD[k].name} gebaut!`, 2500); }
  else if (stage(S.lv[k]) > before) { scene.coins(BLD[k].x, 30); hint(`✨ Aus deinem Gebäude wird: ${BLD[k].stages[stage(S.lv[k])]}!`, 3000); }
  sel = k; renderPane();
}
function hire(id) {
  const c = CREW.find(x => x.id === id); if (!c || S.gold < c.cost || has(id)) return;
  S.gold -= c.cost; S.crew[id] = Date.now(); addXp(20); syncCrew(); save(); renderPane();
  hint(`🤝 ${c.name} zieht auf deinen Hof!`, 2500);
  if (window.BB && Object.keys(S.crew).length === CREW.length) BB.unlock('hof_bande');
}

// ================= Ziele =================
const GOALS = [
  ['🌿', 'Bau den Kräutergarten auf Stufe 3', () => S.lv.garden, 3, 50],
  ['⚒️', 'Bau die Schmiede', () => S.lv.forge, 1, 100],
  ['👆', 'Pack 30-mal mit an (Gebäude antippen)', () => S.taps, 30, 120],
  ['💰', 'Marktstand auf Stufe 5', () => S.lv.market, 5, 200],
  ['🛡️', 'Hol Artur auf den Hof', () => has('artur') ? 1 : 0, 1, 300],
  ['⭐', 'Erreiche Hof-Stufe 2', () => S.hl, 2, 400],
  ['📜', 'Liefere deinen ersten Auftrag', () => S.done, 1, 600],
  ['⭐', 'Erreiche Hof-Stufe 3', () => S.hl, 3, 900],
  ['🧪', 'Bau die Brauerei', () => S.lv.brew, 1, 1500],
  ['⚔️', 'Verjag einen Spießer', () => S.raids, 1, 1200],
  ['🌿', 'Kräutergarten auf Stufe 10', () => S.lv.garden, 10, 2500],
  ['👑', 'Hol den KräuterKönig', () => has('kraeuter') ? 1 : 0, 1, 5000],
  ['📜', 'Erledige 5 Aufträge', () => S.done, 5, 8000],
  ['⭐', 'Erreiche Hof-Stufe 5', () => S.hl, 5, 12000],
  ['🎉', 'Feier einen Festtag', () => S.fests, 1, 8000],
  ['⚒️', 'Schmiede auf Stufe 25', () => S.lv.forge, 25, 40000],
  ['💎', 'Hol Mollymann', () => has('molly') ? 1 : 0, 1, 60000],
  ['💰', 'Verdiene 1 Million Gold', () => S.earned, 1e6, 150000]
];
function goal() {
  if (S.goal < GOALS.length) { const [ico, t, p, n, r] = GOALS[S.goal]; return { ico, t, p: p(), n, r }; }
  const k = S.goal - GOALS.length, n = 2e6 * Math.pow(3, k);
  return { ico: '💰', t: `Verdiene ${fmt(n)} Gold`, p: S.earned, n, r: Math.round(n * .08) };
}
let goalKey = '';
function renderGoal() {
  const G = goal(), done = G.p >= G.n, el = $('#goal');
  const key = done + G.t + Math.floor(Math.min(G.p, G.n) * 100 / G.n);
  if (key === goalKey) return; goalKey = key;
  el.classList.toggle('done', done);
  el.innerHTML = `<span class="gi">${done ? '🎁' : G.ico}</span><span class="gt"><b>${done ? 'Ziel geschafft!' : esc(G.t)}</b><small>${done ? `Tippen: +${fmt(G.r)} 🪙 abholen` : `${fmt(Math.min(G.p, G.n))} / ${fmt(G.n)} · 🪙 ${fmt(G.r)}`}</small>${done ? '' : `<span class="gp"><i style="width:${Math.min(100, G.p / G.n * 100)}%"></i></span>`}</span>`;
}
$('#goal').onclick = e => {
  const G = goal();
  if (G.p < G.n) { hint('🎯 ' + G.t, 2500); return; }
  S.gold += G.r; S.earned += G.r; S.goal++; addXp(10);
  if (window.BB && BB.earn) BB.earn(10 + Math.min(40, S.goal * 2), 'Hof-Ziel geschafft');
  float(`+${fmt(G.r)} 🪙`, e.clientX, e.clientY + 30); scene.coins(camX + viewW() * .2, 20); buzz([30, 40, 30]);
  goalKey = ''; save(); hud();
};

// ================= Kopfzeile =================
let lastCostTick = 0;
function hud() {
  $('#hGold').textContent = fmt(S.gold);
  $('#hRate').textContent = `+${fmt(goldRate())}/s${S.festT > 0 ? ' · 🎉 ×2' : ''}`;
  const c = cap(), res = reserved();
  for (const [k, id] of [['herbs', 'Herb'], ['arms', 'Arm'], ['pots', 'Pot']]) {
    $('#h' + id).textContent = fmt(S[k]);
    $('#c' + id).classList.toggle('full', S[k] >= c - .01);
  }
  $('#cPot').style.display = S.lv.brew ? '' : 'none';
  $('#cArm').style.display = S.lv.forge ? '' : 'none';
  $('#hLv').textContent = S.hl;
  $('#hXp').style.strokeDashoffset = 94.2 * (1 - Math.min(1, S.xp / xpNeed(S.hl)));
  const f = $('#fest');
  f.className = 'fest' + (S.hl < 5 ? '' : S.festT > 0 ? '' : S.festCd > 0 ? ' cd' : ' on');
  $('#festT').textContent = S.festCd > 0 && S.festT <= 0 ? `${Math.ceil(S.festCd / 60)} Min.` : 'Fest';
  const bar = $('#festbar'); bar.style.display = S.festT > 0 ? 'block' : 'none'; if (S.festT > 0) bar.textContent = `🎉 Festtag! Alles doppelt · ${Math.ceil(S.festT)} s`;
  renderGoal();
  // Knöpfe live halten
  document.querySelectorAll('.bup[data-up]').forEach(b => {
    const k = b.dataset.up; if (!unlocked(k)) return;
    const p = plan(k), can = S.gold >= p.c;
    const html = `${S.lv[k] ? '⬆ ' + (p.n > 1 ? '+' + p.n : 'Ausbau') : '🔨 Bauen'}<small>${fmt(p.c)} 🪙</small>`;
    if (b._h !== html) { b.innerHTML = html; b._h = html; }
    b.disabled = !can; b.classList.toggle('can', can);
  });
  let first = true;
  document.querySelectorAll('[data-hire]').forEach(b => { if (first) { b.disabled = S.gold < CREW.find(x => x.id === b.dataset.hire).cost; first = false; } });
  document.querySelectorAll('.ord[data-o]').forEach(row => {
    const o = S.orders.find(x => x.id === row.dataset.o); if (!o) return;
    const ready = S[o.it] >= o.qty, b = row.querySelector('button');
    b.disabled = !ready; b.textContent = ready ? '✓ Liefern' : `${fmt(Math.min(S[o.it], o.qty))}/${o.qty}`;
    row.classList.toggle('ready', ready);
    row.querySelector('.pg i').style.width = Math.min(100, S[o.it] / o.qty * 100) + '%';
    row.querySelector('.tm').textContent = `noch ${Math.max(1, Math.ceil(o.t / 60))} Min.`;
  });
  renderTabs();
}
$('#fest').onclick = () => {
  if (S.hl < 5) return;
  if (S.festCd > 0) { hint(`🎉 Nächstes Fest in ${Math.ceil(S.festCd / 60)} Min.`, 2000); return; }
  S.festT = 60; S.festCd = 8 * 60; S.fests++; buzz([30, 30, 30]); hint('🎉 Festtag! Die Bande arbeitet 60 Sekunden doppelt so schnell.', 3000); hud();
};
$('#hLvl').onclick = () => { showOv(`<div class="t1">Hof-Stufe ${S.hl}</div><p>Ruhm: ${Math.floor(S.xp)} / ${xpNeed(S.hl)} ⭐</p><ul><li>Ausbauen bringt Ruhm</li><li>Aufträge bringen viel Ruhm</li><li>Ziele, Spießer verjagen und Goldbeutel auch</li></ul><p style="font-size:13px;color:var(--mut)">Stufe 2: Aufträge · Stufe 3: Brauerei · Stufe 4: Trank-Aufträge · Stufe 5: Festtag</p><button class="go" id="ok">Alles klar</button>`); $('#ok').onclick = closeOv; };

// ================= Tagesbonus =================
let pendingDaily = false;
function daily() {
  const d = new Date().toDateString();
  if (S.daily && S.daily.d === d) return;
  const y = new Date(Date.now() - 864e5).toDateString();
  const streak = S.daily && S.daily.d === y ? Math.min(7, (S.daily.s || 1) + 1) : 1;
  S.daily = { d, s: streak };
  if (S.earned < 5) { save(); return; }
  const rew = Math.max(100, Math.round(goldRate() * 600 * (1 + (streak - 1) * .25)));
  S.gold += rew; S.earned += rew; save();
  showOv(`<div class="t1">Tagesbonus</div><p>Schön, dass du da bist! Jeden Tag in Folge wird der Bonus größer.</p>
    <div class="days">${[1, 2, 3, 4, 5, 6, 7].map(i => `<div class="${i < streak ? 'got' : i === streak ? 'now' : ''}">Tag<b>${i === 7 ? '👑' : i}</b></div>`).join('')}</div>
    <div class="big">+${fmt(rew)} 🪙</div><button class="go" id="ok">Einsammeln</button>`);
  $('#ok').onclick = () => { closeOv(); scene.coins(BLD.market.x, 30); };
}
let hintT = null;
function hint(t, ms) { const h = $('#hint'); h.textContent = t; h.style.opacity = 1; clearTimeout(hintT); hintT = setTimeout(() => h.style.opacity = 0, ms || 2500); }
function float(txt, x, y) { const f = document.createElement('div'); f.className = 'float'; f.textContent = txt; f.style.left = (x - 24) + 'px'; f.style.top = (y - 20) + 'px'; document.body.appendChild(f); setTimeout(() => f.remove(), 1100); }
function showOv(h) { $('#box').innerHTML = h; $('#ov').classList.remove('hide'); }
function closeOv() { $('#ov').classList.add('hide'); if (pendingDaily) { pendingDaily = false; setTimeout(daily, 250); } }

// ================= Offline & Speichern =================
function offline() {
  const now = Date.now(), gone = (now - (S.t || now)) / 1000;
  S.t = now;
  if (gone < 30) return;
  const maxT = has('geist') ? 24 * 3600 : 8 * 3600, eff = has('geist') ? 1 : .5;
  const T = Math.min(gone, maxT), steps = Math.min(4000, Math.ceil(T)), dt = T / steps;
  const ft = S.festT; S.festT = 0;
  let got = 0; for (let i = 0; i < steps; i++) got += sim(dt * eff);
  S.festT = 0; S.festCd = Math.max(0, S.festCd - gone);
  for (const o of S.orders) o.t -= gone; S.orders = S.orders.filter(o => o.t > 0);
  if (got < 1) return;
  pendingDaily = true;
  const h = Math.floor(gone / 3600), m = Math.floor(gone % 3600 / 60);
  showOv(`<div class="t1">Willkommen zurück</div><p>Du warst ${h ? h + ' Std. ' : ''}${m} Min. weg. Die Bande hat weitergeschuftet${eff < 1 ? ' (mit halber Kraft)' : ''}.</p>
    <div class="big">+${fmt(got)} 🪙</div>${gone > maxT ? `<p style="font-size:13px;color:var(--mut)">Gezählt werden höchstens ${maxT / 3600} Stunden.</p>` : ''}
    <button class="go" id="ok">Einsammeln</button>`);
  $('#ok').onclick = () => { closeOv(); scene.coins(BLD.market.x, 40); renderPane(); };
}
let lastRec = 0;
function save() { S.t = Date.now(); try { localStorage.setItem('bh_save', JSON.stringify(S)); } catch (e) {} }
function report(now) {
  if (!window.BB || S.earned < 1) return;
  if (S.earned > lastRec * 1.02 || !lastRec) { BB.record('hof', Math.floor(S.earned), { b: Object.keys(S.crew).length, l: S.hl }); lastRec = S.earned; }
  if (S.earned >= 1e4) BB.unlock('hof_10k'); if (S.earned >= 1e6) BB.unlock('hof_mio');
  if (BB.cloud) BB.cloud.put('hof', S, now);
}
$('#btnBoard').onclick = () => window.BB && BB.open('board', 'hof');
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); report(true); } else { offline(); renderPane(); } });
addEventListener('pagehide', () => { save(); report(true); });
addEventListener('resize', resize);

// Erste Schritte
function intro() {
  showOv(`${window.BBArt ? BBArt.head('hof') : ''}<div class="t1">Bandenhof</div>
    <p>Die Bande baut ihren eigenen Hof. LG3 zieht Kräuter, Fokuhila schmiedet Waffen, DonPatron verkauft alles für Gold.</p>
    <ul><li><b>Wisch</b> durch den Hof und <b>tipp Gebäude an</b>, um mitzuhelfen</li><li><b>Bau aus</b>, damit mehr Gold reinkommt, und hol die Bande dazu</li><li><b>Aufträge</b> bringen Bonus-Gold und Ruhm für neue Hof-Stufen</li><li>Pass auf <b>Spießer</b> auf, die deine Kasse plündern wollen!</li></ul>
    <button class="go" id="ok">Hof eröffnen</button>`);
  $('#ok').onclick = () => { closeOv(); S.seen = 1; save(); };
}

// ================= Start =================
(async () => {
  if (window.BB && BB.cloud && BB.loggedIn) {
    try { const c = await BB.cloud.get('hof'); if (c && c.lv && (c.earned || 0) > (S.earned || 0)) S = migrate(c); } catch (e) {}
  }
  resize(); focus(S.lv.forge ? 'forge' : 'garden'); syncCrew();
  offline(); renderTabs(); renderPane();
  if (!S.seen && S.earned < 5) intro();
  if ($('#ov').classList.contains('hide')) daily(); else if (!pendingDaily) pendingDaily = true;
  save();
  let last = performance.now(), raidT = rnd(90, 160), bagT = rnd(40, 80);
  setInterval(() => {
    const n = performance.now(), dt = Math.min(1, (n - last) / 1000); last = n;
    sim(dt); tickOrders(dt);
    if (S.earned > 300 && !raid) { raidT -= dt; if (raidT <= 0) { startRaid(); raidT = rnd(150, 300); } }
    if (!bag) { bagT -= dt; if (bagT <= 0) { spawnBag(); bagT = rnd(60, 120); } }
    hud();
  }, 250);
  setInterval(() => { save(); report(); }, 15000);
  setTimeout(report, 3000);
  setTimeout(() => hint('Wischen zum Umsehen · Gebäude antippen', 4000), 600);
  requestAnimationFrame(frame);
})();
window.BH = { get S() { return S; }, sim, renderPane, offline, startRaid, spawnBag, focus, get raid() { return raid; } };
</script>
</body>
</html>
