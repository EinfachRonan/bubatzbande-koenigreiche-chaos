<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kräuter-Match · Bubatzbande</title>
<meta name="theme-color" content="#0b1108">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a06;--txt:#f1e6c8;--mut:#a59a7c;--gold:#d4af37;--gold2:#f0d37a;--line:#7a6128}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{height:100%;color:var(--txt);font:15px/1.35 Georgia,serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
body::before{content:"";position:fixed;inset:-30px;background:url(../krieg/img/hoehle.jpg) center/cover;filter:blur(10px) brightness(.5) saturate(1.1);z-index:-2}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 30%,rgba(0,0,0,.65) 100%);z-index:-1;pointer-events:none}
.c{font-family:"Cinzel",Georgia,serif}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(#19220f,#0b1108);border-bottom:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.6);z-index:3}
.top a,.top button{color:var(--gold2);text-decoration:none;background:linear-gradient(#1f2c19,#0f170c);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font:800 14px "Cinzel",serif;cursor:pointer}
.top h1{font:900 18px "Cinzel Decorative","Cinzel",serif;background:linear-gradient(#fff3c4,#d4af37 60%,#8a6a1d);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto;white-space:nowrap}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 12px max(10px,env(safe-area-inset-bottom))}
.side{display:flex;flex-direction:column;gap:10px;width:250px}
.card{background:linear-gradient(rgba(19,28,15,.92),rgba(9,13,7,.92));border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(240,211,122,.12),0 10px 30px rgba(0,0,0,.5)}
.stats{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.stat b{display:block;font:800 26px "Cinzel",serif;color:var(--gold2);line-height:1.05}
.stat span{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.stat.low b{color:#ff8a6a;animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.scorebar{position:relative;height:10px;border-radius:6px;background:#0a0f08;border:1px solid #3a3418;margin-top:8px;overflow:visible}
.scorebar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#3e7530,#9fe36a);box-shadow:0 0 10px rgba(140,230,90,.5);transition:width .3s}
.scorebar em{position:absolute;top:-7px;font-style:normal;font-size:14px;transform:translateX(-50%);color:#4a4430;text-shadow:0 1px 0 #000;transition:color .3s}
.scorebar em.on{color:#ffd36a;text-shadow:0 0 8px rgba(255,210,100,.8)}
.goals{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.goal{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.2);border-radius:8px;padding:5px 9px 5px 5px}
.goal svg{width:30px;height:30px}
.goal b{font:800 18px "Cinzel",serif;color:var(--txt)}
.goal.done b{color:#9fe36a}
.goal .moss{width:30px;height:30px;border-radius:6px;background:radial-gradient(circle at 35% 35%,#7fb94a,#3c6a24 60%,#26431a);box-shadow:inset 0 0 6px rgba(0,0,0,.6)}
.helpers{display:flex;gap:8px;justify-content:space-between}
.helper{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--txt);font:inherit;cursor:pointer;padding:2px}
.helper .ring{position:relative;width:62px;height:62px;border-radius:50%;padding:3px;background:conic-gradient(#9fe36a calc(var(--p)*1%),#2a2a1c 0);box-shadow:0 4px 12px rgba(0,0,0,.6)}
.helper img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 15%;border:2px solid #0a0f08;filter:grayscale(.55) brightness(.75);transition:filter .3s}
.helper.ready img{filter:none}
.helper.ready .ring{background:conic-gradient(#ffd36a 100%,#0000 0);box-shadow:0 0 0 2px rgba(255,211,106,.4),0 0 18px rgba(255,200,90,.7);animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,211,106,.25),0 0 26px rgba(255,200,90,.9)}}
.helper.armed .ring{background:conic-gradient(#ff8a5a 100%,#0000 0)}
.helper small{font:800 11px "Cinzel",serif;color:var(--gold2);text-align:center;line-height:1.1}
.helper span{font-size:10px;color:var(--mut);text-align:center;line-height:1.15}
.boardWrap{position:relative;width:min(92vw,calc(100vh - 150px),620px);aspect-ratio:1;padding:10px;border-radius:14px;background:linear-gradient(#1b2615,#0b1009);border:1px solid var(--gold);outline:1px solid #3a3418;outline-offset:4px;box-shadow:0 20px 60px rgba(0,0,0,.75),inset 0 0 40px rgba(0,0,0,.6)}
.board{position:relative;width:100%;height:100%;touch-action:none}
.cell{position:absolute;width:12.5%;height:12.5%;border-radius:8px}
.cell.a{background:rgba(255,255,255,.035)}
.cell.moss::after{content:"";position:absolute;inset:6%;border-radius:22%;background:radial-gradient(circle at 30% 30%,#86c24e,#3d6c25 55%,#23401a);box-shadow:inset 0 0 8px rgba(0,0,0,.6),0 0 8px rgba(110,190,70,.25);opacity:.9}
.cell.moss.gone::after{animation:mossGone .5s forwards}
@keyframes mossGone{to{transform:scale(1.5);opacity:0}}
.tile{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .2s ease-in;will-change:transform;z-index:1}
.tile .in{position:absolute;inset:6%;border-radius:22%;transition:transform .15s}
.tile svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6))}
.tile.sel .in{transform:scale(1.12);background:radial-gradient(circle,rgba(255,240,180,.25),transparent 70%);box-shadow:0 0 0 2px var(--gold2)}
.tile.pop .in{animation:pop .26s forwards}
@keyframes pop{40%{transform:scale(1.3);filter:brightness(1.8)}100%{transform:scale(0);opacity:0}}
.tile.hint .in{animation:hint .9s ease-in-out infinite}
@keyframes hint{25%{transform:scale(1.12) rotate(-6deg)}75%{transform:scale(1.12) rotate(6deg)}}
.tile.born .in{animation:born .35s}
@keyframes born{0%{transform:scale(.3);filter:brightness(2.5)}}
.tile.sp-h .in::after,.tile.sp-v .in::after{content:"";position:absolute;inset:10%;border-radius:20%;pointer-events:none;mix-blend-mode:screen;animation:shine 1.4s linear infinite}
.tile.sp-h .in::after{background:repeating-linear-gradient(0deg,transparent 0 18%,rgba(255,255,255,.55) 18% 26%)}
.tile.sp-v .in::after{background:repeating-linear-gradient(90deg,transparent 0 18%,rgba(255,255,255,.55) 18% 26%)}
@keyframes shine{50%{opacity:.55}}
.tile.sp-b .in{border-radius:50%;box-shadow:0 0 0 2px rgba(255,220,120,.85),0 0 16px rgba(255,180,80,.8);animation:bomb 1s ease-in-out infinite}
@keyframes bomb{50%{box-shadow:0 0 0 3px rgba(255,240,160,1),0 0 24px rgba(255,160,60,1)}}
.tile.star .in{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fx{position:absolute;pointer-events:none;z-index:5}
.beam{position:absolute;background:linear-gradient(90deg,transparent,rgba(255,240,190,.95),transparent);border-radius:4px;z-index:4;pointer-events:none;animation:beam .35s forwards}
.beam.v{background:linear-gradient(0deg,transparent,rgba(255,240,190,.95),transparent)}
@keyframes beam{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.boom{position:absolute;border-radius:50%;z-index:4;pointer-events:none;background:radial-gradient(circle,rgba(255,240,180,.95),rgba(255,150,60,.6) 40%,transparent 70%);animation:boomA .45s forwards}
@keyframes boomA{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.4);opacity:0}}
.pts{position:absolute;z-index:6;font:800 20px "Cinzel",serif;color:#ffe9a8;text-shadow:0 2px 0 #000,0 0 10px rgba(255,200,90,.7);pointer-events:none;transform:translate(-50%,-50%);animation:pts .9s forwards;white-space:nowrap}
@keyframes pts{100%{transform:translate(-50%,-160%);opacity:0}}
.shout{position:absolute;left:50%;top:42%;z-index:7;transform:translate(-50%,-50%);font:900 clamp(28px,7vw,52px) "Cinzel Decorative","Cinzel",serif;background:linear-gradient(#fff6d6,#f0d37a 45%,#b8902c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #1a0f05) drop-shadow(0 0 20px rgba(240,200,90,.6));pointer-events:none;animation:shout 1.1s forwards;white-space:nowrap}
@keyframes shout{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.board.shake{animation:shake .3s}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
.armedTip{position:absolute;left:50%;top:14px;transform:translate(-50%,0);box-shadow:0 6px 20px rgba(0,0,0,.7);background:#3a1a10;border:1px solid #ff8a5a;color:#ffd2c0;font:800 12px "Cinzel",serif;padding:4px 10px;border-radius:6px;white-space:nowrap;z-index:8;display:none}
.armedTip.on{display:block}
/* Menüs */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,rgba(8,14,6,.6),rgba(2,3,2,.94))}
.ov.hide{display:none}
.box{position:relative;width:100%;max-width:560px;max-height:100%;overflow:auto;background:linear-gradient(#131c0f,#090d07);border:1px solid var(--gold);outline:1px solid #4a3c18;outline-offset:5px;border-radius:12px;box-shadow:0 30px 90px rgba(0,0,0,.85);text-align:center;padding:22px 20px}
.box h2{font:900 30px "Cinzel Decorative","Cinzel",serif;background:linear-gradient(#fff3c4,#d4af37 55%,#8a6a1d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000)}
.box p{color:#e2d2ad;margin:8px 0}
.orn{color:var(--gold);letter-spacing:.4em;font-size:12px;margin:4px 0}
.go{display:block;width:100%;margin-top:14px;padding:13px;border:1px solid var(--gold);border-radius:7px;background:linear-gradient(#3e7530,#1c3f15);color:#f8e9b4;font:800 17px "Cinzel",serif;letter-spacing:.14em;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,240,180,.35),0 0 0 3px #070a05,0 0 0 4px var(--line),0 8px 24px rgba(60,150,50,.3)}
.go:hover{filter:brightness(1.12)}
.go.alt{background:linear-gradient(#202e1a,#0f170c);color:var(--gold2);box-shadow:0 0 0 3px #070a05,0 0 0 4px #4a3c18}
.row{display:flex;gap:10px}.row .go{flex:1}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0 4px}
.lv{position:relative;aspect-ratio:1;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 40% 35%,#3e7530,#16300f 70%);color:#f8e9b4;font:800 20px "Cinzel",serif;cursor:pointer;box-shadow:0 0 0 3px #070a05,0 6px 14px rgba(0,0,0,.6)}
.lv:hover{filter:brightness(1.15)}
.lv.lock{background:#141a10;border-color:#4a3c18;color:#5a5440;cursor:default}
.lv.cur{box-shadow:0 0 0 3px #070a05,0 0 0 5px #9fe36a,0 0 20px rgba(140,230,90,.6)}
.lv i{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font-style:normal;font-size:12px;letter-spacing:-1px;color:#ffd36a;text-shadow:0 1px 0 #000;white-space:nowrap}
.bigstars{font-size:44px;letter-spacing:6px;margin:6px 0;color:#3a3418}
.bigstars span{display:inline-block;transform:scale(0);animation:star .4s forwards}
.bigstars span.on{color:#ffd36a;text-shadow:0 0 18px rgba(255,200,80,.8)}
@keyframes star{to{transform:scale(1)}}
.how{text-align:left;font-size:13.5px;color:#e2d2ad;margin:12px 0 0;padding-left:18px}
.how li{margin:5px 0}.how b{color:var(--gold2);font-family:"Cinzel",serif}
.heroimg{display:block;width:calc(100% + 40px);margin:-22px -20px 6px;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);max-height:190px;object-fit:cover;object-position:50% 30%}
/* Layout */
@media (max-aspect-ratio:1/1){
  main{flex-direction:column;gap:12px;justify-content:center}
  .side{width:min(92vw,620px);display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .side .card{padding:8px 10px}
  .side .cGoals{grid-column:1/-1;order:-1}
  .boardWrap{width:min(94vw,calc(100vh - 330px),620px);padding:6px}
  .stat b{font-size:22px}
  .helper .ring{width:48px;height:48px}
  .helper span{display:none}
}
@media (max-aspect-ratio:1/1) and (max-height:700px){.helper small{display:none}.side .cHelp{padding:6px}}
@media (min-aspect-ratio:1/1) and (max-height:520px){.side{width:200px}.side .card{padding:6px 8px}.helper .ring{width:44px;height:44px}.helper span{display:none}.stat b{font-size:20px}.top{padding-top:4px;padding-bottom:4px}.boardWrap{width:min(92vw,calc(100vh - 70px))}}
</style>
</head>

<div id="app">
  <div class="top">
    <a href="../" title="Zur Spielauswahl">←</a>
    <h1>Kräuter-Match</h1>
    <button id="btnLevels" title="Levelauswahl">Level</button>
  </div>
  <main>
    <div class="side">
      <div class="card cGoals"><div class="goals" id="goals"></div></div>
      <div class="card">
        <div class="stats">
          <div class="stat" id="stLevel"><b id="lvl">1</b><span>Level</span></div>
          <div class="stat" id="stMoves"><b id="moves">20</b><span>Züge</span></div>
          <div class="stat"><b id="score">0</b><span>Punkte</span></div>
        </div>
        <div class="scorebar"><i id="sbar"></i><em id="s1">★</em><em id="s2">★</em><em id="s3">★</em></div>
      </div>
      <div class="card cHelp"><div class="helpers" id="helpers"></div></div>
    </div>
    <div class="boardWrap"><div class="armedTip" id="armedTip">Tipp auf einen Stein: Fokuhilas Hammer</div><div class="board" id="board"></div></div>
  </main>
</div>
<div class="ov" id="ov"><div class="box" id="box"></div></div>
<script>
'use strict';
const N = 8, KINDS = 6, STAR = 6;
const NAMES = ['Kräuter', 'Kristalle', 'Gold', 'Pilze', 'Tränke', 'Flammen'];
const ico = t => `<svg viewBox="0 0 64 64"><use href="#t${t}"/></svg>`;
// Helfer aus der Bande: laden sich mit ihrem Stein auf
const HELPERS = [
  { id: 'kobold', img: 'kobold', n: 'Kobold', d: 'Feuerregen: 9 Steine brennen weg', feed: 5, need: 22 },
  { id: 'fokuhila', img: 'fokuhila', n: 'Fokuhila', d: 'Hammer: zerschlägt 3×3', feed: 2, need: 22 },
  { id: 'molly', img: 'molly', n: 'Mollymann', d: 'Kristall: räumt eine Farbe ab', feed: 1, need: 26 },
];
// Levels: Ziele sind Steine sammeln (Typ: Anzahl) und/oder Moos entfernen
const MOSS = {
  center: (x, y) => x >= 2 && x <= 5 && y >= 2 && y <= 5,
  rows: (x, y) => y >= 5,
  frame: (x, y) => x === 0 || y === 0 || x === 7 || y === 7,
  x: (x, y) => x === y || x === 7 - y,
  diamond: (x, y) => Math.abs(x - 3.5) + Math.abs(y - 3.5) <= 3,
  full: () => true,
};
const LEVELS = [
  { moves: 20, goals: { 0: 15 } },
  { moves: 20, goals: { 2: 18, 1: 12 } },
  { moves: 22, moss: 'center' },
  { moves: 22, goals: { 3: 18, 4: 18 } },
  { moves: 24, moss: 'rows', goals: { 0: 20 } },
  { moves: 22, goals: { 5: 26, 2: 22 } },
  { moves: 25, moss: 'frame' },
  { moves: 24, goals: { 1: 24, 4: 24 } },
  { moves: 25, moss: 'x', goals: { 2: 25 } },
  { moves: 26, moss: 'diamond', goals: { 0: 30, 3: 30 } },
  { moves: 27, goals: { 0: 26, 1: 26, 5: 26 } },
  { moves: 30, moss: 'full' },
];
function levelDef(n) {
  if (n <= LEVELS.length) return LEVELS[n - 1];
  // danach: endlose Höhle mit zufälligen Zielen
  const r = mulberry(n * 977), k = n - LEVELS.length;
  const goals = {}; const a = Math.floor(r() * 6); let b = Math.floor(r() * 6); if (b === a) b = (b + 1) % 6;
  goals[a] = Math.min(40, 22 + k * 2); goals[b] = Math.min(36, 18 + k * 2);
  const mk = Object.keys(MOSS); const moss = r() < .5 ? mk[Math.floor(r() * (mk.length - 1))] : null;
  return { moves: 26 + Math.min(8, Math.floor(k / 2)), goals, moss };
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- Speicher ----------
let save = { unlocked: 1, stars: {} };
try { const j = JSON.parse(localStorage.getItem('km_save') || 'null'); if (j && j.unlocked) save = j; } catch (e) {}
const persist = () => { try { localStorage.setItem('km_save', JSON.stringify(save)); } catch (e) {} };

// ---------- Zustand ----------
const $ = id => document.getElementById(id);
const boardEl = $('board');
let G = null, uid = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));

function newTile(t, sp = null) {
  const el = document.createElement('div'); el.className = 'tile';
  el.innerHTML = '<div class="in"></div>';
  const tile = { id: uid++, t, sp, el };
  paint(tile); boardEl.appendChild(el); return tile;
}
function paint(tile) {
  tile.el.querySelector('.in').innerHTML = ico(tile.sp === 'star' ? STAR : tile.t);
  tile.el.classList.toggle('sp-h', tile.sp === 'h');
  tile.el.classList.toggle('sp-v', tile.sp === 'v');
  tile.el.classList.toggle('sp-b', tile.sp === 'b');
  tile.el.classList.toggle('star', tile.sp === 'star');
}
function place(tile, x, y, dur) {
  tile.x = x; tile.y = y;
  tile.el.style.transitionDuration = (dur == null ? .2 : dur) + 's';
  tile.el.style.transform = `translate(${x * 100}%,${y * 100}%)`;
}
const at = (x, y) => (x >= 0 && y >= 0 && x < N && y < N) ? G.grid[y][x] : null;
const kind = tile => !tile ? -1 : tile.sp === 'star' ? STAR : tile.t;

function randKind(x, y) {
  for (let tries = 0; tries < 30; tries++) {
    const t = Math.floor(Math.random() * KINDS);
    const l1 = at(x - 1, y), l2 = at(x - 2, y), u1 = at(x, y - 1), u2 = at(x, y - 2);
    if (l1 && l2 && kind(l1) === t && kind(l2) === t) continue;
    if (u1 && u2 && kind(u1) === t && kind(u2) === t) continue;
    return t;
  }
  return Math.floor(Math.random() * KINDS);
}

function startLevel(n) {
  if (G && G.busy && !G.over) return;
  hideMenu();
  boardEl.innerHTML = '';
  const def = levelDef(n);
  G = { n, def, grid: [], moves: def.moves, score: 0, goals: { ...(def.goals || {}) }, moss: [], mossLeft: 0, busy: false, sel: null, charge: [0, 0, 0], armed: -1, over: false, idle: 0,
    t2: def.moves * 300, t3: def.moves * 520 };
  for (let y = 0; y < N; y++) {
    G.moss.push([]);
    for (let x = 0; x < N; x++) {
      const c = document.createElement('div'); c.className = 'cell' + ((x + y) % 2 ? '' : ' a'); c.style.left = x * 12.5 + '%'; c.style.top = y * 12.5 + '%';
      const m = def.moss && MOSS[def.moss](x, y); if (m) { c.classList.add('moss'); G.mossLeft++; }
      G.moss[y].push(m ? c : null); boardEl.appendChild(c);
    }
  }
  for (let y = 0; y < N; y++) { G.grid.push([]); for (let x = 0; x < N; x++) G.grid[y].push(null); }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const t = newTile(randKind(x, y)); G.grid[y][x] = t; place(t, x, y - N - 1, 0); }
  boardEl.offsetWidth;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) place(G.grid[y][x], x, y, .35 + (N - y) * .04);
  if (!hasMove()) shuffle();
  renderHud(); renderHelpers();
  shout('Level ' + n);
}

// ---------- Treffer finden ----------
function findRuns() {
  const runs = [];
  for (let y = 0; y < N; y++) {
    let x = 0;
    while (x < N) {
      const t = kind(at(x, y)); let e = x + 1;
      if (t < 0 || t === STAR) { x++; continue; }
      while (e < N && kind(at(e, y)) === t) e++;
      if (e - x >= 3) runs.push({ dir: 'h', cells: Array.from({ length: e - x }, (_, i) => [x + i, y]) });
      x = e;
    }
  }
  for (let x = 0; x < N; x++) {
    let y = 0;
    while (y < N) {
      const t = kind(at(x, y)); let e = y + 1;
      if (t < 0 || t === STAR) { y++; continue; }
      while (e < N && kind(at(x, e)) === t) e++;
      if (e - y >= 3) runs.push({ dir: 'v', cells: Array.from({ length: e - y }, (_, i) => [x, y + i]) });
      y = e;
    }
  }
  return runs;
}
function groupRuns(runs) {
  const owner = new Map(), groups = [];
  for (const r of runs) {
    let g = null;
    for (const [x, y] of r.cells) { const k = x + ',' + y; if (owner.has(k)) { g = owner.get(k); break; } }
    if (!g) { g = { runs: [], cells: new Map() }; groups.push(g); }
    g.runs.push(r);
    for (const [x, y] of r.cells) { const k = x + ',' + y; g.cells.set(k, [x, y]); owner.set(k, g); }
  }
  return groups;
}
function lineAt(x, y) {
  const t = kind(at(x, y)); if (t < 0 || t === STAR) return false;
  let h = 1, v = 1;
  for (let i = x - 1; i >= 0 && kind(at(i, y)) === t; i--) h++;
  for (let i = x + 1; i < N && kind(at(i, y)) === t; i++) h++;
  for (let j = y - 1; j >= 0 && kind(at(x, j)) === t; j--) v++;
  for (let j = y + 1; j < N && kind(at(x, j)) === t; j++) v++;
  return h >= 3 || v >= 3;
}
function swapModel(a, b) { const ta = at(a[0], a[1]), tb = at(b[0], b[1]); G.grid[a[1]][a[0]] = tb; G.grid[b[1]][b[0]] = ta; }
function findMove() {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    for (const [dx, dy] of [[1, 0], [0, 1]]) {
      const x2 = x + dx, y2 = y + dy; if (x2 >= N || y2 >= N) continue;
      const a = at(x, y), b = at(x2, y2);
      if (a.sp === 'star' || b.sp === 'star' || (a.sp && b.sp)) return [[x, y], [x2, y2]];
      swapModel([x, y], [x2, y2]);
      const ok = lineAt(x, y) || lineAt(x2, y2);
      swapModel([x, y], [x2, y2]);
      if (ok) return [[x, y], [x2, y2]];
    }
  }
  return null;
}
const hasMove = () => !!findMove();
function shuffle() {
  for (let n = 0; n < 50; n++) {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const t = G.grid[y][x]; if (!t.sp) t.t = -1; }
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const t = G.grid[y][x]; if (t.t === -1 && !t.sp) t.t = randKind(x, y); }
    if (!findRuns().length && hasMove()) break;
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const t = G.grid[y][x]; paint(t); t.el.classList.remove('born'); t.el.offsetWidth; t.el.classList.add('born'); }
}

// ---------- Zug ausführen ----------
async function trySwap(a, b) {
  if (G.busy || G.over) return;
  G.busy = true; clearHint(); select(null);
  const ta = at(a[0], a[1]), tb = at(b[0], b[1]);
  swapModel(a, b); place(ta, b[0], b[1], .16); place(tb, a[0], a[1], .16);
  await wait(170);
  // Spezial-Kombis
  if (ta.sp === 'star' || tb.sp === 'star' || (ta.sp && tb.sp)) {
    G.moves--; renderHud();
    const set = new Map();
    if (ta.sp === 'star' && tb.sp === 'star') { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) set.set(x + ',' + y, [x, y]); shout('Kristallsturm!'); }
    else if (ta.sp === 'star' || tb.sp === 'star') {
      const st = ta.sp === 'star' ? ta : tb, other = st === ta ? tb : ta;
      set.set(st.x + ',' + st.y, [st.x, st.y]); st.fired = true;
      const tt = other.t;
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const t = at(x, y); if (t.sp !== 'star' && t.t === tt) { set.set(x + ',' + y, [x, y]); if (other.sp && t !== other) { t.sp = other.sp === 'b' ? 'b' : (Math.random() < .5 ? 'h' : 'v'); paint(t); } } }
      shout('Mollymanns Kristall!');
    } else { set.set(ta.x + ',' + ta.y, [ta.x, ta.y]); set.set(tb.x + ',' + tb.y, [tb.x, tb.y]); }
    await clearCells(set, 0);
    await settle();
    await resolve(null);
    return endTurn();
  }
  const runs = findRuns();
  if (!runs.length) {
    swapModel(a, b); place(ta, a[0], a[1], .16); place(tb, b[0], b[1], .16);
    await wait(180); G.busy = false; return;
  }
  G.moves--; renderHud();
  await resolve([a, b]);
  endTurn();
}
function endTurn() {
  G.busy = false; G.idle = 0;
  if (won()) return win();
  if (G.moves <= 0) return lose();
  if (!hasMove()) { shout('Neu gemischt'); shuffle(); }
}
async function resolve(swapCells) {
  let cascade = 0;
  for (;;) {
    const runs = findRuns(); if (!runs.length) break;
    const groups = groupRuns(runs), set = new Map(), make = [];
    for (const g of groups) {
      const lens = g.runs.map(r => r.cells.length), maxLen = Math.max(...lens);
      const hasH = g.runs.some(r => r.dir === 'h'), hasV = g.runs.some(r => r.dir === 'v');
      let sp = null;
      if (maxLen >= 5) sp = 'star';
      else if (hasH && hasV) sp = 'b';
      else if (maxLen === 4) sp = g.runs.find(r => r.cells.length === 4).dir;
      for (const [k, c] of g.cells) set.set(k, c);
      if (sp) {
        let anchor = null;
        if (swapCells && cascade === 0) for (const c of swapCells) if (g.cells.has(c[0] + ',' + c[1]) && !at(c[0], c[1]).sp) anchor = c;
        if (!anchor) { const longest = g.runs.reduce((a, b) => a.cells.length >= b.cells.length ? a : b); const cand = longest.cells.filter(c => !at(c[0], c[1]).sp); anchor = cand[Math.floor(cand.length / 2)] || longest.cells[Math.floor(longest.cells.length / 2)]; }
        make.push({ anchor, sp, t: at(anchor[0], anchor[1]).t, size: g.cells.size });
      }
      const pts = (g.cells.size === 3 ? 60 : g.cells.size === 4 ? 120 : g.cells.size * 40) * (1 + cascade * .5);
      G.score += Math.round(pts);
      const c0 = [...g.cells.values()][Math.floor(g.cells.size / 2)];
      floatPts(c0[0], c0[1], Math.round(pts));
    }
    // neue Spezialsteine bleiben stehen
    for (const m of make) {
      const k = m.anchor[0] + ',' + m.anchor[1]; set.delete(k);
      const t = at(m.anchor[0], m.anchor[1]);
      if (t.sp && !t.fired) { set.set(k, m.anchor); continue; }
      collect(t, m.anchor[0], m.anchor[1]);
      t.sp = m.sp; t.fired = false; t.fresh = true; paint(t);
      t.el.classList.remove('born'); t.el.offsetWidth; t.el.classList.add('born');
    }
    if (cascade === 1) shout('Stark!'); else if (cascade === 2) shout('Wahnsinn!'); else if (cascade >= 3) shout('Bubatz-Kombo!');
    await clearCells(set, cascade);
    for (const m of make) { const t = at(m.anchor[0], m.anchor[1]); if (t) t.fresh = false; }
    await settle();
    cascade++;
  }
}
// räumt Zellen ab und löst Spezialsteine in Ketten aus
async function clearCells(set, cascade) {
  const queue = [...set.values()];
  while (queue.length) {
    const [x, y] = queue.pop(); const t = at(x, y);
    if (!t || t.fired || t.fresh || !t.sp) continue;
    t.fired = true;
    let add = [];
    if (t.sp === 'h') { for (let i = 0; i < N; i++) add.push([i, y]); beam(y, 'h'); }
    else if (t.sp === 'v') { for (let j = 0; j < N; j++) add.push([x, j]); beam(x, 'v'); }
    else if (t.sp === 'b') { for (let j = y - 1; j <= y + 1; j++) for (let i = x - 1; i <= x + 1; i++) add.push([i, j]); boom(x, y, 3); }
    else if (t.sp === 'star') { const tt = mostCommon(); for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const o = at(i, j); if (o && o.t === tt && o.sp !== 'star') add.push([i, j]); } }
    for (const c of add) { const k = c[0] + ',' + c[1]; if (at(c[0], c[1]) && !set.has(k)) { set.set(k, c); queue.push(c); } }
    G.score += add.length * 20;
  }
  if (set.size >= 12) shake();
  for (const [x, y] of set.values()) {
    const t = at(x, y); if (!t || t.fresh) continue;
    collect(t, x, y);
    G.grid[y][x] = null;
    t.el.classList.add('pop');
    setTimeout(() => t.el.remove(), 280);
  }
  renderHud(); renderHelpers();
  await wait(240);
}
function collect(t, x, y) {
  if (t.sp !== 'star' && G.goals[t.t] > 0) G.goals[t.t]--;
  const m = G.moss[y][x]; if (m && !m.classList.contains('gone')) { m.classList.add('gone'); G.mossLeft--; }
  HELPERS.forEach((h, i) => { if (t.sp !== 'star' && t.t === h.feed) G.charge[i] = Math.min(h.need, G.charge[i] + 1); });
}
function mostCommon() {
  const c = new Array(KINDS).fill(0);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const t = at(x, y); if (t && t.sp !== 'star') c[t.t]++; }
  return c.indexOf(Math.max(...c));
}
// Schwerkraft und Nachfüllen
async function settle() {
  let maxDur = 0;
  for (let x = 0; x < N; x++) {
    let write = N - 1;
    for (let y = N - 1; y >= 0; y--) {
      const t = G.grid[y][x];
      if (t) { if (write !== y) { G.grid[write][x] = t; G.grid[y][x] = null; const d = .1 + (write - y) * .05; place(t, x, write, d); maxDur = Math.max(maxDur, d); } write--; }
    }
    const missing = write + 1;
    for (let k = 0; k < missing; k++) {
      const y = write - k, t = newTile(randKind(x, y));
      place(t, x, y - missing - 1, 0); G.grid[y][x] = t;
    }
  }
  boardEl.offsetWidth;
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
    const t = G.grid[y][x]; if (t.y !== y) { const d = .12 + (y - t.y) * .045; place(t, x, y, d); maxDur = Math.max(maxDur, d); }
  }
  await wait(maxDur * 1000 + 40);
}

// ---------- Helfer der Bande ----------
async function useHelper(i) {
  if (G.busy || G.over) return;
  const h = HELPERS[i]; if (G.charge[i] < h.need) return;
  if (i === 1) { G.armed = G.armed === 1 ? -1 : 1; renderHelpers(); return; }
  G.busy = true; G.charge[i] = 0; clearHint(); select(null);
  const set = new Map();
  if (i === 0) {
    const cells = []; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) cells.push([x, y]);
    cells.sort(() => Math.random() - .5);
    for (const c of cells.slice(0, 9)) { set.set(c[0] + ',' + c[1], c); boom(c[0], c[1], 1.2); }
    shout('Feuerregen!');
  } else {
    const tt = mostCommon();
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const t = at(x, y); if (t.t === tt && t.sp !== 'star') set.set(x + ',' + y, [x, y]); }
    shout('Kristallzauber!');
  }
  await clearCells(set, 0); await settle(); await resolve(null);
  endTurn(); renderHelpers();
}
async function hammer(x, y) {
  G.busy = true; G.armed = -1; G.charge[1] = 0; clearHint();
  const set = new Map(); for (let j = y - 1; j <= y + 1; j++) for (let i = x - 1; i <= x + 1; i++) if (at(i, j)) set.set(i + ',' + j, [i, j]);
  boom(x, y, 3.2); shake(); shout('Hammerschlag!');
  await clearCells(set, 0); await settle(); await resolve(null);
  endTurn(); renderHelpers();
}

// ---------- Eingabe: ziehen oder antippen ----------
let drag = null;
function cellFrom(e) {
  const r = boardEl.getBoundingClientRect();
  return [Math.floor((e.clientX - r.left) / r.width * N), Math.floor((e.clientY - r.top) / r.height * N)];
}
boardEl.addEventListener('pointerdown', e => {
  if (!G || G.busy || G.over) return;
  const [x, y] = cellFrom(e); if (!at(x, y)) return;
  if (G.armed === 1) return hammer(x, y);
  drag = { x, y, sx: e.clientX, sy: e.clientY, moved: false };
  boardEl.setPointerCapture(e.pointerId);
});
boardEl.addEventListener('pointermove', e => {
  if (!drag || drag.moved) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy, th = boardEl.getBoundingClientRect().width / N * .35;
  if (Math.abs(dx) < th && Math.abs(dy) < th) return;
  drag.moved = true;
  const tx = drag.x + (Math.abs(dx) > Math.abs(dy) ? Math.sign(dx) : 0), ty = drag.y + (Math.abs(dy) >= Math.abs(dx) ? Math.sign(dy) : 0);
  if (at(tx, ty)) trySwap([drag.x, drag.y], [tx, ty]);
});
boardEl.addEventListener('pointerup', () => {
  if (!drag) return;
  if (!drag.moved) {
    const s = G.sel;
    if (s && Math.abs(s[0] - drag.x) + Math.abs(s[1] - drag.y) === 1) trySwap(s, [drag.x, drag.y]);
    else if (s && s[0] === drag.x && s[1] === drag.y) select(null);
    else select([drag.x, drag.y]);
  }
  drag = null;
});
function select(c) {
  if (G.sel) { const t = at(G.sel[0], G.sel[1]); if (t) t.el.classList.remove('sel'); }
  G.sel = c;
  if (c) at(c[0], c[1]).el.classList.add('sel');
}
// Tipp nach ein paar Sekunden ohne Zug
let hintEls = [];
function clearHint() { hintEls.forEach(el => el.classList.remove('hint')); hintEls = []; if (G) G.idle = 0; }
setInterval(() => {
  if (!G || G.busy || G.over || !$('ov').classList.contains('hide')) return;
  G.idle++;
  if (G.idle === 7 && !hintEls.length) { const m = findMove(); if (m) { hintEls = m.map(c => at(c[0], c[1]).el); hintEls.forEach(el => el.classList.add('hint')); } }
}, 1000);

// ---------- Anzeige ----------
function renderHud() {
  $('lvl').textContent = G.n;
  $('moves').textContent = G.moves;
  $('stMoves').classList.toggle('low', G.moves <= 5 && !G.over);
  $('score').textContent = G.score;
  const max = G.t3 * 1.1;
  $('sbar').style.width = Math.min(100, G.score / max * 100) + '%';
  const firstGoal = 100 * (G.t2 * .45) / max;
  [[ 's1', firstGoal, won() ], ['s2', G.t2 / max * 100, G.score >= G.t2], ['s3', G.t3 / max * 100, G.score >= G.t3]].forEach(([id, p, on]) => { const e = $(id); e.style.left = p + '%'; e.classList.toggle('on', !!on); });
  const g = [];
  for (const [t, n] of Object.entries(G.goals)) g.push(`<div class="goal ${n <= 0 ? 'done' : ''}" title="${NAMES[t]}">${ico(t)}<b>${n <= 0 ? '✓' : n}</b></div>`);
  if (G.def.moss) g.push(`<div class="goal ${G.mossLeft <= 0 ? 'done' : ''}" title="Moos"><div class="moss"></div><b>${G.mossLeft <= 0 ? '✓' : G.mossLeft}</b></div>`);
  $('goals').innerHTML = g.join('');
}
function renderHelpers() {
  $('helpers').innerHTML = HELPERS.map((h, i) => {
    const p = Math.round(G.charge[i] / h.need * 100), ready = p >= 100;
    return `<button class="helper ${ready ? 'ready' : ''} ${G.armed === i ? 'armed' : ''}" data-h="${i}" title="${h.d}"><div class="ring" style="--p:${p}"><img src="../krieg/img/${h.img}.jpg" alt=""></div><small>${h.n}</small><span>${ready ? (i === 1 ? 'Tippen, dann Stein wählen' : 'Bereit! Antippen') : 'lädt mit ' + NAMES[h.feed]}</span></button>`;
  }).join('');
  $('armedTip').classList.toggle('on', G.armed === 1);
}
$('helpers').addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (b) useHelper(+b.dataset.h); });

// Effekte
function shout(t) { const d = document.createElement('div'); d.className = 'shout'; d.textContent = t; boardEl.parentElement.appendChild(d); setTimeout(() => d.remove(), 1150); }
function floatPts(x, y, p) { const d = document.createElement('div'); d.className = 'pts'; d.textContent = '+' + p; d.style.left = (x + .5) * 12.5 + '%'; d.style.top = (y + .5) * 12.5 + '%'; boardEl.appendChild(d); setTimeout(() => d.remove(), 950); }
function beam(i, dir) { const d = document.createElement('div'); d.className = 'beam ' + dir; if (dir === 'h') Object.assign(d.style, { left: 0, right: 0, top: (i + .3) * 12.5 + '%', height: 12.5 * .4 + '%' }); else Object.assign(d.style, { top: 0, bottom: 0, left: (i + .3) * 12.5 + '%', width: 12.5 * .4 + '%' }); boardEl.appendChild(d); setTimeout(() => d.remove(), 380); }
function boom(x, y, s) { const d = document.createElement('div'); d.className = 'boom'; const w = 12.5 * s; Object.assign(d.style, { left: (x + .5) * 12.5 - w / 2 + '%', top: (y + .5) * 12.5 - w / 2 + '%', width: w + '%', height: w + '%' }); boardEl.appendChild(d); setTimeout(() => d.remove(), 470); }
function shake() { boardEl.classList.remove('shake'); boardEl.offsetWidth; boardEl.classList.add('shake'); }

// ---------- Sieg & Niederlage ----------
const won = () => G && Object.values(G.goals).every(v => v <= 0) && G.mossLeft <= 0;
async function win() {
  G.over = true; G.busy = true;
  shout('Geschafft!');
  await wait(900);
  // Bonusrunde: übrige Züge werden zu Linien-Steinen
  let left = Math.min(G.moves, 12);
  while (left-- > 0) {
    const cells = []; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!at(x, y).sp) cells.push([x, y]);
    const c = cells[Math.floor(Math.random() * cells.length)]; const t = at(c[0], c[1]);
    t.sp = Math.random() < .5 ? 'h' : 'v'; paint(t); G.moves--; G.score += 150; renderHud();
    const set = new Map([[c[0] + ',' + c[1], c]]);
    await clearCells(set, 0); await settle(); await resolve(null);
  }
  G.score += G.moves * 150; G.moves = 0; renderHud();
  const stars = G.score >= G.t3 ? 3 : G.score >= G.t2 ? 2 : 1;
  save.stars[G.n] = Math.max(save.stars[G.n] || 0, stars);
  save.unlocked = Math.max(save.unlocked, G.n + 1);
  save.best = Math.max(save.best || 0, G.score);
  persist();
  G.busy = false;
  showMenu('win', stars);
}
function lose() { G.over = true; showMenu('lose'); }

// ---------- Menüs ----------
const ov = $('ov'), box = $('box');
function hideMenu() { ov.classList.add('hide'); }
function levelGrid() {
  const max = Math.max(save.unlocked + 2, 15), out = [];
  for (let i = 1; i <= max; i++) {
    const st = save.stars[i] || 0, lock = i > save.unlocked;
    out.push(`<button class="lv ${lock ? 'lock' : ''} ${i === save.unlocked ? 'cur' : ''}" data-l="${i}" ${lock ? 'disabled' : ''}>${lock ? '🔒' : i}${st ? `<i>${'★'.repeat(st)}</i>` : ''}</button>`);
  }
  return `<div class="levels">${out.join('')}</div>`;
}
function bindLevels() { box.querySelectorAll('[data-l]').forEach(b => b.onclick = () => startLevel(+b.dataset.l)); }
function goalText(def) {
  const p = Object.entries(def.goals || {}).map(([t, n]) => `${n} ${NAMES[t]}`);
  if (def.moss) p.push('alles Moos entfernen');
  return p.join(' · ');
}
function showMenu(kind, stars) {
  ov.classList.remove('hide');
  if (kind === 'start') {
    box.innerHTML = `<img class="heroimg" src="../krieg/img/hero.jpg" alt=""><h2>Kräuter-Match</h2><div class="orn">✦ 🌿 ✦</div>
      <p>Tausch Kräuter, Kristalle und Gold, bis drei gleiche in einer Reihe liegen. Die Bande hilft dir dabei.</p>
      <button class="go" id="go">▶ ${save.unlocked > 1 ? 'Weiter mit Level ' + save.unlocked : 'PLAY'}</button>
      <button class="go alt" id="lvls">Levelauswahl</button>
      <ul class="how">
        <li><b>4 in einer Reihe</b> ergibt einen Linien-Stein, der die ganze Reihe abräumt.</li>
        <li><b>L- oder T-Form</b> ergibt eine Bombe für 3×3.</li>
        <li><b>5 in einer Reihe</b> ergibt Mollymanns Kristall. Tausch ihn mit einem Stein, dann verschwindet diese Farbe komplett.</li>
        <li><b>Die Bande:</b> Kobold, Fokuhila und Mollymann laden sich mit ihren Steinen auf und helfen mit Spezialangriffen.</li>
        <li><b>Moos</b> verschwindet, wenn du darauf einen Treffer landest.</li>
      </ul>`;
    $('go').onclick = () => startLevel(save.unlocked);
    $('lvls').onclick = () => showMenu('levels');
  } else if (kind === 'levels') {
    box.innerHTML = `<h2>Levelauswahl</h2><div class="orn">✦ 🌿 ✦</div>${levelGrid()}<button class="go alt" id="back">Zurück</button>`;
    bindLevels(); $('back').onclick = () => G && !G.over ? hideMenu() : showMenu('start');
  } else if (kind === 'win') {
    const next = G.n + 1;
    box.innerHTML = `<h2>Level ${G.n} geschafft!</h2>
      <div class="bigstars">${[1, 2, 3].map((s, i) => `<span class="${s <= stars ? 'on' : ''}" style="animation-delay:${.2 + i * .25}s">★</span>`).join('')}</div>
      <p><b class="c" style="color:var(--gold2);font-size:22px">${G.score}</b> Punkte</p>
      <p style="color:var(--mut);font-size:13px">Nächstes Ziel: ${goalText(levelDef(next))}</p>
      <div class="row"><button class="go alt" id="again">Nochmal</button><button class="go" id="next">Level ${next} ▶</button></div>`;
    $('again').onclick = () => startLevel(G.n); $('next').onclick = () => startLevel(next);
  } else if (kind === 'lose') {
    box.innerHTML = `<h2>Keine Züge mehr</h2><div class="orn">✦ 🌿 ✦</div>
      <p>Knapp daneben. Noch offen: ${[...Object.entries(G.goals).filter(([, n]) => n > 0).map(([t, n]) => n + ' ' + NAMES[t]), ...(G.mossLeft > 0 ? [G.mossLeft + ' Moos'] : [])].join(' · ')}</p>
      <div class="row"><button class="go alt" id="lvls">Level</button><button class="go" id="again">Nochmal</button></div>`;
    $('again').onclick = () => startLevel(G.n); $('lvls').onclick = () => showMenu('levels');
  }
}
$('btnLevels').onclick = () => { if (!G || !G.busy) showMenu('levels'); };
showMenu('start');
// Zum Testen
window.KM = { get G() { return G; }, startLevel, trySwap, findMove, useHelper, win };
</script>
</body>
</html>
