<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kräuter-Match · Bubatzbande</title>
<meta name="theme-color" content="#0b1108">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a06;--txt:#f1e6c8;--mut:#a59a7c;--gold:#d4af37;--gold2:#f0d37a;--line:#7a6128}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{height:100%;color:var(--txt);font:15px/1.35 Georgia,serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
body::before{content:"";position:fixed;inset:-30px;background:url(../krieg/img/hoehle.jpg) center/cover;filter:blur(10px) brightness(.5) saturate(1.1);z-index:-2}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 30%,rgba(0,0,0,.65) 100%);z-index:-1;pointer-events:none}
.c{font-family:"Cinzel",Georgia,serif}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(#19220f,#0b1108);border-bottom:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.6);z-index:3}
.top a,.top button{color:var(--gold2);text-decoration:none;background:linear-gradient(#1f2c19,#0f170c);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font:800 14px "Cinzel",serif;cursor:pointer}
.top h1{font:900 18px "Cinzel Decorative","Cinzel",serif;background:linear-gradient(#fff3c4,#d4af37 60%,#8a6a1d);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto;white-space:nowrap}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 12px max(10px,env(safe-area-inset-bottom))}
.side{display:flex;flex-direction:column;gap:10px;width:250px}
.card{background:linear-gradient(rgba(19,28,15,.92),rgba(9,13,7,.92));border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(240,211,122,.12),0 10px 30px rgba(0,0,0,.5)}
.stats{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.stat b{display:block;font:800 26px "Cinzel",serif;color:var(--gold2);line-height:1.05}
.stat span{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.stat.low b{color:#ff8a6a;animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.scorebar{position:relative;height:10px;border-radius:6px;background:#0a0f08;border:1px solid #3a3418;margin-top:8px;overflow:visible}
.scorebar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#3e7530,#9fe36a);box-shadow:0 0 10px rgba(140,230,90,.5);transition:width .3s}
.scorebar em{position:absolute;top:-7px;font-style:normal;font-size:14px;transform:translateX(-50%);color:#4a4430;text-shadow:0 1px 0 #000;transition:color .3s}
.scorebar em.on{color:#ffd36a;text-shadow:0 0 8px rgba(255,210,100,.8)}
.goals{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.goal{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.2);border-radius:8px;padding:5px 9px 5px 5px}
.goal svg{width:30px;height:30px}
.goal b{font:800 18px "Cinzel",serif;color:var(--txt)}
.goal.done b{color:#9fe36a}
.goal .moss{width:30px;height:30px;border-radius:6px;background:radial-gradient(circle at 35% 35%,#7fb94a,#3c6a24 60%,#26431a);box-shadow:inset 0 0 6px rgba(0,0,0,.6)}
.helpers{display:flex;gap:8px;justify-content:space-between}
.helper{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--txt);font:inherit;cursor:pointer;padding:2px}
.helper .ring{position:relative;width:62px;height:62px;border-radius:50%;padding:3px;background:conic-gradient(#9fe36a calc(var(--p)*1%),#2a2a1c 0);box-shadow:0 4px 12px rgba(0,0,0,.6)}
.helper img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 15%;border:2px solid #0a0f08;filter:grayscale(.55) brightness(.75);transition:filter .3s}
.helper.ready img{filter:none}
.helper.ready .ring{background:conic-gradient(#ffd36a 100%,#0000 0);box-shadow:0 0 0 2px rgba(255,211,106,.4),0 0 18px rgba(255,200,90,.7);animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,211,106,.25),0 0 26px rgba(255,200,90,.9)}}
.helper.armed .ring{background:conic-gradient(#ff8a5a 100%,#0000 0)}
.helper small{font:800 11px "Cinzel",serif;color:var(--gold2);text-align:center;line-height:1.1}
.helper span{font-size:10px;color:var(--mut);text-align:center;line-height:1.15}
.boardWrap{position:relative;width:min(92vw,calc(100vh - 150px),620px);aspect-ratio:1;padding:10px;border-radius:14px;background:linear-gradient(#1b2615,#0b1009);border:1px solid var(--gold);outline:1px solid #3a3418;outline-offset:4px;box-shadow:0 20px 60px rgba(0,0,0,.75),inset 0 0 40px rgba(0,0,0,.6)}
.board{position:relative;width:100%;height:100%;touch-action:none}
.cell{position:absolute;width:12.5%;height:12.5%;border-radius:8px}
.cell.a{background:rgba(255,255,255,.035)}
.cell.moss::after{content:"";position:absolute;inset:6%;border-radius:22%;background:radial-gradient(circle at 30% 30%,#86c24e,#3d6c25 55%,#23401a);box-shadow:inset 0 0 8px rgba(0,0,0,.6),0 0 8px rgba(110,190,70,.25);opacity:.9}
.cell.moss.gone::after{animation:mossGone .5s forwards}
@keyframes mossGone{to{transform:scale(1.5);opacity:0}}
.tile{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .2s ease-in;will-change:transform;z-index:1}
.tile .in{position:absolute;inset:6%;border-radius:22%;transition:transform .15s}
.tile svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6))}
.tile.sel .in{transform:scale(1.12);background:radial-gradient(circle,rgba(255,240,180,.25),transparent 70%);box-shadow:0 0 0 2px var(--gold2)}
.tile.pop .in{animation:pop .26s forwards}
@keyframes pop{40%{transform:scale(1.3);filter:brightness(1.8)}100%{transform:scale(0);opacity:0}}
.tile.hint .in{animation:hint .9s ease-in-out infinite}
@keyframes hint{25%{transform:scale(1.12) rotate(-6deg)}75%{transform:scale(1.12) rotate(6deg)}}
.tile.born .in{animation:born .35s}
@keyframes born{0%{transform:scale(.3);filter:brightness(2.5)}}
.tile.sp-h .in::after,.tile.sp-v .in::after{content:"";position:absolute;inset:10%;border-radius:20%;pointer-events:none;mix-blend-mode:screen;animation:shine 1.4s linear infinite}
.tile.sp-h .in::after{background:repeating-linear-gradient(0deg,transparent 0 18%,rgba(255,255,255,.55) 18% 26%)}
.tile.sp-v .in::after{background:repeating-linear-gradient(90deg,transparent 0 18%,rgba(255,255,255,.55) 18% 26%)}
@keyframes shine{50%{opacity:.55}}
.tile.sp-b .in{border-radius:50%;box-shadow:0 0 0 2px rgba(255,220,120,.85),0 0 16px rgba(255,180,80,.8);animation:bomb 1s ease-in-out infinite}
@keyframes bomb{50%{box-shadow:0 0 0 3px rgba(255,240,160,1),0 0 24px rgba(255,160,60,1)}}
.tile.star .in{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fx{position:absolute;pointer-events:none;z-index:5}
.beam{position:absolute;background:linear-gradient(90deg,transparent,rgba(255,240,190,.95),transparent);border-radius:4px;z-index:4;pointer-events:none;animation:beam .35s forwards}
.beam.v{background:linear-gradient(0deg,transparent,rgba(255,240,190,.95),transparent)}
@keyframes beam{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.boom{position:absolute;border-radius:50%;z-index:4;pointer-events:none;background:radial-gradient(circle,rgba(255,240,180,.95),rgba(255,150,60,.6) 40%,transparent 70%);animation:boomA .45s forwards}
@keyframes boomA{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.4);opacity:0}}
.pts{position:absolute;z-index:6;font:800 20px "Cinzel",serif;color:#ffe9a8;text-shadow:0 2px 0 #000,0 0 10px rgba(255,200,90,.7);pointer-events:none;transform:translate(-50%,-50%);animation:pts .9s forwards;white-space:nowrap}
@keyframes pts{100%{transform:translate(-50%,-160%);opacity:0}}
.shout{position:absolute;left:50%;top:42%;z-index:7;transform:translate(-50%,-50%);font:900 clamp(28px,7vw,52px) "Cinzel Decorative","Cinzel",serif;background:linear-gradient(#fff6d6,#f0d37a 45%,#b8902c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #1a0f05) drop-shadow(0 0 20px rgba(240,200,90,.6));pointer-events:none;animation:shout 1.1s forwards;white-space:nowrap}
@keyframes shout{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.board.shake{animation:shake .3s}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
.armedTip{position:absolute;left:50%;top:14px;transform:translate(-50%,0);box-shadow:0 6px 20px rgba(0,0,0,.7);background:#3a1a10;border:1px solid #ff8a5a;color:#ffd2c0;font:800 12px "Cinzel",serif;padding:4px 10px;border-radius:6px;white-space:nowrap;z-index:8;display:none}
.armedTip.on{display:block}
/* Menüs */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,rgba(8,14,6,.6),rgba(2,3,2,.94))}
.ov.hide{display:none}
.box{position:relative;width:100%;max-width:560px;max-height:100%;overflow:auto;background:linear-gradient(#131c0f,#090d07);border:1px solid var(--gold);outline:1px solid #4a3c18;outline-offset:5px;border-radius:12px;box-shadow:0 30px 90px rgba(0,0,0,.85);text-align:center;padding:22px 20px}
.box h2{font:900 30px "Cinzel Decorative","Cinzel",serif;background:linear-gradient(#fff3c4,#d4af37 55%,#8a6a1d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000)}
.box p{color:#e2d2ad;margin:8px 0}
.orn{color:var(--gold);letter-spacing:.4em;font-size:12px;margin:4px 0}
.go{display:block;width:100%;margin-top:14px;padding:13px;border:1px solid var(--gold);border-radius:7px;background:linear-gradient(#3e7530,#1c3f15);color:#f8e9b4;font:800 17px "Cinzel",serif;letter-spacing:.14em;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,240,180,.35),0 0 0 3px #070a05,0 0 0 4px var(--line),0 8px 24px rgba(60,150,50,.3)}
.go:hover{filter:brightness(1.12)}
.go.alt{background:linear-gradient(#202e1a,#0f170c);color:var(--gold2);box-shadow:0 0 0 3px #070a05,0 0 0 4px #4a3c18}
.row{display:flex;gap:10px}.row .go{flex:1}
.bigstars{font-size:44px;letter-spacing:6px;margin:6px 0;color:#3a3418}
.bigstars span{display:inline-block;transform:scale(0);animation:star .4s forwards}
.bigstars span.on{color:#ffd36a;text-shadow:0 0 18px rgba(255,200,80,.8)}
@keyframes star{to{transform:scale(1)}}
.how{text-align:left;font-size:13.5px;color:#e2d2ad;margin:12px 0 0;padding-left:18px}
.how li{margin:5px 0}.how b{color:var(--gold2);font-family:"Cinzel",serif}
.heroimg{display:block;width:calc(100% + 40px);margin:-22px -20px 6px;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);max-height:190px;object-fit:cover;object-position:50% 30%}

.cell.moss2::after{background:radial-gradient(circle at 30% 30%,#5a9a34,#24481a 55%,#122a0e);box-shadow:inset 0 0 0 3px rgba(150,220,90,.55),inset 0 0 10px rgba(0,0,0,.8)}
.goal .moss.m2{background:radial-gradient(circle at 35% 35%,#5a9a34,#24481a 60%,#122a0e);box-shadow:inset 0 0 0 2px rgba(150,220,90,.6)}
.tile.lock .in::before{content:"";position:absolute;inset:-2%;z-index:2;border-radius:22%;pointer-events:none;border:3px solid #9aa2ab;
  background:linear-gradient(45deg,transparent 43%,#b8c0c8 43% 49%,#5a6068 49% 52%,transparent 52%),linear-gradient(-45deg,transparent 43%,#b8c0c8 43% 49%,#5a6068 49% 52%,transparent 52%);box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
.tile.crown .in{animation:crown 1.6s ease-in-out infinite}
@keyframes crown{50%{filter:drop-shadow(0 0 8px rgba(255,210,100,.9))}}
.tile.nope .in{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-8%)}75%{transform:translateX(8%)}}
.saga{position:relative;height:120px;margin:10px -6px 4px}
.saga svg{position:absolute;inset:0;width:100%;height:100%}
.saga path{fill:none;stroke:#7a6128;stroke-width:5;stroke-dasharray:2 12;stroke-linecap:round;vector-effect:non-scaling-stroke}
.node{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 15px "Cinzel",serif;border:2px solid #4a3c18;background:#141a10;color:#6a6450;box-shadow:0 0 0 3px #070a05,0 6px 12px rgba(0,0,0,.6)}
.node.done{background:radial-gradient(circle at 40% 35%,#f0d37a,#a8862f 70%);border-color:#fff3c4;color:#2a1a06}
.node.done i{position:absolute;bottom:-14px;font-style:normal;font-size:10px;letter-spacing:-1px;color:#ffd36a;white-space:nowrap;text-shadow:0 1px 0 #000}
.node.now{width:52px;height:52px;margin:-26px 0 0 -26px;background:radial-gradient(circle at 40% 35%,#6ac04a,#1c3f15 75%);border-color:#c8f59a;color:#fff;font-size:19px;z-index:2;animation:nowG 1.4s ease-in-out infinite}
@keyframes nowG{50%{box-shadow:0 0 0 3px #070a05,0 0 0 6px rgba(160,240,110,.5),0 0 26px rgba(140,230,90,.8)}}
.node .me{position:absolute;top:-34px;width:30px;height:30px;border-radius:50%;border:2px solid #f0d37a;object-fit:cover;object-position:50% 15%;box-shadow:0 3px 8px rgba(0,0,0,.7);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.node em{position:absolute;top:-12px;right:-10px;font-style:normal;font-size:14px;filter:drop-shadow(0 1px 2px #000)}
.node.boss{border-color:#a8442e}.node.boss.lock{background:radial-gradient(circle,#3a140e,#140806)}
.lvcard{background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.35);border-radius:10px;padding:10px 12px;margin-top:8px}
.lvcard.boss{border-color:#c8543a;background:linear-gradient(rgba(60,16,10,.55),rgba(0,0,0,.4))}
.lvh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.lvh b{font:900 19px "Cinzel",serif;color:var(--gold2)}.lvh span{font-size:13px;color:var(--mut)}
.lvcard.nx .lvh b{font-size:14px}
.spx{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:8px}.spx:empty{display:none}
.spx span{font:800 11px "Cinzel",serif;padding:3px 8px;border-radius:10px;background:#1c2a14;border:1px solid #4a6a2a;color:#cfeaa8}
.spx .bs{background:#4a140e;border-color:#c8543a;color:#ffc4b0}
.lvcard .goals .goal{background:rgba(0,0,0,.4)}
.tip{font-size:13px;color:#cfeaa8 !important;margin:8px 0 0 !important}
.howd{margin-top:10px}.howd summary{cursor:pointer;color:var(--gold2);font:800 13px "Cinzel",serif;list-style:none}.howd summary::-webkit-details-marker{display:none}
.box .heroimg+h2,.ba-head+h2{margin-top:-4px}
/* Layout */
@media (max-aspect-ratio:1/1){
  main{flex-direction:column;gap:12px;justify-content:center}
  .side{width:min(92vw,620px);display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .side .card{padding:8px 10px}
  .side .cGoals{grid-column:1/-1;order:-1}
  .boardWrap{width:min(94vw,calc(100vh - 330px),620px);padding:6px}
  .stat b{font-size:22px}
  .helper .ring{width:48px;height:48px}
  .helper span{display:none}
}
@media (max-aspect-ratio:1/1) and (max-height:700px){.helper small{display:none}.side .cHelp{padding:6px}}
@media (min-aspect-ratio:1/1) and (max-height:520px){.side{width:200px}.side .card{padding:6px 8px}.helper .ring{width:44px;height:44px}.helper span{display:none}.stat b{font-size:20px}.top{padding-top:4px;padding-bottom:4px}.boardWrap{width:min(92vw,calc(100vh - 70px))}}
</style>
</head>

<script>
'use strict';
const N = 8, KINDS = 6, STAR = 6;

// Helfer aus der Bande: laden sich mit ihrem Stein auf
const HELPERS = [
  { id: 'kobold', img: 'kobold', n: 'Kobold', d: 'Feuerregen: 9 Steine brennen weg', feed: 5, need: 22 },
  { id: 'fokuhila', img: 'fokuhila', n: 'Fokuhila', d: 'Hammer: zerschlägt 3×3', feed: 2, need: 22 },

const CROWN = 7, CRATE = 8;
// Muster für Moos, Kisten und Ketten
const PAT = {
  center: (x, y) => x >= 2 && x <= 5 && y >= 2 && y <= 5,

// Level 1–20 von Hand, danach wird jedes Level aus seiner Nummer gebaut (immer gleich, aber immer schwerer)
const LEVELS = [
  { moves: 20, goals: { 0: 12 }, kinds: 5, tip: 'Tausch zwei Steine, bis drei gleiche in einer Reihe liegen.' },
  { moves: 20, goals: { 2: 15, 1: 10 }, kinds: 5 },
  { moves: 22, moss: 'center', kinds: 5, tip: 'Neu: Moos. Mach einen Treffer auf dem Feld, dann ist es weg.' },
  { moves: 20, goals: { 3: 18, 4: 18 }, kinds: 5 },
  { moves: 22, crowns: 1, kinds: 5, tip: 'Neu: Königskrone. Bring sie bis in die unterste Reihe.' },
  { moves: 22, moss: 'rows', goals: { 0: 18 }, kinds: 5 },
  { moves: 24, crates: 'mid', kinds: 5, tip: 'Neu: Spießer-Kisten. Ein Treffer direkt daneben zerschlägt sie.' },
  { moves: 22, crowns: 2, goals: { 5: 20 }, kinds: 5 },
  { moves: 24, moss: 'frame' },
  { moves: 25, moss: 'diamond', crates: 'corners', goals: { 2: 22 }, boss: 1 },
  { moves: 24, locks: 'checker', goals: { 1: 22 }, tip: 'Neu: Ketten. Verkettete Steine lassen sich nicht tauschen. Ein Treffer sprengt die Kette.' },
  { moves: 25, moss2: 'center', tip: 'Neu: Dickes Moos. Braucht zwei Treffer.' },
  { moves: 24, crates: 'mid', hp: 2, tip: 'Neu: Eisenkisten halten zwei Schläge aus.' },
  { moves: 26, crowns: 2, locks: 'checker' },
  { moves: 26, moss: 'x', goals: { 0: 25, 3: 25 } },
  { moves: 27, crates: 'ring', crowns: 2 },
  { moves: 26, locks: 'plus', moss: 'frame' },
  { moves: 30, moss2: 'low' },
  { moves: 25, goals: { 0: 26, 1: 26, 5: 26 }, crates: 'corners', hp: 2 },
  { moves: 32, moss2: 'diamond', crowns: 2, locks: 'frame', boss: 1 },

const PK = ['center', 'rows', 'frame', 'x', 'diamond', 'mid', 'plus', 'low', 'cols', 'ring', 'bottom'];
const CK = ['mid', 'corners', 'sides', 'ring', 'checker', 'bottom', 'cols'];
function levelDef(n) {
  if (n <= LEVELS.length) return { kinds: 6, ...LEVELS[n - 1] };
  const r = mulberry(n * 977 + 13), d = n - LEVELS.length, boss = n % 10 === 0;
  const pick = a => a[Math.floor(r() * a.length)];
  const def = { kinds: 6, moves: 26 - Math.min(5, Math.floor(d / 12)) + (boss ? 3 : 0), boss: boss ? 1 : 0 };
  const types = ['goals', 'moss', 'crowns', 'crates']; const main = pick(types);
  const breather = n % 10 === 1 || n % 10 === 2;
  const extra = Math.max(0, Math.min(2, (r() < .5 + d * .012 ? 1 : 0) + (boss ? 1 : 0) + (d > 25 && r() < .35 ? 1 : 0) - (breather ? 1 : 0)));
  const use = new Set([main]); for (let i = 0; i < extra; i++) use.add(pick(['goals', 'moss', 'crowns', 'crates', 'locks']));
  const dbl = r() < Math.min(.6, .25 + d * .015);
  if (use.has('goals')) { const k = 2 + (r() < .35 ? 1 : 0), amt = Math.min(38, 22 + Math.floor(d * .5)); def.goals = {}; const ks = [0, 1, 2, 3, 4, 5].sort(() => r() - .5); for (let i = 0; i < k; i++) def.goals[ks[i]] = amt - i * 2; }
  if (use.has('moss')) def[dbl ? 'moss2' : 'moss'] = pick(dbl ? ['center', 'diamond', 'mid', 'ring', 'bottom'] : PK);
  if (use.has('crowns')) def.crowns = Math.min(4, 2 + Math.floor(d / 12) + (r() < .3 ? 1 : 0));
  if (use.has('crates')) { def.crates = pick(CK); if (r() < Math.min(.7, .15 + d * .02)) def.hp = 2; }
  if (use.has('locks')) def.locks = pick(['checker', 'frame', 'plus', 'rows', 'cols', 'x']);

}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- Speicher ----------
let save = { level: 1, stars: {}, t: 0 };
try { const j = JSON.parse(localStorage.getItem('km_save') || 'null'); if (j && (j.level || j.unlocked)) save = { stars: {}, ...j, level: j.level || j.unlocked }; } catch (e) {}
const persist = (cloud) => { save.t = Date.now(); try { localStorage.setItem('km_save', JSON.stringify(save)); } catch (e) {} if (cloud !== false && window.BB && BB.cloud) BB.cloud.put('match', save); };

// ---------- Zustand ----------
const $ = id => document.getElementById(id);
const boardEl = $('board');
let G = null, uid = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));

function newTile(t, sp = null) {
  const el = document.createElement('div'); el.className = 'tile';
  el.innerHTML = '<div class="in"></div>';
  const tile = { id: uid++, t, sp, el };
  paint(tile); boardEl.appendChild(el); return tile;
}
function paint(tile) {
  tile.el.querySelector('.in').innerHTML = ico(tile.sp === 'star' ? STAR : tile.t === CRATE ? (tile.hp > 1 ? 9 : 8) : tile.t);
  tile.el.classList.toggle('lock', !!tile.lock);
  tile.el.classList.toggle('crate', tile.t === CRATE);
  tile.el.classList.toggle('crown', tile.t === CROWN);
  tile.el.classList.toggle('sp-h', tile.sp === 'h');
  tile.el.classList.toggle('sp-v', tile.sp === 'v');
  tile.el.classList.toggle('sp-b', tile.sp === 'b');
  tile.el.classList.toggle('star', tile.sp === 'star');
}

  tile.x = x; tile.y = y;
  tile.el.style.transitionDuration = (dur == null ? .2 : dur) + 's';
  tile.el.style.transform = `translate(${x * 100}%,${y * 100}%)`;
}
const at = (x, y) => (x >= 0 && y >= 0 && x < N && y < N) ? G.grid[y][x] : null;
const kind = tile => !tile ? -1 : tile.sp === 'star' ? STAR : tile.t >= CROWN ? -1 : tile.t;
const fixed = t => !!t && (t.t === CRATE || !!t.lock);
const plain = t => !!t && !t.sp && t.t < CROWN;
const onBoard = k => { let c = 0; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const t = G.grid[y][x]; if (t && t.t === k) c++; } return c; };

function randKind(x, y) {
  for (let tries = 0; tries < 30; tries++) {
    const t = Math.floor(Math.random() * (G ? G.kinds : KINDS));
    const l1 = at(x - 1, y), l2 = at(x - 2, y), u1 = at(x, y - 1), u2 = at(x, y - 2);
    if (l1 && l2 && kind(l1) === t && kind(l2) === t) continue;
    if (u1 && u2 && kind(u1) === t && kind(u2) === t) continue;
    return t;
  }
  return Math.floor(Math.random() * (G ? G.kinds : KINDS));
}
// Nachfüllen: ab und zu fällt eine Krone von oben rein
function spawnKind(x, y) {
  if (G.crownsSpawned < G.crownTotal) {
    const ob = onBoard(CROWN);
    if (ob === 0 || (ob < 2 && Math.random() < .12)) { G.crownsSpawned++; return CROWN; }
  }
  return randKind(x, y);
}

function startLevel(n) {
  if (G && G.busy && !G.over) return;
  hideMenu();
  boardEl.innerHTML = '';
  const def = levelDef(n);
  const CBm = id => window.BB && BB.cardVal ? BB.cardVal(id) : 0;
  G = { n, def, kinds: def.kinds || KINDS, grid: [], moves: def.moves + Math.round(CBm('mr-mollymann')), score: 0, goals: { ...(def.goals || {}) }, moss: [], mossLeft: 0, busy: false, sel: null, charge: [0, 0, 0], armed: -1, over: false, idle: 0,
    crownTotal: def.crowns || 0, crownsLeft: def.crowns || 0, crownsSpawned: 0, cratesLeft: 0,
    t2: def.moves * 300, t3: def.moves * 520 };
  for (let y = 0; y < N; y++) {
    G.moss.push([]);
    for (let x = 0; x < N; x++) {
      const c = document.createElement('div'); c.className = 'cell' + ((x + y) % 2 ? '' : ' a'); c.style.left = x * 12.5 + '%'; c.style.top = y * 12.5 + '%';
      const hp = def.moss2 && PAT[def.moss2](x, y) ? 2 : def.moss && PAT[def.moss](x, y) ? 1 : 0;
      if (hp) { c.classList.add('moss'); if (hp > 1) c.classList.add('moss2'); G.mossLeft += hp; }

  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let t;
    if (def.crates && PAT[def.crates](x, y) && y > 0) { t = newTile(CRATE); t.hp = def.hp || 1; paint(t); G.cratesLeft++; }
    else { t = newTile(randKind(x, y)); if (def.locks && PAT[def.locks](x, y) && y > 0) { t.lock = true; paint(t); } }

  boardEl.offsetWidth;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) place(G.grid[y][x], x, y, .35 + (N - y) * .04);
  if (!hasMove()) shuffle();

}

// ---------- Treffer finden ----------
function findRuns() {
  const runs = [];
  for (let y = 0; y < N; y++) {
    let x = 0;
    while (x < N) {
      const t = kind(at(x, y)); let e = x + 1;
      if (t < 0 || t === STAR) { x++; continue; }
      while (e < N && kind(at(e, y)) === t) e++;
      if (e - x >= 3) runs.push({ dir: 'h', cells: Array.from({ length: e - x }, (_, i) => [x + i, y]) });
      x = e;
    }
  }
  for (let x = 0; x < N; x++) {
    let y = 0;
    while (y < N) {
      const t = kind(at(x, y)); let e = y + 1;
      if (t < 0 || t === STAR) { y++; continue; }
      while (e < N && kind(at(x, e)) === t) e++;
      if (e - y >= 3) runs.push({ dir: 'v', cells: Array.from({ length: e - y }, (_, i) => [x, y + i]) });

}
function groupRuns(runs) {
  const owner = new Map(), groups = [];

    let g = null;
    for (const [x, y] of r.cells) { const k = x + ',' + y; if (owner.has(k)) { g = owner.get(k); break; } }
    if (!g) { g = { runs: [], cells: new Map() }; groups.push(g); }

}
function swapModel(a, b) { const ta = at(a[0], a[1]), tb = at(b[0], b[1]); G.grid[a[1]][a[0]] = tb; G.grid[b[1]][b[0]] = ta; }

  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {

    if (!findRuns().length && hasMove()) break;

}

// ---------- Zug ausführen ----------
async function trySwap(a, b) {

  G.busy = true; clearHint(); select(null);
  const ta = at(a[0], a[1]), tb = at(b[0], b[1]);
  if (fixed(ta) || fixed(tb)) { const f = fixed(ta) ? ta : tb; f.el.classList.remove('nope'); f.el.offsetWidth; f.el.classList.add('nope'); G.busy = false; return; }
  swapModel(a, b); place(ta, b[0], b[1], .16); place(tb, a[0], a[1], .16);
  await wait(170);
  // Spezial-Kombis
  if (ta.sp === 'star' || tb.sp === 'star' || (ta.sp && tb.sp)) {
    G.moves--; renderHud();
    const set = new Map();
    if (ta.sp === 'star' && tb.sp === 'star') { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) set.set(x + ',' + y, [x, y]); shout('Kristallsturm!'); }
    else if (ta.sp === 'star' || tb.sp === 'star') {
      const st = ta.sp === 'star' ? ta : tb, other = st === ta ? tb : ta;
      set.set(st.x + ',' + st.y, [st.x, st.y]); st.fired = true;
      const tt = other.t < CROWN ? other.t : mostCommon();
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const t = at(x, y); if (t.sp !== 'star' && t.t === tt) { set.set(x + ',' + y, [x, y]); if (other.sp && t !== other) { t.sp = other.sp === 'b' ? 'b' : (Math.random() < .5 ? 'h' : 'v'); paint(t); } } }
      shout('Mollymanns Kristall!');
    } else { set.set(ta.x + ',' + ta.y, [ta.x, ta.y]); set.set(tb.x + ',' + tb.y, [tb.x, tb.y]); }

async function resolve(swapCells) {

      const t = at(m.anchor[0], m.anchor[1]);
      if ((t.sp && !t.fired) || t.lock) { set.set(k, m.anchor); continue; }

// räumt Zellen ab und löst Spezialsteine in Ketten aus
async function clearCells(set, cascade) {

    else if (t.sp === 'v') { for (let j = 0; j < N; j++) add.push([x, j]); beam(x, 'v'); }

    removeTile(t, x, y);

function removeTile(t, x, y) { G.grid[y][x] = null; t.el.classList.add('pop'); setTimeout(() => t.el.remove(), 280); }

  } else if (kind === 'win') {
    const next = levelDef(G.n + 1);
    box.innerHTML = `<h2>Level ${G.n} geschafft!</h2>
      <div class="bigstars">${[1, 2, 3].map((s, i) => `<span class="${s <= stars ? 'on' : ''}" style="animation-delay:${.2 + i * .25}s">★</span>`).join('')}</div>
      <p><b class="c" style="color:var(--gold2);font-size:22px">${G.score}</b> Punkte</p>
      <div class="lvcard nx ${next.boss ? 'boss' : ''}"><div class="lvh"><b>Als Nächstes: Level ${G.n + 1}</b></div><div class="spx">${specials(next)}</div>${goalChips(next)}</div>
      <button class="go" id="next">Weiter ▶</button>
      ${window.BB ? '<button class="go alt" id="bbBoard">🏆 Bestenliste</button>' : ''}`;
    if ($('bbBoard')) $('bbBoard').onclick = () => BB.open('board', 'match');
    $('next').onclick = () => showMenu('start');
  } else if (kind === 'lose') {
    box.innerHTML = `<h2>Keine Züge mehr</h2><div class="orn">✦ 🌿 ✦</div>
      <p>Knapp daneben. Noch offen: ${[...Object.entries(G.goals).filter(([, n]) => n > 0).map(([t, n]) => n + ' ' + NAMES[t]), ...(G.mossLeft > 0 ? [G.mossLeft + ' Moos'] : []), ...(G.crownsLeft > 0 ? [G.crownsLeft + ' Kronen'] : []), ...(G.cratesLeft > 0 ? [G.cratesLeft + ' Kisten'] : [])].join(' · ')}</p>
      <div class="row"><button class="go alt" id="map">Zur Karte</button><button class="go" id="again">Nochmal</button></div>`;
    $('again').onclick = () => startLevel(G.n); $('map').onclick = () => showMenu('start');
  }
  box.insertAdjacentHTML('beforeend', `${window.BB && BB.home ? BB.home() : '<a class="bb-home" href="../">🏠 Zur Startseite</a>'}`);
}
$('btnLevels').onclick = () => { if (!G || !G.busy) showMenu('start'); };
showMenu('start');
if (window.BB && BB.cloud && BB.loggedIn) BB.cloud.get('match').then(c => { if (c && c.level && ((c.t || 0) > (save.t || 0) || c.level > save.level)) { save = { stars: {}, ...c, level: Math.max(c.level, save.level) }; persist(false); if (!G || G.over) showMenu('start'); } }).catch(() => {});
// Zum Testen
window.KM = { get G() { return G; }, get save() { return save; }, persist, levelDef, startLevel, trySwap, findMove, useHelper, win };
</script>
</body>
</html>
