<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Die Bande · Kartensammlung</title>
<meta name="theme-color" content="#070a05">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--txt:#f1e6c8;--mut:#a99d7e;--gold:#d4af37;--gold2:#f0d37a;--line:#7a6128;--g1:#3e7530;--g2:#1c3f15}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#070a05}
html,body{min-height:100%;color:var(--txt);font:15px/1.4 Georgia,serif}
body{min-height:100vh;min-height:100dvh}
body::before{content:"";position:fixed;inset:-40px;z-index:-2;background:url(../krieg/img/hoehle.jpg) center/cover;filter:blur(14px) brightness(.36)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 20%,rgba(212,175,55,.1),transparent 55%),radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.7) 100%)}
button{font:inherit;color:inherit;cursor:pointer}
.c{font-family:"Cinzel",Georgia,serif}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(rgba(10,14,7,.95),rgba(10,14,7,.85));border-bottom:1px solid rgba(212,175,55,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top a{color:var(--gold2);text-decoration:none;background:linear-gradient(#1f2c19,#0f170c);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:800 14px "Cinzel",serif}
.top h1{font:900 19px "Cinzel Decorative","Cinzel",serif;background:linear-gradient(#fff3c4,#d4af37 60%,#8a6a1d);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto;white-space:nowrap}
.bg{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:linear-gradient(#3a2a0c,#1a1206);border:1px solid var(--gold);font:900 17px "Cinzel",serif;color:#ffe9a0}
main{max-width:1100px;margin:0 auto;padding:14px 14px max(30px,env(safe-area-inset-bottom))}
.intro{display:flex;gap:16px;align-items:center;padding:14px 16px;border-radius:14px;background:linear-gradient(rgba(19,28,15,.92),rgba(9,13,7,.92));border:1px solid var(--gold);outline:1px solid #3a3418;outline-offset:4px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.intro .fan{position:relative;flex:none;width:130px;height:96px}
.intro .fan img{position:absolute;bottom:0;width:62px;height:88px;object-fit:cover;border-radius:6px;border:2px solid var(--gold);box-shadow:0 6px 14px rgba(0,0,0,.6)}
.intro .fan img:nth-child(1){left:0;transform:rotate(-14deg)}.intro .fan img:nth-child(2){left:34px;z-index:2;bottom:6px}.intro .fan img:nth-child(3){left:68px;transform:rotate(14deg)}
.intro h2{font:900 22px "Cinzel",serif;color:#fff3d4}
.intro p{color:#d9c9a0;font-size:14px;margin-top:4px}
.prog{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.prog span{padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid #4a3c18;font:800 12.5px "Cinzel",serif;color:var(--gold2)}
.tabs{display:flex;gap:6px;margin:18px 0 12px}
.tabs button{flex:1;padding:11px;border-radius:10px;border:1px solid #4a3c18;background:#0e150b;font:800 15px "Cinzel",serif;color:#cdbf9c}
.tabs button.on{border-color:var(--gold);background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filt button{padding:6px 12px;border-radius:99px;border:1px solid #4a3c18;background:#0e150b;font:800 12.5px "Cinzel",serif;color:#cdbf9c}
.filt button.on{border-color:var(--gold);color:#f8e9b4;background:#1f2c19}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
/* Karte */
.card{--rc:#b5a07c;position:relative;aspect-ratio:5/7;border-radius:12px;padding:6px;background:linear-gradient(160deg,#2a2410,#0c0f07 40%,#1a160a);border:2px solid var(--rc);box-shadow:0 10px 26px rgba(0,0,0,.65),0 0 0 1px #000 inset;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;transition:transform .2s,box-shadow .2s;text-align:left}
.card:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 16px 34px rgba(0,0,0,.7),0 0 20px color-mix(in srgb,var(--rc) 45%,transparent)}
.card.r-l{box-shadow:0 10px 26px rgba(0,0,0,.65),0 0 18px rgba(255,180,58,.35)}
.card.r-l::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,240,190,.22) 45%,transparent 60%);background-size:250% 100%;animation:shine 3.5s linear infinite;pointer-events:none}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.card .art{position:relative;flex:none;height:58%;border-radius:7px;overflow:hidden;border:1px solid rgba(0,0,0,.6)}
.card .art img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.card .gem{position:absolute;top:5px;left:5px;padding:2px 7px;border-radius:99px;background:rgba(0,0,0,.72);border:1px solid var(--rc);font:800 9.5px "Cinzel",serif;color:var(--rc);letter-spacing:.04em}
.card .lv{position:absolute;bottom:4px;right:5px;padding:1px 5px;border-radius:99px;background:rgba(0,0,0,.6);display:flex;gap:1px;font-size:10px;color:#ffe9a0;text-shadow:0 1px 2px #000}
.card .nm{font:800 13px/1.15 "Cinzel",serif;color:#fff3d4;margin:7px 2px 3px}
.card .fx{font-size:11px;line-height:1.3;color:#cdbf9c;padding:0 2px;flex:1;overflow:hidden}
.card .fx b{color:#9fe36a}
.card .cp{height:5px;border-radius:3px;background:#0a0f07;border:1px solid #2e2a14;overflow:hidden;margin:4px 2px 2px}.card .cp i{display:block;height:100%;background:linear-gradient(90deg,#4caa3c,#f0d37a)}
.card .up{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:linear-gradient(var(--g1),var(--g2));border:1px solid var(--gold2);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 12px rgba(150,240,90,.8)}}
.card.lock{filter:grayscale(1) brightness(.45)}
.card.lock .art img{filter:blur(3px)}
.card.lock .nm{color:#8a8070}
.card .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 46px "Cinzel",serif;color:rgba(255,255,255,.4)}
.r-g{--rc:#b5a07c}.r-s{--rc:#6ab0ff}.r-e{--rc:#c78bff}.r-l{--rc:#ffb43a}
/* Shop */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.pack{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;border-radius:14px;background:linear-gradient(#1a2412,#0a0f07);border:1px solid var(--gold);text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.pack .pimg{width:150px;height:150px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 4px #0a0d06,0 0 30px rgba(212,175,55,.35);animation:bob 3s ease-in-out infinite}
.pack .pimg img{width:100%;height:100%;object-fit:cover}
@keyframes bob{50%{transform:translateY(-6px)}}
.pack h3{font:900 22px "Cinzel",serif;color:#fff3d4}
.pack p{font-size:13.5px;color:#cdbf9c}
.buy{margin-top:6px;width:100%;padding:13px;border-radius:9px;border:1px solid var(--gold);background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4;font:800 17px "Cinzel",serif;letter-spacing:.06em;box-shadow:inset 0 1px 0 rgba(255,240,180,.3)}
.buy:disabled{filter:grayscale(.8) brightness(.55);cursor:default}
.odds{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:11.5px}
.odds span{padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.how{margin-top:18px;padding:14px 16px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid #3a3418}
.how h3{font:800 15px "Cinzel",serif;color:var(--gold2);margin-bottom:6px}
.how ul{margin-left:18px;color:#d9c9a0;font-size:14px}.how li{margin:3px 0}
/* Overlay */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:16px;background:radial-gradient(ellipse at 50% 45%,rgba(40,30,8,.9),rgba(3,4,2,.96));backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);overflow-y:auto}
.ov.hide{display:none}
.det{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.det .card{width:min(250px,64vw);cursor:default;transform:none!important}
.det .card .nm{font-size:17px}.det .card .fx{font-size:13px}
.det .info{width:100%;padding:12px;border-radius:12px;background:rgba(10,14,7,.9);border:1px solid #4a3c18;font-size:14px;color:#d9c9a0}
.det .info b{color:#fff3c4}
.det .row{display:flex;gap:8px;width:100%}.det .row>*{flex:1}
.ghost{padding:12px;border-radius:9px;border:1px solid var(--line);background:linear-gradient(#1f2c19,#0f170c);color:var(--gold2);font:800 15px "Cinzel",serif}
/* Pack öffnen */
.reveal{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:900px;perspective:900px}
.flip{width:min(150px,28vw);aspect-ratio:5/7;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1);cursor:pointer}
.flip.open{transform:rotateY(180deg)}
.flip>*{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .back{border-radius:12px;border:2px solid var(--gold);background:radial-gradient(circle at 50% 40%,#3a5a24,#0f170c 70%);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.65)}
.flip .back{flex-direction:column;gap:6px;background:radial-gradient(circle at 50% 40%,#3a5a24,#0f170c 70%),repeating-linear-gradient(45deg,rgba(212,175,55,.08) 0 2px,transparent 2px 10px)}
.flip .back i{font-style:normal;font-size:44px;filter:drop-shadow(0 0 12px rgba(240,211,122,.7))}.flip .back b{font:900 12px 'Cinzel Decorative','Cinzel',serif;color:#f0d37a;letter-spacing:.06em}
.flip .back::after{content:'';position:absolute;inset:7px;border:1px solid rgba(212,175,55,.5);border-radius:8px}
.flip .card{transform:rotateY(180deg)!important;cursor:pointer}
.flip>.new{inset:auto;position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotateY(180deg);z-index:3;padding:2px 10px;border-radius:99px;background:linear-gradient(#f0d37a,#b8902c);color:#2a1a08;font:800 11px "Cinzel",serif}
.flip.open.r-l .card{box-shadow:0 0 0 1px #000 inset,0 0 30px rgba(255,180,58,.75)}.flip.open.r-e .card{box-shadow:0 0 0 1px #000 inset,0 0 22px rgba(199,139,255,.65)}
.rt{font:900 26px "Cinzel Decorative","Cinzel",serif;background:linear-gradient(#fff6d6,#f0d37a 45%,#b8902c);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px}
.rhint{color:var(--mut);font-size:13px;margin-top:14px}
.rdone{margin-top:16px;padding:12px 28px;border-radius:9px;border:1px solid var(--gold);background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4;font:800 16px "Cinzel",serif;visibility:hidden}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.intro{flex-direction:column;text-align:center}.prog{justify-content:center}.card .fx{font-size:10.5px}}
</style>
</head>
<body>
<header class="top"><a href="../">←</a><h1>Die Bande</h1><span class="bg">🪙 <span id="bgv">0</span></span></header>
<main>
  <section class="intro">
    <div class="fan"><img src="img/der-gruene-kobold.jpg" alt=""><img src="img/der-koenig-von-deutschland.jpg" alt=""><img src="img/donpatron.jpg" alt=""></div>
    <div><h2>Kartensammlung</h2><p>Sammel die ganze Bande. Jede Karte macht dich in einem Spiel stärker, Gegenstände bringen mehr Bandengold. Doppelte Karten brauchst du zum Aufwerten bis Stufe 5.</p><div class="prog" id="prog"></div></div>
  </section>
  <div class="tabs"><button data-t="col" class="on">🃏 Sammlung</button><button data-t="shop">🛒 Shop</button></div>
  <div id="body"></div>
</main>
<div class="ov hide" id="ov"></div>

<script src="../bb.js?v=20261108c"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const GNAME = { runner: 'Kobold-Runner', krieg: 'Bandenkrieg', match: 'Kräuter-Match', hof: 'Bandenhof' };
let tab = 'col', filt = 'all';
const M = () => BB.meta;
const fx = (c, lv) => c.fx.replace('{x}', (Math.round(Math.max(1, lv) * c.per * 10) / 10).toLocaleString('de-DE'));
function cardHtml(c, opt = {}) {
  const m = M().cards[c.id], lv = m ? m.lv : 0, own = !!m;
  const need = lv < 5 ? BB.NEED[lv + 1] : 0;
  return `<div class="card r-${c.r} ${own || opt.force ? '' : 'lock'}" data-c="${c.id}">
    <div class="art"><img src="${c.img}" alt="" loading="lazy">${own || opt.force ? '' : '<span class="q">?</span>'}<span class="gem">${BB.RAR[c.r].n}</span>${own ? `<span class="lv">${'★'.repeat(lv)}${'☆'.repeat(5 - lv)}</span>` : ''}</div>
    <div class="nm">${esc(c.name)}</div>
    <div class="fx">${own || opt.force ? fx(c, lv).replace(/(\+?[\d,.]+ ?(%|s|Züge)?)/, '<b>$1</b>') : (c.game ? GNAME[c.game] : 'Gegenstand')}</div>
    ${own && lv < 5 ? `<div class="cp"><i style="width:${Math.min(100, m.n / need * 100)}%"></i></div>` : ''}
    ${own && BB.canUp(c.id) ? '<span class="up">⬆</span>' : ''}</div>`;
}
function head() {
  $('#bgv').textContent = M().bg.toLocaleString('de-DE');
  const own = Object.keys(M().cards).length, stars = Object.values(M().cards).reduce((a, m) => a + m.lv, 0);
  $('#prog').innerHTML = `<span>🃏 ${own}/${BB.CARDS.length} Karten</span><span>★ ${stars}/${BB.CARDS.length * 5} Sterne</span><span>🪙 +${BB.bgBonus()} % Bandengold</span>`;
}
function render() {
  head();
  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const B = $('#body');
  if (tab === 'col') {
    const list = BB.CARDS.filter(c => filt === 'all' || (filt === 'item' ? c.kind === 'item' : c.game === filt));
    B.innerHTML = `<div class="filt">${[['all', 'Alle'], ['runner', '🏃 Runner'], ['krieg', '⚔️ Krieg'], ['match', '🌿 Match'], ['hof', '🏡 Hof'], ['item', '💰 Gegenstände']].map(([k, n]) => `<button data-f="${k}" class="${filt === k ? 'on' : ''}">${n}</button>`).join('')}</div>
      <div class="grid">${list.map(c => cardHtml(c)).join('')}</div>`;
    B.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filt = b.dataset.f; render(); });
    B.querySelectorAll('[data-c]').forEach(el => el.onclick = () => detail(el.dataset.c));
  } else {
    B.innerHTML = `<div class="packs">${Object.entries(BB.PACKS).map(([k, p]) => `<div class="pack"><div class="pimg"><img src="img/${p.img}.jpg" alt=""></div><h3>${p.name}</h3>
        <p>${p.n} zufällige Karten${p.min ? ', mindestens eine Epische oder Legendäre' : ''}.</p>
        <div class="odds">${Object.entries(BB.RAR).map(([r, x]) => `<span style="color:${x.c}">${x.n}</span>`).join('')}</div>
        <button class="buy" data-buy="${k}" ${M().bg < p.cost ? 'disabled' : ''}>Öffnen · ${p.cost} 🪙</button></div>`).join('')}</div>
      <div class="how"><h3>So verdienst du Bandengold</h3><ul>
        <li>⚔️ Bandenkrieg gewinnen: 30 bis 100</li><li>🏃 Kobold-Runner: Gold und Meter jedes Laufs</li><li>🌿 Kräuter-Match: jedes geschaffte Level</li>
        <li>🍺 Kneipen-Duell gegen den Wirt gewinnen</li><li>🎤 Quiz solo oder als Party-Sieger</li><li>🏡 Bandenhof: Ziele und Hof-Stufen</li><li>♞ Schach gegen Herrn Holz gewinnen: 50</li><li>📅 Jeden Tag vorbeischauen: 25</li></ul></div>`;
    B.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => pack(b.dataset.buy));
  }
}
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
function closeOv() { $('#ov').classList.add('hide'); render(); }
function detail(id) {
  const c = BB.CARDS.find(x => x.id === id), m = M().cards[id], lv = m ? m.lv : 0;
  const ov = $('#ov'); ov.classList.remove('hide');
  const next = lv && lv < 5 ? lv + 1 : 0;
  ov.innerHTML = `<div class="det">${cardHtml(c, { force: true })}
    <div class="info">${m ? `Stufe <b>${lv}</b> von 5 · ${c.game ? GNAME[c.game] : 'gilt für alle Spiele'}<br>Jetzt: <b>${fx(c, lv)}</b>${next ? `<br>Stufe ${next}: <b style="color:#9fe36a">${fx(c, next)}</b><br>Kopien: <b>${m.n}/${BB.NEED[next]}</b> · Kosten: <b>${BB.UPCOST[next]} 🪙</b>` : '<br>🌟 Maximale Stufe erreicht'}`
      : `Diese Karte hast du noch nicht. Du findest sie in Kräuterbeuteln und Königstruhen.<br><b>${BB.RAR[c.r].n}</b> · ${c.game ? GNAME[c.game] : 'Gegenstand'}`}</div>
    <div class="row"><button class="ghost" id="cl">Zurück</button>${next ? `<button class="buy" id="upb" ${BB.canUp(id) ? '' : 'disabled'}>⬆ Aufwerten</button>` : ''}</div></div>`;
  $('#cl').onclick = closeOv;
  if ($('#upb')) $('#upb').onclick = () => { if (BB.upCard(id)) { BB.toast(`<b>${esc(c.name)}</b> ist jetzt Stufe ${M().cards[id].lv}!`, '⬆️'); detail(id); head(); } };
  ov.onclick = e => { if (e.target === ov) closeOv(); };
}
function pack(type) {
  const res = BB.openPack(type); if (!res) return;
  const ov = $('#ov'); ov.classList.remove('hide'); ov.onclick = null;
  ov.innerHTML = `<div class="rt">${BB.PACKS[type].name}</div><div class="reveal">${res.map((r, i) => `<div class="flip r-${r.card.r}" data-i="${i}"><div class="back"><i>🌿</i><b>Bubatzbande</b></div>${cardHtml(r.card, { force: true })}${r.isNew ? '<span class="new">NEU!</span>' : ''}</div>`).join('')}</div>
    <p class="rhint" id="rh">Tipp auf die Karten zum Aufdecken</p><button class="rdone" id="rd">Weiter</button>`;
  let opened = 0;
  const done = () => { $('#rd').style.visibility = 'visible'; $('#rh').textContent = res.filter(r => r.isNew).length + ' neue Karten, ' + res.filter(r => !r.isNew).length + ' Kopien'; };
  ov.querySelectorAll('.flip').forEach(f => f.onclick = () => {
    if (f.classList.contains('open')) return;
    f.classList.add('open'); opened++;
    const r = res[+f.dataset.i].card.r; try { navigator.vibrate && navigator.vibrate(r === 'l' ? [60, 40, 120] : r === 'e' ? [40, 30, 60] : 20); } catch (e) {}
    if (opened === res.length) done();
  });
  $('#rd').onclick = closeOv;
  head();
}
BB.onMeta(() => { if ($('#ov').classList.contains('hide')) render(); else head(); });
render();
if (new URLSearchParams(location.search).get('shop')) { tab = 'shop'; render(); }
</script>
</body>
</html>
