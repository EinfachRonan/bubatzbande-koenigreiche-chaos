function actor(key,x,y,o){return Object.assign({key,x,y,face:1,sc:1,stack:[],type:null,cap:3,role:'',xferT:0,atk:0,atkT:-1,phase:0,moving:false,speed:60,mode:'idle',goal:0},o||{});}

function pushItem(c,t){c.type=t;c.stack.push({t,pop:0});}
function popItem(c){c.stack.pop();if(!c.stack.length)c.type=null;}
function stepTo(a,tx,ty,dt,col){const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);if(d<2){a.moving=false;return true;}const s=Math.min(d,a.speed*dt);a.x+=dx/d*s;a.y+=dy/d*s;if(col)collide(a,7);if(Math.abs(dx)>1)a.face=dx>0?1:-1;a.moving=true;return false;}
function nav(f,t){const a=f.y<GATE.y,b=t.y<GATE.y;if(a===b)return t;const gx=281;if(Math.abs(f.x-gx)>10||(a?f.y<GATE.y-30:f.y>GATE.y+30))return {x:gx,y:a?GATE.y-26:GATE.y+26};return {x:gx,y:b?GATE.y-40:GATE.y+40};}
function drawActor(a){const s=IMG[a.key];g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(Math.round(a.x),Math.round(a.y),9*a.sc,3*a.sc,0,0,7);g.fill();
  let frame=null;if(a.atkT>=0&&s&&s.atk.length){frame=Math.min(s.atk.length-1,Math.floor(a.atkT/.32*s.atk.length));}
  const bob=a.moving?-Math.abs(Math.sin(a.phase))*2:0,rot=a.moving?Math.sin(a.phase)*.06:0;
  drawSpr(a.key,a.x,a.y+bob+(a.sitY||0),a.face,frame,a.sc,a.alpha,a.flash,rot);
  if(a.stack.length){const hx=a.x+a.face*7,base=a.y-20*a.sc+bob;let yy=base;for(const it of a.stack){it.pop=Math.min(1,it.pop+.12);g.save();g.translate(hx,yy);g.scale(it.pop,it.pop);drawItem(it.t,0,0);g.restore();yy-=ITEM_H[it.t];}}}

function placePrey(p,far){p.def=pickPrey();p.key=p.def.key;for(let k=0;k<20;k++){p.x=rnd(CAVE.x1,CAVE.x2);p.y=rnd(CAVE.y1,CAVE.y2);if(!far||dist(p,player)>90)break;}p.tx=p.x;p.ty=p.y;p.wait=rnd(0,2);p.alive=true;p.alpha=0;p.dead=0;}

const hunters=()=>[player,...jaegers];
function updPrey(dt){for(const p of prey){
  if(!p.alive){p.dead+=dt;p.alpha=Math.max(0,1-p.dead*3);if(p.dead>p.res)placePrey(p,true);continue;}
  if(p.alpha<1)p.alpha=Math.min(1,p.alpha+dt*2);
  let th=null,td=1e9;for(const h of hunters()){const d=dist(p,h);if(d<td){td=d;th=h;}}
  if(th&&td<55&&th.y<GATE.y+10){const dx=p.x-th.x,dy=p.y-th.y,d=Math.hypot(dx,dy)||1;p.x+=dx/d*p.def.flee*dt;p.y+=dy/d*p.def.flee*dt;p.face=dx>0?1:-1;p.moving=true;p.wait=.4;}
  else if(p.wait>0){p.wait-=dt;p.moving=false;if(p.wait<=0){p.tx=clamp(p.x+rnd(-70,70),CAVE.x1,CAVE.x2);p.ty=clamp(p.y+rnd(-70,70),CAVE.y1,CAVE.y2);}}
  else{p.speed=p.def.spd;if(stepTo(p,p.tx,p.ty,dt,false))p.wait=rnd(.6,2.6);}
  p.x=clamp(p.x,CAVE.x1,CAVE.x2);p.y=clamp(p.y,CAVE.y1,CAVE.y2);tickActor(p,dt);}}

function kellnerAI(k,dt){let tg=null;const n=totalNeed();

  if(can.raw&&(c.type===null||c.type==='raw')&&c.stack.length<c.cap)for(let i=drops.length-1;i>=0;i--){const d=drops[i];if(d.landed&&dist(c,d)<16){drops.splice(i,1);pushItem(c,'raw');sfx('pop');if(c.stack.length>=c.cap)break;}}

  kellners.forEach(k=>kellnerAI(k,dt));jaegers.forEach(j=>jaegerAI(j,dt));
  interact(player,dt);kellners.forEach(k=>interact(k,dt));jaegers.forEach(j=>interact(j,dt));tickActor(player,dt);
  for(const t of tables){if(t.unlocked&&t.money>0&&dist(player,moneyPos(t))<20){const m=moneyPos(t);gold+=t.money;floatText(m.x,m.y-10,'+'+t.money);for(let i=0;i<Math.min(14,t.cs||1);i++)flyCoins.push({x:m.x+rnd(-12,12),y:m.y+rnd(-6,4),life:.25+i*.03});t.money=0;t.cs=0;t.fall=[];sfx('coin');bump();}}
  updGrill(dt);updCustomers(dt);updMoneyVis(dt);updPads(dt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy+=200*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=24*dt;if(f.life<=0)floats.splice(i,1);}
  for(let i=flyCoins.length-1;i>=0;i--){const c=flyCoins[i];c.life-=dt;const k=Math.min(1,dt*14);c.x+=(player.x-c.x)*k;c.y+=(player.y-30-c.y)*k;if(c.life<=0)flyCoins.splice(i,1);}
  const [gt,ht]=goal();if(ht!==hintTxt){hintTxt=ht;hintEl.textContent=ht;}update.guide=gt&&dist(player,gt)>14?gt:null;
  const fg=Math.floor(gold);if(fg!==shownGold){shownGold=fg;gEl.textContent=fg;}
  const tx=WW<VW?(WW-VW)/2:clamp(player.x-VW/2,0,WW-VW),ty=clamp(player.y-VH*.55,0,WH-VH);const k=1-Math.exp(-7*dt);camX+=(tx-camX)*k;camY+=(ty-camY)*k;
}

function render(){g.setTransform(1,0,0,1,0,0);g.fillStyle='#050505';g.fillRect(0,0,VW,VH);
  const cx=Math.round(camX),cy=Math.round(camY);CX=cx;CY=cy;g.setTransform(1,0,0,1,-cx,-cy);
  g.drawImage(BG,0,0);
  // Licht der Laternen
  g.globalCompositeOperation='lighter';for(const [lx,ly] of LAMPS){const r=46+Math.sin(time*3+lx)*3;const gr=g.createRadialGradient(lx,ly,2,lx,ly,r);gr.addColorStop(0,'rgba(255,170,80,.22)');gr.addColorStop(1,'rgba(255,170,80,0)');g.fillStyle=gr;g.fillRect(lx-r,ly-r,r*2,r*2);}
  for(const pr of prey)if(pr.alive){const gr=g.createRadialGradient(pr.x,pr.y-10,1,pr.x,pr.y-10,22);gr.addColorStop(0,'rgba(140,255,100,.07)');gr.addColorStop(1,'rgba(140,255,100,0)');g.fillStyle=gr;g.fillRect(pr.x-22,pr.y-32,44,44);}
  g.globalCompositeOperation='source-over';
  for(const [lx,ly] of LAMPS){R('#2a1a0e',lx-3,ly-4,6,8);R('#ffd24a',lx-2,ly-3,4,5);}
  zoneOutline(zAbl,player.type==='raw');zoneOutline(zGrl,false);zoneOutline(zSpu,player.type==='dirty');
  for(const p of pads)drawPad(p);
  for(const t of tables)if(t.unlocked)drawMoney(t);
  for(const d of drops){g.fillStyle='rgba(0,0,0,.3)';g.fillRect(Math.round(d.x-4),Math.round(d.y),8,2);g.drawImage(RAWI,Math.round(d.x-5),Math.round(d.y-6-d.z));}
  // y-sortierte Objekte
  const L=[];L.push({y:ABL.y+26,f:drawAblage},{y:GRL.y+30,f:drawGrill},{y:SPU.y+24,f:drawSpuele});
  for(const t of tables)if(t.unlocked)L.push({y:t.y,f:()=>drawTable(t)});
  for(const p of prey)if(p.alive||p.alpha>0)L.push({y:p.y,f:()=>drawActor(p)});
  for(const c of customers)L.push({y:c.state==='walkIn'||c.state==='leaving'?c.y:c.y-2,f:()=>drawActor(c)});
  for(const a of [player,...kellners,...jaegers])L.push({y:a.y,f:()=>drawActor(a)});
  L.sort((a,b)=>a.y-b.y);for(const o of L)o.f();
  for(const a of arrows){g.save();g.translate(Math.round(a.x),Math.round(a.y));g.rotate(a.ang||0);R('#8a5a2a',-6,0,9,1);R('#ddd',3,-1,2,3);R('#fff3c4',-7,-1,2,3);g.restore();}
  for(const p of parts){g.globalAlpha=Math.min(1,p.life*2);R(p.c,p.x,p.y,p.s,p.s);}g.globalAlpha=1;
  for(const c of flyCoins)g.drawImage(COINI,Math.round(c.x-3),Math.round(c.y-3));
  for(const c of customers)drawBubble(c);
  drawArrowGuide(update.guide);
  for(const f of floats){g.globalAlpha=Math.min(1,f.life*2);txt(f.t,f.x,f.y,13,f.c);}g.globalAlpha=1;
  // Vignette
  g.setTransform(1,0,0,1,0,0);const vg=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.35,VW/2,VH/2,Math.max(VW,VH)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=vg;g.fillRect(0,0,VW,VH);
}
let last=performance.now(),saveT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();drawTexts();saveT+=dt;if(saveT>4){saveT=0;save();}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
addEventListener('visibilitychange',()=>{if(document.hidden)save();});
})();
</script>
</body>
</html>
