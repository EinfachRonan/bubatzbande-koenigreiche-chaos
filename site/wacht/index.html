<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{--wood:#2a1b0f;--wood2:#3a2615;--gold:#d9a948;--gold2:#f3d27a;--parch:#ead8ad;--ink:#3a2410;--red:#8a2020;--herb:#9ad84a}
html,body{height:100%;color:var(--parch);font-family:'Alegreya Sans','Nunito',system-ui,sans-serif;font-weight:700;overflow:hidden;
 background:#0d0906 repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2px,transparent 2px 64px),linear-gradient(#1a110a,#0d0906)}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(90deg,#0b0705,#160e08 8%,#160e08 92%,#0b0705)}

/* Kopfleiste: Holzbalken */

 background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 5px),linear-gradient(#4a2f18,#2c1b0d);border-bottom:3px solid #1a0f06;box-shadow:inset 0 1px 0 rgba(255,220,160,.18),0 3px 0 #6b4a22}

#top:before{left:4px}#top:after{right:4px}
#home{font-family:'MedievalSharp',serif;font-size:30px;line-height:1;color:var(--parch);text-decoration:none;padding:0 6px 4px 4px;text-shadow:0 2px 0 #1a0f06}

 padding:6px 34px 8px;background:linear-gradient(#f4e4bb,#d9bf86);border-top:2px solid #8a6a3a;border-bottom:2px solid #8a6a3a;box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 0 14px rgba(120,80,30,.35)}
#banner:before,#banner:after{content:'';position:absolute;top:6px;width:20px;height:100%;background:#b8935a;z-index:-1}

.btn{font-family:'MedievalSharp',serif;font-weight:400;font-size:14px;color:var(--parch);cursor:pointer;padding:7px 11px;border-radius:4px;
 background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 7px),linear-gradient(#5a3a1e,#3a2412);border:2px solid #1a0f06;box-shadow:inset 0 1px 0 rgba(255,220,160,.25),inset 0 0 0 1px #7a5a30,0 2px 0 #0a0603;text-shadow:0 1px 0 #000}

.btn.on{color:var(--gold2);box-shadow:inset 0 1px 0 rgba(255,220,160,.25),inset 0 0 0 1px var(--gold),0 2px 0 #0a0603,0 0 10px rgba(217,169,72,.35)}

.btn.go{background:linear-gradient(#e2bb5c,#a87a26);color:#2a1608;text-shadow:0 1px 0 rgba(255,240,190,.5);box-shadow:inset 0 1px 0 #fff0b8,inset 0 0 0 1px #f3d27a,0 2px 0 #0a0603}

 background:radial-gradient(ellipse at 50% 80%,#3a2a1a,#140c06);border:2px solid #6a5232;box-shadow:inset 0 0 0 1px #1a0f06,0 0 0 1px #1a0f06}
.ult:before{content:'';position:absolute;inset:2px;border:1px solid rgba(217,169,72,.35);pointer-events:none;z-index:2}
.ult img{height:42px;image-rendering:pixelated;position:relative;z-index:1}
.ult .f{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(rgba(154,216,74,.5),rgba(154,216,74,.12))}
.ult.rdy{border-color:var(--gold2);box-shadow:0 0 0 1px #1a0f06,0 0 14px rgba(243,210,122,.7);animation:pl .9s infinite}

.ult.lock img{filter:brightness(0)}
#tabs{display:flex;gap:6px;padding:0 10px 2px}
#tabs button{flex:1;font-size:16px;border-radius:6px 6px 2px 2px}
/* Pergament-Bereich */
#panel{flex:1;overflow-y:auto;padding:10px 10px 20px;-webkit-overflow-scrolling:touch;border-top:3px solid #1a0f06;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 38px),linear-gradient(90deg,#2a1a0d,#352211 50%,#2a1a0d)}
.card{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:8px;color:var(--ink);position:relative;border-radius:3px;
 background:radial-gradient(ellipse at 30% 20%,#f6e8c4,#e3cc96 70%,#cdb27a);box-shadow:inset 0 0 18px rgba(120,80,30,.35),0 2px 0 #120a04,0 0 0 1px #8a6a3a}

.card .d{font-size:12.5px;color:#5a3e20;line-height:1.3;margin-top:2px}

.btn.go small{color:#3a1c08!important}
.card.locked{filter:sepia(.3) brightness(.85)}
.card.locked .pic img{filter:brightness(0) opacity(.7)}
.sec{font-family:'MedievalSharp',serif;font-size:15px;color:var(--gold);margin:12px 2px 7px;display:flex;align-items:center;gap:8px}
.sec:before,.sec:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#8a6a3a,transparent)}
.box{padding:12px 13px;margin-bottom:9px;font-size:13.5px;color:#4a3018;line-height:1.4;border-radius:3px;
 background:radial-gradient(ellipse at 30% 20%,#f6e8c4,#e3cc96 70%,#cdb27a);box-shadow:inset 0 0 18px rgba(120,80,30,.35),0 2px 0 #120a04,0 0 0 1px #8a6a3a}
.box b{color:#3a1c08}.box .t1{font-family:'MedievalSharp',serif;font-size:19px;color:#7a1f1f;display:block;margin-bottom:4px}
.icon{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(#3a2a1a,#160d06);border:2px solid #7a5a30;border-radius:3px}
.icon img{width:36px;height:36px;image-rendering:pixelated}
.card.empty{opacity:.65}.card .col{display:flex;flex-direction:column;gap:5px}.card .col .btn{min-width:84px;padding:5px 8px}
.hpick{display:flex;gap:6px}.hpick .btn{flex:1;padding:3px;height:52px;display:flex;align-items:flex-end;justify-content:center}.hpick img{height:42px;image-rendering:pixelated}
.melt{display:flex;gap:5px;margin-bottom:8px}.melt .btn{flex:1;font-size:12px;padding:6px 4px}
.eqs{display:flex;gap:4px;margin-top:5px}.eqs img,.eqs i{width:22px;height:22px;image-rendering:pixelated;border:1.5px solid #8a6a3a;border-radius:2px;background:#2a1a0d;display:block}
#tabs button{font-size:14px!important;padding:7px 4px}
#sv{margin-left:8px;color:#9a8460}#sv.ok{color:#9ad84a}
#bMus{margin-left:auto}.ib{font-family:system-ui,sans-serif;font-size:17px;padding:3px 8px;margin-right:4px}.ib.off{opacity:.55}

 #banner{font-size:34px;padding:8px 48px 10px}
 .card .n{font-size:21px}.card .d{font-size:14.5px}.card .buy{min-width:104px}.btn{font-size:15px}.card .buy small{font-size:13px}.card .pic,.icon{width:56px;height:56px}.card .pic img{max-height:52px;max-width:52px}

#ultfx b{display:block;font-family:'MedievalSharp',serif;font-weight:400;font-size:clamp(26px,6.5vw,64px);color:#fff6dc;text-shadow:0 3px 0 #1a0f06,0 0 18px var(--uc);white-space:nowrap}

 background:radial-gradient(ellipse at 30% 20%,#f6e8c4,#e0c890 70%,#c8aa70);box-shadow:inset 0 0 26px rgba(120,80,30,.45),0 0 0 2px #8a6a3a,0 0 0 6px #2a1a0d,0 0 0 8px #6a5232,0 10px 30px #000}

function rollRar(boss){const t=boss?[38,34,19,7.5,1.5]:[73,21,4.8,1.1,.1];let r=Math.random()*100,i=0;while(i<4&&r>=t[i]){r-=t[i];i++;}if(i===4&&S.stage<30)i=3;return i;}
function mkItem(boss){const sl=['w','r','a'][Math.floor(Math.random()*3)],st=sl==='w'?'dmg':sl==='r'?'hp':['spd','gold','ult'][Math.floor(Math.random()*3)],ri=rollRar(boss),lv=S.stage;
 const grow=st==='spd'?1+lv*.025:1+lv*.1;const nm=SLOTS[sl].names[Math.floor(Math.random()*SLOTS[sl].names.length)];
 return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),s:sl,st,r:ri,lv,up:0,n:nm,v:Math.round(STAT[st].b*grow*RAR[ri].m*(.85+Math.random()*.3)*10)/10};}
const iv=it=>it?it.v*(1+.15*it.up):0;
function eqv(k,st){const e=S.eq[k];if(!e)return 0;let t=0;for(const s in e)if(e[s]&&e[s].st===st)t+=iv(e[s]);return t;}
function eqAll(st){let t=0;for(const k in S.eq)t+=eqv(k,st);return t;}

 if(S.items.length>=BAGMAX||(S.autoMelt&&it.r<S.autoMelt)){const v=meltVal(it);S.stones+=v;num(e.x,e.y-58,'+'+v+' ⚒','#c8c0b0');return;}

function mkHero(k){const H0=HEROES[k],l=S.heroes[k],mh=heroHp(k,l);return{k,x:HOME[k][0]-60,y:HOME[k][1],hp:mh,mh,cd:Math.random()*.5,anim:-1,hit:false,tgt:null,en:0,dead:false,flash:0,bob:Math.random()*6};}

function startWave(){const s=S.stage,w=S.wave;S.wmax=Math.max(S.wmax||1,w);spawnQ=[];enemies=[];shots=[];
 if(w===WAVES){const B=BOSSES[(s-1)%3];spawnQ.push({boss:B});bossT=25;showBan(B.n+'!');sfx('boss');}
 else{const pool=Object.keys(ENEMIES).filter(k=>ENEMIES[k].min<=s);const n=2+Math.floor(w/2)+Math.min(3,Math.floor(s/6));for(let i=0;i<n;i++)spawnQ.push({k:pool[Math.floor(Math.random()*pool.length)]});}
 spawnT=.3;state='fight';renderWave();}
function spawn(q){const s=S.stage,hm=eHp(s)*(1+(S.wave-1)*.12),dm=eDmg(s);
 if(q.boss){const b={k:q.boss.k,n:q.boss.n,boss:1,x:335,y:172,hp:0,mh:0,dmg:11*dm,cd:1.6,range:30,spd:18,gold:30,sc:1.15,c:0,anim:-1,frz:0,slow:0,flash:0};b.mh=b.hp=650*hm;enemies.push(b);return;}
 const E=ENEMIES[q.k];enemies.push({k:q.k,n:E.n,x:325+Math.random()*12,y:158+Math.random()*30,hp:E.hp*hm,mh:E.hp*hm,dmg:E.dmg*dm,cd:E.cd,range:E.range,spd:E.spd*(1+tl('auto')*.1),gold:E.gold,ranged:E.ranged,c:Math.random()*.6,anim:-1,frz:0,slow:0,flash:0,sc:1});}
function alive(a){return a.filter(o=>!o.dead&&o.hp>0);}
function nearest(from,list){let b=null,bd=1e9;for(const o of list){if(o.dead||o.hp<=0)continue;const d=Math.abs(o.x-from.x)+Math.abs(o.y-from.y)*.3;if(d<bd){bd=d;b=o;}}return b;}

function update(dt){
 // Spawnen
 if(state==='fight'){if(spawnQ.length){spawnT-=dt;if(spawnT<=0){spawn(spawnQ.shift());spawnT=.55;}}
  if(S.wave===WAVES&&enemies.length){bossT-=dt;if(bossT<=0)return fail('Zeit abgelaufen');}
  if(!spawnQ.length&&!alive(enemies).length)waveDone();
  if(!alive(heroes).length)return fail('Die Bande ist k.o.');}
 else{stT-=dt;if(stT<=0){if(state==='next')startWave();}}
 const regen=ul('regen')*.01;
 // Helden
 for(const h of heroes){const H0=HEROES[h.k];h.flash=Math.max(0,h.flash-dt);h.bob+=dt*6;if(h.dead)continue;
  if(regen)h.hp=Math.min(h.mh,h.hp+h.mh*regen*dt);
  if(S.auto&&h.en>=100&&alive(enemies).length)castUlt(h);
  const t=nearest(h,enemies);h.cd-=dt;
  if(h.anim>=0){h.anim+=dt;const n=IMG[h.k].atk.length||6,dur=n*.05;if(!h.hit&&h.anim>=dur*.55){h.hit=true;doAttack(h);}if(h.anim>=dur)h.anim=-1;continue;}
  if(!t||state!=='fight'){const hx=HOME[h.k][0],hy=HOME[h.k][1];h.x+=Math.sign(hx-h.x)*Math.min(Math.abs(hx-h.x),60*dt);h.y+=Math.sign(hy-h.y)*Math.min(Math.abs(hy-h.y),40*dt);continue;}
  const dx=t.x-h.x;
  if(Math.abs(dx)>H0.range||(H0.melee&&Math.abs(t.y-h.y)>14)){if(H0.melee&&t.x>225){const hx=HOME[h.k][0]+40;h.x+=Math.sign(hx-h.x)*Math.min(Math.abs(hx-h.x),H0.spd*dt);}else if(H0.melee){h.x+=Math.sign(dx)*H0.spd*dt;h.y+=Math.sign(t.y-h.y)*Math.min(Math.abs(t.y-h.y),30*dt);}else{const hx=HOME[h.k][0];if(h.x<hx)h.x+=Math.min(hx-h.x,60*dt);}continue;}
  if(h.cd<=0){h.cd=H0.cd/(1+eqv(h.k,'spd')/100);h.anim=0;h.hit=false;h.tgt=t;}}
 // Gegner
 for(const e of enemies){e.flash=Math.max(0,e.flash-dt);if(e.hp<=0)continue;if(e.frz>0){e.frz-=dt;continue;}e.slow=Math.max(0,e.slow-dt);const sm=e.slow>0?.6:1;
  const t=nearest(e,heroes);if(!t){e.x+=e.spd*dt*.5;continue;}e.c-=dt*sm;
  if(e.anim>=0){e.anim+=dt;const n=IMG[e.k].atk.length,dur=n?n*.06:.35;if(!e.hit&&e.anim>=dur*.5){e.hit=true;if(e.ranged)shots.push({x:e.x-8,y:e.y-20,t:e.tgt,sp:150,d:e.dmg,en:1,c:'#9bd84a',r:2});else if(e.boss){for(const h of heroes)if(!h.dead&&Math.abs(h.x-e.x)<e.range+14)hurtHero(h,e.dmg);shake=.2;}else hurtHero(e.tgt,e.dmg);}if(e.anim>=dur)e.anim=-1;continue;}
  const dx=t.x-e.x;if(Math.abs(dx)>e.range||e.x>222||(!e.ranged&&Math.abs(t.y-e.y)>12)){e.x+=Math.sign(dx)*e.spd*sm*dt*(e.x>235?3:1);if(!e.ranged)e.y+=Math.sign(t.y-e.y)*Math.min(Math.abs(t.y-e.y),20*dt);continue;}
  if(e.c<=0){e.c=e.cd;e.anim=0;e.hit=false;e.tgt=t;}}
 enemies=enemies.filter(e=>e.hp>0||e.dying);
 // Geschosse
 for(const s of shots){if(s.delay>0){s.delay-=dt;continue;}
  if(s.fall){s.y+=s.sp*dt;if(s.y>=s.ty){s.done=1;sfx(s.aoe?'boom':'thunk');if(s.aoe){for(const e of enemies)if(e.hp>0&&Math.hypot(e.x-s.x,(e.y-s.ty)*1.5)<s.aoe)hurtEnemy(e,s.d,null,1);burst(s.x,s.ty,s.c,8);}else if(s.t&&s.t.hp>0)hurtEnemy(s.t,s.d,null,1);}continue;}
  const t=s.t;if(!t||t.hp<=0||t.dead){s.done=1;continue;}const tx=t.x,ty=t.y-18,dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy);
  if(d<6){s.done=1;if(!s.en)sfx(s.aoe?'boom':'thunk');if(s.en)hurtHero(t,s.d);else if(s.aoe){for(const e of enemies)if(e.hp>0&&Math.hypot(e.x-t.x,e.y-t.y)<s.aoe)hurtEnemy(e,s.d,s.src);burst(tx,ty,s.c,6);}else hurtEnemy(t,s.d,s.src);continue;}
  s.x+=dx/d*s.sp*dt;s.y+=dy/d*s.sp*dt;s.a=Math.atan2(dy,dx);}
 shots=shots.filter(s=>!s.done);
 for(const p of fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.l-=dt;}fx=fx.filter(p=>p.l>0);
 for(const n of nums){n.y-=22*dt;n.a-=dt*1.1;}nums=nums.filter(n=>n.a>0);
 shake=Math.max(0,shake-dt);
}
function doAttack(h){sfx(h.k);const H0=HEROES[h.k],d=heroDmg(h.k,S.heroes[h.k]),t=h.tgt;if(!t||t.hp<=0)return;
 if(H0.arrow)shots.push({x:h.x+8,y:h.y-28,t,sp:320,d,src:h,c:'#c9a46a',arrow:1});
 else if(H0.orb)shots.push({x:h.x+8,y:h.y-34,t,sp:170,d,src:h,c:'#9ad84a',r:3,aoe:22});
 else if(H0.frost){for(const e of enemies)if(e.hp>0&&e.x>=h.x-6&&e.x-h.x<H0.range+12&&Math.abs(e.y-h.y)<22){e.slow=1.5;hurtEnemy(e,d,h);}burst(h.x+18,h.y-18,'#a8f0ff',6);}
 else{hurtEnemy(t,d,h);if(H0.steal)h.hp=Math.min(h.mh,h.hp+d*H0.steal);}}

 else if(h.k==='lg3'){for(let i=0;i<6;i++){const e=al[i%al.length];shots.push({fall:1,x:e.x+(Math.random()-.5)*16,y:-10,ty:e.y,sp:260,d:d*3,c:'#9ad84a',r:4,aoe:26,delay:i*.12});}}
 else if(h.k==='marwin'){for(const e of al)for(let i=0;i<5;i++)shots.push({fall:1,x:e.x+(Math.random()-.5)*10,y:-10-i*20,ty:e.y,sp:300,d:d,t:e,c:'#c9a46a',arrow:1,delay:i*.08});}
 else if(h.k==='foku'){for(const e of al){e.frz=3;hurtEnemy(e,d*3,null,1);burst(e.x,e.y-16,'#a8f0ff',8);}}

/* ============ UI ============ */
const $=id=>document.getElementById(id);let tab='bande',buyN=1;
function renderTop(){$('goldv').textContent=fmt(S.gold);$('cores').textContent=S.cores?'✦ '+S.cores+' Kräuterkerne (+'+S.cores*10+' %)':'';$('stv').textContent='Stufe '+S.stage;$('dps').textContent=fmt(teamDps())+' Schaden/s';
 $('bAdv').style.display=S.farm?'':'none';$('stx').textContent=S.farm?'Boss nicht geschafft – Bande farmt':'Welle '+S.wave+' von '+WAVES;$('bAuto').classList.toggle('on',S.auto);$('bSpd').textContent='x'+S.spd;$('bSpd').classList.toggle('on',S.spd>1);renderWave();}
function renderWave(){let h='';for(let i=1;i<=WAVES;i++){const b=i===WAVES,done=S.farm?!b:i<S.wave,ok=!b&&i!==S.wave&&i<=(S.farm?WAVES-1:S.wmax);
  h+=`<span data-w="${i}" class="${done?'d':''} ${i===S.wave?'c':''} ${b?'b':''} ${b&&S.farm?'lost':''} ${ok?'ok':''}" title="${b?'Boss':'Welle '+i}">${b?'☠':''}</span>`;}
 $('wave').innerHTML=h;$('wave').querySelectorAll('span.ok').forEach(el=>el.onclick=()=>goWave(+el.dataset.w));}
function goWave(w){S.wave=w;for(const h of heroes){if(h.dead){h.dead=false;}h.hp=h.mh;}enemies=[];shots=[];spawnQ=[];state='next';stT=.3;renderTop();}
$('bMus').onclick=()=>{startAudio();setMute('m',!MUTE.m);};$('bAud').onclick=openAudio;renderTopAudio();
$('bAdv').onclick=()=>{S.farm=false;goWave(WAVES);};$('bAuto').onclick=()=>{S.auto=!S.auto;renderTop();};$('bSpd').onclick=()=>{S.spd=S.spd===1?2:1;renderTop();};
function renderUlts(){let h='';for(const k of HORDER){h+=`<div class="ult${S.heroes[k]?'':' lock'}" data-k="${k}"><div class="f"></div><img src="${SPR[k].r}"></div>`;}$('ults').innerHTML=h;
 $('ults').querySelectorAll('.ult').forEach(el=>el.onclick=()=>{const he=heroes.find(x=>x.k===el.dataset.k);if(he)castUlt(he);});}
function tickUlts(){$('ults').querySelectorAll('.ult').forEach(el=>{const k=el.dataset.k,he=heroes.find(x=>x.k===k);el.classList.toggle('lock',!S.heroes[k]);if(!he)return;el.querySelector('.f').style.height=he.en+'%';el.classList.toggle('rdy',he.en>=100&&!he.dead);el.classList.toggle('dead',he.dead);});}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));renderTab();});
function maxBuy(k){let l=S.heroes[k],g0=S.gold,n=0,c=0;while(n<500){const cc=lvlCost(k,l+n);if(c+cc>g0)break;c+=cc;n++;}return{n,c};}
function bulk(k){const l=S.heroes[k];if(buyN==='max'){const m=maxBuy(k);return m.n?m:{n:1,c:lvlCost(k,l)};}let c=0;for(let i=0;i<buyN;i++)c+=lvlCost(k,l+i);return{n:buyN,c};}
function renderTab(){const P=$('panel');let h='';
 if(tab==='bande'){h+=`<div style="display:flex;gap:6px;margin-bottom:8px">${[1,10,'max'].map(n=>`<button class="btn ${buyN===n?'on':''}" data-n="${n}" style="flex:1">${n==='max'?'Max':'x'+n}</button>`).join('')}</div>`;
  for(const k of HORDER){const H0=HEROES[k],l=S.heroes[k];
   if(!l){h+=`<div class="card locked"><div class="pic"><img src="${SPR[k].r}"></div><div class="t"><div class="n">${H0.n}</div><div class="d">${H0.d}</div></div><button class="btn buy go" data-u="${k}">Anheuern<small>${fmt(H0.unlock)}</small></button></div>`;continue;}
   const b=bulk(k),ms=25-(l%25);
   h+=`<div class="card"><div class="pic"><img src="${SPR[k].r}"></div><div class="t"><div class="n">${H0.n}<small>Lv ${l}</small></div><div class="d">${fmt(heroDmg(k,l))} Schaden · ${fmt(heroHp(k,l))} ♥<br>Ult: <b style="color:#2f6a12">${H0.ult.n}</b> – ${H0.ult.d}<br><span class="ms">in ${ms} Lv: Schaden ×2</span>${eqStrip(k)}</div></div><button class="btn buy" data-l="${k}">+${b.n} Lv<small>${fmt(b.c)}</small></button></div>`;}}
 else if(tab==='ausbau'){for(const u of UPG){const l=ul(u.id);if(S.max<u.min){h+=`<div class="card locked"><div class="t"><div class="n">???</div><div class="d">Ab Stufe ${u.min}</div></div></div>`;continue;}
   h+=`<div class="card"><div class="t"><div class="n">${u.n}<small>Stufe ${l}</small></div><div class="d">${u.d(l)} → ${u.d(l+1)}</div></div><button class="btn buy" data-g="${u.id}">Ausbauen<small>${fmt(upgCost(u))}</small></button></div>`;}}
 else if(tab==='schmiede'){h+=renderSchmiede();}
 else{const cg=coreGain();
  h+=`<div class="box"><span class="t1">🍺 Rückzug in die Taverne</span>Die Bande zieht sich zurück, feiert durch und kommt stärker wieder. Gold, Stufen, Helden und Ausbau werden zurückgesetzt, Ausrüstung und Schmiedesteine bleiben – du bekommst <b style="color:#2f6a12">Kräuterkerne</b>. Jeder Kern gibt dauerhaft +10 % Schaden und Gold.<br><br>Höchste Stufe: <b>${S.max}</b> · ${S.max<25?'Rückzug ab Stufe 25':'Jetzt: <b style="color:#2f6a12">+'+cg+' Kerne</b>'}</div>
  <button class="btn go" id="bPre" style="width:100%;padding:12px;font-size:15px;margin-bottom:6px" ${cg?'':'disabled'}>🍺 Rückzug (+${cg} ✦)</button>
  <div class="sec">Kern-Talente · ✦ ${S.cores}</div>`;
  for(const t of TAL){const l=tl(t.id),mx=l>=t.max;h+=`<div class="card"><div class="t"><div class="n">${t.n}<small>${l}/${t.max}</small></div><div class="d">${t.d(l)}${mx?'':' → '+t.d(l+1)}</div></div><button class="btn buy" data-tal="${t.id}" ${mx?'disabled':''}>${mx?'Max':'Lernen'}<small>${mx?'':'✦ '+t.c(l)}</small></button></div>`;}
  h+=`<div class="sec">Statistik</div><div class="box">Gold insgesamt: <b>${fmt(S.total)}</b><br>Rückzüge: <b>${S.runs}</b></div><button class="btn" id="bReset" style="width:100%;opacity:.6">Spielstand löschen</button>`;}
 P.innerHTML=h;
 P.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{buyN=b.dataset.n==='max'?'max':+b.dataset.n;renderTab();});
 P.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const k=b.dataset.u;if(S.gold<HEROES[k].unlock)return;S.gold-=HEROES[k].unlock;S.heroes[k]=1;syncHeroes();sfx('lvl');showBan(HEROES[k].n+' ist dabei!');renderAll();});
 P.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const k=b.dataset.l,x=bulk(k);if(S.gold<x.c)return;S.gold-=x.c;S.heroes[k]+=x.n;syncHeroes();sfx('lvl');renderAll();});
 P.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const u=UPG.find(u=>u.id===b.dataset.g),c=upgCost(u);if(S.gold<c)return;S.gold-=c;S.upg[u.id]=ul(u.id)+1;syncHeroes();sfx('lvl');renderAll();});
 P.querySelectorAll('[data-tal]').forEach(b=>b.onclick=()=>{const t=TAL.find(t=>t.id===b.dataset.tal),c=t.c(tl(t.id));if(S.cores<c)return;S.cores-=c;S.tal[t.id]=tl(t.id)+1;syncHeroes();sfx('lvl');renderAll();});
 const bp=$('bPre');if(bp)bp.onclick=()=>modal('Rückzug?','Du bekommst '+coreGain()+' Kräuterkerne. Gold, Helden, Ausbau und Stufen starten neu. Ausrüstung bleibt.',[['Abbrechen'],['Rückzug!',prestige,1]]);
 const br=$('bReset');if(br)br.onclick=()=>modal('Alles löschen?','Dein kompletter Spielstand inkl. Kerne ist dann weg.',[['Abbrechen'],['Löschen',()=>{S=fresh();heroes=[];syncHeroes();startWave();renderAll();save();},1]]);
 if(tab==='schmiede')bindSchmiede(P);
 tickBtns();}
function tickBtns(){const P=$('panel');P.querySelectorAll('[data-u]').forEach(b=>b.disabled=S.gold<HEROES[b.dataset.u].unlock);
 P.querySelectorAll('[data-l]').forEach(b=>{const x=bulk(b.dataset.l);b.disabled=S.gold<x.c;if(buyN==='max')b.innerHTML=`+${x.n} Lv<small>${fmt(x.c)}</small>`;});
 P.querySelectorAll('[data-g]').forEach(b=>b.disabled=S.gold<upgCost(UPG.find(u=>u.id===b.dataset.g)));}
function renderAll(){renderTop();renderTab();renderUlts();save();}
function prestige(){const c=coreGain();S.cores+=c;S.runs++;const keep={items:S.items,eq:S.eq,stones:S.stones,autoMelt:S.autoMelt,cores:S.cores,tal:S.tal,runs:S.runs,total:S.total,auto:S.auto,spd:S.spd,max:S.max};S=Object.assign(fresh(),keep);S.stage=1+tl('start')*3;S.max=Math.max(S.max,S.stage);heroes=[];syncHeroes();startWave();save();renderAll();showBan('Prost! +'+c+' ✦');}
function modal(t,p,btns){$('mh').textContent=t;$('mp').textContent=p;const r=$('mr');r.innerHTML='';btns.forEach(([txt,fn,go])=>{const b=document.createElement('button');b.className='btn'+(go?' go':'');b.textContent=txt;b.onclick=()=>{$('modal').classList.remove('on');fn&&fn();};r.appendChild(b);});$('modal').classList.add('on');}

/* ============ Offline-Ertrag ============ */
(function(){const away=(Date.now()-(S.last||Date.now()))/1000,cap=(4+tl('off')*2)*3600;if(away>60&&S.gps>0){const t=Math.min(away,cap),gain=S.gps*t*.5;S.gold+=gain;S.total+=gain;
 const hh=Math.floor(t/3600),mm=Math.floor(t%3600/60);setTimeout(()=>modal('Willkommen zurück!','Die Bande hat '+(hh?hh+' Std. ':'')+mm+' Min. ohne dich weitergekämpft und '+fmt(gain)+' Gold gesammelt.',[['Nice',null,1]]),300);}})();

/* ============ Loop ============ */
if(S.wave>WAVES)S.wave=1;S.wmax=Math.min(S.wmax||1,WAVES);syncHeroes();if(S.stage<1)S.stage=1;startWave();renderAll();
(async function(){const id=myId();if(!id||!window.BB||!BB.cloud){save();return;}let c=null,ok=false;try{c=await Promise.race([BB.cloud.get('hw').then(x=>{ok=true;return x;}),new Promise(r=>setTimeout(()=>r(null),6000))]);}catch(e){}
 cloudReady=ok;if(!ok){setTimeout(()=>{if(!cloudReady)BB.cloud.get('hw').then(x=>{cloudReady=true;if(x&&(x.total||0)>(S.total||0)){S=Object.assign(fresh(),x);heroes=[];enemies=[];syncHeroes();startWave();renderAll();}save(true);}).catch(()=>{});},8000);}
 if(c&&(c.total||0)>(S.total||0)){S=Object.assign(fresh(),c);heroes=[];enemies=[];syncHeroes();startWave();renderAll();}save(true);})();
let lt=performance.now(),acc=0,gpsT=0;
function loop(now){let dt=Math.min(.1,(now-lt)/1000);lt=now;if(slowT>0){slowT-=dt;dt*=.2;}dt*=S.spd;
 const steps=Math.ceil(dt/.034);for(let i=0;i<steps;i++)update(dt/steps);
 draw();gpsT+=dt/S.spd;acc+=dt/S.spd;
 if(gpsT>=5){const cur=gpsAcc/gpsT;S.gps=S.gps?S.gps*.8+cur*.2:cur;gpsAcc=0;gpsT=0;}
 if(acc>.25){acc=0;$('goldv').textContent=fmt(S.gold);$('dps').textContent=fmt(teamDps())+' Schaden/s';tickUlts();tickBtns();}
 requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
