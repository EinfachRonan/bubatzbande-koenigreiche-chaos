<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kobold-Runner · Bubatzbande</title>
<meta name="theme-color" content="#070a05">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--txt:#f1e6c8;--mut:#a99d7e;--gold:#d4af37;--gold2:#f0d37a;--line:#7a6128;--g1:#3e7530;--g2:#1c3f15}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#070a05;color:var(--txt);font:16px/1.4 Georgia,serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));z-index:3;pointer-events:none}
.hud>*{pointer-events:auto}
.hud a,.hud button{color:var(--gold2);text-decoration:none;background:linear-gradient(rgba(31,44,25,.92),rgba(15,23,12,.92));border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:800 14px "Cinzel",serif}
.pill{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:rgba(8,12,6,.78);border:1px solid rgba(212,175,55,.5);font:800 17px "Cinzel",serif;color:#fff3c4;pointer-events:none}
.pill small{font:12px Georgia,serif;color:var(--mut)}
.sp{flex:1}
.pw{display:flex;gap:6px}.pw span{padding:4px 9px;border-radius:99px;background:rgba(8,12,6,.78);border:1px solid #8a6d32;font:800 13px "Cinzel",serif}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:safe center;justify-content:center;overflow-y:auto;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 40%,rgba(10,16,7,.55),rgba(5,8,4,.92))}
.ov.hide{display:none}
.panel{width:100%;max-width:520px;background:linear-gradient(rgba(19,28,15,.96),rgba(9,13,7,.97));border:1px solid var(--gold);outline:1px solid #3a3418;outline-offset:4px;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.85);padding:20px;text-align:center;margin:auto 0}
.title{font:900 clamp(30px,8vw,44px) "Cinzel Decorative","Cinzel",serif;background:linear-gradient(#fff6d6,#f0d37a 45%,#b8902c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 18px rgba(212,175,55,.3));line-height:1.1}
.orn{color:var(--gold);letter-spacing:.4em;font-size:12px;margin:2px 0 8px}
.panel p{color:#e2d2ad;margin:6px 0}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 4px;text-align:left}
.ctrl div{padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.28);border:1px solid #3a3418;font-size:13px;color:#d9c9a0}
.ctrl b{display:block;font:800 13px "Cinzel",serif;color:var(--gold2)}
.go{display:block;width:100%;margin-top:14px;padding:14px;border:1px solid var(--gold);border-radius:8px;background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4;font:800 19px "Cinzel",serif;letter-spacing:.12em;box-shadow:inset 0 1px 0 rgba(255,240,180,.35),0 0 0 3px #070a05,0 0 0 4px var(--line),0 8px 24px rgba(60,150,50,.3)}
.go.alt{background:linear-gradient(#1f2c19,#0f170c);color:var(--gold2);margin-top:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
.big{font:900 46px "Cinzel",serif;color:#fff3c4;line-height:1;margin:8px 0 2px;text-shadow:0 0 24px rgba(240,211,122,.4)}
.sub{color:var(--mut);font-size:14px}
.rec{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:99px;background:linear-gradient(#f0d37a,#b8902c);color:#2a1a08;font:800 13px "Cinzel",serif}
.statsr{display:flex;gap:8px;margin-top:12px}.statsr div{flex:1;padding:8px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid #3a3418}.statsr b{display:block;font:800 20px "Cinzel",serif;color:#fff3c4}.statsr span{font-size:12px;color:var(--mut)}
.link{display:block;margin:12px auto 0;background:none;border:0;color:var(--gold2);text-decoration:underline;font-size:14px}
.mt{display:flex;gap:6px;margin:10px 0 10px}.mt button{flex:1;padding:9px 4px;border-radius:9px;border:1px solid #4a3c18;background:#0e150b;font:800 13px "Cinzel",serif;color:#cdbf9c}.mt button.on{border-color:var(--gold);background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4}
.bank{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:99px;background:linear-gradient(#3a2a0c,#1a1206);border:1px solid var(--gold);color:#ffe9a0;font-size:14px}.bank b{font:900 16px "Cinzel",serif}
.multi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid #8a6d32;text-align:left;margin-bottom:8px}.multi b{font:900 30px "Cinzel",serif;color:#ffe9a0;text-shadow:0 0 16px rgba(240,200,90,.5)}.multi span{font:800 14px "Cinzel",serif;color:#fff3d4}.multi small{font:12px Georgia,serif;color:var(--mut)}
.multi.up{border-color:var(--gold2);background:linear-gradient(rgba(62,117,48,.6),rgba(28,63,21,.6));margin-top:10px}
.mis{display:flex;flex-direction:column;gap:6px;margin:6px 0;text-align:left}.mis>div{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;background:rgba(0,0,0,.28);border:1px solid #3a3418}
.mis i{font-style:normal;font-size:18px;flex:none}.mis span{flex:1;min-width:0;font-size:13px;color:#e2d2ad}.mis em{display:block;height:4px;border-radius:2px;background:#0a0f07;margin-top:4px;overflow:hidden}.mis em b{display:block;height:100%;background:linear-gradient(90deg,#4caa3c,#f0d37a)}
.mis small{flex:none;font:800 12px "Cinzel",serif;color:var(--mut)}.mis .ok{border-color:#4c7a32;background:rgba(62,117,48,.25)}.mis .ok span{color:#9fe36a}
.shop{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid #3a3418;margin-bottom:7px;text-align:left}.shop.sel{border-color:var(--gold)}
.shop>i{font-style:normal;font-size:26px;flex:none;width:38px;text-align:center}.shop>span{flex:1;min-width:0;font-size:12.5px;color:#cdbf9c}.shop b{display:block;font:800 14px "Cinzel",serif;color:#fff3d4}.shop small{color:var(--mut)}.shop small em{font-style:normal;color:#9fe36a}
.shop button{flex:none;min-width:88px;padding:8px;border-radius:9px;border:1px solid var(--gold);background:linear-gradient(var(--g1),var(--g2));color:#f8e9b4;font:800 13px "Cinzel",serif}.shop button:disabled{filter:grayscale(.8) brightness(.55)}
.shop .max{flex:none;font:800 12px "Cinzel",serif;color:#9fe36a;font-style:normal;min-width:70px;text-align:center}
.pips{display:flex;gap:3px;margin-top:4px}.pips i{width:16px;height:5px;border-radius:2px;background:#2a2a1a}.pips i.on{background:linear-gradient(90deg,#4caa3c,#f0d37a)}
.how{margin-top:10px;text-align:left}.how summary{cursor:pointer;color:var(--gold2);font:800 13px "Cinzel",serif}
#tip{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;padding:8px 14px;border-radius:99px;background:rgba(8,12,6,.8);border:1px solid #8a6d32;font-size:14px;color:#e2d2ad;pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <a href="../" title="Zur Spielauswahl">←</a>
  <span class="pill" id="hScore">0</span>
  <span class="pill">🪙 <span id="hCoins">0</span></span>
  <span class="pw" id="hPw"></span>
  <span class="sp"></span>
  <button id="btnPause" title="Pause">❚❚</button>
</div>
<div id="tip" style="opacity:0"></div>
<div class="ov" id="ov"><div class="panel" id="box"></div></div>

<script src="../art.js"></script>
<script src="../bb.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv'), g = cv.getContext('2d');
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const rnd = (a, b) => a + Math.random() * (b - a);
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const LANE = 1.25, FAR = 44;
const CV = id => window.BB && BB.cardVal ? BB.cardVal(id) : 0;

// ---------- Bild & Projektion ----------
let W = 0, H = 0, DPR = 1, Y0 = 0, S0 = 0, CH = 3, ZC = 2.2, F = 0;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  S0 = Math.min(.88 * W / (LANE * 3), H * .2);
  Y0 = H * (W < H ? .26 : .24);
  CH = (H * .86 - Y0) / S0;
  F = S0 * ZC;
}
addEventListener('resize', resize); resize();
const sc = z => F / (Math.max(z, -1.6) + ZC);
const px = (x, z) => W / 2 + x * sc(z);
const py = (y, z) => Y0 + (CH - y) * sc(z);

const cave = new Image(); cave.src = '../krieg/img/hoehle.jpg';

// ---------- Fortschritt (Missionen, Upgrades, Figuren) ----------
const MT = {
  coinsRun: { t: 'Sammle {n} Gold in einem Lauf', b: 40, s: 15, run: 1, ico: '🪙' },
  distRun: { t: 'Lauf {n} m in einem Lauf', b: 500, s: 250, run: 1, ico: '🏃' },
  jumps: { t: 'Spring {n}-mal', b: 30, s: 15, ico: '⤴️' },
  slides: { t: 'Rutsch {n}-mal unter Balken durch', b: 8, s: 4, ico: '⤵️' },
  pots: { t: 'Spring über {n} Kessel', b: 12, s: 6, ico: '🍲' },
  guards: { t: 'Lass {n} Spießer hinter dir', b: 20, s: 10, ico: '🛡️' },
  power: { t: 'Sammle {n} Power-ups', b: 3, s: 2, ico: '💎' },
  coinsTot: { t: 'Sammle insgesamt {n} Gold', b: 250, s: 120, ico: '💰' }
};
const UPG = {
  magnet: { n: 'Mollymanns Kristall', d: 'Münzmagnet hält länger', ico: '💎', val: l => 10 + l * 2.5, unit: 's' },
  double: { n: 'Goldregen', d: 'Alle Münzen zählen doppelt', ico: '✨', val: l => 8 + l * 2.5, unit: 's' },
  luck: { n: 'Glücksklee', d: 'Power-ups tauchen öfter auf', ico: '🍀', val: l => 100 + l * 30, unit: '%' }
};
const UCOST = [150, 400, 900, 1800, 3500];
const CHARS = {
  kobold: { n: 'Kobold', d: 'Der Klassiker mit Zauberstab', cost: 0, card: null },
  nille: { n: 'Kleine Nille', d: 'Wechselt 35 % schneller die Spur', cost: 1500, card: 'kleine-nille' },
  geist: { n: 'Grauer Geist', d: 'Startet jeden Lauf mit Schild', cost: 3000, card: 'der-graue-geist' },
  artur: { n: 'Artur', d: 'Jede Münze zählt 1,25-fach', cost: 5000, card: 'artur-king-kebab' }
};
const WORLDS = [
  { n: 'Kräuterhöhle', fog: '120,200,80', tint: null },
  { n: 'Dunkelwald', fog: '90,170,210', tint: 'rgba(10,40,60,.35)' },
  { n: 'Spießerburg', fog: '230,110,70', tint: 'rgba(60,15,8,.38)' }
];
const worldAt = d => { const m = d % 3300; return m < 900 ? 0 : m < 2000 ? 1 : 2; };
function genMissions(set) {
  const keys = Object.keys(MT).sort(() => Math.random() - .5).slice(0, 3);
  return keys.map(k => ({ k, n: Math.round((MT[k].b + MT[k].s * set) / (MT[k].b >= 100 ? 10 : 1)) * (MT[k].b >= 100 ? 10 : 1), p: 0, done: false }));
}
let PR = ls.get('kr_prog', null);
if (!PR || !PR.missions) PR = { bank: 0, mult: 1, set: 0, missions: genMissions(0), up: { magnet: 0, double: 0, luck: 0 }, chars: { kobold: 1 }, char: 'kobold', t: 0 };
const ownChar = k => PR.chars[k] || (CHARS[k].card && window.BB && BB.lvl && BB.lvl(CHARS[k].card) > 0);
function saveProg() { PR.t = Date.now(); ls.set('kr_prog', PR); if (window.BB && BB.cloud) BB.cloud.put('runner', PR); }
function missionTick(k, v, abs) {
  for (const m of PR.missions) {
    if (m.done || m.k !== k) continue;
    m.p = abs ? Math.max(m.p, v) : m.p + v;
    if (m.p >= m.n) { m.done = true; m.p = m.n; tip(`✅ Mission geschafft: ${MT[m.k].t.replace('{n}', m.n.toLocaleString('de-DE'))}`, 2600); buzz([30, 40, 30]); }
  }
  if (PR.missions.every(m => m.done) && !PR._pending) PR._pending = true;
}

// ---------- Zustand ----------
let G = null, best = ls.get('kr_best', 0), last = performance.now(), paused = false;
function newGame() {
  G = {
    t: 0, dist: 0, speed: 10, coins: 0, over: false, crashT: 0,
    lane: 1, x: 0, y: 0, vy: 0, slide: 0, run: 0,
    objs: [], next: 18, magnet: 0, double: 0, shield: (PR.char === 'geist' || Math.random() * 100 < CV('der-graue-geist')) ? 1 : 0, flash: 0, shake: 0, combo: 0,
    world: 0, coinAcc: 0, stats: { jumps: 0, slides: 0, pots: 0, guards: 0, power: 0 }
  };
  for (const m of PR.missions) if (MT[m.k].run && !m.done) m.p = 0;
  tip('Wischen: ← → Spur, ↑ springen, ↓ rutschen', 3200);
}

// ---------- Strecke bauen ----------
function spawnRow(z) {
  const S = G.speed, hard = Math.min(1, (S - 10) / 14);
  const lanes = [0, 1, 2].sort(() => Math.random() - .5);
  const nBlock = Math.random() < .35 + hard * .45 ? 2 : 1;
  const blocked = lanes.slice(0, nBlock), free = lanes.slice(nBlock);
  for (const l of blocked) {
    const r = Math.random(), wg = G.world === 2 ? [.28, .72] : G.world === 1 ? [.42, .62] : [.38, .7];
    const type = r < wg[0] ? 'pot' : r < wg[1] ? 'guard' : 'beam';
    G.objs.push({ type, lane: l, z, ph: Math.random() * 6 });
    if (type === 'pot' && Math.random() < .5) for (let k = -1; k <= 1; k++) G.objs.push({ type: 'coin', lane: l, z: z + k * 1.1, y: 1.15 - Math.abs(k) * .25 });
  }
  // Münzen in einer freien Spur
  if (Math.random() < .75) {
    const l = free[Math.floor(Math.random() * free.length)], n = 4 + Math.floor(Math.random() * 4);
    for (let k = 0; k < n; k++) G.objs.push({ type: 'coin', lane: l, z: z - 3 - k * 1.3, y: .45 });
  }
  // Kräfte
  if (Math.random() < .07 * UPG.luck.val(PR.up.luck) / 100) { const pr = Math.random(); G.objs.push({ type: pr < .38 ? 'magnet' : pr < .7 ? 'double' : 'shield', lane: free[0], z: z + 3, y: .6 }); }
}

// ---------- Eingabe ----------
function move(d) { if (!G || G.over || paused) return; G.lane = Math.max(0, Math.min(2, G.lane + d)); }
function jump() { if (!G || G.over || paused) return; if (G.y <= .001) { G.vy = 9.2; G.slide = 0; G.stats.jumps++; missionTick('jumps', 1); } }
function slide() { if (!G || G.over || paused) return; G.slide = .62; if (G.y > 0) G.vy = -14; }
let sx = 0, sy = 0, st = 0, swiped = false;
cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = performance.now(); swiped = false; });
cv.addEventListener('pointermove', e => {
  if (swiped || !e.buttons && e.pointerType === 'mouse') return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
  swiped = true;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1); else if (dy < 0) jump(); else slide();
});
cv.addEventListener('pointerup', e => { if (!swiped && performance.now() - st < 300) jump(); });
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft', 'a', 'A'].includes(k)) move(-1);
  else if (['ArrowRight', 'd', 'D'].includes(k)) move(1);
  else if (['ArrowUp', 'w', 'W', ' '].includes(k)) { e.preventDefault(); if (G && !G.over && !paused) jump(); else if ($('#go')) $('#go').click(); }
  else if (['ArrowDown', 's', 'S'].includes(k)) { e.preventDefault(); slide(); }
  else if (k === 'Escape' || k === 'p' || k === 'P') togglePause();
});
$('#btnPause').onclick = togglePause;
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.over && !paused) togglePause(); });
function togglePause() {
  if (!G || G.over) return;
  paused = !paused;
  if (paused) menu('pause'); else { hideMenu(); last = performance.now(); }
}

// ---------- Ablauf ----------
function update(dt) {
  if (!G || paused) return;
  if (G.over) { G.crashT += dt; G.shake = Math.max(0, G.shake - dt * 2); return; }
  G.t += dt;
  G.speed = Math.min(26, 10 + G.t * .14);
  const d = G.speed * dt; G.dist += d; G.run += dt * G.speed * .9;
  // Spur, Sprung, Rutschen
  const tx = (G.lane - 1) * LANE; G.x += Math.sign(tx - G.x) * Math.min(Math.abs(tx - G.x), dt * (PR.char === 'nille' ? 17.5 : 13));
  if (G.y > 0 || G.vy > 0) { G.vy -= 26 * dt; G.y = Math.max(0, G.y + G.vy * dt); if (G.y === 0) G.vy = 0; }
  if (G.slide > 0) G.slide -= dt;
  G.magnet = Math.max(0, G.magnet - dt); G.double = Math.max(0, G.double - dt); G.flash = Math.max(0, G.flash - dt * 3);
  const w = worldAt(G.dist); if (w !== G.world) { G.world = w; tip(`🌍 Neue Welt: ${WORLDS[w].n}`, 2600); G.flash = .6; }
  missionTick('distRun', Math.floor(G.dist), true);
  // Objekte
  G.next -= d;
  if (G.next <= 0) { spawnRow(FAR); G.next = Math.max(6.5, 14 - G.speed * .28) + rnd(0, 3); }
  const pl = Math.round(G.x / LANE) + 1;
  for (const o of G.objs) {
    o.z -= d + (o.type === 'guard' ? 2.2 * dt : 0);
    if (o.type === 'coin' && G.magnet > 0 && o.z < 7 && o.z > -.5) { o.lane = pl; o.mag = true; }
    if (o.type === 'guard' && !o.passed && o.z < -.45) { o.passed = true; if (!o.dead) { G.stats.guards++; missionTick('guards', 1); } }
    if (o.dead || o.z > .55 || o.z < -.45) continue;
    const same = Math.abs((o.lane - 1) * LANE - G.x) < LANE * .55;
    if (!same && !(o.mag && o.type === 'coin')) continue;
    if (o.type === 'coin') { o.dead = true; G.coinAcc += (G.double > 0 ? 2 : 1) * (PR.char === 'artur' ? 1.25 : 1); const n = Math.floor(G.coinAcc); if (n) { G.coinAcc -= n; G.coins += n; missionTick('coinsRun', G.coins, true); missionTick('coinsTot', n); } continue; }
    if (o.type === 'magnet') { o.dead = true; G.magnet = UPG.magnet.val(PR.up.magnet) + CV('kleine-nille'); tip('Mollymanns Kristall: Münzmagnet!', 1500); missionTick('power', 1); continue; }
    if (o.type === 'double') { o.dead = true; G.double = UPG.double.val(PR.up.double); tip('Goldregen: alle Münzen zählen doppelt!', 1500); missionTick('power', 1); continue; }
    if (o.type === 'shield') { o.dead = true; G.shield = 1; tip('Kräuterschild: hält einen Treffer aus', 1500); missionTick('power', 1); continue; }
    let hit = false;
    if (o.type === 'pot') { hit = G.y < .72; if (!hit && !o.ok) { o.ok = true; G.stats.pots++; missionTick('pots', 1); } }
    else if (o.type === 'guard') hit = true;
    else if (o.type === 'beam') { hit = G.slide <= 0; if (!hit && !o.ok) { o.ok = true; G.stats.slides++; missionTick('slides', 1); } }
    if (hit) {
      o.dead = true; if (o.type === 'pot' || o.type === 'beam') o.ok = true;
      if (G.shield) { G.shield = 0; G.flash = 1; buzz(60); tip('Schild weg!', 1000); continue; }
      crash();
      break;
    }
  }
  G.objs = G.objs.filter(o => o.z > -2 && !(o.dead && o.type !== 'pot' && o.type !== 'guard' && o.type !== 'beam'));
  hud();
}
function crash() {
  G.over = true; G.shake = 1; G.flash = 1; buzz([80, 40, 140]);
  setTimeout(gameOver, 900);
}
function score() { return Math.floor((Math.floor(G.dist) + G.coins * 5) * PR.mult * (1 + CV('der-gruene-kobold') / 100)); }
function hud() {
  $('#hScore').textContent = score().toLocaleString('de-DE');
  $('#hCoins').textContent = G.coins;

  g.save();

  drawBg(); drawFloor();
  if (G) {
    const objs = G.objs.slice().sort((a, b) => b.z - a.z);
    for (const o of objs) if (o.z >= 0) drawObj(o);
    drawKobold();
    for (const o of objs) if (o.z < 0) drawObj(o);
    if (G.flash > 0) { g.fillStyle = G.over ? `rgba(255,80,60,${G.flash * .35})` : `rgba(150,255,100,${G.flash * .3})`; g.fillRect(0, 0, W, H); }
  }
  // Rand-Vignette
  const vg = g.createRadialGradient(W / 2, H * .55, Math.min(W, H) * .35, W / 2, H * .55, Math.max(W, H) * .8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  g.restore();
  requestAnimationFrame(frame);
}

// ---------- Menüs ----------
let tipT = null;
function tip(t, ms) { const e = $('#tip'); e.textContent = t; e.style.opacity = 1; clearTimeout(tipT); tipT = setTimeout(() => e.style.opacity = 0, ms || 2000); }
function hideMenu() { $('#ov').classList.add('hide'); }
let mtab = 'play';
function missionsHtml() {
  return `<div class="mis">${PR.missions.map(m => { const T = MT[m.k]; return `<div class="${m.done ? 'ok' : ''}"><i>${m.done ? '✅' : T.ico}</i><span>${T.t.replace('{n}', m.n.toLocaleString('de-DE'))}<em><b style="width:${Math.min(100, m.p / m.n * 100)}%"></b></em></span><small>${m.done ? '' : Math.floor(m.p).toLocaleString('de-DE') + '/' + m.n.toLocaleString('de-DE')}</small></div>`; }).join('')}</div>`;
}
function claimSet() {
  if (!PR.missions.every(m => m.done)) return false;
  PR.set++; PR.mult = Math.min(20, PR.mult + 1); PR.missions = genMissions(PR.set); PR._pending = false; saveProg();
  if (window.BB && BB.earn) BB.earn(20 + PR.set * 5, 'Runner-Missionen geschafft');
  return true;
}
function menu(kind) {
  $('#ov').classList.remove('hide');
  const box = $('#box');
  if (kind === 'start') {
    const tabs = `<div class="mt">${[['play', '▶ Laufen'], ['up', '⬆ Upgrades'], ['char', '🎭 Figuren']].map(([k, n]) => `<button data-mt="${k}" class="${mtab === k ? 'on' : ''}">${n}</button>`).join('')}</div>`;
    let body = '';
    if (mtab === 'play') {
      body = `<div class="multi"><b>×${PR.mult}</b><span>Punkte-Multiplikator<br><small>Schaff alle 3 Missionen für +1</small></span></div>${missionsHtml()}
        <p class="sub">Bestwert: <b class="c" style="color:#fff3c4">${best.toLocaleString('de-DE')}</b> · Figur: <b class="c" style="color:#fff3c4">${CHARS[PR.char].n}</b></p>
        <button class="go" id="go">▶ LOSRENNEN</button>
        <details class="how"><summary>Steuerung</summary><div class="ctrl"><div><b>← →</b>Wischen: Spur wechseln</div><div><b>↑ oder Tippen</b>Springen</div><div><b>↓</b>Rutschen</div><div><b>PC</b>Pfeiltasten oder WASD</div></div></details>`;
    } else if (mtab === 'up') {
      body = Object.entries(UPG).map(([k, u]) => { const l = PR.up[k], c = UCOST[l]; return `<div class="shop"><i>${u.ico}</i><span><b>${u.n}</b>${u.d}<br><small>Stufe ${l}/5 · ${u.val(l)} ${u.unit}${l < 5 ? ` → <em>${u.val(l + 1)} ${u.unit}</em>` : ''}</small><span class="pips">${'<i class="on"></i>'.repeat(l)}${'<i></i>'.repeat(5 - l)}</span></span>${l < 5 ? `<button data-up="${k}" ${PR.bank < c ? 'disabled' : ''}>🪙 ${c.toLocaleString('de-DE')}</button>` : '<em class="max">MAX</em>'}</div>`; }).join('');
    } else {
      body = Object.entries(CHARS).map(([k, c]) => { const own = ownChar(k), on = PR.char === k; return `<div class="shop ${on ? 'sel' : ''}"><i>${{ kobold: '🧙', nille: '🗡️', geist: '👻', artur: '🐺' }[k]}</i><span><b>${c.n}</b>${c.d}${!own && c.card ? `<br><small>Gratis mit der Karte „${window.BB && BB.CARDS ? (BB.CARDS.find(x => x.id === c.card) || {}).name : ''}“</small>` : ''}</span>${on ? '<em class="max">✓ dabei</em>' : own ? `<button data-ch="${k}">Wählen</button>` : `<button data-buy="${k}" ${PR.bank < c.cost ? 'disabled' : ''}>🪙 ${c.cost.toLocaleString('de-DE')}</button>`}</div>`; }).join('');
    }
    box.innerHTML = `${window.BBArt ? BBArt.head('runner') : ''}<div class="title">Kobold-Runner</div>
      <div class="bank">🪙 <b>${PR.bank.toLocaleString('de-DE')}</b> Kobold-Gold</div>${tabs}${body}
      ${window.BB ? '<button class="link" id="bbB">🏆 Bestenliste</button>' : ''}`;
    if ($('#go')) $('#go').onclick = start;
    box.querySelectorAll('[data-mt]').forEach(b => b.onclick = () => { mtab = b.dataset.mt; menu('start'); });
    box.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const k = b.dataset.up, c = UCOST[PR.up[k]]; if (PR.bank >= c) { PR.bank -= c; PR.up[k]++; saveProg(); buzz(20); menu('start'); } });
    box.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { PR.char = b.dataset.ch; saveProg(); menu('start'); });
    box.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { const k = b.dataset.buy; if (PR.bank >= CHARS[k].cost) { PR.bank -= CHARS[k].cost; PR.chars[k] = 1; PR.char = k; saveProg(); buzz(30); menu('start'); } });
  } else if (kind === 'pause') {
    box.innerHTML = `<div class="title">Pause</div><div class="orn">✦ ❚❚ ✦</div>${missionsHtml()}<button class="go" id="go">▶ Weiter</button><button class="go alt" id="quit">Aufgeben</button>`;
    $('#go').onclick = togglePause;
    $('#quit').onclick = () => { paused = false; G.over = true; gameOver(); };
  } else if (kind === 'over') {
    const sc = score(), rec = sc > best;
    if (rec) { best = sc; ls.set('kr_best', best); }
    PR.bank += G.coins;
    const setDone = claimSet();
    saveProg();
    if (window.BB) {
      BB.record('runner', sc, { c: G.coins, m: Math.floor(G.dist) });
      if (sc >= 1000) BB.unlock('runner_1000'); if (sc >= 5000) BB.unlock('runner_5000'); if (G.coins >= 100) BB.unlock('runner_gold');
      BB.stat('runner_coins', G.coins);
      if (BB.earn) BB.earn(Math.floor(G.coins / 4) + Math.floor(G.dist / 250), 'Kobold-Runner');
    }
    box.innerHTML = `<div class="title">${rec ? 'Neuer Rekord!' : 'Erwischt!'}</div><div class="orn">✦ ${WORLDS[G.world].n} ✦</div>
      <div class="big">${sc.toLocaleString('de-DE')}</div><div class="sub">Punkte · ×${setDone ? PR.mult - 1 : PR.mult}</div>
      ${rec ? '<span class="rec">🏆 Bestwert</span>' : `<p class="sub">Bestwert: ${best.toLocaleString('de-DE')}</p>`}
      ${setDone ? `<div class="multi up"><b>×${PR.mult}</b><span>Alle Missionen geschafft!<br><small>Dein Multiplikator steigt. Neue Missionen warten.</small></span></div>` : ''}
      <div class="statsr"><div><b>${Math.floor(G.dist).toLocaleString('de-DE')} m</b><span>gerannt</span></div><div><b>🪙 ${G.coins}</b><span>Gold · Bank ${PR.bank.toLocaleString('de-DE')}</span></div></div>
      ${missionsHtml()}
      <div class="row"><button class="go alt" id="home">Menü</button><button class="go" id="go">Nochmal</button></div>
      ${window.BB ? '<button class="link" id="bbB">🏆 Bestenliste</button>' : ''}`;
    $('#go').onclick = start; $('#home').onclick = () => { G = null; mtab = 'play'; menu('start'); };
  }
  if ($('#bbB')) $('#bbB').onclick = () => BB.open('board', 'runner');
}
function start() { paused = false; newGame(); hideMenu(); last = performance.now(); }
function gameOver() { if (!$('#ov').classList.contains('hide') && $('#box .big')) return; menu('over'); }
menu('start');
requestAnimationFrame(frame);
if (window.BB && BB.cloud && BB.loggedIn) BB.cloud.get('runner').then(c => { if (c && c.missions && (c.t || 0) > (PR.t || 0)) { PR = c; ls.set('kr_prog', PR); if (!G) menu('start'); } }).catch(() => {});
window.KR = { get G() { return G; }, get PR() { return PR; }, saveProg, move, jump, slide, start };
</script>
</body>
