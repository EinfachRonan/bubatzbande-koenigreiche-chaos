name: Deploy to STRATO

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  # Pushes der Mario-Schleuse (mit GITHUB_TOKEN) lösen keinen Push-Trigger aus → danach extra deployen
  workflow_run:
    workflows: [Mario-Schleuse]
    types: [completed]

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Update-Zeiten der Spiele (für die Startseite)
        run: python3 scripts/updates.py

      - name: Verify site
        run: test -f site/index.html

      - name: Install paramiko
        run: |
          for i in 1 2 3 4 5; do python3 -m pip install --quiet --user --break-system-packages paramiko && exit 0; sleep 15; done; exit 1

      - name: Deploy to STRATO
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_PASSWORD: ${{ secrets.STRATO_PASSWORD }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_PATH: ${{ secrets.STRATO_PATH }}
        run: python3 scripts/deploy_sftp.py

      - name: Check online relay (PHP)
        continue-on-error: true
        run: curl -fsS "https://bubatzbande.de/net.php?ping=1" | tee /dev/stderr | grep -q '"ok":1'
