name: Deploy to STRATO

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify site
        run: test -f site/index.html

      - name: Install lftp
        run: |
          command -v lftp && exit 0
          for i in 1 2 3 4 5; do
            sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 lftp && exit 0
            echo "Versuch $i fehlgeschlagen, warte kurz ..."; sleep 20
          done
          exit 1

      - name: Deploy to STRATO
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_PASSWORD: ${{ secrets.STRATO_PASSWORD }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          STRATO_PATH: ${{ secrets.STRATO_PATH }}
        run: |
          TARGET_PATH="${STRATO_PATH:-/}"

          if [ -z "$TARGET_PATH" ] || [ "$TARGET_PATH" = "." ]; then
            TARGET_PATH="/"
          fi

          if [[ "$TARGET_PATH" != /* ]]; then
            TARGET_PATH="/$TARGET_PATH"
          fi

          echo "Deploying ./site/ to STRATO path: $TARGET_PATH"

          lftp -u "$STRATO_USER","$STRATO_PASSWORD" -p "$STRATO_PORT" sftp://"$STRATO_HOST" <<EOF2
          set sftp:auto-confirm yes
          set ssl:verify-certificate no
          mirror -R --delete --verbose --exclude '/rooms/' --exclude '/data/' ./site/ "$TARGET_PATH"
          bye
          EOF2

      - name: Check online relay (PHP)
        continue-on-error: true
        run: curl -fsS "https://bubatzbande.de/net.php?ping=1" | tee /dev/stderr | grep -q '"ok":1'
